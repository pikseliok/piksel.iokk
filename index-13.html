<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&display=swap" rel="stylesheet">
<title>πksel İntellektual Oyunlar Platforması</title>
<style>
:root{
  --dark:#00030f;--mid:#080e2d;
  --grad:linear-gradient(135deg,#70A6FF 0%,#6099FA 55%,#8AB7FF 100%);
  --t-land:1.9s; --t-light:4.55s; --t-shake:3.7s; --t-open:4.5s; --tt:5.8s;
  --vh:100vh;
}
@supports(height:100dvh){:root{--vh:100dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{height:var(--vh);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background-color:var(--mid);background-image:radial-gradient(ellipse at 50% 45%,#101b48 0%,#080e2d 43%,#00030f 100%);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky svg{position:absolute;left:0;top:0;opacity:.12;will-change:transform}

/* header: ekrana görə ölçülür */
header{position:relative;z-index:5;padding:calc(env(safe-area-inset-top) + min(4vh,32px)) 12px 0;text-align:center;pointer-events:none}
header h1{font-weight:800;font-size:clamp(20px,min(8vw,9vh),64px);letter-spacing:.1em;line-height:1.1;white-space:nowrap}
header h1 span{display:inline-block;background:var(--grad);background-size:1100% 100%;background-position:calc(var(--i)*10%) 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:letterIn .9s cubic-bezier(.2,.9,.3,1.2) calc(var(--tt) + var(--i)*.09s) both}
header h1 span.dot{animation:letterIn .9s cubic-bezier(.2,.9,.3,1.2) calc(var(--tt) + var(--i)*.09s) both,blink 1.8s ease-in-out calc(var(--tt) + 1.8s + var(--i)*.15s) infinite}
@keyframes letterIn{from{opacity:0;transform:translateY(-40px) scale(.5);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

main{position:relative;z-index:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px}

/* qutunun ölçüsü həm eni, həm hündürlüyü nəzərə alır */
.stage{--s:clamp(84px,min(34vw,30vh),240px);--B:calc(var(--s)*.72);--L:calc(var(--s)*.28);position:relative;width:var(--s);height:var(--s);margin-top:min(5vh,40px);perspective:1100px;perspective-origin:50% 35%;isolation:isolate}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-24deg);animation:dropIn var(--t-land) cubic-bezier(.45,.05,.55,.95) both}
.body,.pivot,.lid{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.body{transform:translateY(calc(var(--L)/2))}
.pivot{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5));animation:lidShake .8s linear var(--t-shake),lidOpen 1s cubic-bezier(.3,1.2,.5,1) var(--t-open) forwards}
.lid{transform:translate3d(0,calc(var(--L)*-.5),calc(var(--s)*.5))}
.f{position:absolute;width:var(--w);height:var(--h);left:calc(var(--w)/-2);top:calc(var(--h)/-2);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(135,155,200,.025);transform:var(--base)}
.f::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--lg,none);animation:lit 1.4s ease-out calc(var(--t-open) + .25s) forwards}
.bf,.bb,.br,.bl{--w:var(--s);--h:var(--B)}
.bt,.bd{--w:var(--s);--h:var(--s)}
.lf,.lb,.lr,.ll{--w:var(--s);--h:var(--L)}
.lt,.lu{--w:var(--s);--h:var(--s)}
.bf{background:linear-gradient(145deg,#08090d 0%,#030407 48%,#010102 100%);--lg:linear-gradient(145deg,rgba(150,170,205,.035),transparent 42%)}
.bb{background:#010102}
.br{background:linear-gradient(90deg,#030407,#010102 80%);--lg:linear-gradient(180deg,rgba(125,155,205,.025),transparent 65%)}
.bl{background:#020203}
.bt{background:#010102;border:1px solid #08090d;box-shadow:none}
.bd{background:#000}
.lf{background:linear-gradient(150deg,#090a0e 0%,#030407 60%,#010102 100%);--lg:linear-gradient(145deg,rgba(155,180,220,.045),transparent 55%)}
.lb{background:#010102}
.lr{background:#030407;--lg:linear-gradient(180deg,rgba(125,155,205,.025),transparent 75%)}
.ll{background:#020203}
.lt{background:#020203;box-shadow:none}
.lu{background:#000;box-shadow:none}
.mark{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:800/680;height:auto;transform:translate(-50%,-50%);opacity:.95}

/* yerə düşmə: kölgə + zərbə halqası */
.shadow{position:absolute;left:50%;top:calc(50% + var(--s)*.48);width:calc(var(--s)*1.9);height:calc(var(--s)*.48);transform:translateX(-50%) scale(.2);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.88) 0%,rgba(0,0,0,.58) 30%,rgba(0,0,0,.24) 55%,transparent 76%);filter:blur(8px);opacity:0;animation:shadowIn var(--t-land) cubic-bezier(.45,.05,.55,.95) both}
.ring{position:absolute;left:50%;top:calc(50% + var(--s)*.52);width:calc(var(--s)*1.2);height:calc(var(--s)*.34);margin-left:calc(var(--s)*-.6);margin-top:calc(var(--s)*-.17);border-radius:50%;border:2px solid rgba(138,183,255,.55);box-shadow:0 0 18px rgba(112,166,255,.35);opacity:0;pointer-events:none;animation:ringOut 1.1s ease-out calc(var(--t-land)*.52) both}
.ring.r2{animation-delay:calc(var(--t-land)*.52 + .18s);border-color:rgba(138,183,255,.3)}

.beam{position:absolute;left:50%;bottom:calc(50% + var(--s)*.2);width:calc(var(--s)*3.6);height:min(72vh,calc(var(--s)*5));z-index:3;pointer-events:none;transform-origin:50% 100%;transform:translateX(-50%) scaleX(.25) scaleY(.05);opacity:0;mix-blend-mode:screen;filter:blur(7px);animation:beamOn 1.7s cubic-bezier(.2,.7,.2,1) var(--t-light) forwards,beamBreath 5s ease-in-out calc(var(--t-light) + 2s) infinite}
.beam i,.beam b{position:absolute;inset:0;display:block}
.beam i{clip-path:polygon(39% 100%,61% 100%,100% 0,0 0);background:linear-gradient(180deg,transparent 0%,rgba(150,185,245,.05) 22%,rgba(175,205,255,.17) 58%,rgba(225,238,255,.40) 100%)}
.beam b{clip-path:polygon(44% 100%,56% 100%,70% 0,30% 0);background:linear-gradient(180deg,transparent 0%,rgba(210,230,255,.10) 40%,rgba(245,250,255,.60) 100%)}
.ground-glow{position:absolute;left:50%;top:calc(50% + var(--s)*.42);width:calc(var(--s)*2.8);height:calc(var(--s)*.9);transform:translateX(-50%) scale(.55);border-radius:50%;background:radial-gradient(ellipse at center,rgba(130,165,225,.15) 0%,rgba(100,140,210,.07) 30%,rgba(80,110,175,.025) 52%,transparent 72%);filter:blur(15px);opacity:0;pointer-events:none;animation:floorLight 2.4s ease-out calc(var(--t-light) + .2s) forwards}
.light-spill{position:absolute;left:50%;top:calc(50% + var(--s)*.22);width:calc(var(--s)*2.1);height:calc(var(--s)*1.3);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(145,175,230,.055) 0%,rgba(115,150,210,.025) 35%,transparent 72%);filter:blur(18px);opacity:0;pointer-events:none;animation:spillLight 2.6s ease-out calc(var(--t-light) + .1s) forwards}
.light-dust{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(205,222,255,.75);box-shadow:0 0 7px 2px rgba(145,180,255,.18);opacity:0;pointer-events:none;z-index:4;will-change:transform,opacity}

/* qutu bütöv şəkildə yuxarıdan fırlanaraq düşür, yerə dəyib sıçrayır */
/* açılan qutudan çıxan işıq: içəridən parlayan üst üz, qapağın alt tərəfi, parıltı və mühit işığı */
.bt::after{background:radial-gradient(ellipse at 50% 55%,#fff 0%,rgba(205,225,255,.95) 25%,rgba(120,165,240,.7) 60%,rgba(60,100,190,.35) 100%);animation:openGlow 1.2s ease-out var(--t-open) forwards}
.lu::after{background:radial-gradient(ellipse at 50% 80%,rgba(210,228,255,.85) 0%,rgba(120,165,240,.45) 50%,rgba(40,70,140,.15) 100%);animation:openGlow 1.2s ease-out calc(var(--t-open) + .25s) forwards}
.flare{position:absolute;left:50%;bottom:calc(50% + var(--s)*.2);width:calc(var(--s)*1.5);height:calc(var(--s)*.7);transform:translate(-50%,50%) scale(.2);border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95) 0%,rgba(190,215,255,.55) 22%,rgba(110,160,240,.18) 50%,transparent 72%);filter:blur(6px);opacity:0;mix-blend-mode:screen;z-index:4;pointer-events:none;animation:flareOn 2s ease-out var(--t-light) forwards}
.ambient{position:absolute;left:50%;bottom:calc(50% + var(--s)*.2);width:calc(var(--s)*10);height:calc(var(--s)*10);transform:translate(-50%,50%) scale(.4);border-radius:50%;background:radial-gradient(circle,rgba(120,165,235,.20) 0%,rgba(90,135,215,.10) 22%,rgba(60,95,170,.04) 45%,transparent 68%);opacity:0;mix-blend-mode:screen;pointer-events:none;z-index:0;animation:ambientOn 2.8s ease-out var(--t-light) forwards}
@keyframes dropIn{
0%{transform:translateY(-85vh) rotateX(-24deg) rotateY(330deg) scale(.7)}
52%{transform:translateY(0) rotateX(-24deg) rotateY(-24deg) scale(1)}
58%{transform:translateY(calc(var(--s)*.03)) rotateX(-24deg) rotateY(-24deg) scale(1.07,.9)}
74%{transform:translateY(calc(var(--s)*-.2)) rotateX(-24deg) rotateY(-24deg) scale(.98,1.03)}
88%{transform:translateY(0) rotateX(-24deg) rotateY(-24deg) scale(1.03,.97)}
100%{transform:translateY(0) rotateX(-24deg) rotateY(-24deg) scale(1)}}
@keyframes shadowIn{
0%{opacity:0;transform:translateX(-50%) scale(.2)}
45%{opacity:.35;transform:translateX(-50%) scale(.55)}
52%{opacity:1;transform:translateX(-50%) scale(1.12)}
74%{opacity:.7;transform:translateX(-50%) scale(.82)}
100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes ringOut{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3.2)}}
@keyframes lit{to{opacity:1}}
@keyframes beamOn{0%{opacity:0;transform:translateX(-50%) scaleX(.25) scaleY(.05)}20%{opacity:.9;transform:translateX(-50%) scaleX(.45) scaleY(.35)}100%{opacity:1;transform:translateX(-50%) scaleX(1) scaleY(1)}}
@keyframes beamBreath{0%,100%{opacity:1}50%{opacity:.78}}
@keyframes openGlow{0%{opacity:0}35%{opacity:1}100%{opacity:.92}}
@keyframes flareOn{0%{opacity:0;transform:translate(-50%,50%) scale(.2)}15%{opacity:1;transform:translate(-50%,50%) scale(.8)}40%{opacity:.9;transform:translate(-50%,50%) scale(1.15)}100%{opacity:.55;transform:translate(-50%,50%) scale(1)}}
@keyframes ambientOn{to{opacity:1;transform:translate(-50%,50%) scale(1)}}
@keyframes floorLight{0%{opacity:0;transform:translateX(-50%) scale(.55)}45%{opacity:.9;transform:translateX(-50%) scale(1)}100%{opacity:.65;transform:translateX(-50%) scale(1.12)}}
@keyframes spillLight{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}40%{opacity:.85;transform:translate(-50%,-50%) scale(1)}100%{opacity:.5;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes lidShake{
0%,100%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(0deg) rotateZ(0deg)}
10%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(5deg) rotateZ(-1.6deg)}
20%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(0deg) rotateZ(1.6deg)}
32%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(6.5deg) rotateZ(-1.2deg)}
44%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(0deg) rotateZ(1.2deg)}
56%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(4.5deg) rotateZ(-.8deg)}
68%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(0deg) rotateZ(.8deg)}
82%{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(2.5deg) rotateZ(-.4deg)}}
@keyframes lidOpen{from{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(0deg)}to{transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(112deg)}}

footer{position:relative;z-index:5;padding:6px 14px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:clamp(9px,min(2.8vw,2.4vh) + 3px,12px);line-height:1.5;animation:fadeUp 1.2s ease .8s both}
footer p,footer a{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-decoration:none}
footer a:hover,footer a:focus-visible{filter:brightness(1.25);text-decoration:underline;text-decoration-color:#70A6FF}
footer a:focus-visible{outline:2px solid #70A6FF;outline-offset:3px;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* çox dar ekranlar */
@media(max-width:380px){header h1{letter-spacing:.07em}}
/* alçaq (landscape) ekranlar: footer sətirləri yan-yana */
@media(max-height:460px){
  footer{display:flex;flex-wrap:wrap;justify-content:center;gap:0 12px;padding-top:2px}
  header{padding-top:calc(env(safe-area-inset-top) + 6px)}
}
@media(prefers-reduced-motion:reduce){
.cube,.shadow,footer,header h1 span,.ground-glow,.light-spill,.light-dust,.ring,.flare,.ambient{animation:none!important}
.bt::after,.lu::after{animation:none!important;opacity:1}
.flare{opacity:.5;transform:translate(-50%,50%)}
.ambient{opacity:1;transform:translate(-50%,50%)}
.ring{display:none}
.f::after{animation:none!important;opacity:1}
.shadow{opacity:1;transform:translateX(-50%)}
.pivot{animation:none!important;transform:translate3d(0,calc(var(--s)*-.22),calc(var(--s)*-.5)) rotateX(112deg)}
.beam{position:absolute;left:50%;bottom:calc(50% + var(--s)*.2);width:calc(var(--s)*3.6);height:min(72vh,calc(var(--s)*5));z-index:3;pointer-events:none;transform-origin:50% 100%;transform:translateX(-50%) scaleX(.25) scaleY(.05);opacity:0;mix-blend-mode:screen;filter:blur(7px);animation:beamOn 1.7s cubic-bezier(.2,.7,.2,1) var(--t-light) forwards,beamBreath 5s ease-in-out calc(var(--t-light) + 2s) infinite}
.ground-glow,.light-spill{opacity:.5}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="emblemBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A6FF"/>
      <stop offset="55%" stop-color="#6099FA"/>
      <stop offset="100%" stop-color="#8AB7FF"/>
    </linearGradient>
    <symbol id="logo" viewBox="140 200 800 680">
      <g fill="url(#emblemBlue)">
        <path d="M 512,325 L 550,325 L 407,841 L 249,839 Z"/>
        <path d="M 530,340 L 602,340 L 828,843 L 670,844 Z"/>
        <path d="M 199,469 C 182,438 173,405 175,375 C 176,334 193,300 221,276 C 250,251 286,244 326,246 C 371,247 416,263 465,278 C 524,297 579,310 628,311 C 690,312 747,296 804,275 L 800,347 C 757,363 707,382 659,385 C 612,388 570,375 530,358 L 469,350 C 432,336 391,322 355,322 C 323,322 296,333 278,351 C 260,369 257,390 265,411 L 284,447 Z"/>
        <rect x="815" y="268" width="68" height="69"/>
        <rect x="876" y="218" width="40" height="40"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="sky" aria-hidden="true"></div>

<header>
  <h1 aria-label="Tezliklə...">
    <span style="--i:0">T</span><span style="--i:1">E</span><span style="--i:2">Z</span><span style="--i:3">L</span><span style="--i:4">İ</span><span style="--i:5">K</span><span style="--i:6">L</span><span style="--i:7">Ə</span><span class="dot" style="--i:8">.</span><span class="dot" style="--i:9">.</span><span class="dot" style="--i:10">.</span>
  </h1>
</header>

<main>
  <div class="stage" role="img" aria-label="İşıq düşən qara qutu">
    <div class="shadow"></div>
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ambient" aria-hidden="true"></div>
    <div class="ground-glow"></div>
    <div class="light-spill"></div>
    <div class="cube">
      <div class="body">
        <div class="f bf" style="--base:translateZ(calc(var(--s)/2))">
          <svg class="mark" aria-hidden="true"><use href="#logo" width="100%" height="100%"/></svg>
        </div>
        <div class="f bb" style="--base:rotateY(180deg) translateZ(calc(var(--s)/2))"></div>
        <div class="f br" style="--base:rotateY(90deg) translateZ(calc(var(--s)/2))"></div>
        <div class="f bl" style="--base:rotateY(-90deg) translateZ(calc(var(--s)/2))"></div>
        <div class="f bt" style="--base:rotateX(90deg) translateZ(calc(var(--B)/2))"></div>
        <div class="f bd" style="--base:rotateX(-90deg) translateZ(calc(var(--B)/2))"></div>
      </div>
      <div class="pivot">
        <div class="lid">
          <div class="f lf" style="--base:translateZ(calc(var(--s)/2))"></div>
          <div class="f lb" style="--base:rotateY(180deg) translateZ(calc(var(--s)/2))"></div>
          <div class="f lr" style="--base:rotateY(90deg) translateZ(calc(var(--s)/2))"></div>
          <div class="f ll" style="--base:rotateY(-90deg) translateZ(calc(var(--s)/2))"></div>
          <div class="f lt" style="--base:rotateX(90deg) translateZ(calc(var(--L)/2))"></div>
          <div class="f lu" style="--base:rotateX(-90deg) translateZ(calc(var(--L)/2))"></div>
        </div>
      </div>
    </div>
    <div class="beam" aria-hidden="true"><i></i><b></b></div>
    <div class="flare" aria-hidden="true"></div>
    <div id="light-dust-container" aria-hidden="true"></div>
  </div>
</main>

<footer>
  <p>πksel İntellektual Oyunlar klubu tərəfindən layihələşdirilmiş πksel İntellektual Oyunlar Platforması</p>
  <p><a href="https://www.instagram.com/peaksel.az" target="_blank" rel="noopener noreferrer">©2026 πksel İntellektual Oyunlar klubu</a></p>
  <p><a href="https://www.instagram.com/onurelzh" target="_blank" rel="noopener noreferrer">©Onur Əlizadə</a></p>
</footer>

<script>
(function(){
  "use strict";
  var sky=document.getElementById("sky");
  var dustContainer=document.getElementById("light-dust-container");
  var NS="http://www.w3.org/2000/svg";
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var count=window.innerWidth<700?32:55;
  function rnd(a,b){return a+Math.random()*(b-a)}

  for(var i=0;i<count;i++){
    var svg=document.createElementNS(NS,"svg");
    var use=document.createElementNS(NS,"use");
    use.setAttribute("href","#logo");
    svg.appendChild(use);
    svg.setAttribute("width",24);
    svg.setAttribute("height",20.4);
    sky.appendChild(svg);
    if(reduce){svg.style.transform="translate("+rnd(0,95)+"vw,"+rnd(0,90)+"vh)";continue}
    var frames=[],steps=5;
    for(var k=0;k<=steps;k++){
      frames.push(k===steps?frames[0]:{transform:"translate("+rnd(-5,100)+"vw,"+rnd(-5,100)+"vh) rotate("+rnd(-180,180)+"deg)"});
    }
    svg.animate(frames,{duration:rnd(28000,60000),iterations:Infinity,easing:"ease-in-out",delay:-rnd(0,30000)});
  }

  if(dustContainer&&!reduce){
    var dustCount=window.innerWidth<700?17:30;
    for(var j=0;j<dustCount;j++){
      var dust=document.createElement("span");
      dust.className="light-dust";
      var startX=rnd(-100,100),startY=rnd(-150,80),driftX=rnd(-110,110),driftY=rnd(-100,70);
      var size=rnd(1,3.2),duration=rnd(3500,8000),delay=4700+rnd(0,3000);
      dust.style.width=size+"px";
      dust.style.height=size+"px";
      dust.style.left="calc(50% + "+startX+"px)";
      dust.style.top="calc(50% + "+startY+"px)";
      dustContainer.appendChild(dust);
      dust.animate([
        {opacity:0,transform:"translate3d(0,0,0) scale(.3)"},
        {opacity:rnd(.2,.65),transform:"translate3d("+(driftX*.45)+"px,"+(driftY*.4)+"px,0) scale(1)"},
        {opacity:rnd(.1,.35),transform:"translate3d("+driftX+"px,"+driftY+"px,0) scale(.5)"},
        {opacity:0,transform:"translate3d("+(driftX*1.2)+"px,"+(driftY*1.3)+"px,0) scale(.2)"}
      ],{duration:duration,delay:delay,iterations:Infinity,easing:"ease-in-out"});
    }
  }else if(dustContainer&&reduce){
    dustContainer.style.display="none";
  }
})();
</script>
</body>
</html>
