<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b8d5ff">
<title>πksel - Xal sayacı</title>
<link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
body{--page:#b8d5ff;--c1:#00269C;--c2:#00269C;--fg:#b8d5ff;--accent:#00269C;--nav:rgba(255,255,255,.35);--navb:rgba(17,92,251,.2);--gl:linear-gradient(135deg,rgba(184,213,255,.3),rgba(184,213,255,.08));--glb:rgba(184,213,255,.55);--glh:rgba(255,255,255,.4);--og:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.12));--ogb:rgba(255,255,255,.7)}
body.dark{--page:#000521;--c1:#6ca2f9;--c2:#6ca2f9;--fg:#000521;--accent:#6ca2f9;--nav:rgba(108,162,249,.2);--navb:rgba(108,162,249,.2);--gl:linear-gradient(135deg,rgba(0,5,33,.28),rgba(0,5,33,.08));--glb:rgba(0,5,33,.45);--glh:rgba(255,255,255,.28);--og:linear-gradient(135deg,rgba(108,162,249,.22),rgba(108,162,249,.06));--ogb:rgba(108,162,249,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*,*:focus,*:focus-visible{outline:none!important}
a,button{-webkit-touch-callout:none}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--page);color:var(--accent);font-family:Montserrat,system-ui,sans-serif;overflow-x:hidden;transition:background .6s ease,color .6s ease;-webkit-font-smoothing:antialiased}
a,button,input{font:inherit}
a{color:inherit;text-decoration:none}
.page{width:calc(100% - 24px);max-width:820px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 0 14px;flex:1 0 auto}
.frame{animation:frameIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--i,0) * .1s)}
@keyframes frameIn{from{opacity:0;transform:translateY(28px)}}
@keyframes navIn{from{opacity:0;transform:translate(-50%,60px)}}

/* şüşə çərçivə */
.glass{position:relative;isolation:isolate;padding:12px;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 48%,rgba(255,255,255,.1));-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.18)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse 75% 55% at 8% 0%,rgba(255,255,255,.62),transparent 72%),linear-gradient(118deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 18%,transparent 42%,rgba(255,255,255,.07) 76%,rgba(255,255,255,.2) 100%)}
body.dark .glass{background:linear-gradient(135deg,rgba(108,162,249,.14),rgba(0,5,33,.28) 48%,rgba(108,162,249,.08));border-color:rgba(108,162,249,.46);box-shadow:inset 0 1px 0 rgba(108,162,249,.24),inset 0 -1px 0 rgba(108,162,249,.16)}
body.dark .glass::before{background:radial-gradient(ellipse 72% 48% at 8% 0%,rgba(108,162,249,.24),transparent 72%),linear-gradient(118deg,rgba(108,162,249,.13) 0%,rgba(108,162,249,.055) 18%,transparent 42%,rgba(108,162,249,.035) 76%,rgba(108,162,249,.12) 100%)}
.glass>*{position:relative;z-index:1}

/* içdəki çərçivələr */
.box{background:var(--c1);color:var(--fg);border-radius:28px;padding:22px 24px;margin-top:12px}
.title-card{display:flex;align-items:center;justify-content:center;gap:14px;min-height:84px;padding:18px 24px;margin-top:0}
.card-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center}
.card-icon svg{width:100%;height:100%;display:block}
.card-title{font-size:25px;line-height:1.15;font-weight:700;letter-spacing:-.6px}
.screen{display:none}
.screen.active{display:block}
h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.5px;text-align:center;margin-bottom:16px}
.center{text-align:center}
.in{font-weight:500;font-size:17px;color:var(--fg);background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border-radius:40px;padding:0 18px;height:46px;width:100%;max-width:260px;text-align:center;transition:box-shadow .25s ease;-webkit-user-select:text;user-select:text}
.in::placeholder{color:var(--fg);opacity:.55}
.in.bad,.slot .in.bad{box-shadow:0 0 0 3px #ff5d6c}
.actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{height:46px;min-width:130px;padding:0 26px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:600;background:var(--gl);color:var(--fg);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);transition:transform .25s ease,opacity .25s ease}
.btn:hover{transform:scale(1.03)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.pbtn{height:46px;min-width:46px;padding:0 24px;border:1px solid var(--ogb);border-radius:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--og);color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,20,110,.1);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);transition:transform .25s ease,opacity .25s ease}
.pbtn:hover{transform:scale(1.04)}.pbtn:active{transform:scale(.96)}
.pbtn:disabled{opacity:.45;cursor:default;transform:none}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.slot{display:flex;align-items:center;gap:10px;background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border-radius:40px;padding:6px 8px}
.slot b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--c1);font-size:14px}
.slot .in{max-width:none;text-align:left;height:36px;font-size:15px;padding:0 14px;background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;min-width:0}

/* xal sayacı */
body.playing{height:100vh;height:100dvh;overflow:hidden}
body.playing footer{display:none}
.page{display:flex;flex-direction:column;max-width:620px}
body.playing .page{height:100vh;height:100dvh}
.glass{display:flex;flex-direction:column}
body.playing .glass{flex:1 1 auto;min-height:0;padding-bottom:calc(88px + max(0px,env(safe-area-inset-bottom)))}
#app{width:100%;margin:0 auto;display:flex;flex-direction:column}
body.playing #app{flex:1 1 auto;min-height:0}
.screen{display:none;width:100%}
.screen.active{display:flex;flex:1 1 auto;min-height:0}
.card{width:100%;border-radius:28px;padding:22px 24px 24px;background:var(--c1);color:var(--fg);display:flex;flex-direction:column}
.card.game{flex:1 1 auto;min-height:0;background:transparent;color:var(--accent);padding:0}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
.brand-badge{width:42px;height:42px;margin-bottom:8px}
.brand-badge img{width:100%;height:100%;object-fit:contain;display:block}
.brand-title{font-size:25px;font-weight:700;text-align:center;line-height:1.1;letter-spacing:-.6px}
.brand-tagline{font-size:15px;font-weight:500;text-align:center;margin-top:2px}
.subtitle{text-align:center;font-size:15px;font-weight:600;opacity:.8;margin:4px 0 10px}
.spacer{flex:1 0 14px}
.card .in{max-width:none;margin-bottom:10px;background:var(--fg);color:var(--c1);border:2px solid var(--fg);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.card .in::placeholder{color:var(--c1);opacity:.5}
.card .in.bad,.card .slot .in.bad{box-shadow:0 0 0 3px #ff5d6c}
#cnt{text-align:center}
.name-row{display:flex;align-items:flex-start;gap:8px}
.name-row .in{flex:1;min-width:0}
.card .btn{width:100%;margin-top:8px;background:var(--fg);color:var(--c1);border:2px solid var(--fg);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.error{color:#ff8a82;text-align:center;margin-top:8px;font-size:14px;font-weight:600;min-height:1em}
body.dark .error{color:#c4160c}
.c0{--tc:#2f6bff}.c1{--tc:#ff2fd0}.c2{--tc:#14d26e}.c3{--tc:#ff7a1a}.c4{--tc:#8f4dff}.c5{--tc:#12c8e0}
.dot,.tile{background:var(--tc)}
.dot{flex:0 0 18px;width:18px;height:18px;border-radius:6px;margin-top:13px}
/* oyun */
.gbtn{border:2px solid var(--c1);background:var(--c1);color:var(--fg);font-weight:700;cursor:pointer;transition:transform .25s ease,opacity .25s ease,background .25s ease}
.gbtn:active{transform:scale(.97)}
.toprow{display:flex;gap:8px;align-items:center;flex:0 0 auto;position:relative;z-index:20}
.dd{position:relative;flex:1;min-width:0}
.dd-btn{position:relative;width:100%;height:46px;border-radius:40px;padding:0 40px;font-size:15px}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:101;background:var(--c1);color:var(--fg);border-radius:22px;padding:6px;box-shadow:0 12px 28px rgba(0,20,110,.3);transform-origin:top center;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px) scale(.94);transition:opacity .3s ease,transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s}
.dd.open .dd-menu{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .3s ease,transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dd-item{opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .35s ease,background .25s}
.dd.open .dd-item{opacity:1;transform:none}
.dd.open .dd-item:nth-child(1){transition-delay:.05s}.dd.open .dd-item:nth-child(2){transition-delay:.1s}.dd.open .dd-item:nth-child(3){transition-delay:.15s}.dd.open .dd-item:nth-child(4){transition-delay:.2s}
.dd-item{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:14px;font-weight:700;padding:10px;border-radius:16px;cursor:pointer}
.dd-item.on{background:color-mix(in srgb,var(--fg) 18%,transparent)}
.hidden{display:none!important}
.icon-btn{flex:0 0 46px;width:46px;height:46px;border-radius:50%;font-size:20px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.tiles{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-content:center;margin:12px 0}
.tiles.r1{grid-template-rows:minmax(0,190px)}
.tiles.r2{grid-template-rows:repeat(2,minmax(0,150px))}
.tile{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px;min-width:0;min-height:0;height:100%;cursor:pointer;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);opacity:.8;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:opacity .25s ease,box-shadow .25s ease}
.tile.sel{opacity:1;box-shadow:inset 0 0 0 3px #fff}
.t-name,.t-score{display:block;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip}
.t-name{font-weight:700;line-height:1.25}
.t-score{font-weight:800;line-height:1.15}
.pts{flex:0 0 auto;border:1px solid var(--ogb);background:var(--og);box-shadow:inset 0 1px 0 rgba(255,255,255,.55);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border-radius:24px;padding:8px}
.vals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.val-btn{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:8px 0 6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:inherit}
.val-btn b{font-size:clamp(14px,4.4vw,20px);font-weight:800}
.val-btn span{font-size:clamp(8px,2.4vw,11px);font-weight:600;margin-top:4px;letter-spacing:.5px}
.val-btn.on,.gbtn.plus{background:var(--c1);color:var(--fg);border-color:var(--c1)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pm .gbtn:not(.plus){background:transparent;color:var(--accent);border:2px solid var(--accent)}
.pm .gbtn{padding:8px;font-size:26px;font-weight:800;line-height:1.1;border-radius:40px;font-family:inherit}
@media (max-width:700px){.card{border-radius:22px;padding:18px 16px 20px}.brand-title{font-size:19px}.brand-tagline,.subtitle{font-size:12px}.tiles{gap:8px}.tile{border-radius:16px;padding:5px 6px}.dd-btn{font-size:13px}}

/* footer */
footer{background:var(--c1);color:var(--fg);min-height:110px;padding:20px 20px calc(96px + max(0px,env(safe-area-inset-bottom)));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:background .6s ease,color .6s ease}
.footer-line{font-size:15px;line-height:1.4;font-weight:500}
.footer-link{transition:opacity .25s ease,transform .25s ease}.footer-link:hover{opacity:.72;transform:translateY(-1px)}

/* navbar */
.navbar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:900;display:flex;gap:10px;padding:8px;border-radius:44px;background:var(--nav);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 30px rgba(0,20,110,.18),inset 0 0 0 1px rgba(255,255,255,.25);animation:navIn .8s cubic-bezier(.18,.8,.24,1) .6s backwards}
.nb{position:relative;width:56px;height:56px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);background:var(--navb);transition:transform .25s ease,background .4s ease,color .4s ease}
.nb:hover{transform:translateY(-3px)}.nb:active{transform:scale(.92)}
.nb svg{width:28px;height:28px;overflow:visible;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nb svg.search-i{fill:none;stroke-width:1.9}
.nb svg.theme-icon{fill:none;stroke:none}
body.dark .navbar{background:rgba(0,9,34,.72)}
body.dark .nb{background:rgba(108,162,249,.2);color:#6ca2f9}
body.dark .nb:hover{background:#6ca2f9;color:#000521}
.ray{stroke:currentColor;stroke-width:2;stroke-linecap:round}
body.dark .ray{opacity:0}
.core{transform:scale(.68);transform-origin:16px 16px}
.bite{transform:translate(14px,-14px)}
body.dark .core{transform:scale(1)}body.dark .bite{transform:translate(0,0)}
body.ready .bite,body.ready .core{transition:transform .6s cubic-bezier(.4,0,.2,1)}

@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
@media (max-width:700px){
.glass{padding:10px;border-radius:26px}
.box{padding:18px 16px;border-radius:22px;margin-top:10px}
.title-card{min-height:70px;gap:10px;padding:12px 16px}
.card-icon{width:32px;height:32px;flex-basis:32px}
.card-title{font-size:19px}
h2{font-size:17px}
.team{font-size:16px;height:52px;padding:0 8px;border-radius:20px}
.vs{width:22px;font-size:18px}
.row{gap:8px}
.nb{width:52px;height:52px}.navbar{gap:8px}
}
@media (max-width:420px){.card-title{font-size:17px}.footer-line{font-size:13px}}
@media (max-width:360px){.nb{width:46px;height:46px}.nb svg{width:25px;height:25px}}
</style>
</head>
<body>
<div class="page">
 <main class="frame glass" style="--i:1">
  <div id="app">
   <div class="screen active" id="setupScreen">
    <div class="card">
     <div class="brand">
      <div class="brand-badge"><img alt="πksel" src="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png"></div>
      <div class="brand-title">Xal sayacı</div>
      <div class="brand-tagline">İntellektual oyunlar üçün</div>
     </div>
     <div class="subtitle">İŞTİRAKÇI SAYI (1-6)</div>
     <input class="in" id="cnt" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" placeholder="məs. 4">
     <div id="names"></div>
     <div class="spacer"></div>
     <button class="btn" id="startBtn" type="button" disabled>BAŞLA</button>
     <div class="error" id="setupError"></div>
    </div>
   </div>
   <div class="screen" id="gameScreen">
    <div class="card game">
     <div class="toprow">
      <div class="dd" id="dd">
       <button class="gbtn dd-btn" id="ddBtn" type="button"><span id="ddLabel">BƏLLİ RAUND</span></button>
       <div class="dd-menu" id="ddMenu"></div>
      </div>
      <button class="gbtn icon-btn" id="resetBtn" type="button" aria-label="Yeni oyun" title="Yeni oyun">↺</button>
     </div>
     <div class="tiles" id="tiles"></div>
     <div class="pts">
      <div class="vals" id="vals"></div>
      <div class="pm">
       <button class="gbtn" id="minusBtn" type="button" aria-label="Xalı çıx">−</button>
       <button class="gbtn plus" id="plusBtn" type="button" aria-label="Xal əlavə et">+</button>
      </div>
     </div>
    </div>
   </div>
  </div>
 </main>
</div>
<footer><div class="footer-line">Unikal İntellektual Oyunlar Platforması</div><a class="footer-line footer-link" href="https://www.instagram.com/piksel.iok" rel="noopener noreferrer" target="_blank">©πksel intellektual oyunlar klubu</a><a class="footer-line footer-link" href="https://www.instagram.com/onurelzh" rel="noopener noreferrer" target="_blank">©Onur Əlizadə</a></footer>
<nav class="navbar" aria-label="Əsas naviqasiya">
<a href="/" class="nb" aria-label="Əsas Səhifə" title="Əsas Səhifə"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.4l8 6.8V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19z" stroke-width="2.2"/></svg></a>

</nav>
<script src="/footer.js"></script>
<script>
const $=s=>document.querySelector(s);
/* ===== SAĞ KLİK VƏ CTRL+U BLOKU ===== */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='u'){e.preventDefault();e.stopPropagation()}
},true);

/* ===== TEMA ===== */
const themeToggle=$('#themeToggle'),rays=[...document.querySelectorAll('.ray')];
function animateRays(n){rays.forEach(e=>{e.getAnimations().forEach(a=>a.cancel());const t=e.animate(n?[{transform:'translateY(0)',opacity:1},{transform:'translateY(-14px)',opacity:0}]:[{transform:'translateY(11px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:n?520:620,delay:n?0:180,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});t.onfinish=()=>t.cancel()})}
function setTheme(d,anim){document.body.classList.toggle('dark',d);try{localStorage.setItem('piksel-theme',d?'dark':'light')}catch(e){}themeToggle.setAttribute('aria-label',d?'Gündüz rejiminə keç':'Gecə rejiminə keç');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#010033':'#b8d5ff';if(anim)animateRays(d)}
(function(){let v=null;try{v=localStorage.getItem('piksel-theme')}catch(e){}
 if(v==='dark')setTheme(true,false);else if(v==='light')setTheme(false,false);else setTheme(!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),false)})();
themeToggle.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark'),true));
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
(function(){
const g=id=>document.getElementById(id);
const ROUNDS=[{n:'BƏLLİ RAUND',m:100},{n:'ŞƏRTLİ RAUND',m:200},{n:'SİRLİ RAUND',m:300},{n:'FƏRDİ RAUND',m:400}];
const ORD=['','1-ci','2-ci','3-cü','4-cü','5-ci','6-cı'];
const SPANS={1:[6],2:[3,3],3:[2,2,2],4:[3,3,3,3],5:[2,2,2,3,3],6:[2,2,2,2,2,2]};
let typed=['','','','','',''],teams=[],round=0,step=0,sel=0;
function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 g(id).classList.add('active');
 document.body.classList.toggle('playing',id==='gameScreen');
 window.scrollTo(0,0);
}
/* QURULUM */
const cnt=g('cnt');
function buildNames(n){
 const box=g('names');box.innerHTML='';g('setupError').textContent='';
 if(!(n>=1&&n<=6)){
  if(cnt.value)g('setupError').textContent='1-dən 6-ya qədər rəqəm yazın.';
  g('startBtn').disabled=true;return;
 }
 for(let i=0;i<n;i++){
  const row=document.createElement('div');row.className='name-row';
  const dot=document.createElement('span');dot.className='dot c'+i;
  const inp=document.createElement('input');
  inp.type='text';inp.className='in';inp.maxLength=24;inp.autocomplete='off';
  inp.placeholder=ORD[i+1]+' iştirakçının adı';
  inp.value=typed[i]||'';
  inp.addEventListener('input',()=>{typed[i]=inp.value;inp.classList.remove('bad');g('setupError').textContent=''});
  inp.addEventListener('keydown',e=>{
   if(e.key!=='Enter')return;
   const nx=box.querySelectorAll('input')[i+1];
   if(nx)nx.focus();else startGame();
  });
  row.appendChild(dot);row.appendChild(inp);box.appendChild(row);
 }
 g('startBtn').disabled=false;
}
cnt.addEventListener('input',()=>{
 cnt.value=cnt.value.replace(/\D/g,'').slice(0,1);
 buildNames(parseInt(cnt.value,10));
 const f=g('names').querySelector('input');
 if(f&&parseInt(cnt.value,10)>=1&&parseInt(cnt.value,10)<=6&&!typed[0])f.focus();
});
g('startBtn').addEventListener('click',startGame);
function startGame(){
 const ins=[...document.querySelectorAll('#names input')];
 if(!ins.length)return;
 let bad=null;
 ins.forEach(x=>{const e=!x.value.trim();x.classList.toggle('bad',e);if(e&&!bad)bad=x});
 if(bad){g('setupError').textContent='Bütün adları yazın.';bad.focus();return}
 teams=ins.map(x=>({name:x.value.trim(),score:0}));
 round=0;step=0;sel=0;
 buildTiles();renderRound();renderVals();
 showScreen('gameScreen');
 requestAnimationFrame(()=>requestAnimationFrame(fitAll));
}
/* XANALAR */
function buildTiles(){
 const box=g('tiles');box.innerHTML='';
 box.className='tiles '+(teams.length<=3?'r1':'r2');
 teams.forEach((t,i)=>{
  const d=document.createElement('div');
  d.className='tile c'+i;
  d.style.gridColumn='span '+SPANS[teams.length][i];
  const n=document.createElement('div');n.className='t-name';n.textContent=t.name;
  const s=document.createElement('div');s.className='t-score';s.textContent=t.score;
  d.appendChild(n);d.appendChild(s);
  d.addEventListener('pointerdown',()=>{sel=i;renderSel()});
  box.appendChild(d);
 });
 renderSel();
}
function tiles(){return [...document.querySelectorAll('#tiles .tile')]}
function renderSel(){tiles().forEach((d,i)=>d.classList.toggle('sel',teams.length===1||i===sel))}
function fit(el,max,min){
 let s=max;el.style.fontSize=s+'px';
 while(el.scrollWidth>el.clientWidth&&s>min){s-=.5;el.style.fontSize=s+'px'}
}
function fitTile(d){
 const h=d.clientHeight||60;
 fit(d.querySelector('.t-name'),Math.max(9,Math.min(22,h*.2)),4);
 fit(d.querySelector('.t-score'),Math.max(16,Math.min(46,h*.42)),6);
}
function fitAll(){tiles().forEach(fitTile)}
function renderScores(){tiles().forEach((d,i)=>{d.querySelector('.t-score').textContent=teams[i].score;fitTile(d)})}
/* RAUND VƏ XAL */
function renderRound(){
 g('ddLabel').textContent=ROUNDS[round].n;
 g('ddMenu').innerHTML='';
 ROUNDS.forEach((r,i)=>{
  const b=document.createElement('button');
  b.type='button';b.className='dd-item'+(i===round?' on':'');b.textContent=r.n;
  b.addEventListener('click',()=>{round=i;renderRound();renderVals()});
  g('ddMenu').appendChild(b);
 });
}
function renderVals(){
 const v=g('vals');v.innerHTML='';
 for(let i=0;i<5;i++){
  const b=document.createElement('button');
  b.type='button';b.className='gbtn val-btn'+(i===step?' on':'');
  b.innerHTML='<b>'+(ROUNDS[round].m*(i+1))+'</b><span>XAL</span>';
  b.addEventListener('click',()=>{step=i;renderVals()});
  v.appendChild(b);
 }
}
function apply(sign){
 const t=teams[sel];if(!t)return;
 t.score+=sign*ROUNDS[round].m*(step+1);
 renderScores();
 const d=tiles()[sel];
 if(d)d.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
}
g('plusBtn').addEventListener('click',()=>apply(1));
g('minusBtn').addEventListener('click',()=>apply(-1));
g('ddBtn').addEventListener('click',e=>{
 e.stopPropagation();
 g('dd').classList.toggle('open');
});
document.addEventListener('click',()=>g('dd').classList.remove('open'));
g('resetBtn').addEventListener('click',()=>{
 if(!confirm('Oyun sıfırlansın və əvvələ qayıdılsın?'))return;
 showScreen('setupScreen');
});
window.addEventListener('resize',fitAll);
window.addEventListener('orientationchange',()=>setTimeout(fitAll,250));
if(window.ResizeObserver)new ResizeObserver(fitAll).observe(g('tiles'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
})();
</script>
</body>
</html>
