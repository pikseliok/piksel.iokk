{name:"I və II Döyüş",questions:[
["<i>(Aparıcı üçün qeyd: Turnirin adını xatırlat!)</i> Fizika dərsinə aid 3D simulyasiya proqramında şagird düsturdakı verilənlərdən birini qısaltdığı üçün simulyasiyada avtomobil təkərləri kiçilir, məscid günbəzləri dağılır, ekvator 1806 km, Ayın orbiti isə 109 000 km qısalır, hətta Günəş belə öz formasını dəyişir. Şagird düsturda nəyi dəyişmişdi?","π (pi ədədi)",A,N,"Bildiyimiz kimi, π ədədi sonsuz irrasional ədəddir. Şagird 3,14... ədədini qısaldıb, tamlaşdıraraq 3 yazdıqdan sonra simulyasiyada bu cür dəyişikliklər baş verdi. Turnirin adının da πksel olması ipucu olmalı idi."],
["2022-ci ildə London Zooparkı nəsli kəsilməkdə olan heyvanlara diqqət çəkmək üçün qəfəslərdən birini boş saxlamışdı. Qəfəsin arxasına yalnız bahalı bir əl çantası qoyulmuşdu. Bəs bu əl çantasını xüsusi edən nə idi?","Nəsli kəsilməkdə olan heyvanın/timsahın dərisindən hazırlanmışdı",O,N,"Zoopark administrasiyası qəfəsdə nəsli kəsilməkdə olan “Siam” timsahı yerinə, həmin timsahın dərisindən hazırlanmış çantanı qoymuşdu və bununla insanları qəfəsin önündəki nəsli kəsilməkdə olan timsah haqqındakı yazıları oxumağa vadar etmişdi."],
["Kriptomneziya - insanın keçmişdə gördüyü, eşitdiyi və ya yaşadığı hadisələri unutduğunu sanması, lakin onların daim şüuraltında saxlanmasına deyilir. Məşhur yazıçı bir romanındakı uşağın macəralarının tamamilə təxəyyül məhsulu olduğunu demiş olsa da, yaxınları yazılanların məhz yazıçının öz uşaqlıq xatirələri olduğunu bildirərək təkzib etmişdilər. Söhbət hansı məşhur yazıçıdan gedir?","Mark Tven",O,N,"“Tom Soyerin macəraları” romanındakı hadisələr məhz Mark Tvenin öz uşaqlıq illərinə aid idi. Sual şərtindəki uşağın macəraları ifadəsi isə əsas ipucu idi."],
["İngilis futbol analitiklərindən birinin 2015/16 mövsümünün əvvəlindəki təxminin cavab olaraq mövsüm sonunda azarkeşlər analitiki “Bəs yadplanetlilər nə vaxt gəlir?” mesajları ilə tənqid atəşinə tutdular. Söhbət nədən gedir?","“Lester Siti”nin çempion olmasından.",O,N,"Mövsümün əvvəlində bu komandanın çempionluq ehtimalını riyazi olaraq yadplanetlilərin Yerə enməsi ehtimalından da aşağı hesablayan ekspertlər “Lester Siti” sensasion şəkildə Premyer Liqanı qazandıqdan sonra azarkeşlərin kinayəli hücumlarına məruz qalmışdılar."],
["“Leap Year” [li:p yɪr] filmində qədim bir İrlandiya ənənəsinin şahidi oluruq. Ənənəyə görə qadınların kişilərə evlilik təklifi etməsi qəbuledilməz sayıldığı halda, məhz bu xüsusi gündə buna icazə verilir. Söhbət hansı gündən gedir?","29 fevral",O,N,"İrlandiya ənənəsinə görə fevral ayının 29-da qadınlar kişilərə evlilik təklifi edə bilərlər və kişilərin bu təklifi rədd etməsi bağışlanmazdır. Filmin adının 366 günlük ili bildirən “Leap Year” [li:p yɪr] olması da əbəs deyildi."]
]},
{name:"III və IV Döyüş",questions:[

["Bir serialın ssenari mərhələsində personajlar üçün kod adları axtarılırdı, lakin heç cür ortaq qərara gələ bilmirdilər. Bir gün bu məsələ üçün keçirilən iclasa komanda üzvlərindən biri üzərində böyük hərflərlə “TOKYO” yazılmış köynəklə gəldi və beləliklə, məsələni böyük ölçüdə həll etmiş oldular. Söhbət hansı serialdan gedir?","La Kasa de Papel",O,N,"Sözügedən serialda oğrular Berlin, Nairobi, Moskva, Rio və digər məşhur şəhərlərin adını kod adı kimi almışdı."],

["“GTA San Andreas” oyununda xəritədəki nəhəng Qant körpüsünün ən zirvəsinə böyük çətinliklə dırmaşan oyunçular orada balaca bir lövhə ilə qarşılaşırlar. Bəs bu lövhədə nəyin olmadığı yazılmışdı?","“Easter Eqin",O,"Qrafik Pasxa yumurtasının","Oyunu hazırlayan proqramçılar körpünün ən uca nöqtəsinə gizli bir detal axtarmağa gələn oyunçular üçün zarafatla lövhə yerləşdirmişdilər. “peaksel.az” İntellektual Oyunlar Platformasında isə siz ardıcıl olaraq 4 dəfə “PageUp”, 2 dəfə isə “PageRight” düyməsinə klikləyərək Easter Eq-i tapa bilərsiniz."],
["Memar Fernando Donis Dubay üçün yeni binalar tikmək əvəzinə, onun hazırkı gözəlliyini göstərən bir tikili ilə “Burc Xəlifə”nin əsl sənət əsəri olduğunu nümayiş etdirməyə çalışmışdı. Bəs bu tikili nə formasında idi?","Şəkil çərçivəsi",O,"Çərçivə","Memar Fernando Donis tərəfindən Dubayda layihələndirilən bu nəhəng tikili qızılı rəngli şəkil çərçivəsidir. Binanın unikallığı ondadır ki, onun daxilindən baxdıqda əzəmətli “Burc Xəlifə”, sanki bir sənət əsəri imiş kimi görünürdü."],
["“Vostok 1” uçuşu zamanı birinci kosmonavt Yuri Qaqarin seçilmişdi. Baxmayaraq ki, German Titovun nəticələri Qaqarindən daha yaxşı idi, qəribə bir səbəbdən o, sadəcə Yurinin dublyoru, yəni ikinci kosmonavt olmuşdu. Bəs səbəb nə idi?","Adının alman sözünü çağrışdırması",O,"Adının “German” olması","İkinci Dünya müharibəsinin təsirləri hələ təzə olduğu üçün rəhbərlik bu adın xəbər başlıqlarına yazılmasını istəmirdi. Başlıqlardan birində Titov üçün “Adına görə ‘kosmosu fəth edən ilk insan’ titulunu əldən verən kosmonavt” yazılmışdı."],
["Yalan dedektorunun nəticələri məhkəmələrdə sübut kimi qəbul edilmir. Çünki sınaq zamanı şübhəliyə “Cinayət silahı olan bıçaq haqqında düşünmə” deyilsə, günahsız olsa belə, bıçaq haqqında düşünməməli olduğunu düşünür. Siz isə bu psixoloji paradoksu izah edərkən adı çəkilən iki canlıdan heç olmasa birinin adını dəqiqliklə deyin.","Çəhrayı fil və ya Ağ ayı.",O,N,"Psixologiyaya görə düşünməmək tapşırıldıqda, beyin həmin obyekti qeyri-şüuri olaraq daim nəzarətdə saxlayır və nəticədə tam əksi baş verir."],
["Belfast şəhərində hazırlanmış heykəldə bu şəxs qarderob qapısı açarkən təsvir olunub. Kim?","Klayv Steypls Lyuis.",O,N,"Məşhur “Narniya salnamələri” əsərinin müəllifi K. S. Lyuisin doğulduğu Belfast şəhərində onun xatirəsinə “Axtaran” adlı heykəl qoyulub. Heykəl “Narniya salnamələri”nin birinci kitabı olan “Aslan, cadugər və qarderob” əsərini simvolizə edir."]
]},
{name:"II Döyüş",questions:[
["17 noyabr 1907-ci ildə Rusiya Dövlət Dumasında Fyodor Rodiçev hökumətin sərt siyasətini tənqid edərək demişdi: “Keçmişdə Nikolay Muravyovun boyun bağı adlandırılan şey, bu gün artıq belə adlandırılır.” Necə?","Stolıpin qalstuku.",O,N,"Fyodor Rodiçev həmin çıxışında baş nazir Pyotr Stolıpinin sərt repressiyalarını, xüsusilə də inqilabçıların edam edildiyi səyyar hərbi məhkəmələri tənqid edərək asma cəzasında istifadə olunan ipi sarkazmla “Stolıpin qalstuku” adlandırmışdı."],
["MTV yəni “Music Television” telekanalı fəaliyyətə başlayarkən yayımladığı ilk klip məhz ingilis pop qrupu “The Buggles”ın [de baqlz] hansı mahnısı olmuşdu?","“Video Killed the Radio Star” / Video radio ulduzunu öldürdü.",O,N,"1 avqust 1981-ci ildə yayım həyatına başlayan MTV telekanalının efirə verdiyi ilk musiqi klipi məhz “The Buggles” qrupunun “Video Killed the Radio Star” mahnısı olmuşdur. Mahnının adı vizual video dövrünün radio erası üzərindəki qələbəsini simvolizə etdiyi üçün xüsusi olaraq seçilmişdi."],
["1871-ci ildə məşhur ingilis yazıçısı Lüis Kerrollun “Alisa güzgü arxasında” adlı kitabındakı Hampti Dampti personajı, Alisaya yaxınlıqdakı elastik və selikli canlıları izah edərkən lüğətdə olmayan “slithy” [slayti] sözündən istifadə etmişdi. Siz isə deyin: Bununla o hansı terminin əsasını qoymuşdu?","Portmentu",O,N,"Portmentu sözlər fərqli məna kəsb edən müxtəlif sözlərin bir hissəsinin birləşməsindən alınan sözlərdir. Hampti Dampti də “Slimy” - selikli və “Lithe” - əsnək, elastik sözlərini birləşdirərək portmentunun əsasını qoymuşdu."],
["Bəzi inanclarda, türk mədəniyyətində daha çox işlədilən “Başına dövlət quşu qondu” ifadəsindəki dövlət quşu da Simurq quşu kimi özünü yandıraraq külündən yenidən doğulduğu deyilir. Bəs bu nə zaman baş verir?","Yeni padşah seçilməli olanda",O,"Padşah vəfat edəndə","Əfsanəyə görə, mövcud padşah vəfat etdikdə və yeni hökmdar seçilməli olduqda Hümayun quşu özünü yandıraraq külündən yenidən doğulur və uçaraq yeni padşah olacaq şəxsin başına qonur. Məşhur ifadə də buradan gəlir."],
["1987-ci ildə Filadelfiyada “One Liberty Place” göydələninin açılışından sonra şəhəri təmsil edən idman komandaları çempion ola bilmirdilər. Bu uğursuzluq “Billi Pennin lənəti” adlandırıldı. Bəs bu lənətin yaranmasına nə səbəb olmuşdu?","Uilyam Pennin heykəlindən hündür göydələnin tikilməsi.",O,N,"Filadelfiyanın qurucusu Uilyam Pennin heykəli Siti Holl binasının zirvəsində yerləşirdi. “One Liberty Place” tikildikdən sonra Pennin heykəli artıq şəhərin ən hündür nöqtəsində deyildi. Komandaların sonrakı uğursuzluqları bu hadisə ilə əlaqələndirilərək “Billi Pennin lənəti” adlandırıldı."]
]},
