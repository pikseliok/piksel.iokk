  <!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>πksel.iok</title>
<script>try{document.documentElement.classList.toggle('dark',localStorage.getItem('piksel-theme')==='dark');}catch(e){}</script>
<style>
  :root{
    --bg:#BDD7FF;
    --navy:#001E6F;
    --navy2:#102B75;
    --mid:#88A8D3;
    --accent:#79B8FF;
    --text-on-light:#001E6F;
    --text-on-dark:#BDD7FF;
    --card-grad:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(189,215,255,.55) 45%,rgba(136,168,211,.45) 100%);
    --card-border:rgba(0,30,111,.28);
    --tr:.3s cubic-bezier(.25,1,.5,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  html,body{
    width:100%;
    background:var(--bg);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text-on-light);
    transition:background var(--tr),color var(--tr);
    overflow-x:hidden;
  }

  html.dark{
    --bg:#081335;
    --card-grad:linear-gradient(135deg,rgba(16,43,117,.55) 0%,rgba(0,30,111,.55) 45%,rgba(8,19,53,.6) 100%);
    --card-border:rgba(121,184,255,.25);
    --text-on-light:#BDD7FF;
  }

  h1,h2,h3,.brand-title,.quick-title,.stat-title{
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-weight:800;
  }

  a{color:inherit;text-decoration:none;}

  /* =========================================================
     TOP BAR — hamburger (left) + dark mode (right)
  ========================================================= */
  .topbar{
    position:sticky;top:0;left:0;right:0;z-index:200;
    height:56px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;
    background:linear-gradient(120deg,var(--navy),var(--navy2));
  }

  .icon-btn{
    width:40px;height:40px;border:0;border-radius:14px;
    background:rgba(189,215,255,.12);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .3s ease, background .3s ease;
  }
  .icon-btn:active{transform:scale(.88);}

  .hamburger-line{
    display:block;width:20px;height:2px;background:var(--text-on-dark);
    position:relative;
    transition:transform .3s ease;
  }
  .hamburger-line::before,.hamburger-line::after{
    content:"";position:absolute;left:0;width:20px;height:2px;background:var(--text-on-dark);
    transition:transform .3s ease, top .3s ease;
  }
  .hamburger-line::before{top:-6px;}
  .hamburger-line::after{top:6px;}

  .theme-icon{font-size:18px;transition:transform .3s ease;}

  /* =========================================================
     SIDE MENU
  ========================================================= */
  .menu-overlay{
    position:fixed;inset:0;background:rgba(0,10,40,0);
    backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
    pointer-events:none;z-index:150;
    transition:background .3s ease, backdrop-filter .3s ease;
  }
  .menu-overlay.open{
    background:rgba(0,10,40,.45);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    pointer-events:auto;
  }

  .side-menu{
    position:fixed;top:0;left:0;bottom:0;
    width:250px;max-width:78vw;
    background:linear-gradient(160deg,var(--navy),var(--navy2) 80%);
    transform:translateX(-105%);
    transition:transform .35s cubic-bezier(.25,1,.5,1);
    z-index:151;
    padding:70px 18px 18px;
    display:flex;flex-direction:column;gap:4px;
  }
  .side-menu.open{transform:translateX(0);}

  .side-menu a{
    padding:12px 10px;border-radius:12px;
    color:var(--text-on-dark);font-weight:700;font-size:14px;
    transition:background .2s ease, transform .2s ease;
  }
  .side-menu a:active{transform:scale(.97);}
  .side-menu a.current{background:rgba(189,215,255,.16);}

  /* =========================================================
     HERO BANNER
  ========================================================= */
  .hero-banner{width:100%;line-height:0;cursor:pointer;}
  .hero-banner img{
    width:100%;height:auto;display:block;
    animation:heroPulse 3s ease-in-out infinite;
  }
  @keyframes heroPulse{0%,66%{transform:scale(1);}83%{transform:scale(.97);}100%{transform:scale(1);}}

  /* =========================================================
     CAROUSEL
  ========================================================= */
  .page{width:100%;max-width:900px;margin:0 auto;}

  .carousel-wrapper{
    position:relative;width:100%;height:380px;
    display:flex;justify-content:center;align-items:center;
    perspective:1000px;overflow:visible;
    margin-top:14px;padding-bottom:22px;
  }
  .carousel-container{
    position:relative;width:100%;height:100%;
    display:flex;justify-content:center;align-items:center;
    transform-style:preserve-3d;
  }
  .carousel-item{
    position:absolute;width:260px;height:260px;border-radius:22px;
    cursor:pointer;display:flex;justify-content:center;align-items:center;
    user-select:none;
    transition:transform .5s cubic-bezier(.25,1,.5,1),opacity .5s ease,filter .5s ease;
    opacity:0;pointer-events:none;
  }
  .carousel-item img{
    width:100%;height:100%;object-fit:contain;border-radius:18px;
    pointer-events:none;transition:transform .5s cubic-bezier(.25,1,.5,1);
  }
  .carousel-item.left{transform:translateX(-190px) translateZ(0) scale(.7);opacity:.6;z-index:2;filter:grayscale(20%);pointer-events:auto;}
  .carousel-item.center{transform:translateX(0) translateZ(100px) scale(1.25);opacity:1;z-index:3;filter:drop-shadow(0 12px 18px rgba(0,30,111,.3));pointer-events:auto;}
  .carousel-item.right{transform:translateX(190px) translateZ(0) scale(.7);opacity:.6;z-index:2;filter:grayscale(20%);pointer-events:auto;}
  .carousel-item.hidden-card{transform:translateX(0) translateZ(-100px) scale(.4);opacity:0;z-index:0;pointer-events:none;}
  .carousel-item.pressed.center{transform:translateX(0) translateZ(100px) scale(1.15);}
  .carousel-item.pressed.left{transform:translateX(-190px) translateZ(0) scale(.62);}
  .carousel-item.pressed.right{transform:translateX(190px) translateZ(0) scale(.62);}

  .nav-btn{
    position:absolute;top:45%;transform:translateY(-50%);
    width:44px;height:44px;
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    border:2px solid var(--text-on-dark);border-radius:50%;
    color:#fff;display:flex;justify-content:center;align-items:center;
    cursor:pointer;z-index:10;box-shadow:0 4px 12px rgba(0,30,111,.4);
    transition:transform .25s ease, background .25s ease;
  }
  .nav-btn:hover{transform:translateY(-50%) scale(1.1);}
  .nav-btn:active{transform:translateY(-50%) scale(.9);}
  .nav-btn.prev{left:8px;}
  .nav-btn.next{right:8px;}
  .pixel-arrow{width:16px;height:16px;fill:#fff;image-rendering:pixelated;}

  .dots-container{position:absolute;bottom:0;display:flex;gap:8px;z-index:10;}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(0,30,111,.28);cursor:pointer;transition:background .3s,transform .3s;}
  .dot.active{background:var(--navy);transform:scale(1.3);}

  /* =========================================================
     QUICK LINKS
  ========================================================= */
  .quick-section{padding:18px 16px 8px;}
  .quick-title{font-size:26px;color:var(--text-on-light);margin-bottom:16px;}

  .quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  @media(max-width:1024px){.quick-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:640px){.quick-grid{grid-template-columns:repeat(2,1fr);}}

  .quick-item{
    aspect-ratio:1/1;
    border-radius:20px;
    background:var(--card-grad);
    border:1px solid var(--card-border);
    box-shadow:0 6px 16px rgba(0,30,111,.15);
    display:flex;align-items:center;justify-content:center;
    padding:14px;
    cursor:pointer;
    opacity:0;transform:translateY(34px);
    transition:transform .5s cubic-bezier(.25,1,.5,1), box-shadow .3s ease;
  }
  .quick-item.revealed{
    animation:quickFadeUp .6s cubic-bezier(.25,1,.5,1) forwards;
  }
  @keyframes quickFadeUp{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:translateY(0);}}
  .quick-item img{width:100%;height:100%;object-fit:contain;pointer-events:none;}
  .quick-item.pressed{transform:scale(.9);transition:transform .3s ease;}

  /* =========================================================
     STATS
  ========================================================= */
  .stats-section{padding:26px 16px 6px;}
  .stats-title{font-size:20px;margin-bottom:12px;}
  .stats-grid{
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .stat-card{
    flex:1 1 0;min-width:0;
    background:var(--card-grad);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:10px 12px;
    box-shadow:0 4px 12px rgba(0,30,111,.12);
    transition:transform .25s ease;
  }
  .stat-card:hover{transform:translateY(-3px);}
  .stat-label{font-size:10.5px;font-weight:700;color:var(--text-on-light);opacity:.85;}
  .stat-value{font-size:17px;font-weight:800;color:var(--text-on-light);margin-top:2px;}

  /* =========================================================
     FOOTER
  ========================================================= */
  footer{
    margin-top:26px;
    background:var(--navy);
    color:#BDD7FF;
    text-align:center;
    padding:22px 14px 26px;
    font-size:12px;
    line-height:1.7;
  }
  footer .tagline{font-weight:800;font-size:14px;white-space:nowrap;}
  footer a{font-weight:700;text-decoration:underline;}


  /* =========================================================
     πKSEL VISUAL SYSTEM — subtle premium layer
  ========================================================= */
  body{
    position:relative;
    isolation:isolate;
    background:var(--bg);
    background-image:radial-gradient(circle at 12% 8%,rgba(121,184,255,.16),transparent 30%),radial-gradient(circle at 88% 55%,rgba(0,30,111,.08),transparent 34%);
    background-size:140% 140%,140% 140%;
    animation:ambientDrift 20s ease-in-out infinite alternate;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
    opacity:.20;
    background-image:linear-gradient(90deg,transparent 49%,rgba(255,255,255,.035) 50%,transparent 51%),linear-gradient(0deg,transparent 49%,rgba(255,255,255,.025) 50%,transparent 51%);
    background-size:46px 46px;
    mask-image:linear-gradient(to bottom,black,transparent 75%);
  }
  @keyframes ambientDrift{
    0%{background-position:0% 0%,100% 100%;}
    100%{background-position:35% 18%,65% 82%;}
  }
  .quick-item,.stat-card{
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 22px rgba(0,30,111,.13),inset 0 1px 0 rgba(255,255,255,.32);
  }
  .quick-item::before,.stat-card::before,.carousel-item::after{
    content:"";position:absolute;pointer-events:none;
    width:90px;height:180%;top:-40%;left:-130px;
    transform:rotate(20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
    opacity:0;
  }
  .quick-item::after,.stat-card::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.20),transparent 30%);
    opacity:.55;
  }
  .quick-item.revealed:nth-child(2){animation-delay:.06s}.quick-item.revealed:nth-child(3){animation-delay:.12s}.quick-item.revealed:nth-child(4){animation-delay:.18s}.quick-item.revealed:nth-child(5){animation-delay:.24s}.quick-item.revealed:nth-child(6){animation-delay:.30s}
  .quick-item:hover,.stat-card:hover{
    box-shadow:0 12px 28px rgba(0,30,111,.18),inset 0 1px 0 rgba(255,255,255,.38);
  }
  .quick-item:hover::before,.stat-card:hover::before{
    animation:softShine 1.1s ease forwards;
  }
  @keyframes softShine{
    0%{left:-130px;opacity:0}
    15%{opacity:1}
    100%{left:135%;opacity:0}
  }
  .carousel-item.center{
    filter:drop-shadow(0 15px 24px rgba(0,30,111,.28));
  }
  .carousel-item.center::after{opacity:.35;animation:carouselShine 5.8s ease-in-out infinite;z-index:4}
  @keyframes carouselShine{
    0%,65%{left:-130px;opacity:0}
    73%{opacity:.7}
    82%{left:135%;opacity:0}
    100%{left:135%;opacity:0}
  }
  .nav-btn,.icon-btn{
    box-shadow:0 6px 16px rgba(0,30,111,.25),inset 0 1px 0 rgba(255,255,255,.16);
  }
  .side-menu{
    box-shadow:12px 0 35px rgba(0,10,40,.25);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  footer{
    box-shadow:0 -8px 30px rgba(0,30,111,.12);
  }
  @media(max-width:640px){
    .stats-grid{gap:7px}
    .stat-card{padding:7px 7px;border-radius:14px}
    .stat-label{font-size:9.5px}
    .stat-value{font-size:16px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  }

  /* =========================================================
     MOBİL KARUSEL ÖLÇÜSÜ — telefonlar üçün kiçildildi
  ========================================================= */
  @media(max-width:640px){
    .carousel-wrapper{height:250px;margin-top:10px;padding-bottom:18px;}
    .carousel-item{width:170px;height:170px;border-radius:18px;}
    .carousel-item img{border-radius:15px;}
    .carousel-item.left{transform:translateX(-120px) translateZ(0) scale(.66);}
    .carousel-item.center{transform:translateX(0) translateZ(80px) scale(1.12);}
    .carousel-item.right{transform:translateX(120px) translateZ(0) scale(.66);}
    .carousel-item.pressed.center{transform:translateX(0) translateZ(80px) scale(1.02);}
    .carousel-item.pressed.left{transform:translateX(-120px) translateZ(0) scale(.58);}
    .carousel-item.pressed.right{transform:translateX(120px) translateZ(0) scale(.58);}
    .nav-btn{width:36px;height:36px;}
    .nav-btn.prev{left:2px;}
    .nav-btn.next{right:2px;}
    .pixel-arrow{width:13px;height:13px;}
    .dots-container{gap:6px;}
    .dot{width:8px;height:8px;}
  }
  @media(max-width:380px){
    .carousel-wrapper{height:205px;}
    .carousel-item{width:140px;height:140px;}
    .carousel-item.left{transform:translateX(-100px) translateZ(0) scale(.66);}
    .carousel-item.right{transform:translateX(100px) translateZ(0) scale(.66);}
    .carousel-item.pressed.left{transform:translateX(-100px) translateZ(0) scale(.58);}
    .carousel-item.pressed.right{transform:translateX(100px) translateZ(0) scale(.58);}
  }

</style>
</head>

<div class="page">

  <div class="carousel-wrapper" id="carouselWrapper">
    <button class="nav-btn prev" onclick="movePrev()" aria-label="Əvvəlki">
      <svg class="pixel-arrow" viewBox="0 0 8 8"><path d="M4 1h1v1H4z M3 2h1v1H3z M2 3h1v1H2z M1 4h1v1H1z M2 5h1v1H2z M3 6h1v1H3z M4 7h1v1H4z"/></svg>
    </button>
    <div class="carousel-container" id="carouselContainer"></div>
    <button class="nav-btn next" onclick="moveNext()" aria-label="Növbəti">
      <svg class="pixel-arrow" viewBox="0 0 8 8"><path d="M3 1h1v1H3z M4 2h1v1H4z M5 3h1v1H5z M6 4h1v1H6z M5 5h1v1H5z M4 6h1v1H4z M3 7h1v1H3z"/></svg>

<script>
/* =========================================================
   MENU
========================================================= */
const menuBtn = document.getElementById('menuBtn');
const menuOverlay = document.getElementById('menuOverlay');
const sideMenu = document.getElementById('sideMenu');
let menuOpen = false;

menuBtn.addEventListener('click', () => {
  menuOpen = !menuOpen;
  sideMenu.classList.toggle('open', menuOpen);
  menuOverlay.classList.toggle('open', menuOpen);
});
menuOverlay.addEventListener('click', () => {
  menuOpen = false;
  sideMenu.classList.remove('open');
  menuOverlay.classList.remove('open');
});

/* =========================================================
   DARK MODE — bütün səhifələr üçün ortaq 'piksel-theme' açarı
========================================================= */
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');

function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  themeIcon.textContent = dark ? '☀️' : '🌙';
  try{ localStorage.setItem('piksel-theme', dark ? 'dark' : 'light'); }catch(e){}
}
let savedDark = false;
try{ savedDark = localStorage.getItem('piksel-theme') === 'dark'; }catch(e){}
applyTheme(savedDark);

themeBtn.addEventListener('click', () => {
  themeIcon.style.transform = 'scale(0)';
  setTimeout(() => {
    applyTheme(!document.documentElement.classList.contains('dark'));
    themeIcon.style.transform = 'scale(1)';
  }, 150);
});

/* =========================================================
   HERO LINK
========================================================= */
document.getElementById('heroBanner').addEventListener('click', function () {
  window.open('https://www.instagram.com/piksel.iok?stkn=cDd6bHhzM2VpaHU0', '_blank');
});

/* =========================================================
   CAROUSEL DATA
========================================================= */
const slideData = [
  { img:"https://lh3.googleusercontent.com/d/1A6PXoxb_tiAq6aw1KVJdXR1vwCOdSsLk", link:"paketler.html", alt:"Sual paketləri" },
  { img:"https://lh3.googleusercontent.com/d/1mO2owRgvZsL6-8zNeOj5tdvK1_6tj5-n", link:"muellif.html", alt:"Müəlliflər" },
  { img:"https://cdn.phototourl.com/free/2026-09-13-068316a8-ce46-4a88-841b-b8085bbf567d.png", link:"breynrinq.html", alt:"Breyn Rinq" },
  { img:"https://cdn.phototourl.com/free/2026-09-04-ab776095-fc12-4524-883d-d4d2d1e2f3b0.png", link:"taymer.html", alt:"NHN Taymer" },
  { img:"https://lh3.googleusercontent.com/d/1WWC8Th2Wzk8AYrQmjeWicSyOtezuUxu-", link:"elaqe.html", alt:"Bizimlə Əlaqə" },
  { img:"https://cdn.phototourl.com/free/2026-09-06-a12d1a67-c59a-4fc9-9cca-46acc2017d24.png", link:"elanlar.html", alt:"Elanlar" }
];

const TOTAL = slideData.length;
let currentIndex = 1;

const carouselContainer = document.getElementById('carouselContainer');
const dotsContainer = document.getElementById('dotsContainer');

slideData.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'carousel-item';
  item.onclick = () => handleCardClick(i);
  item.innerHTML = `<img src="${s.img}" alt="${s.alt}">`;
  carouselContainer.appendChild(item);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.onclick = () => jumpTo(i);
  dotsContainer.appendChild(dot);
});

const items = document.querySelectorAll('.carousel-item');
const dots = document.querySelectorAll('.dot');
let autoRotateTimer = null;

function updateCarousel(){
  items.forEach((item, index) => {
    item.className = 'carousel-item';
    if (index === currentIndex) item.classList.add('center');
    else if (index === (currentIndex - 1 + TOTAL) % TOTAL) item.classList.add('left');
    else if (index === (currentIndex + 1) % TOTAL) item.classList.add('right');
    else item.classList.add('hidden-card');
  });
  dots.forEach((dot, index) => dot.classList.toggle('active', index === currentIndex));
}
function moveNext(){ currentIndex = (currentIndex + 1) % TOTAL; updateCarousel(); }
function movePrev(){ currentIndex = (currentIndex - 1 + TOTAL) % TOTAL; updateCarousel(); }
function jumpTo(index){ currentIndex = index; updateCarousel(); }

function handleCardClick(index){
  const item = items[index];
  item.classList.remove('pressed');
  void item.offsetWidth;
  item.classList.add('pressed');
  setTimeout(() => item.classList.remove('pressed'), 400);

  if (index === currentIndex){
    setTimeout(() => { window.location.href = slideData[index].link; }, 400);
  } else {
    setTimeout(() => { currentIndex = index; updateCarousel(); }, 400);
  }
}

function startAutoRotate(){ stopAutoRotate(); autoRotateTimer = setInterval(moveNext, 3500); }
function stopAutoRotate(){ if (autoRotateTimer){ clearInterval(autoRotateTimer); autoRotateTimer = null; } }

const wrapper = document.getElementById('carouselWrapper');
wrapper.addEventListener('mouseenter', stopAutoRotate);
wrapper.addEventListener('mouseleave', startAutoRotate);

updateCarousel();
startAutoRotate();

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting){
      entry.target.classList.add('revealed');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.2 });

document.querySelectorAll('.quick-item').forEach(el => revealObserver.observe(el));

  /* =========================================================
     SUBTLE DESKTOP MAGNETIC EFFECT
  ========================================================= */
  if (window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    document.querySelectorAll('.quick-item,.stat-card,.nav-btn,.icon-btn').forEach(el=>{
      el.addEventListener('pointermove',e=>{
        const r=el.getBoundingClientRect();
        const x=(e.clientX-r.left-r.width/2)/r.width;
        const y=(e.clientY-r.top-r.height/2)/r.height;
        const max=el.classList.contains('quick-item')?3:2;
        el.style.transform=`translate(${x*max}px,${y*max}px)`;
      });
      el.addEventListener('pointerleave',()=>{el.style.transform='';});
    });
