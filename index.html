
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;800&display=swap" rel="stylesheet">
<title>πksel İntellektual Oyunlar Platforması</title>

<style>
:root {
  --dark: #00030f;
  --mid: #080e2d;
  --grad: linear-gradient(135deg,#70A6FF 0%,#6099FA 55%,#8AB7FF 100%);
  --t-light: 2.9s;
  --t-shake: 3.7s;
  --t-open: 4.5s;
  --tt: 5.1s;
}

* { box-sizing:border-box; margin:0; padding:0; }

html,body {
  width:100%;
  height:100%;
}

body {
  min-height:100dvh;
  overflow:hidden;
  background-color:var(--mid);
  background-image:
    radial-gradient(ellipse at 50% 38%,#101b48 0%,#080e2d 43%,#00030f 100%);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* Fonda uçan loqolar */
#sky {
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}

#sky svg {
  position:absolute;
  left:0;
  top:0;
  opacity:.12;
  will-change:transform;
}

main {
  position:relative;
  z-index:1;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}

/* =========================================
   3D QARA QUTU
========================================= */

.stage {
  --s:clamp(110px,26vmin,240px);
  --B:calc(var(--s)*.72);
  --L:calc(var(--s)*.28);

  position:relative;
  width:var(--s);
  height:var(--s);
  margin-top:9vh;
  perspective:1100px;
  perspective-origin:50% 35%;
  isolation:isolate;
}

.cube {
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transform:rotateX(-24deg) rotateY(-24deg);
}

.body,.pivot,.lid {
  position:absolute;
  left:50%;
  top:50%;
  width:0;
  height:0;
  transform-style:preserve-3d;
}

.body {
  transform:translateY(calc(var(--L)/2));
}

/* Qapağın arxa menteşəsi */
.pivot {
  transform:translate3d(
    0,
    calc(var(--s)*-.22),
    calc(var(--s)*-.5)
  );
  animation:
    lidShake .8s linear var(--t-shake),
    lidOpen 1s cubic-bezier(.3,1.2,.5,1) var(--t-open) forwards;
}

.lid {
  transform:translate3d(
    0,
    calc(var(--L)*-.5),
    calc(var(--s)*.5)
  );
}

/* Bütün 3D səthlər */
.f {
  position:absolute;
  width:var(--w);
  height:var(--h);
  left:calc(var(--w)/-2);
  top:calc(var(--h)/-2);

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  /* Kontur parıltısı minimum səviyyədə */
  box-shadow:inset 0 0 0 1px rgba(135,155,200,.025);

  transform:var(--base);

  animation:
    assemble 1.4s cubic-bezier(.2,.9,.25,1.04)
    calc(var(--d)*1s) both;
}

/* Çox zəif səth əksi */
.f::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:var(--lg,none);
  animation:lit 1.1s ease-out 3.2s forwards;
}

/* Qutu ölçüləri */
.bf,.bb,.br,.bl {
  --w:var(--s);
  --h:var(--B);
}

.bt,.bd {
  --w:var(--s);
  --h:var(--s);
}

.lf,.lb,.lr,.ll {
  --w:var(--s);
  --h:var(--L);
}

.lt,.lu {
  --w:var(--s);
  --h:var(--s);
}

/* =========================================
   MAT-QARA GÖVDƏ
   Rəngli parıltı və parlaq kənarlar yoxdur
========================================= */

.bf {
  background:linear-gradient(
    145deg,
    #08090d 0%,
    #030407 48%,
    #010102 100%
  );

  --lg:linear-gradient(
    145deg,
    rgba(150,170,205,.035),
    transparent 42%
  );
}

.bb {
  background:#010102;
}

.br {
  background:linear-gradient(
    90deg,
    #030407,
    #010102 80%
  );

  --lg:linear-gradient(
    180deg,
    rgba(125,155,205,.025),
    transparent 65%
  );
}

.bl {
  background:#020203;
}

.bt {
  background:#010102;
  border:1px solid #08090d;
  box-shadow:none;
}

.bd {
  background:#000;
}

/* =========================================
   MAT-QARA QAPAQ
========================================= */

.lf {
  background:linear-gradient(
    150deg,
    #090a0e 0%,
    #030407 60%,
    #010102 100%
  );

  --lg:linear-gradient(
    145deg,
    rgba(155,180,220,.045),
    transparent 55%
  );
}

.lb {
  background:#010102;
}

.lr {
  background:#030407;

  --lg:linear-gradient(
    180deg,
    rgba(125,155,205,.025),
    transparent 75%
  );
}

.ll {
  background:#020203;
}

.lt {
  background:#020203;
  box-shadow:none;
}

.lu {
  background:#000;
  box-shadow:none;
}

/* Qutunun ön üzündəki SVG loqo */
.mark {
  position:absolute;
  left:50%;
  top:50%;
  width:46%;
  aspect-ratio:800/680;
  height:auto;
  transform:translate(-50%,-50%);
  opacity:.95;
}

/* =========================================
   REALİSTİK YER KÖLGƏSİ
========================================= */

.shadow {
  position:absolute;
  left:50%;
  top:calc(50% + var(--s)*.48);

  width:calc(var(--s)*1.9);
  height:calc(var(--s)*.48);

  transform:translateX(-50%);
  border-radius:50%;

  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,.88) 0%,
    rgba(0,0,0,.58) 30%,
    rgba(0,0,0,.24) 55%,
    transparent 76%
  );

  filter:blur(8px);
  opacity:0;

  animation:appear 1.5s ease-out 1.1s forwards;
}

/* =========================================
   YUXARIDAN DÜŞƏN HƏCMİ İŞIQ
========================================= */

.beam {
  position:absolute;
  left:50%;

  bottom:calc(50% + var(--s)*.12);

  width:calc(var(--s)*2.8);
  height:70vh;

  z-index:3;
  pointer-events:none;

  transform-origin:50% 0;
  transform:translateX(-50%) scaleY(0);

  opacity:0;
  filter:blur(9px);

  animation:beamOn 2.2s ease-out var(--t-light) forwards;
}

/*
  Üçbucaq əvəzinə müxtəlif yumşaq gradientlər.
  Şüanın kənarları tədricən itir.
*/
.beam i {
  position:absolute;
  inset:0;

  display:block;
  width:100%;
  height:100%;

  clip-path:none;
  border-radius:48% 48% 8% 8% / 5% 5% 20% 20%;

  background:
    radial-gradient(
      ellipse at 50% 3%,
      rgba(220,233,255,.20) 0%,
      rgba(160,190,240,.10) 12%,
      transparent 42%
    ),
    radial-gradient(
      ellipse at 50% 65%,
      rgba(125,160,220,.06) 0%,
      transparent 68%
    ),
    linear-gradient(
      180deg,
      transparent 0%,
      rgba(150,180,235,.025) 18%,
      rgba(155,190,250,.075) 55%,
      rgba(200,220,255,.16) 100%
    );

  filter:blur(13px);
  opacity:.9;
}

/* =========================================
   DÖŞƏMƏDƏ YAYILAN İŞIQ
========================================= */

.ground-glow {
  position:absolute;
  left:50%;
  top:calc(50% + var(--s)*.42);

  width:calc(var(--s)*2.8);
  height:calc(var(--s)*.9);

  transform:translateX(-50%) scale(.55);
  border-radius:50%;

  background:radial-gradient(
    ellipse at center,
    rgba(130,165,225,.15) 0%,
    rgba(100,140,210,.07) 30%,
    rgba(80,110,175,.025) 52%,
    transparent 72%
  );

  filter:blur(15px);
  opacity:0;
  pointer-events:none;

  animation:floorLight 2s ease-out 3.2s forwards;
}

/* İşığın qutu kənarlarından yayılması */
.light-spill {
  position:absolute;
  left:50%;
  top:calc(50% + var(--s)*.22);

  width:calc(var(--s)*2.1);
  height:calc(var(--s)*1.3);

  transform:translate(-50%,-50%);
  border-radius:50%;

  background:radial-gradient(
    ellipse at center,
    rgba(145,175,230,.055) 0%,
    rgba(115,150,210,.025) 35%,
    transparent 72%
  );

  filter:blur(18px);
  opacity:0;
  pointer-events:none;

  animation:spillLight 2.5s ease-out 3.2s forwards;
}

/* Havada görünən zəif toz hissəcikləri */
.light-dust {
  position:absolute;
  left:50%;
  top:50%;

  width:3px;
  height:3px;
  border-radius:50%;

  background:rgba(205,222,255,.75);
  box-shadow:0 0 7px 2px rgba(145,180,255,.18);

  opacity:0;
  pointer-events:none;
  z-index:4;
  will-change:transform,opacity;
}

/* =========================================
   ANİMASİYALAR
========================================= */

@keyframes assemble {
  from {
    transform:
      translate3d(var(--x),var(--y),var(--z))
      rotate3d(1,1,0,var(--r))
      var(--base);
  }

  to {
    transform:
      translate3d(0,0,0)
      rotate3d(1,1,0,0deg)
      var(--base);
  }
}

@keyframes appear {
  to { opacity:1; }
}

@keyframes lit {
  to { opacity:1; }
}

@keyframes beamOn {
  0% {
    opacity:0;
    transform:translateX(-50%) scaleY(0);
  }

  25% {
    opacity:.8;
    transform:translateX(-50%) scaleY(.55);
  }

  55% {
    opacity:.55;
    transform:translateX(-50%) scaleY(1);
  }

  75% {
    opacity:.85;
  }

  100% {
    opacity:.65;
    transform:translateX(-50%) scaleY(1);
  }
}

@keyframes floorLight {
  0% {
    opacity:0;
    transform:translateX(-50%) scale(.55);
  }

  45% {
    opacity:.9;
    transform:translateX(-50%) scale(1);
  }

  100% {
    opacity:.65;
    transform:translateX(-50%) scale(1.12);
  }
}

@keyframes spillLight {
  0% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
  }

  40% {
    opacity:.85;
    transform:translate(-50%,-50%) scale(1);
  }

  100% {
    opacity:.5;
    transform:translate(-50%,-50%) scale(1.2);
  }
}

@keyframes lidShake {
  0%,100% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(0deg) rotateZ(0deg);
  }

  10% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(5deg) rotateZ(-1.6deg);
  }

  20% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(0deg) rotateZ(1.6deg);
  }

  32% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(6.5deg) rotateZ(-1.2deg);
  }

  44% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(0deg) rotateZ(1.2deg);
  }

  56% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(4.5deg) rotateZ(-.8deg);
  }

  68% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(0deg) rotateZ(.8deg);
  }

  82% {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(2.5deg) rotateZ(-.4deg);
  }
}

@keyframes lidOpen {
  from {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(0deg);
  }

  to {
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(112deg);
  }
}

/* =========================================
   BAŞLIQ
========================================= */

header {
  position:fixed;
  left:0;
  right:0;
  top:0;
  z-index:5;

  padding:calc(env(safe-area-inset-top) + clamp(16px,5vh,44px)) 12px 0;

  text-align:center;
  pointer-events:none;
}

header h1 {
  font-weight:800;
  font-size:clamp(26px,6vmin + 8px,64px);
  letter-spacing:.1em;
  line-height:1.1;
  white-space:nowrap;
}

header h1 span {
  display:inline-block;

  background:var(--grad);
  background-size:1100% 100%;
  background-position:calc(var(--i)*10%) 0;

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;

  animation:
    letterIn .9s cubic-bezier(.2,.9,.3,1.2)
    calc(var(--tt) + var(--i)*.09s) both;
}

header h1 span.dot {
  animation:
    letterIn .9s cubic-bezier(.2,.9,.3,1.2)
    calc(var(--tt) + var(--i)*.09s) both,
    blink 1.8s ease-in-out
    calc(var(--tt) + 1.8s + var(--i)*.15s) infinite;
}

@keyframes letterIn {
  from {
    opacity:0;
    transform:translateY(-40px) scale(.5);
    filter:blur(10px);
  }

  to {
    opacity:1;
    transform:none;
    filter:blur(0);
  }
}

@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:.15; }
}

/* =========================================
   FOOTER
========================================= */

footer {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:5;

  padding:10px 14px calc(12px + env(safe-area-inset-bottom));

  text-align:center;
  font-size:clamp(10px,1.6vmin + 4px,12px);
  line-height:1.6;

  animation:fadeUp 1.2s ease .8s both;
}

footer p,
footer a {
  background:var(--grad);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  text-decoration:none;
}

footer a:hover,
footer a:focus-visible {
  filter:brightness(1.25);
  text-decoration:underline;
  text-decoration-color:#70A6FF;
}

footer a:focus-visible {
  outline:2px solid #70A6FF;
  outline-offset:3px;
  border-radius:3px;
}

/* Footer animasiyası */
@keyframes fadeUp {
  from {
    opacity:0;
    transform:translateY(10px);
  }

  to {
    opacity:1;
    transform:none;
  }
}

/* Kiçik ekranlar */
@media (max-width:380px) {
  header h1 {
    font-size:clamp(23px,7vw,32px);
    letter-spacing:.07em;
  }

  .stage {
    --s:clamp(110px,31vmin,190px);
  }
}

/* Hərəkət həssaslığı */
@media (prefers-reduced-motion:reduce) {
  .f,
  .shadow,
  footer,
  header h1 span,
  .ground-glow,
  .light-spill,
  .light-dust {
    animation:none !important;
  }

  .f::after {
    animation:none !important;
    opacity:1;
  }

  .shadow {
    opacity:1;
  }

  .pivot {
    animation:none !important;
    transform:translate3d(
      0,
      calc(var(--s)*-.22),
      calc(var(--s)*-.5)
    ) rotateX(112deg);
  }

  .beam {
    animation:none !important;
    opacity:.65;
    transform:translateX(-50%) scaleY(1);
  }

  .ground-glow,
  .light-spill {
    opacity:.5;
  }
}
</style>
</head>

<!-- Ortaq gradient və loqo simvolu -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="emblemBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A6FF"/>
      <stop offset="55%" stop-color="#6099FA"/>
      <stop offset="100%" stop-color="#8AB7FF"/>
    </linearGradient>

    <symbol id="logo" viewBox="140 200 800 680">
      <g fill="url(#emblemBlue)">
        <path d="M 512,325 L 550,325 L 407,841 L 249,839 Z"/>
        <path d="M 530,340 L 602,340 L 828,843 L 670,844 Z"/>
        <path d="M 199,469 C 182,438 173,405 175,375 C 176,334 193,300 221,276 C 250,251 286,244 326,246 C 371,247 416,263 465,278 C 524,297 579,310 628,311 C 690,312 747,296 804,275 L 800,347 C 757,363 707,382 659,385 C 612,388 570,375 530,358 L 469,350 C 432,336 391,322 355,322 C 323,322 296,333 278,351 C 260,369 257,390 265,411 L 284,447 Z"/>
        <rect x="815" y="268" width="68" height="69"/>

<div id="sky" aria-hidden="true"></div>

<main>

    <div class="ground-glow"></div>
    <div class="light-spill"></div>

    <div class="cube">

      <!-- Qutunun gövdəsi -->
      <div class="body">

        <div class="f bf"
          style="--base:translateZ(calc(var(--s)/2));--x:-95vw;--y:-30vh;--z:-700px;--r:540deg;--d:0">
          <svg class="mark" aria-hidden="true">
            <use href="#logo" width="100%" height="100%"/>
          </svg>
        </div>

        <div class="f bb"
          style="--base:rotateY(180deg) translateZ(calc(var(--s)/2));--x:95vw;--y:-40vh;--z:-500px;--r:-480deg;--d:.08"></div>

        <div class="f br"
          style="--base:rotateY(90deg) translateZ(calc(var(--s)/2));--x:100vw;--y:25vh;--z:-600px;--r:600deg;--d:.16"></div>

        <div class="f bl"
          style="--base:rotateY(-90deg) translateZ(calc(var(--s)/2));--x:-100vw;--y:35vh;--z:-400px;--r:-540deg;--d:.24"></div>

        <div class="f bt"
          style="--base:rotateX(90deg) translateZ(calc(var(--B)/2));--x:10vw;--y:-110vh;--z:-800px;--r:720deg;--d:.32"></div>

        <div class="f bd"
          style="--base:rotateX(-90deg) translateZ(calc(var(--B)/2));--x:-10vw;--y:110vh;--z:-800px;--r:-720deg;--d:.4"></div>

      </div>

      <!-- Arxa menteşəli qapaq -->
      <div class="pivot">
        <div class="lid">

          <div class="f lf"
            style="--base:translateZ(calc(var(--s)/2));--x:-80vw;--y:-70vh;--z:-600px;--r:480deg;--d:.48"></div>

          <div class="f lb"
            style="--base:rotateY(180deg) translateZ(calc(var(--s)/2));--x:80vw;--y:-70vh;--z:-600px;--r:-480deg;--d:.54"></div>

          <div class="f lr"
            style="--base:rotateY(90deg) translateZ(calc(var(--s)/2));--x:100vw;--y:-20vh;--z:-500px;--r:540deg;--d:.6"></div>

          <div class="f ll"
            style="--base:rotateY(-90deg) translateZ(calc(var(--s)/2));--x:-100vw;--y:-20vh;--z:-500px;--r:-540deg;--d:.66"></div>

          <div class="f lt"
            style="--base:rotateX(90deg) translateZ(calc(var(--L)/2));--x:0vw;--y:-120vh;--z:-900px;--r:720deg;--d:.72"></div>

          <div class="f lu"
            style="--base:rotateX(-90deg) translateZ(calc(var(--L)/2));--x:0vw;--y:120vh;--z:-900px;--r:-720deg;--d:.78"></div>

        </div>
      </div>

    </div>

    <!-- Yumşaq, həcmli işıq şüası -->
    <div class="beam" aria-hidden="true"><i></i></div>

    <!-- İşığın qutunun ətrafına səpələnməsi üçün hissəciklər -->
    <div id="light-dust-container" aria-hidden="true"></div>

  </div>
</main>

<header>
  <h1 aria-label="Tezliklə...">
    <span style="--i:0">T</span><span style="--i:1">E</span><span style="--i:2">Z</span><span style="--i:3">L</span><span style="--i:4">İ</span><span style="--i:5">K</span><span style="--i:6">L</span><span style="--i:7">Ə</span><span class="dot" style="--i:8">.</span><span class="dot" style="--i:9">.</span><span class="dot" style="--i:10">.</span>
  </h1>
</header>

<footer>

<script>
(function () {
  "use strict";

  var sky = document.getElementById("sky");
  var dustContainer = document.getElementById("light-dust-container");
  var NS = "http://www.w3.org/2000/svg";

  var reduce = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  var count = window.innerWidth < 700 ? 32 : 55;

  function rnd(a, b) {
    return a + Math.random() * (b - a);
  }

  /* Fon loqolarının yavaş hərəkəti */
  for (var i = 0; i < count; i++) {
    var svg = document.createElementNS(NS, "svg");
    var use = document.createElementNS(NS, "use");

    use.setAttribute("href", "#logo");
    svg.appendChild(use);

    svg.setAttribute("width", 24);
    svg.setAttribute("height", 20.4);

    sky.appendChild(svg);

    if (reduce) {
      svg.style.transform =
        "translate(" + rnd(0, 95) + "vw," +
        rnd(0, 90) + "vh)";
      continue;
    }

    var frames = [];
    var steps = 5;

    for (var k = 0; k <= steps; k++) {
      frames.push(
        k === steps
          ? frames[0]
          : {
              transform:
                "translate(" + rnd(-5, 100) + "vw," +
                rnd(-5, 100) + "vh) rotate(" +
                rnd(-180, 180) + "deg)"
            }
      );
    }

    svg.animate(frames, {
      duration: rnd(28000, 60000),
      iterations: Infinity,
      easing: "ease-in-out",
      delay: -rnd(0, 30000)
    });
  }

  /*
    İşıqda görünən xırda toz hissəcikləri.
    Bəziləri yuxarı qalxır, bəziləri yanlara yayılır.
  */
  if (dustContainer && !reduce) {
    var dustCount = window.innerWidth < 700 ? 17 : 30;

    for (var j = 0; j < dustCount; j++) {
      var dust = document.createElement("span");
      dust.className = "light-dust";

      var startX = rnd(-100, 100);
      var startY = rnd(-150, 80);
      var driftX = rnd(-110, 110);
      var driftY = rnd(-100, 70);
      var size = rnd(1, 3.2);
      var duration = rnd(3500, 8000);
      var delay = rnd(2800, 6000);

      dust.style.width = size + "px";
      dust.style.height = size + "px";
      dust.style.left = "calc(50% + " + startX + "px)";
      dust.style.top = "calc(50% + " + startY + "px)";

      dustContainer.appendChild(dust);

      dust.animate(
        [
          {
            opacity: 0,
            transform: "translate3d(0,0,0) scale(.3)"
          },
          {
            opacity: rnd(.2, .65),
            transform:
              "translate3d(" + (driftX * .45) + "px," +
              (driftY * .4) + "px,0) scale(1)"
          },
          {
            opacity: rnd(.1, .35),
            transform:
              "translate3d(" + driftX + "px," +
              driftY + "px,0) scale(.5)"
          },
          {
            opacity: 0,
            transform:
              "translate3d(" + (driftX * 1.2) + "px," +
              (driftY * 1.3) + "px,0) scale(.2)"
          }
        ],
        {
          duration: duration,
          delay: delay,
          iterations: Infinity,
          easing: "ease-in-out"
        }
      );
    }
  } else if (dustContainer && reduce) {
    dustContainer.style.display = "none";
  }
})();
</script>

</body>
</html>
