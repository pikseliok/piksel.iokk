firebase.initializeApp({apiKey:"AIzaSyBmo0VWzQ-K4s_yvt89ZMLqKWJx4cJBLUk",authDomain:"piksel-sesli-breyn-rinq.firebaseapp.com",databaseURL:"https://piksel-sesli-breyn-rinq-default-rtdb.firebaseio.com",projectId:"piksel-sesli-breyn-rinq",storageBucket:"piksel-sesli-breyn-rinq.firebasestorage.app",messagingSenderId:"147223095536",appId:"1:147223095536:web:08b9501bae3bca64763a35"});
const db=firebase.database(),$=e=>document.getElementById(e),
esc=e=>String(e??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]),
ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",
rnd=n=>Array.from({length:n},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join(""),

MAX_TEAM=6,MIN_TEAM=1;

const rays=[...document.querySelectorAll(".ray")];
function animateRays(toDark){
  rays.forEach(el=>{
    el.getAnimations().forEach(x=>x.cancel());
    const a=el.animate(toDark?[{transform:"translateY(0)",opacity:1},{transform:"translateY(-14px)",opacity:0}]:[{transform:"translateY(11px)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:toDark?520:620,delay:toDark?0:180,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"});
    a.onfinish=()=>a.cancel();
  });
}
function setTheme(dark,anim){
  document.body.classList.toggle("dark",dark);
  try{localStorage.setItem("piksel-theme",dark?"dark":"light")}catch(e){}
  $("themeToggle").setAttribute("aria-label",dark?"Gündüz rejiminə keç":"Gecə rejiminə keç");

}
let sv=null;
try{sv=localStorage.getItem("piksel-theme")}catch(e){}
function setMode(m){
  mode=m;
  document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m&&m!=="host"));
  $("form").hidden=m==="host";
  $("fRoom").hidden=$("fTeam").hidden=m!=="cap";
  $("fCode").hidden=m!=="pl";
  $("go").textContent=m==="cap"?"Komandanı yarat":"Komandaya qoş";
}
setTheme(sv?sv==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),false);
$("themeToggle").onclick=()=>setTheme(!document.body.classList.contains("dark"),true);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));
document.addEventListener("pointermove",e=>{
  const a=e.target.closest&&e.target.closest(".card,.tcard");

});

$("go").onclick=()=>start();

async function start(){
  if(busy)return;
  busy=true;
  try{
    if(mode==="host"){
      let code=null;
      for(let i=0;i<10;i++){
        const t=rnd(5);
        const snap=await db.ref("rooms/"+t).once("value");
        if(!snap.exists()){code=t;break}
      }
      if(!code)return alert("Otaq kodu yaradıla bilmədi, yenidən yoxla");
      await db.ref("rooms/"+code).set({createdAt:firebase.database.ServerValue.TIMESTAMP,status:"lobby",host:pid});
      room=code;role="host";
    }else if(mode==="cap"){
      const r=norm($("fRoom").value),teamName=$("fTeam").value.trim(),pname=$("fName").value.trim();
      if(r.length<4||!teamName||!pname)return alert("Otaq kodunu, komanda adını və adını yaz");
      const snap=await db.ref("rooms/"+r).once("value");
      const data=snap.val();
      if(!data)return alert("Belə otaq yoxdur");
      const teams=data.teams||{};
      if(Object.keys(teams).length>=2)return alert("Otaqda artıq 2 komanda var");
      if(Object.values(teams).some(x=>x.name.trim().toLowerCase()===teamName.toLowerCase()))return alert("Bu komanda adı artıq var, fərqli ad seç");
      let tid;
      do{tid=rnd(4)}while(teams[tid]);
      await db.ref("rooms/"+r+"/teams/"+tid).set({name:teamName,captain:pid,founder:pid,presser:null,createdAt:firebase.database.ServerValue.TIMESTAMP});
      await db.ref("rooms/"+r+"/players/"+pid).set({name:pname,team:tid,cap:true,joinedAt:firebase.database.ServerValue.TIMESTAMP});
      room=r;role="captain";
    }else{
      const c=norm($("fCode").value),pname=$("fName").value.trim();
      if(c.length<8||!pname)return alert("Komanda kodunu və adını yaz");
      const r=c.slice(0,-4),tid=c.slice(-4);
      const snap=await db.ref("rooms/"+r).once("value");
      const data=snap.val();
      if(!data||!data.teams||!data.teams[tid])return alert("Komanda kodu yanlışdır");
      let full=false;
      const res=await db.ref("rooms/"+r+"/players").transaction(cur=>{
        cur=cur||{};
        if(cur[pid])return cur;
        if(Object.values(cur).filter(x=>x.team===tid).length>=MAX_TEAM){full=true;return}
        cur[pid]={name:pname,team:tid,cap:false,joinedAt:Date.now()};
        return cur;
      });
      if(!res.committed)return alert(full?"Komanda doludur (maksimum 6 nəfər)":"Qoşulmaq alınmadı, yenidən yoxla");
      room=r;role="player";
    }
    listen();
  }catch(e){
    alert("Xəta: "+e.message);
  }finally{
    setTimeout(()=>{busy=false},400);
  }
}

function listen(){
  try{sessionStorage.setItem("piksel-br-sess",JSON.stringify({room:room,role:role}))}catch(e){}
  presence();
  db.ref("rooms/"+room).on("value",snap=>{
    const v=snap.val();
    if(!v){
      leaveClean();
      alert(window.idleMsg||"Otaq bağlandı");
      noPrompt=1;location.reload();
      return;
    }
    if(role==="host"||(v.players&&v.players[pid])){R=v;render()}
    else{noPrompt=1;leaveClean();location.replace("/sesli-breyn-rinq")}
  },()=>{
    alert("Əlaqə kəsildi");noPrompt=1;location.reload();
  });
}

<script>
let vol=.5,off=0,muted=false,stream=null,micAsk=0,sigOn=0,xp=0,micFail=0,rejoined=false;
const _pA=performance.now(),_wA=Date.now(),FAIR_WINDOW=400,EXPIRE_GRACE=1500,localNow=()=>_wA+(performance.now()-_pA);
let calib=false,syncing=false,lastSync=0;
db.ref(".info/serverTimeOffset").on("value",s=>{const v=s.val();if(typeof v==="number"&&!calib)off=v});
const now=()=>Math.round(localNow()+off),rf=p=>db.ref("rooms/"+room+(p?"/"+p:""));
function evTime(ev){
  const t=ev&&ev.timeStamp,n=localNow();
  if(typeof t==="number"&&isFinite(t)&&t>0){
    const w=t>1e12?t:_wA+(t-_pA);
    if(w<=n+5&&n-w<=1500)return w+off;
  }
  return n+off;
}
async function syncClock(count){
  if(syncing||!room)return;
  syncing=true;
  const ref=db.ref("sync/"+room+"/"+pid);
  try{
    const samples=[];
    for(let i=0;i<count&&room;i++){
      const t0=localNow();
      await ref.set(firebase.database.ServerValue.TIMESTAMP);
      const t1=localNow(),sv=(await ref.once("value")).val();
      if(typeof sv==="number"&&isFinite(sv))samples.push({rtt:t1-t0,off:sv-(t0+t1)/2});
      await new Promise(r=>setTimeout(r,60));
    }
    if(samples.length){
      samples.sort((a,b)=>a.rtt-b.rtt);
      const best=samples.filter(s=>s.rtt<=samples[0].rtt+25).sort((a,b)=>a.off-b.off);
      const m=best[Math.floor(best.length/2)].off;
      if(isFinite(m)){off=Math.round(m);calib=true}
    }
  }catch(e){}
  finally{try{await ref.remove()}catch(e){}syncing=false}
}
setInterval(()=>{
  if(room&&!syncing&&Date.now()-lastSync>(calib?15e3:3e3)){lastSync=Date.now();syncClock(calib?4:8)}
},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&room)lastSync=0});

const T=()=>R.teams||{},P=()=>R.players||{},opn={},isH=()=>role==="host",isPen=id=>!!(P()[id]&&P()[id].pen),skip={},sk=k=>Date.now()<(skip[k]||0),
TK=()=>!!R&&["lobby","wait","expired","finished"].includes(R.status);
function remMs(){return R&&R.status==="running"&&R.timerEnd?Math.max(0,R.timerEnd-now()):0}
function tms(){
  if(!R)return 2e4;
  if(R.status==="running")return remMs();
  if(R.status==="answered")return Math.max(0,Number(R.pausedMs)||0);
  if(R.status==="expired"||R.status==="finished")return 0;
  return 2e4;
}
function tl(){return Math.ceil(tms()/1e3)}
function paintTm(){
  const el=$("tm");
  if(!el||!R)return;
  const t=Math.max(0,Math.round(tms())),sec=String(Math.floor(t/1e3)),ms=String(t%1e3).padStart(3,"0");
  const a=el._s||(el._s=el.querySelector(".t-sec")),b=el._m||(el._m=el.querySelector(".t-ms"));
  if(a&&a.textContent!==sec)a.textContent=sec;
  if(b&&b.textContent!==ms)b.textContent=ms;
}
function members(tid){
  return Object.entries(P()).filter(([,p])=>p.team===tid).map(([id,p])=>({id,...p}))
    .sort((a,b)=>(a.pen?1:0)-(b.pen?1:0)||(b.cap?1:0)-(a.cap?1:0)||(a.joinedAt||0)-(b.joinedAt||0));
}
function presserOf(tid){
  const t=T()[tid];
  return t&&t.presser&&members(tid).some(m=>m.id===t.presser)?t.presser:null;
}
(function loop(){paintTm();requestAnimationFrame(loop)})();
setInterval(paintTm,25);

const MICSVG=slash=>`<svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>${slash?'<path d="M3.5 3.5l17 17" stroke-width="2.6"/>':""}</svg>`,
BTNSVG='<svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>';

function render(){
  if(role!=="host"&&P()[pid])role=P()[pid].cap?"captain":"player";
  const isHost=isH(),me=P()[pid]||{},o=me.team,c=role==="captain",l=R.status,val=R.val||1;
  const tids=Object.keys(T()).sort((a,b)=>(T()[a].createdAt||0)-(T()[b].createdAt||0));
  const d=id=>tids.indexOf(id)===1?"p":"b";
  const isPresser=!isHost&&!!o&&presserOf(o)===pid;
  const u=isHost;
  $("lobby").hidden=true;$("game").hidden=false;
  const ready=tids.length===2&&tids.every(id=>members(id).length>=MIN_TEAM&&presserOf(id));

  let s=R.ev;
  if(l==="lobby"){
    s=tids.length<2?"Komandaların qoşulması gözlənilir...":isHost?(ready?"Hazırdır. Oyunu başlada bilərsən.":"Hər komandada düyməsıxan lazımdır."):c?"Komandandan düyməsıxan seç.":"Kapitan düyməsıxanı seçir.";
  }else if(l==="wait"&&!s){
    s=`${val} XALLIQ SUAL SƏSLƏNİR!`+(val>=3?" TAPILMASA DİSKVALİFİKASİYA":"");
  }else if(l==="finished"){
    s="🏆 "+((T()[R.winner]||{}).name||"")+" QALİB OLDU!";
  }
  let p=esc(s||"");
  if(l==="answered"&&R.speaker&&P()[R.speaker]){
    p=R.speaker===pid?"<b>Siz</b> cavab verirsiniz":"<b>"+esc(P()[R.speaker].name)+"</b> cavab verir";
  }
  if(TK()&&R.talk&&P()[R.talk]){
    p=R.talk===pid?"<b>Siz</b> aparıcı ilə danışırsınız":"Aparıcı <b>"+esc(P()[R.talk].name)+"</b> ilə danışır";
  }
  $("head").innerHTML=`<div class="coderow"><span>${isHost?"Otaq kodu":"Komanda kodu"}</span><button class="copy-code code" data-copy="${esc(isHost?room:room+o)}" type="button">${esc(isHost?room:room+o)}</button></div>`
    +(l==="lobby"?"":`<div class="sm" style="font-size:var(--c)">Sual <b>${R.q||1}</b> • Dəyər <b>+${val}</b></div>`)
    +`<div class="evt2">${p}</div>`;

  const scoreBox=idx=>{
    const tid=tids[idx],tm=T()[tid];
    const won=tid&&l==="answered"&&R.winner===tid&&!R.sil;
    const talking=tid&&TK()&&R.talk&&(P()[R.talk]||{}).team===tid;
    let name="Gözləyir...";
    if(tm){
      name=esc(tm.name);
      if(won){
        if(R.speaker&&P()[R.speaker])name+=": "+esc(P()[R.speaker].name);
        else{const cp=members(tid).find(m=>m.cap);name+=": "+esc(cp?cp.name:"KAPİTAN")}
      }else if(talking){
        name+=": "+esc(P()[R.talk].name);
      }
    }
    return `<div class="sbox ${idx?"p":"b"}">${u&&tm?`<button class="kick-btn" type="button" data-kick="team" data-id="${tid}" aria-label="Çıxar">✕</button>`:""}<div class="sn">${name}</div><div class="ss">${(tm&&tm.score)||0}</div></div>`;
  };
  $("colL").innerHTML=scoreBox(0)+scoreBox(1)+'<section class="card center"><div class="tm" id="tm"><span class="t-sec">20</span><span class="t-ms">000</span></div></section>';
  paintTm();

  const f=(m,tid,opt)=>{
    opt=opt||{};
    const isPres=m.id===presserOf(tid);
    const pickDis=!c||m.team!==o||(l!=="lobby"&&l!=="wait")||m.pen;
    const pickB=`<button class="ib${isPres?" on":""}" data-pick="${m.id}"${pickDis?" disabled":""}>${BTNSVG}</button>`;
    const spkDis=!c||m.team!==o||l!=="answered"||R.winner!==o||R.speaker||m.pen;
    const spkB=m.cap?"":`<button class="ib${R.speaker===m.id?" on":""}" data-spk="${m.id}"${spkDis?" disabled":""}>${MICSVG(0)}</button>`;
    const showBk=(tid===o||isHost)&&!m.pen;
    const icB=opt.ic?`<span class="ic">${spkB}${pickB}${bkBtn(m,tid)}</span>`:(showBk?`<span class="ic">${bkBtn(m,tid)}</span>`:"");
    const restB=isHost&&m.pen&&opt.rest?`<button class="mini" data-rest="${m.id}">Geri qaytar</button>`:"";
    const kickB=u&&opt.kick?`<button class="kick-btn" type="button" data-kick="player" data-id="${m.id}" aria-label="Çıxar">✕</button>`:"";
    const isBk=m.id===(T()[tid]||{}).backup&&!m.cap;
    const nm=m.cap?`<b>${esc(m.name)} (K)${isPres?" (D)":""}</b>`:esc(m.name)+(isPres?" (D)":"");
    return `<div class="mr ${d(tid)}${m.pen?" pen":""}${m.off?" off":""}"><span class="nm">${nm}${isBk?" (E.K)":""}${m.pen?" (X)":""}${m.off?" (oflayn)":""}</span>${icB}${restB}${kickB}</div>`;
  };
  const hb=(act,text,outline,disabled,extra)=>`<button class="hb${outline?" o":""}" data-act="${act}"${disabled?" disabled":""}${extra||""}>${text}</button>`;

  let right="";
  if(isHost){

function buzz(ev){
  const me=P()[pid];
  if(!me||!R)return;
  const c=me.team,l=Math.round(evTime(ev)),rival=Object.keys(T()).find(x=>x!==c);
  if(R.status==="running"){
    if(!R.timerEnd||R.timerEnd-l<0)return;
    SND.buzz();skip.buzz=Date.now()+2500;
  }else if(R.status==="wait"){
    if(rival&&(R.fs||{})[rival])return;
    SND.fail();skip.fail=Date.now()+2500;
  }else{
    if(R.status!=="answered")return;
    if(R.winner===c||R.buzzAt==null||R.speaker)return;
    const dd=R.buzzAt-l;
    if(!(dd>0&&dd<=FAIR_WINDOW))return;
    SND.buzz();skip.buzz=Date.now()+2500;
  }
  const upd=rm=>{
    if(!rm)return;
    const s=(rm.players||{})[pid];
    if(!s||s.pen||!rm.teams[c]||rm.teams[c].presser!==pid)return;
    const fs=rm.fs||{},wr=rm.wrong||{};
    if(fs[c]||wr[c])return;
    const t=l;
    if(rm.status==="wait"){
      const rv=Object.keys(rm.teams).find(x=>x!==c);
      if(rv&&fs[rv])return;
      fs[c]=true;rm.fs=fs;s.pen=true;
      const fst=rm.fst||{};fst[c]=t;rm.fst=fst;
      rm.ev=rm.teams[c].name+" FALSTART ETDİ! "+s.name+" CƏRİMƏLƏNDİ!";
      if(rv&&(fs[rv]||(rm.wrong||{})[rv])){rm.status="expired";rm.ev="Hər iki komanda cavab hüququnu itirdi"}
    }else if(rm.status==="running"){
      if(!rm.timerEnd||t<Number(rm.startedAt||0))return;
      const left=rm.timerEnd-t;
      if(left<0)return;
      rm.first=t-Number(rm.startedAt||t)<=1e3;
      rm.status="answered";rm.winner=c;rm.buzzAt=t;
      rm.pausedMs=Math.max(1,Math.round(left));rm.timerEnd=null;rm.speaker=null;
      rm.ev=(rm.first?"İLK SANİYƏ! ":"")+rm.teams[c].name.toUpperCase()+" KOMANDASI DÜYMƏNİ SIXDI";
    }else{
      if(rm.status!=="answered")return;
      if(rm.winner===c||rm.buzzAt==null||rm.speaker)return;
      const dd=Number(rm.buzzAt)-t;
      if(!(dd>0&&dd<=FAIR_WINDOW))return;
      rm.first=t-Number(rm.startedAt||t)<=1e3;
      rm.winner=c;rm.buzzAt=t;
      rm.pausedMs=Math.round(Number(rm.pausedMs||0)+dd);
      rm.speaker=null;
      rm.ev=(rm.first?"İLK SANİYƏ! ":"")+rm.teams[c].name.toUpperCase()+" KOMANDASI DÜYMƏNİ SIXDI";
    }
    return rm;
  };
  let n=0;
  const run=()=>rf().transaction(upd,(err,ok)=>{
    if(ok||++n>=3)return;
    if(!err&&R.status!=="running"&&R.status!=="wait")return;
    setTimeout(run,60);
  },true);
  run();
}

      if(a&&a.cap&&a.team===rm.winner&&b&&b.team===rm.winner&&!b.pen&&!b.cap){
        rm.speaker=id;rm.ev=b.name.toUpperCase()+" CAVAB VERİR";

function mkpc(peer){

  pc._q=[];
  stream.getTracks().forEach(tr=>pc.addTrack(tr,stream));
  pc.onicecandidate=e=>{if(e.candidate)sg(peer,{ice:e.candidate})};

      auds[peer].a.remove();

    const au=document.createElement("audio");
    au.srcObject=st;au.muted=true;au.autoplay=true;au.playsInline=true;
    document.body.appendChild(au);
    au.play().catch(()=>{});
    const ctx=mixer(),src=ctx.createMediaStreamSource(st),g=ctx.createGain();
    g.gain.value=0;src.connect(g);g.connect(ctx.destination);
    auds[peer]={a:au,src:src,g:g};
    applyMute();
  };
  pcs[peer]=pc;
  return pc;
}
function drop(id){
  if(pcs[id]){pcs[id].close();delete pcs[id]}
  if(auds[id]){
    try{auds[id].src.disconnect();auds[id].g.disconnect()}catch(x){}
    auds[id].a.srcObject=null;auds[id].a.remove();delete auds[id];
  }
}
async function reconcile(){
  if(!stream||!R)return;
  const ids=Object.keys(P()).concat(R.host).filter(x=>x&&x!==pid);
  Object.keys(pcs).forEach(id=>{if(!(ids.includes(id)&&want(id)))drop(id)});
  for(const id of ids){
    if(!pcs[id]&&want(id)&&pid<id){
      const pc=mkpc(id);
      try{
        await pc.setLocalDescription(await pc.createOffer());
        sg(id,{sdp:pc.localDescription});
      }catch(x){}
    }
  }
  applyMute();
}
function sigIn(from,d){if(stream)onSig(from,d);else pend.push([from,d])}
async function onSig(from,d){
  if(!R||!(want(from)||from===R.host||P()[from]))return;
  if(d.sdp&&d.sdp.type==="offer"&&pcs[from]&&pcs[from].remoteDescription)drop(from);
  const pc=pcs[from]||mkpc(from);
  try{
    if(d.sdp){
      await pc.setRemoteDescription(d.sdp);
      for(const c of pc._q.splice(0))await pc.addIceCandidate(c);
      if(d.sdp.type==="offer"){
        await pc.setLocalDescription(await pc.createAnswer());
        sg(from,{sdp:pc.localDescription});
      }
    }else if(d.ice){
      if(pc.remoteDescription)await pc.addIceCandidate(d.ice);else pc._q.push(d.ice);
    }
  }catch(x){}
}
async function getMic(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,latency:0,channelCount:1}});
    micFail=0;rejoined=false;
  }catch(e){
    micFail=1;
    if(!rejoined)alert("Mikrofon icazəsi lazımdır. Brauzer ayarlarından icazə ver.");
    rejoined=false;
    return;
  }
  await Promise.race([iceReady,new Promise(r=>setTimeout(r,3e3))]);
  const me=P()[pid]||{};
  stream.getAudioTracks().forEach(tr=>{tr.enabled=!muted&&!me.pen});
  await reconcile();
  showNet();
  pend.splice(0).forEach(([f,d])=>onSig(f,d));
}
document.addEventListener("pointerdown",()=>{if(room&&!stream&&micFail){micFail=0;getMic()}},{passive:true});
const NETTR={connected:"qoşuldu",connecting:"qoşulur",new:"başlayır",failed:"alınmadı",disconnected:"kəsildi",closed:"bağlandı"};
function showNet(){
  if(!R||!$("net"))return;
  const list=Object.keys(pcs).map(id=>(id===R.host?"Aparıcı":(P()[id]||{}).name||id)+": "+(NETTR[pcs[id].connectionState]||pcs[id].connectionState));
  $("net").textContent="Mikrofon: "+(stream?"var":"yoxdur")+(mixCtx&&mixCtx.state!=="running"?" | SƏS BLOKLANIB: ekrana toxun":"")+" | Relay: "+(relayOk?"var":"yoxdur")+" | Səs: "+(list.length?list.join(", "):"əlaqə yoxdur");
}
setInterval(()=>{
  if(!R)return;
  Object.keys(pcs).forEach(id=>{
    const s=pcs[id].connectionState;
    if(s==="failed"||s==="closed")drop(id);
    else if(s==="disconnected"){
      if(pcs[id]._dt){if(Date.now()-pcs[id]._dt>5e3)drop(id)}
      else pcs[id]._dt=Date.now();
    }else pcs[id]._dt=0;
  });
  applyMute();reconcile();showNet();
},3e3);
["pointerdown","pointerup","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{
  try{mixer()}catch(e){}
  for(const id in auds)auds[id].a.play().catch(()=>{});
},{passive:true,capture:true}));

<script>
let ac=null,last={},bk="",rxOn=0,pshown=0,pkey="",sfx=1;
const unlock=()=>{
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext);if(ac.state==="suspended")ac.resume()}catch(e){}
};
function tone(freq,dur,type,gain,delay){
  if(!ac)return;
  gain=(gain||.25)*sfx;
  if(!gain)return;
  const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  g.gain.setValueAtTime(1e-4,t);
  g.gain.linearRampToValueAtTime(gain,t+.015);
  g.gain.setValueAtTime(gain,t+Math.max(dur-.04,.02));
  g.gain.linearRampToValueAtTime(1e-4,t+dur);
  o.connect(g).connect(ac.destination);
  o.start(t);o.stop(t+dur+.03);
}
document.addEventListener("pointerdown",unlock,{passive:true});
$("vol2").addEventListener("input",e=>{sfx=e.target.value/50;e.target.style.setProperty("--p",e.target.value+"%")});
const SND={
  beep:()=>tone(880,.7),
  up:()=>tone(700,2),
  buzz:()=>{tone(1568,.22,"sine",.28);tone(1976,.22,"sine",.28,.08)},
  fail:()=>tone(220,.28,"sawtooth",.25),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.3,"triangle",.3,.12*i))
};
setInterval(()=>{
  if(R&&R.status==="running"){
    const s=tl(),key=R.timerEnd+"|"+s;
    if((s===10||s===4)&&bk!==key){bk=key;SND.beep()}
  }
},50);

function spawn(emoji,from){
  const r=from?from.getBoundingClientRect():{left:innerWidth/2-20+160*(Math.random()-.5),top:innerHeight-120,width:40,height:40};
  const n=document.createElement("span");
  n.className="rxe";n.textContent=emoji;
  n.style.left=r.left+r.width/2-13+18*(Math.random()-.5)+"px";
  n.style.top=r.top+r.height/2-13+"px";
  $("rxlayer").appendChild(n);
  const a=n.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${40*(Math.random()-.5)}px,-130px) scale(.45)`,opacity:0}],{duration:650,easing:"cubic-bezier(.12,.75,.3,1)",fill:"forwards"});
  a.onfinish=()=>n.remove();
}
function showNp(){
  const el=$("np");
  pshown=now();el.hidden=false;
  el.animate([{opacity:0,transform:"translate(-50%,18px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:300,easing:"ease-out"});
  setTimeout(hideNp,3e3);
}
function hideNp(){
  if(!pshown)return;
  pshown=0;
  const el=$("np");
  el.animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"}).onfinish=()=>{el.hidden=true};
}
document.body.insertAdjacentHTML("beforeend",'<div id="rxlayer"></div><div id="np" hidden>YENİ DÜYMƏSİXAN SEÇ</div>');
document.addEventListener("click",ev=>{
  const rx=ev.target.closest("[data-rx]");
  if(rx&&R){
    spawn(rx.dataset.rx,rx);
    db.ref("rx/"+room).push({e:rx.dataset.rx,t:now(),f:pid}).then(r=>setTimeout(()=>r.remove(),4e3)).catch(()=>{});
  }
  if(R&&isH()&&R.status==="wait"&&Object.keys(R.fs||{}).length)rf("pz").set(now());
  const pk=ev.target.closest("[data-pick]");
  if(pk&&R&&role==="captain"&&R.status==="wait"){
    const tid=(P()[pid]||{}).team,pl=P()[pk.dataset.pick];
    if(tid&&(R.fs||{})[tid]&&pl&&!pl.pen){
      rf("ev").set(T()[tid].name.toUpperCase()+" KOMANDASINDA YENİ DÜYMƏSİXAN: "+pl.name.toUpperCase()+". FALSTART ETDİYİ ÜÇÜN BU SUALA CAVAB HÜQUQUNU İTİRİR.");
    }
  }
});
const _render=render;
render=function(){
  _render();
  const st=R.status,sa=R.startedAt,nfs=Object.keys(R.fs||{}).length;
  if(last.init){
    if(st==="running"&&sa!==last.sa&&!sk("beep"))SND.beep();
    if(st==="answered"&&last.k!=="answered"&&!sk("buzz"))SND.buzz();
    if(st==="expired"&&last.k!=="expired")SND.up();
    if(st==="finished"&&last.k!=="finished")SND.win();
    if(nfs>last.fs&&!sk("fail"))SND.fail();
  }
  last={init:1,k:st,sa:sa,fs:nfs};
  if(!rxOn){
    rxOn=1;
    db.ref("rx/"+room).on("child_added",s=>{
      const v=s.val();
      if(v&&v.f!==pid&&now()-v.t<3e3)spawn(v.e);
    });
  }
  if(role==="captain"&&st==="wait"){
    const tid=(P()[pid]||{}).team,pr=presserOf(tid);
    const need=!!(pr&&isPen(pr)&&(R.fs||{})[tid]);
    const key=R.q+"|"+pr;
    if(need&&!pshown&&pkey!==key){pkey=key;showNp()}
    if((!need&&pshown)||(pshown&&(R.pz||0)>pshown+1e3))hideNp();
  }else if(pshown)hideNp();
};
</script>

<script>
/* ===== Ehtiyat kapitan (E.K), oflayn izləmə, arxa plan və avtomatik qayıdış ===== */
const OFF_GRACE=5*60*1000;
let presOn=0,capBusy=0,wl=null;

/* Oyunçu çıxanda dərhal silinmir: yalnız "off" vaxtı yazılır */
function presence(){
  if(presOn||role==="host")return;
  presOn=1;
  db.ref(".info/connected").on("value",s=>{
    if(!s.val()||!room)return;
    const base="rooms/"+room+"/players/"+pid,r=db.ref(base+"/off");
    db.ref(base+"/name").once("value").then(n=>{
      if(!n.exists())return;
      r.onDisconnect().set(firebase.database.ServerValue.TIMESTAMP).then(()=>r.set(null)).catch(()=>{});
    }).catch(()=>{});
  });
}
function leaveClean(){
  try{
    sessionStorage.removeItem("piksel-br-sess");
    if(room)db.ref("rooms/"+room+"/players/"+pid+"/off").onDisconnect().cancel();
  }catch(e){}
}

/* E.K düyməsi */
function bkBtn(m,tid){
  const tm=T()[tid]||{},me=P()[pid]||{};
  const on=tm.backup===m.id&&!m.cap;
  const dis=!(me.cap&&me.team===tid)||m.cap||m.pen;
  return `<button class="ib ek${on?" on":""}" data-bk="${m.id}"${dis?" disabled":""}>E.K</button>`;
}
function setBackup(id){
  const me=P()[pid],m=P()[id];
  if(!me||!me.cap||!m||m.team!==me.team||m.cap||m.pen)return;
  const cur=(T()[me.team]||{}).backup;
  rf("teams/"+me.team+"/backup").set(cur===id?null:id);
}

/* Kapitan idarəsi (yalnız aparıcının səhifəsində işləyir) */
function capReconcile(){
  if(!R||!isH()||capBusy||!R.teams)return;
  const up={},ts=now(),calm=["lobby","wait","finished"].includes(R.status),gone=new Set();
  let reset=false;
  Object.entries(P()).forEach(([id,p])=>{
    if(!p||!p.name||(p.off&&ts-p.off>OFF_GRACE)){
      gone.add(id);up["players/"+id]=null;
      if(R.talk===id)up.talk=null;
      if(R.speaker===id)up.speaker=null;
    }
  });
  Object.keys(T()).forEach(t=>{
    const tm=T()[t],all=members(t);
    if(!all.length)return;
    const mem=all.filter(m=>!gone.has(m.id));
    if(!mem.length){
      up["teams/"+t]=null;
      ["fs","fst","wrong"].forEach(k=>{up[k+"/"+t]=null});
      reset=true;return;
    }
    const by={};mem.forEach(m=>{by[m.id]=m});
    const good=m=>!!m&&!m.pen&&!m.off;
    const cur=by[tm.captain]||mem.find(m=>m.cap);
    const bk2=by[tm.backup];
    if(tm.backup&&(!bk2||(cur&&bk2.id===cur.id)))up["teams/"+t+"/backup"]=null;
    const live=bk2&&(!cur||bk2.id!==cur.id)?bk2:null;

    if(!good(cur)){
      /* kapitan yoxdur / oflayn / cərimədədir: ehtiyat kapitan, o yoxdursa ilk uyğun oyunçu */
      let s=(good(live)?live:null)||mem.filter(m=>(!cur||m.id!==cur.id)&&good(m))[0];
      if(!s&&!cur)s=mem[0];
      if(s){
        if(cur){
          up["players/"+cur.id+"/cap"]=false;
          if(!tm.home||!by[tm.home])up["teams/"+t+"/home"]=cur.id;
        }
        up["players/"+s.id+"/cap"]=true;
        up["teams/"+t+"/captain"]=s.id;
        if(tm.backup===s.id)up["teams/"+t+"/backup"]=null;
      }
    }else if(tm.home&&tm.home!==cur.id){
      /* köhnə kapitan qayıdıb: yalnız sual oynanmayanda geri qaytar */
      const h=by[tm.home];
      if(!h)up["teams/"+t+"/home"]=null;
      else if(calm&&good(h)){
        up["players/"+cur.id+"/cap"]=false;
        up["players/"+h.id+"/cap"]=true;
        up["teams/"+t+"/captain"]=h.id;
        up["teams/"+t+"/home"]=null;
        if(!tm.backup||tm.backup===h.id)up["teams/"+t+"/backup"]=cur.id;
      }
    }
  });
  if(reset&&["running","answered","expired"].includes(R.status)){
    Object.assign(up,{status:"wait",winner:null,speaker:null,timerEnd:null,pausedMs:null,startedAt:null,buzzAt:null,first:null,wrong:null,fs:null,fst:null,sil:null,ev:null});
  }
  if(Object.keys(up).length){
    capBusy=1;
    rf().update(up).catch(()=>{}).then(()=>setTimeout(()=>{capBusy=0},700));
  }
}
const _r2=render;
render=function(){_r2();try{capReconcile()}catch(e){}};
setInterval(()=>{try{capReconcile()}catch(e){}},1000);

/* Arxa planda işləmə */
async function keepAwake(){
  try{
    if("wakeLock" in navigator&&!wl&&!document.hidden){
      wl=await navigator.wakeLock.request("screen");
      wl.addEventListener("release",()=>{wl=null});
    }
  }catch(e){wl=null}
}
async function wake(){
  if(!room)return;
  try{db.goOnline()}catch(e){}
  try{mixer()}catch(e){}
  for(const k in auds)auds[k].a.play().catch(()=>{});
  keepAwake();
  if(stream){
    const tr=stream.getAudioTracks()[0];
    if(!tr||tr.readyState==="ended"){
      try{
        const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
        const nt=ns.getAudioTracks()[0],p=P()[pid]||{};
        nt.enabled=!muted&&!p.pen;
        Object.values(pcs).forEach(pc=>pc.getSenders().forEach(s=>{s.replaceTrack(nt).catch(()=>{})}));
        stream=ns;
      }catch(e){}
    }
  }
  lastSync=0;
  Object.keys(pcs).forEach(k=>{
    const s=pcs[k].connectionState;
    if(s==="failed"||s==="disconnected"||s==="closed")drop(k);
  });
  applyMute();reconcile();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});
window.addEventListener("online",wake);
window.addEventListener("pageshow",wake);
window.addEventListener("focus",wake);
document.addEventListener("pointerdown",keepAwake,{passive:true});

(function(){

    }).catch(()=>{});
  }catch(e){}
})();
