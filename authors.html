<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9DC3FF">
<title>πksel - Müəlliflər</title>
<link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ölçülər: Komp+Planşet (701px+) / Telefon (≤700px) / Dar telefon (≤420px) */
body{
  --page:#9DC3FF; --c1:#001E6F; --c2:#002E92; --fg:#9DC3FF; --accent:#001E6F;
  --glow:rgba(0,8,45,.30); --soft:rgba(255,255,255,.35); --mk:rgba(255,255,255,.3);
  --grad:linear-gradient(135deg,var(--c1) 0%,var(--c2) 50%,var(--c1) 100%);
  --tx:env(safe-area-inset-top,0px); --bx:env(safe-area-inset-bottom,0px);
}
body.dark{
  --page:#00072C; --c1:#9DC3FF; --c2:#6FA5FC; --fg:#00072C; --accent:#9DC3FF;
  --glow:rgba(255,255,255,.40); --soft:rgba(0,0,0,.2); --mk:rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
a,button,.author-card{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{min-height:100vh;background:var(--page);color:var(--fg);font-family:"Poppins",sans-serif;overflow-x:hidden;max-width:100%;transition:background .65s ease;-webkit-font-smoothing:antialiased;padding-top:var(--tx);padding-bottom:var(--bx)}
button,input,a{font:inherit}
a{color:inherit;text-decoration:none}
.page{width:min(95vw,820px);margin:0 auto;padding:12px 0 32px}

/* ---------- Giriş animasiyası: əvvəl çərçivə, sonra içindəkilər ---------- */
.frame{--d:calc(var(--i) * .1s);animation:frameIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:var(--d)}
.rise{animation:riseIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--d) + .55s)}
@keyframes frameIn{from{opacity:0;transform:translateY(28px)}}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}}

/* ---------- Naviqasiya ---------- */
.top-nav{height:50px;border-radius:40px;padding:0 52px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--grad);box-shadow:0 10px 28px rgba(0,20,100,.08)}
.nav-links{display:flex;align-items:center;gap:40px;height:100%}
.nav-link{position:relative;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .25s ease}
.nav-link:hover{transform:translateY(-1px)}
.theme-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--accent);background:var(--page);transition:transform .3s ease,background .65s ease,color .65s ease}
.theme-toggle:hover{transform:translateY(-50%) scale(1.08)}
.theme-toggle:active{transform:translateY(-50%) scale(.95)}
.theme-icon{width:24px;height:24px;display:block}
.ray{stroke:currentColor;stroke-width:2;stroke-linecap:round}
body.dark .ray{opacity:0}
.core{transform:scale(.68);transform-origin:16px 16px}
.bite{transform:translate(14px,-14px)}
body.dark .core{transform:scale(1)}
body.dark .bite{transform:translate(0,0)}
body.ready .core,body.ready .bite{transition:transform .6s cubic-bezier(.4,0,.2,1)}

/* ---------- Axtarış ---------- */
.search-wrap{margin-top:14px;height:52px;border-radius:40px;border:2px solid var(--accent);background:var(--soft);display:flex;align-items:center;padding:0 18px;gap:10px;transition:border-color .65s ease,background .65s ease}
.search-wrap>svg{width:22px;height:22px;flex:0 0 22px;color:var(--accent)}
#searchInput{flex:1 1 auto;min-width:0;width:0;border:0;background:transparent;outline:0;font-family:"Poppins",sans-serif;font-size:17px;font-weight:500;color:var(--accent)}
#searchInput::placeholder{color:var(--accent);opacity:.6}
.sort-btn{border:0;background:transparent;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;color:var(--accent);transition:transform .25s ease}
.sort-btn:hover{transform:scale(1.1)}
.sort-btn svg{width:22px;height:22px;transition:transform .3s ease}
.sort-btn.flip svg{transform:scaleY(-1)}

.section-title{text-align:center;color:var(--accent);font-size:24px;line-height:1;font-weight:700;letter-spacing:-.7px;margin:24px 0 14px}

/* ---------- Müəlliflər: 2 müstəqil sütun (hər sütun öz aşağı düşməsini idarə edir) ---------- */
.cards-list{display:flex;align-items:flex-start;gap:14px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}

.author-card{position:relative;border-radius:28px;background:var(--grad);color:var(--fg);padding:14px 20px;display:flex;align-items:center;gap:14px;height:104px;overflow:hidden;box-shadow:0 10px 25px rgba(0,20,110,.07);cursor:pointer;transition:transform .35s cubic-bezier(.18,.8,.22,1),box-shadow .35s ease}
.author-card>*{position:relative;z-index:1}
.author-card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:
    radial-gradient(ellipse 170px 120px at var(--mx,50%) var(--my,50%),var(--glow),transparent 72%),
    radial-gradient(ellipse 100px 150px at calc(var(--mx,50%) + 16px) calc(var(--my,50%) - 12px),var(--glow),transparent 72%)}
@media (hover:hover){
  .author-card:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 14px 30px rgba(0,20,110,.14);z-index:5}
  .author-card:hover::before{opacity:1}
}
/* Müəllif kartında basılma effekti yoxdur */
.author-icon{width:64px;height:64px;flex:0 0 64px;border-radius:16px;overflow:hidden}
.author-icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon-night{display:none!important}
body.dark .icon-day{display:none!important}
body.dark .icon-night{display:block!important}
.author-right{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.author-name{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.author-count{font-size:15px;font-weight:500;line-height:1.3;opacity:.92}

/* ---------- Paketlər: müəllif kartının altından aşağı düşür ---------- */
.packages-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.author-wrapper.open .packages-panel{grid-template-rows:1fr}
.packages-inner{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:0 2px}
.packages-inner>.package-item:first-child{margin-top:8px}
.package-item{min-height:46px;padding:9px 16px;border-radius:17px;display:flex;align-items:center;min-width:0;background:var(--grad);color:var(--fg);border:1px solid rgba(255,255,255,.12);box-shadow:0 5px 15px rgba(0,20,110,.08);font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;
  opacity:0;transform:translateY(-16px);transition:opacity .35s ease,transform .45s cubic-bezier(.18,.8,.22,1)}
.author-wrapper.open .package-item{opacity:1;transform:none;transition-delay:calc(var(--k) * .06s + .08s)}
/* Paket kartlarında basılma effekti (0.3 san) */
.author-wrapper.open .package-item:active{transform:scale(.96);transition-delay:0s;transition-duration:.3s}

mark.hl{background:var(--mk);color:inherit;font-weight:800;border:2px solid currentColor;border-radius:6px;padding:0 4px;display:inline-block;line-height:1.1}
.no-results{width:100%;text-align:center;color:var(--accent);font-size:15px;font-weight:500;padding:25px 10px 50px}

/* ---------- Footer ---------- */
footer{background:var(--grad);color:var(--fg);min-height:110px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.footer-line{font-size:15px;line-height:1.4;font-weight:500}
.footer-link{transition:opacity .25s ease,transform .25s ease}
.footer-link:hover{opacity:.72;transform:translateY(-1px)}

.author-card:focus-visible,.package-item:focus-visible,.nav-link:focus-visible,.theme-toggle:focus-visible,.footer-link:focus-visible{outline:3px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- TELEFON ≤700px (tək sütun) ---------- */
@media (max-width:700px){
  .page{width:calc(100vw - 44px);padding:11px 0 26px}
  .top-nav{height:46px;padding:0 46px}
  .nav-links{gap:28px}
  .nav-link{font-size:13px}
  .theme-toggle{width:34px;height:34px;right:6px}
  .theme-icon{width:21px;height:21px}
  .search-wrap{margin-top:12px;height:46px;padding:0 14px}
  #searchInput{font-size:16px}
  .section-title{font-size:17px;margin:20px 0 12px}
  .cards-list,.col{gap:10px}
  .author-card{height:88px;padding:12px 16px;gap:12px;border-radius:22px}
  .author-icon{width:48px;height:48px;flex-basis:48px;border-radius:13px}
  .author-name{font-size:17px;letter-spacing:-.5px}
  .author-count{font-size:9px}
  .package-item{min-height:42px;padding:8px 14px;border-radius:14px;font-size:10px}
  .packages-inner{gap:7px}
  footer{min-height:96px;padding:16px 12px;gap:5px}
  .footer-line{font-size:13px}
}

/* ---------- DAR TELEFON ≤420px ---------- */
@media (max-width:420px){
  .page{width:calc(100vw - 36px)}
  .top-nav{height:42px;padding:0 42px}
  .nav-links{gap:22px}
  .nav-link{font-size:11px}
  .theme-toggle{width:32px;height:32px;right:5px}
  .theme-icon{width:20px;height:20px}
  #searchInput{font-size:15px}
  .section-title{font-size:15px}
  .author-card{height:82px;padding:10px 14px;gap:10px}
  .author-icon{width:44px;height:44px;flex-basis:44px}
  .author-name{font-size:15px}
  .author-count{font-size:8px}
  .package-item{min-height:40px;padding:7px 12px;font-size:9px}
  footer{min-height:88px}
  .footer-line{font-size:11px}
}
</style>
</head>

<body>
<div class="page">

  <nav class="top-nav frame" style="--i:0" aria-label="Əsas naviqasiya">
    <div class="nav-links rise">

          <g transform="rotate(0 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g>

          <g transform="rotate(90 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g>
          <g transform="rotate(135 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g>

  <div class="search-wrap frame" style="--i:1">

      <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input class="rise" id="searchInput" type="text" placeholder="Müəllif axtar" autocomplete="off">
    <button class="sort-btn rise" id="sortBtn" type="button" aria-label="Sıralamanı dəyiş">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 6h16M4 12h11M4 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 14v6m0 0l-3-3m3 3l3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <h2 class="section-title rise" style="--d:.2s">Müəlliflər</h2>

  <div class="cards-list" id="cardsList"></div>

</div>

<footer>
  <div class="footer-line">Unikal İntellektual Oyunlar Platforması</div>
  <a class="footer-line footer-link" href="https://www.instagram.com/piksel.iok" target="_blank" rel="noopener noreferrer">©πksel intellektual oyunlar klubu</a>
  <a class="footer-line footer-link" href="https://www.instagram.com/onurelzh" target="_blank" rel="noopener noreferrer">©Onur Əlizadə</a>
</footer>

<script>
/* =========================
   THEME
========================= */
const themeToggle=document.getElementById("themeToggle");
const rays=[...document.querySelectorAll(".ray")];

const DAY_ICON="https://pictureurl.com/api/storage/file?key=u%2Fanon%2Fb5303c34-5ba7-472a-baa1-8b9143bc98cb-1000463113.png";
const NIGHT_ICON="https://cdn.phototourl.com/member/2026-09-27-be52e931-8795-498a-850b-3c147010701e.png";

function animateRays(dark){
  rays.forEach(r=>{
    r.getAnimations().forEach(a=>a.cancel());
    const kf=dark
      ?[{transform:"translateY(0)",opacity:1},{transform:"translateY(-14px)",opacity:0}]
      :[{transform:"translateY(11px)",opacity:0},{transform:"translateY(0)",opacity:1}];
    const a=r.animate(kf,{duration:dark?520:620,delay:dark?0:180,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"});
    a.onfinish=()=>a.cancel();
  });
}
function setTheme(dark,animate){
  document.body.classList.toggle("dark",dark);
  try{localStorage.setItem("piksel-theme",dark?"dark":"light")}catch(e){}
  themeToggle.setAttribute("aria-label",dark?"Gündüz rejiminə keç":"Gecə rejiminə keç");
  if(animate) animateRays(dark);
}
function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem("piksel-theme")}catch(e){}
  if(saved==="dark") return setTheme(true,false);
  if(saved==="light") return setTheme(false,false);
  setTheme(!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),false);
}
themeToggle.addEventListener("click",()=>setTheme(!document.body.classList.contains("dark"),true));
initTheme();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));

/* =========================
   PACKAGES
========================= */
const PKG={
  vesper1:{title:'"Vesper" kuboku',link:"/vesper_kuboku.html"},
  vesper2:{title:'II "Vesper" kuboku',link:"/vesper_kuboku_2.html"},
  amazon:{title:'"Amazon" kuboku',link:"/amazon_kuboku.html"},
  moonopoly:{title:'"Moonopoly" turniri',link:"/moonopoly_turniri.html"},
  yubiley:{title:'"Yubiley" turniri',link:"/yubiley_turniri.html"},
  maqrit:{title:'"Maqrit" kuboku',link:"/maqrit_kuboku.html"},
  solo:{title:'"Solo Leveling" kuboku',link:"/solo_leveling.html"},
  whatsapp:{title:'"πksel.iok" WhatsApp paketi',link:"/piksel_paket_1.html"},
  diamonds1:{title:'"Diamonds" Fərdi Oyun Liqası II Mövsüm I oyun',link:"/diamonds2_1.html"},
  diamonds2:{title:'"Diamonds" Fərdi Oyun Liqası II Mövsüm II oyun',link:"/diamonds2_2.html"},
  diamonds3:{title:'"Diamonds" Fərdi Oyun Liqası II Mövsüm III oyun',link:"/diamonds2_3.html"}
};

/* Yeni müəllif əlavə etmək üçün sadəcə bir sətir əlavə edin. */
const authors=[
  {name:"Abbaslı Nigar",packages:[PKG.whatsapp]},
  {name:"Bəylərov Kamal",packages:[PKG.yubiley]},
  {name:"Cəfərzadə Yəhya",packages:[PKG.yubiley]},
  {name:"Əliyeva Zəhra",packages:[PKG.whatsapp]},
  {name:"Əlizadə Onur",packages:[PKG.whatsapp]},
  {name:"Əlizadə Rüfət",packages:[PKG.diamonds3,PKG.diamonds2,PKG.diamonds1]},
  {name:"Hacızadə Nihad",packages:[PKG.maqrit]},
  {name:"Həsənov Kamil",packages:[PKG.diamonds3]},
  {name:"Hüseynli Muhəmməd",packages:[PKG.whatsapp]},
  {name:"Hüseynli Qabil",packages:[PKG.vesper2,PKG.vesper1]},
  {name:"Hüseynzadə Yusif",packages:[PKG.diamonds3]},
  {name:"Kərimli Kərim",packages:[PKG.maqrit,PKG.solo,PKG.vesper2,PKG.vesper1]},
  {name:"Mahmudlu Nəzrin",packages:[PKG.solo]},
  {name:"Məhərrəmov Ağasəf",packages:[PKG.solo]},
  {name:"Məmmədli Nurşad",packages:[PKG.yubiley]},
  {name:"Məmmədov Şəmil",packages:[PKG.yubiley]},
  {name:"Nəhmətli Turqut",packages:[PKG.maqrit,PKG.solo,PKG.diamonds3,PKG.vesper2,PKG.vesper1]},
  {name:"Pənahov Səmral",packages:[PKG.solo]},
  {name:"Qarayev Ramiz",packages:[PKG.whatsapp]},
  {name:"Rzalı Üsyan",packages:[PKG.diamonds3,PKG.diamonds2,PKG.diamonds1]},
  {name:"Seyidova Aydan",packages:[PKG.amazon]},
  {name:"Səmədov İslam",packages:[PKG.vesper2,PKG.vesper1]},
  {name:"Şentürk Serkan",packages:[PKG.diamonds3,PKG.diamonds2,PKG.diamonds1]},
  {name:"Vəlili Murad",packages:[PKG.yubiley]},
  {name:"Yuniszadə Ema",packages:[PKG.whatsapp]},
  {name:"Yusifov Zeynal",packages:[PKG.vesper2,PKG.amazon,PKG.moonopoly,PKG.vesper1]}
];

/* =========================
   SEARCH / SORT
========================= */
let ascending=true;
let query="";
let firstRender=true;
const openSet=new Set();

const searchInput=document.getElementById("searchInput");
const sortBtn=document.getElementById("sortBtn");
const cardsList=document.getElementById("cardsList");
const wide=matchMedia("(min-width:701px)");   /* komp/planşet: 2 sütun, telefon: 1 sütun */

searchInput.addEventListener("input",()=>{query=normalize(searchInput.value.trim());render()});
sortBtn.addEventListener("click",()=>{ascending=!ascending;sortBtn.classList.toggle("flip",!ascending);render()});
wide.addEventListener("change",render);

function normalize(t){return t.toLocaleLowerCase("az-AZ")}
function highlight(text,q){
  if(!q) return text;
  const i=normalize(text).indexOf(q);
  if(i===-1) return text;
  return text.slice(0,i)+"<mark class='hl'>"+text.slice(i,i+q.length)+"</mark>"+text.slice(i+q.length);
}
function authorCompare(a,b){
  const diff=b.packages.length-a.packages.length;
  if(diff!==0) return ascending?diff:-diff;
  return a.name.localeCompare(b.name,"az");
}

/* Maus işığı */
cardsList.addEventListener("pointermove",e=>{
  const card=e.target.closest(".author-card");
  if(!card) return;
  const r=card.getBoundingClientRect();
  card.style.setProperty("--mx",(e.clientX-r.left)+"px");
  card.style.setProperty("--my",(e.clientY-r.top)+"px");
});

/* Paket kartına basanda 0.3 san effekt: yeni tabda açıldığı üçün gecikmə yoxdur, effekt basılı saxlananda görünür */

/* =========================
   RENDER
========================= */
function render(){
  const list=authors.filter(a=>!query||normalize(a.name).includes(query)).sort(authorCompare);
  cardsList.innerHTML="";

  if(!list.length){
    cardsList.innerHTML='<div class="no-results">Bu ada uyğun müəllif tapılmadı.</div>';
    return;
  }

  const colCount=wide.matches?2:1;
  const cols=Array.from({length:colCount},()=>{
    const c=document.createElement("div");
    c.className="col";
    cardsList.appendChild(c);
    return c;
  });

  const anim=firstRender;   /* giriş animasiyası yalnız ilk yüklənmədə */
  firstRender=false;

  list.forEach((author,idx)=>{
    const col=idx%colCount, row=Math.floor(idx/colCount);

    const wrapper=document.createElement("div");
    wrapper.className="author-wrapper"+(openSet.has(author.name)?" open":"");

    const card=document.createElement("div");
    card.className="author-card"+(anim?" frame":"");
    if(anim) card.style.setProperty("--i",3+Math.min(row,10)+col*0.5);
    card.setAttribute("role","button");
    card.tabIndex=0;
    card.setAttribute("aria-expanded",openSet.has(author.name));
    const r=anim?" rise":"";
    card.innerHTML=`
      <span class="author-icon${r}">
        <img class="icon-day" src="${DAY_ICON}" alt="">
        <img class="icon-night" src="${NIGHT_ICON}" alt="">
      </span>
      <div class="author-right${r}">
        <div class="author-name">${highlight(author.name,query)}</div>
        <div class="author-count">${author.packages.length} paket</div>
      </div>`;

    const panel=document.createElement("div");
    panel.className="packages-panel";
    const inner=document.createElement("div");
    inner.className="packages-inner";
    author.packages.forEach((pkg,k)=>{
      const link=document.createElement("a");
      link.className="package-item";
      link.style.setProperty("--k",k);
      link.href=pkg.link;
      link.target="_blank";
      link.rel="noopener noreferrer";
      link.textContent=pkg.title;
      inner.appendChild(link);
    });
    panel.appendChild(inner);

    const toggle=()=>{
      const open=wrapper.classList.toggle("open");
      card.setAttribute("aria-expanded",open);
      if(open) openSet.add(author.name); else openSet.delete(author.name);
    };
    card.addEventListener("click",toggle);
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
    });

    wrapper.appendChild(card);
    wrapper.appendChild(panel);
    cols[col].appendChild(wrapper);
  });
}
render();
</script>
</body>
</html>
