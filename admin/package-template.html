<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="πksel sual paketi">
  <title>πksel — Sual paketi</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#f5f7fb;background:#0d1220;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;background:radial-gradient(ellipse at 50% -20%,#37336d 0,transparent 58%),#0d1220}
    a{color:inherit}
    .wrap{width:min(100% - 28px,920px);margin:0 auto;padding:18px 0 60px}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}
    .brand{font-size:21px;font-weight:850;text-decoration:none}
    .back{color:#c3c9d8;text-decoration:none}
    .hero{padding:30px;border:1px solid #ffffff20;border-radius:20px;background:#ffffff0b}
    .label{margin:0 0 10px;color:#b9b1ff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:-.04em}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;color:#c3c9d8}
    .pill{padding:7px 10px;border:1px solid #ffffff25;border-radius:999px;font-size:12px}
    .package-icon{width:100%;max-height:300px;object-fit:cover;margin-top:22px;border-radius:14px}
    .section{margin-top:24px;padding:22px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff08}
    .section h2{margin:0 0 16px;font-size:22px}
    .group{margin-top:14px;padding-top:14px;border-top:1px solid #ffffff1c}
    .group h3{margin:0 0 10px;color:#d9d5ff;font-size:16px}
    .author{color:#a9b1c3;font-size:13px}
    .question{margin:10px 0;padding:14px;border:1px solid #ffffff15;border-radius:12px;background:#080c16a8}
    .question summary{cursor:pointer;font-weight:700;line-height:1.55}
    .answer{margin-top:14px;padding-top:12px;border-top:1px solid #ffffff1b;color:#e3e7ef;line-height:1.7;white-space:normal}
    .question-image{display:block;max-width:100%;max-height:360px;margin:12px 0;border-radius:10px}
    .answer p:first-child{margin-top:0}
    .extra{margin:10px 0 0;color:#aab2c3;font-size:13px;line-height:1.6}
    img.rich-image{max-width:100%;height:auto;border-radius:8px}
    .empty{color:#aab2c3}
    @media(max-width:600px){.hero,.section{padding:18px}.top{margin-bottom:28px}}
  </style>
  <!-- PACKAGE_DATA -->
</head>
<body>
  <main class="wrap">
    <nav class="top"><a class="brand" href="/">πksel</a><a class="back" href="/paketler">← Paketlərə qayıt</a></nav>
    <header id="hero" class="hero"></header>
    <div id="content"></div>
  </main>
  <script>
    (() => {
      const pkg = window.PACKAGE_DATA;
      const labels = { nhn: "Nə? Harada? Nə Zaman?", breyn: "Breyn Rinq", xemse: "Xəmsə", ferdi: "Fərdi Oyun" };
      const hero = document.getElementById("hero");
      const content = document.getElementById("content");
      document.title = `πksel — ${pkg.title}`;
      const eyebrow = document.createElement("p");
      eyebrow.className = "label";
      eyebrow.textContent = "Sual paketi";
      const title = document.createElement("h1");
      title.textContent = pkg.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      [labels[pkg.type], pkg.date].filter(Boolean).forEach((value) => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = value;
        meta.append(pill);
      });
      hero.append(eyebrow, title, meta);
      if (pkg.icon) {
        const image = document.createElement("img");
        image.className = "package-icon";
        image.src = pkg.icon;
        image.alt = "";
        image.loading = "lazy";
        hero.append(image);
      }

      function safeRichText(value, destination) {
        const source = document.createElement("template");
        source.innerHTML = value || "";
        const safeTags = new Set(["A", "B", "BLOCKQUOTE", "BR", "CODE", "DIV", "EM", "I", "IMG", "LI", "OL", "P", "SMALL", "SPAN", "STRONG", "SUB", "SUP", "U", "UL"]);
        const safeUrl = (value, image) => {
          try {
            const url = new URL(value, location.href);
            if (url.protocol === "https:" || (!image && url.protocol === "mailto:")) return true;
            return !/^[a-z][a-z0-9+.-]*:/i.test(value) && url.origin === location.origin;
          } catch {
            return false;
          }
        };
        function clean(parent) {
          for (const child of [...parent.children]) {
            if (!safeTags.has(child.tagName)) {
              if (["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "SVG", "MATH"].includes(child.tagName)) {
                child.remove();
              } else {
                child.replaceWith(document.createTextNode(child.textContent || ""));
              }
              continue;
            }
            for (const attribute of [...child.attributes]) {
              const allowed = child.tagName === "A" && ["href", "title"].includes(attribute.name)
                || child.tagName === "IMG" && ["src", "alt", "title", "width", "height"].includes(attribute.name);
              if (!allowed) child.removeAttribute(attribute.name);
            }
            if (child.tagName === "A") {
              if (!child.hasAttribute("href") || !safeUrl(child.getAttribute("href"), false)) child.removeAttribute("href");
              child.target = "_blank";
              child.rel = "noopener noreferrer";
            }
            if (child.tagName === "IMG") {
              if (!child.hasAttribute("src") || !safeUrl(child.getAttribute("src"), true)) child.remove();
              else child.className = "rich-image";
            }
            clean(child);
          }
        }
        clean(source.content);
        destination.append(source.content);
      }

      pkg.sections.forEach((section) => {
        const sectionElement = document.createElement("section");
        sectionElement.className = "section";
        const sectionTitle = document.createElement("h2");
        sectionTitle.textContent = section.name;
        sectionElement.append(sectionTitle);
        section.groups.forEach((group) => {
          const groupElement = document.createElement("div");
          groupElement.className = "group";
          const groupTitle = document.createElement("h3");
          groupTitle.textContent = group.name;
          groupElement.append(groupTitle);
          if (group.author) {
            const author = document.createElement("p");
            author.className = "author";
            author.textContent = `Müəllif: ${group.author}`;
            groupElement.append(author);
          }
          group.questions.forEach((question, index) => {
            const details = document.createElement("details");
            details.className = "question";
            if (question.author && question.author !== group.author) {
              const questionAuthor = document.createElement("p");
              questionAuthor.className = "author";
              questionAuthor.textContent = `Müəllif: ${question.author}`;
              details.append(questionAuthor);
            }
            const summary = document.createElement("summary");
            summary.textContent = `${index + 1}. `;
            safeRichText(question.question, summary);
            const answer = document.createElement("div");
            answer.className = "answer";
            safeRichText(question.answer, answer);
            details.append(summary, answer);
            if (question.reqImg) {
              const image = document.createElement("img");
              image.className = "question-image";
              image.src = question.reqImg;
              image.alt = "Rekvizit şəkli";
              image.loading = "lazy";
              details.insertBefore(image, answer);
            }
            if (question.handout) {
              const handout = document.createElement("p");
              handout.className = "extra";
              const label = document.createElement("strong");
              label.textContent = "Paylama materialı: ";
              handout.append(label);
              safeRichText(question.handout, handout);
              details.append(handout);
            }
            if (question.extraImage) {
              const image = document.createElement("img");
              image.className = "question-image";
              image.src = question.extraImage;
              image.alt = "Əlavə şəkil";
              image.loading = "lazy";
              details.append(image);
            }
            for (const [label, value] of [["Şərh", question.comment], ["Mənbə", question.source], ["Qəbul meyarı", question.criteria]]) {
              if (!value) continue;
              const extra = document.createElement("p");
              extra.className = "extra";
              const strong = document.createElement("strong");
              strong.textContent = `${label}: `;
              extra.append(strong);
              safeRichText(value, extra);
              details.append(extra);
            }
            groupElement.append(details);
          });
          sectionElement.append(groupElement);
        });
        content.append(sectionElement);
      });
    })();
  </script>
</body>
</html>
