function mkSegs(r){const t=r.q.type,d=r.durs||[],n=t==='duplet'?2:t==='blitz'?3:1,S=[];for(let j=0;j<n;j++){if(j)S.push({g:1,j,d:GAP});S.push({j,d:d[j]||30})}return S}

const roundList=()=>[...new Set((D.room&&D.room.rounds)||[])].sort((a,b)=>a-b);
function rows(){const N=D.players.length,c={},rt={},by={},np={},cr={},RD=(D.room&&D.room.rounds)||[];
 D.answers.forEach(a=>{const k=a.pid+'|'+a.q+'|'+a.part;if(!by[k]||a.status==='ok')by[k]=a;np[a.q]=Math.max(np[a.q]||0,a.np||1)});
 Object.keys(np).forEach(qi=>{const S=[];D.players.forEach(p=>{let ok=1;for(let i=0;i<np[qi];i++){const a=by[p.pid+'|'+qi+'|'+i];if(!a||a.status!=='ok')ok=0}if(ok)S.push(p.pid)});const v=100+900*(N-S.length)/Math.max(1,N-1),R=RD[qi]||1;S.forEach(pid=>{c[pid]=(c[pid]||0)+1;rt[pid]=(rt[pid]||0)+v;cr[pid]=cr[pid]||{};cr[pid][R]=(cr[pid][R]||0)+1})});
 const l=D.players.map(p=>({name:p.name,act:p.active!==false,s:c[p.pid]||0,rt:rt[p.pid]||0,cr:cr[p.pid]||{}})).filter(x=>x.act||x.s>0).sort((a,b)=>b.s-a.s||b.rt-a.rt||a.name.localeCompare(b.name));
 l.forEach((x,i)=>x.rk=i&&l[i-1].s===x.s&&l[i-1].rt===x.rt?l[i-1].rk:i+1);return l}
function tableHtml(){const L=rows(),R=roundList(),m=R.length>1;
 const head=`<th>Yer</th><th>Ad</th>${m?R.map(r=>`<th>${rom(r)} Tur</th>`).join('')+'<th>Cəm</th>':'<th>Xal</th>'}<th>Reytinq</th>`;
 return`<div class="card"><table><tr>${head}</tr>${L.map(x=>`<tr><td>${x.rk}</td><td>${esc(x.name)}</td>${m?R.map(r=>`<td>${x.cr[r]||0}</td>`).join(''):''}<td><b>${x.s}</b></td><td><b>${x.rt.toFixed(1)}</b></td></tr>`).join('')}</table></div>`}

function loadLogo(){const t=u=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u});return t(LOGO).then(im=>im||t(LOGO+'?cors=1'))}
function fit(x,txt,w,s,mw,mn){while(s>mn){x.font=`${w} ${s}px Poppins,sans-serif`;if(x.measureText(txt).width<=mw)break;s--}x.font=`${w} ${s}px Poppins,sans-serif`}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

 for(let i=0;i<n;i++){const X0=X[two&&i>=10?1:0],y=470+(i%10)*108,top=i<3,w=top?700:500,rs=l[i].rt.toFixed(1);

 x.fillStyle='#9DC3FF';x.textAlign='center';
 const b1='Qalibləri təbrik edir',b2='İştirakçılara təşəkkür edirik';fit(x,b1,700,52,960,20);x.fillText(b1,540,1735);fit(x,b2,700,52,960,20);x.fillText(b2,540,1805);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(D.room.title||'reytinq').replace(/[^\w\u0080-\uFFFF-]+/g,'_')+'_top'+n+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png')}

function dino(cv){const x=cv.getContext('2d'),dp=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight,G=H-22,DS=46/344,DX=40,DW=319*DS;cv.width=W*dp;cv.height=H*dp;x.scale(dp,dp);
 const P=LG.map(d=>new Path2D(d)),DP=new Path2D(DINO_D);let y,vy,ob,sp,sc,dead,last=performance.now();
 const reset=()=>{y=0;vy=0;ob=[];sp=5;sc=0;dead=0};reset();
 const jump=()=>{if(dead)reset();else if(y===0)vy=10};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
 const kd=e=>{if(!cv.isConnected){removeEventListener('keydown',kd);return}if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}};addEventListener('keydown',kd);
 (function loop(now){if(!cv.isConnected)return;const d=Math.min(2.5,(now-last)/16.67);last=now;
  if(!dead){vy-=.6*d;y+=vy*d;if(y<=0){y=0;vy=0}sc+=sp*d/10;sp=Math.min(12,5+sc/150);
   const l=ob[ob.length-1];if(!l||l.x<W-(230+sp*22+l.r)){const h=30+Math.random()*16|0;ob.push({x:W+10,h,w:h*1275/1079,r:Math.random()*160})}
   ob.forEach(o=>o.x-=sp*d);ob=ob.filter(o=>o.x+o.w>-10);
   if(ob.some(o=>o.x+6<DX+DW-6&&o.x+o.w-6>DX+6&&y<o.h-8))dead=1}

  ob.forEach(o=>{x.save();x.translate(o.x,G+1);const s=o.h/1079;x.scale(s,s);x.translate(-91,-1324);P.forEach(p=>x.fill(p));x.restore()});
  x.font='500 13px Poppins,sans-serif';x.textAlign='right';x.fillText(String(Math.floor(sc)),W-8,18);

/* ---------- PLAYER ---------- */
async function playerStart(r){rid=r;mode='p';try{const s=JSON.parse(localStorage.getItem('pk_v')||'{}');if(s.rid===r)vals=s.v||{}}catch(e){}
 const rs=await col('rooms').doc(r).get();if(!rs.exists){app.innerHTML='<div class="card">Otaq tapılmadı.</div>';return}
 setTitle(rs.data().title);const ps=await col('players').doc(r+'_'+pid).get();if(ps.exists){myName=ps.data().name;if(ps.data().active===false)ps.ref.update({active:true}).catch(()=>{});lastAct=Date.now();return enterP()}
 app.innerHTML=`<div class="card"><h3>Yarışda iştirak etmək üçün qeydiyyatdan keçin</h3><input id="nm" placeholder="Adınız"><button class="pri" style="margin-top:14px" onclick="reg()">Daxil ol</button></div>`}
async function reg(){const n=$('#nm').value.trim();if(!n)return;myName=n;await col('players').doc(rid+'_'+pid).set({room:rid,pid,name:n,at:Date.now(),active:true});lastAct=Date.now();enterP()}
function enterP(){mode='p';pkey='';app.innerHTML='<div class="tabs" id="pt"></div><div id="pp"></div>';sub()}
function pRender(){if(!D.room||kicked)return;const r=D.room;idle(r,sn());
 if(!r.started){const pt=$('#pt');pt.innerHTML='';pt._h='';const pp=$('#pp');
  if(!$('#dino')){pp.innerHTML='<div class="card"><div class="q" id="intro"></div></div><canvas id="dino"></canvas>';dino($('#dino'));pkey='w'}
  const it=r.intro||'Oyun tezliklə başlayacaq…';if($('#intro').textContent!==it)$('#intro').textContent=it;bar(r,null);return}
 const live=r.phase==='live',t=live?tl(r,sn()):null;
 tabsH($('#pt'),['Suallar','Oyunçu sıralaması','Cavabların'],ptab,'setP',0);
 if(ptab===0){const k=r.phase+r.cur+r.t0+(t?t.i+'_'+t.end:'')+(r.phase==='done'?sig():'');if(k!==pkey){pkey=k;pGame(r,t);if(!(r.phase==='review'||(t&&t.end)))an($('#pp'))}}else if(ptab===1)$('#pp').innerHTML=tableHtml();else pMine();
 bar(r,t)}
function pData(){const r=D.room;if(ptab!==0||(r&&r.phase==='done'))pRender()}
function saveVals(){try{localStorage.setItem('pk_v',JSON.stringify({rid,v:vals}))}catch(e){}}
function setV(k,v){const r=D.room;vals[r.t0+'|'+k]={c:r.cur,j:k,v,t0:r.t0,qt:r.q.parts[k].text,np:r.q.parts.length};saveVals()}
const qCards=(r,upto,rev)=>r.q.parts.slice(0,upto+1).map((p,k)=>`<div class="card"><div class="ql">Sual ${r.q.parts.length>1?k+1:r.cur+1}</div>${qHtml(p)}${rev&&r.rev&&r.rev[k]?rvH(r.rev[k]):''}</div>`).join('');
function pGame(r,t){const el=$('#pp');
 if(r.phase==='closed'){el.innerHTML='<div class="card"><h3>Otaq hərəkətsizlik səbəbindən bağlandı</h3></div>';return}
 if(r.phase==='done'){el.innerHTML='<div class="card"><h2>Oyun bitdi 🎉</h2><div class="mu">Nəticələr aşağıdadır.</div></div>'+tableHtml();return}
 if(r.phase==='idle'){el.innerHTML='<div class="card"><h3>Növbəti sual gözlənilir…</h3></div>';return}
 const n=r.q.parts.length;
 if(r.phase==='review'||t.end){el.innerHTML=`<div class="card"><div class="mu">Tur ${r.q.round} · Sual ${r.cur+1}/${r.n}</div><h3>Vaxt bitdi</h3><div class="mu">Cavablar yoxlanılır…</div></div>`+qCards(r,n-1,1);return}
 const sg=t.S[t.i],R=['I','II','III'];
 if(sg.g){el.innerHTML=`<div class="card"><div class="ho">${R[sg.j]} sual üçün</div><div class="tm" id="tm"></div></div>`+qCards(r,sg.j-1);return}
 el.innerHTML=`<div class="card"><div class="mu">Tur ${r.q.round} · Sual ${r.cur+1}/${r.n}</div><div class="tm" id="tm"></div></div>`+qCards(r,sg.j)}
/* cavab paneli: ekranın ən altında, klaviaturanın üstündə */
function bar(r,t){const b=$('#abar'),live=mode==='p'&&ptab===0&&r.started&&r.phase==='live'&&t&&!t.end;
 if(!live){if(b.firstChild)b.innerHTML='';b._k='';b._j=-1;document.body.classList.remove('hasbar');return}
 const n=r.q.parts.length,k=r.t0+'|'+n;
 if(b._k!==k){b._k=k;b._j=-1;b.innerHTML=`<div class="card">${r.q.parts.map((x,i)=>`<div class="ac${n===1?' s':''}">${n>1?`<b>${i+1}.</b>`:''}<input placeholder="Cavabınız" autocomplete="off" value="${esc((vals[r.t0+'|'+i]||{}).v||'')}" oninput="setV(${i},this.value)"></div>`).join('')}</div>`;document.body.classList.add('hasbar')}
 const sg=t.S[t.i],j=sg.j,gap=sg.g,ins=[...b.querySelectorAll('.ac')];
 ins.forEach((e,i)=>{const o=i>j||(gap&&i===j);e.classList.toggle('off',o);e.querySelector('input').disabled=o});
 if(!gap&&b._j!==j){b._j=j;if(j>0)try{ins[j].querySelector('input').focus()}catch(e){}}
 kb()}
async function submitEn(en){const k=en.t0+'|'+en.j;if(sent.has(k)||sending.has(k)||Date.now()<(retryAt.get(k)||0))return;const v=en.v.trim();if(!v){sent.add(k);return}const id=`${rid}_${en.c}_${en.j}_${pid}`;if(D.answers.some(a=>a.id===id)){sent.add(k);return}
 sending.add(k);
 try{await col('answers').doc(id).set({room:rid,q:en.c,part:en.j,np:en.np,pid,name:myName||'?',text:v,qtext:en.qt,status:'new',at:sn()});sent.add(k);retryAt.delete(k);answerWriteError=0}
 catch(e){retryAt.set(k,Date.now()+2000);console.error('Cavab Firestore-a göndərilmədi:',e);if(!answerWriteError){answerWriteError=1;toast('Cavab göndərilmədi, yenidən yoxlanılır…')}}
 finally{sending.delete(k)}}
function flush(r,now){Object.values(vals).forEach(en=>{if(sent.has(en.t0+'|'+en.j))return;if(r.t0!==en.t0||r.phase!=='live'||tl(r,now).end)submitEn(en)})}
function pMine(){const g=groupBy(D.answers.filter(a=>a.pid===pid)).sort((a,b)=>b.q-a.q);
 $('#pp').innerHTML=g.map(x=>`<div class="card al"><div class="mu">Sual ${x.q+1}</div>${x.l.map(a=>{const ap=D.appeals.find(y=>y.id===a.id),cl=a.status==='ok'?'g':a.status==='no'?'r':'';
 return`<div class="pl"><span class="${cl}"><b>${a.np>1?(a.part+1)+'. ':''}${esc(a.text)}</b>${a.status==='new'||a.status==='pending'?' <span class="mu">gözləyir</span>':''}${ap?`<br><span class="mu" data-re="${a.id}">${ap.status==='open'?'Apellyasiya göndərildi':ap.status==='done'?'Apellyasiya qəbul edildi':'Apellyasiya rədd edildi'}</span>`:''}</span>${a.status==='no'&&(!ap||reap.has(a.id))?`<button class="ap" onclick="appeal('${a.id}')" aria-label="Apellyasiya">${HAND}</button>`:''}</div>`}).join('')}</div>`).join('')||'<div class="mu">Hələ cavab göndərməmisiniz.</div>'}
function appeal(id){const a=D.answers.find(x=>x.id===id);if(!a)return;col('appeals').doc(id).set({room:rid,aid:id,q:a.q,part:a.part,pid,name:a.name,text:a.text,status:'open'}).then(()=>{reap.delete(id);toast('Apellyasiya göndərildi');pMine()})}
/* gizli yol: "Apellyasiya ..." yazısına 3 san basılı saxla → əl ikonu yenidən çıxır */
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('[data-re]');if(!s)return;const id=s.dataset.re;clearTimeout(apT);apT=setTimeout(()=>{reap.add(id);pMine()},3000)},true);
['pointerup','pointercancel','pointermove'].forEach(v=>document.addEventListener(v,e=>{if(v==='pointermove'&&e.pressure===0)return;clearTimeout(apT)},true));
/* ---------- ticker ---------- */
setInterval(()=>{const r=D.room;if(!r||kicked)return;const now=sn();
 if(mode==='p'){flush(r,now);kickCheck()}
 if(r.phase!=='live')return;
 const t=tl(r,now),el=$('#tm');if(el&&!t.end)el.textContent=Math.ceil(t.rem);
 const k=r.t0+'_'+t.i;if(!t.end&&!t.S[t.i].g&&t.rem<=10&&t.S[t.i].d>10&&beeped!==k){beeped=k;beep()}
 if(mode==='p'&&ptab===0)pRender();
 else if(mode==='h'&&t.end&&(now-r.t0)/1000>=t.total+1&&endF!==r.t0){endF=r.t0;endQ()}},250);
init();
