 apiKey:"AIzaSyCqcyIZFC-39yAZ-2tQrbaUK7O4oi0CnW4",
 authDomain:"peaksel-quiz.firebaseapp.com",
 projectId:"peaksel-quiz",
 storageBucket:"peaksel-quiz.firebasestorage.app",
 messagingSenderId:"426308663897",
 appId:"1:426308663897:web:9092d8f9b140a3eccccf48",

const TR=(f,id)=>`<button class="del" onclick="${f}('${id}')" aria-label="Sil">${TRASH}</button>`;
let db,pid,pack,ed,rid,mode,D={answers:[],players:[],appeals:[]},unsubs=[],htab=0,ptab=0,hdur=null,vals={},sent=new Set(),pkey='',hkey='',beeped='',adv=0,endF='',saveT,ac,off=0,closing=0,apOpen=0,ui={},chk=new Set(),myName='';

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
function beep(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.setValueAtTime(0,ac.currentTime+1.6);o.start();o.stop(ac.currentTime+1.7)}catch(e){}}
addEventListener('pointerdown',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}});
/* server vaxtı ilə sinxronizasiya: bütün telefonlarda eyni saniyə */
async function sync(){let best=1e9;for(let i=0;i<3;i++){try{const ref=col('players').doc('_t_'+pid),a=Date.now();await ref.set({room:'_',t:firebase.firestore.FieldValue.serverTimestamp()});const s=await ref.get({source:'server'}),b=Date.now();if(b-a<best){best=b-a;off=s.data().t.toMillis()-(a+b)/2}}catch(e){break}}}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ə/g,'e').replace(/ı/g,'i').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function match(t,p){const a=norm(t);if(!a)return false;return[p.answer,...String(p.acc||'').split(/[;\n]/)].some(x=>{const n=norm(x);if(!n)return false;const tol=n.length<=4?0:n.length<=8?1:2;return lev(a,n)<=tol})}
const defDurs=(t,n)=>t==='duplet'?[3,30]:t==='blitz'?Array(n).fill(20):[60];
/* zaman xətti: sual hissələri + aralarında 5 san geri sayım */
function mkSegs(r){const t=r.q.type,d=r.durs||[],n=t==='duplet'?2:t==='blitz'?3:1,S=[];for(let j=0;j<n;j++){if(j)S.push({g:1,j,d:5});S.push({j,d:d[j]||30})}return S}
function tl(r,now){const e=Math.max(0,(now-r.t0)/1000),S=mkSegs(r);let a=0;for(let i=0;i<S.length;i++){if(e<a+S[i].d)return{i,rem:a+S[i].d-e,S,end:0};a+=S[i].d}return{i:S.length-1,rem:0,S,end:1,total:a}}

function groupBy(list){const g={};list.forEach(a=>{const k=a.q+'|'+a.pid;(g[k]=g[k]||{q:a.q,name:a.name,pid:a.pid,l:[]}).l.push(a)});return Object.values(g).map(x=>(x.l.sort((a,b)=>a.part-b.part),x)).sort((a,b)=>a.q-b.q)}

async function init(){
 try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){app.innerHTML='<div class="card">Firebase config səhvdir.</div>';return}
 try{pid=localStorage.getItem('pk_pid')}catch(e){}
 if(!pid){pid=rnd()+rnd();}try{localStorage.setItem('pk_pid',pid)}catch(e){}
 await Promise.race([sync(),new Promise(r=>setTimeout(r,4000))]);setInterval(sync,120000);
 const m=location.hash.match(/r=(\w+)/);
 if(m)return playerStart(m[1]);
 let isH=false;try{isH=localStorage.getItem('pk_host')==='1'}catch(e){}
 if(isH){let l=null;try{l=localStorage.getItem('pk_room')}catch(e){}return l?openHost(l):home()}
 app.innerHTML='<div class="card"><h3>Aparıcı girişi</h3><input id="hp1" type="password" placeholder="Şifrə"><button class="pri" style="margin-top:12px" onclick="hostLogin()">Daxil ol</button></div><div class="mu">Oyunçular yalnız aparıcının göndərdiyi link vasitəsilə qoşula bilər.</div>';
}

/* ---------- HOST: dashboard ---------- */
function home(){unsubs.forEach(f=>f());unsubs=[];mode='d';setTitle('');try{localStorage.removeItem('pk_room')}catch(e){}
 app.innerHTML=`<h2>Aparıcı paneli</h2><div class="row"><button class="pri" onclick="newPack()">+ Yeni paket</button><button onclick="logout()">Çıxış</button></div><h3>Paketlər</h3><div id="pl"></div><h3>Otaqlar</h3><div id="rl"></div>`;
 unsubs.push(col('packs').onSnapshot(s=>{const d=s.docs.map(x=>x.data()).sort((a,b)=>(b.updated||0)-(a.updated||0));$('#pl').innerHTML=d.map(p=>`<div class="card"><b>${esc(p.title||'Adsız')}</b> <span class="mu">${p.questions.length} sual</span><div class="row" style="margin-top:10px"><button onclick="editPack('${p.id}')">Redaktə et</button><button class="pri" onclick="playPack('${p.id}')">Oynat</button>${TR('delPack',p.id)}</div></div>`).join('')||'<div class="mu">Hələ paket yoxdur.</div>'}));

document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p||mode!=='e')return;const s=p.split('.');
 if(s.length===1)ed[s[0]]=e.target.value;else if(s.length===2)ed.questions[s[0]][s[1]]=+e.target.value||1;else ed.questions[s[0]].parts[s[1]][s[2]]=e.target.value;autosave()});

async function upImg(i,j,el){const f=el.files[0];if(!f)return;try{const im=await createImageBitmap(f),k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ed.questions[i].parts[j].img=c.toDataURL('image/jpeg',.7);edRender();autosave()}catch(e){toast('Foto yüklənmədi')}}
function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>savePack(1),1200)}
async function savePack(q){ed.updated=Date.now();try{await col('packs').doc(ed.id).set(ed);toast('Yaddaşa vuruldu ✓')}catch(e){toast('Yaddaşa yazmaq alınmadı!')}}
/* ---------- HOST: room ---------- */
async function playPack(id){const s=await col('packs').doc(id).get(),p=s.data();rid=rnd().toUpperCase();
 await col('rooms').doc(rid).set({title:p.title,packId:id,cur:0,phase:'idle',n:p.questions.length,created:Date.now(),last:sn(),t0:0});openHost(rid)}
async function openHost(id){rid=id;const rs=await col('rooms').doc(id).get();if(!rs.exists)return home();
 const pk=await col('packs').doc(rs.data().packId).get();if(!pk.exists){toast('Paket tapılmadı');return home()}
 pack=pk.data();mode='h';hkey='';htab=0;D.room=null;try{localStorage.setItem('pk_room',id)}catch(e){}setTitle(rs.data().title);
 app.innerHTML=`<div class="row"><button onclick="home()">←</button><button onclick="copyLink()">🔗 Linki kopyala</button></div><div class="tabs" id="ht"></div><div id="hp"></div>`;sub()}
function copyLink(){const u=location.href.split('#')[0]+'#r='+rid;navigator.clipboard.writeText(u).then(()=>toast('Link kopyalandı'),()=>prompt('Linki kopyalayın',u))}
function sub(){unsubs.forEach(f=>f());unsubs=[];D={answers:[],players:[],appeals:[]};closing=0;
 unsubs.push(col('rooms').doc(rid).onSnapshot(s=>{D.room=s.data();mode==='h'?hostRender():pRender()}));
 ['answers','players','appeals'].forEach(n=>unsubs.push(col(n).where('room','==',rid).onSnapshot(s=>{D[n]=s.docs.map(d=>({id:d.id,...d.data()}));mode==='h'?hostRender():pData()})))}
const openAp=()=>D.appeals.filter(a=>a.status==='open');
function hostRender(){if(!D.room||!pack)return;const r=D.room;hostCheck();idle(r,sn());
 const n=D.answers.filter(a=>a.status==='pending').length+openAp().length;
 tabsH($('#ht'),['Aparıcı paneli','Oyunçu sıralaması','Gözləyən cavablar'],htab,'setH',n);
 const k=htab+'|'+r.cur+'|'+r.phase+'|'+r.t0;
 if(htab===0){if(k!==hkey){hkey=k;hostGame()}}else if(htab===1)$('#hp').innerHTML=tableHtml()+`<div class="row"><button onclick="savePng()">Nəticəni şəkil kimi yüklə</button></div>`;else hostPend()}
function hostGame(){const r=D.room,P=$('#hp');
 if(r.phase==='closed'){P.innerHTML='<div class="card"><h3>Otaq 10 dəqiqə hərəkətsizlik səbəbindən bağlandı</h3></div>';return}
 if(r.phase==='done'){P.innerHTML='<div class="card"><h2>Oyun bitdi 🎉</h2></div>';return}
 const q=pack.questions[r.cur];if(!hdur||hdur.k!==r.cur)hdur={k:r.cur,d:defDurs(q.type,q.parts.length)};
 const live=r.phase==='live';
 P.innerHTML=`<div class="card"><div class="mu">Tur ${q.round||1} · Sual ${r.cur+1}/${r.n}</div>
 ${q.parts.map((p,j)=>`<details><summary class="q">${esc(p.text||'(mətn yoxdur)')}</summary>${qHtml({img:p.img,handout:p.handout,text:''})}
 <div><b class="g">Cavab:</b> ${esc(p.answer)}</div>${p.acc?`<div class="mu">Sayılma: ${esc(p.acc)}</div>`:''}${p.comment?`<div>Şərh: ${esc(p.comment)}</div>`:''}${p.source?`<div class="mu">Mənbə: ${esc(p.source)}</div>`:''}</details>`).join('')}
 ${r.phase==='idle'?`<div class="row" style="margin-top:8px">${hdur.d.map((d,i)=>`<label class="mu">${q.parts.length>1?(i+1)+'. ':''}Vaxt (san)<input class="sm" type="number" min="1" value="${d}" oninput="hdur.d[${i}]=+this.value||1"></label>`).join('')}</div><button class="pri" style="margin-top:14px" onclick="play()">▶ Oynat</button>`:''}
 ${live?`<div class="tm" id="tm"></div><button style="margin-top:10px" onclick="upd({phase:'review'})">Vaxtı bitir</button>`:''}
 ${r.phase==='review'?'<div class="mu">Cavablar yoxlanılır…</div><button style="margin-top:10px" onclick="nextQ()">Növbəti sual ▶</button>':''}</div>
 <div class="card"><b>Suallar</b>${pack.questions.map((x,i)=>`<div class="ans"><span>${i+1}. ${esc((x.parts[0].text||'').slice(0,40))} <span class="mu">tur ${x.round||1}</span></span>${i<r.cur?'<span class="g">✓</span>':i===r.cur?'<b>●</b>':live?'':`<button onclick="jump(${i})">Seç</button>`}</div>`).join('')}</div>`}
function jump(i){upd({cur:i,phase:'idle'})}
function nextQ(){const c=D.room,n=c.cur+1;upd(n>=c.n?{phase:'done'}:{cur:n,phase:'idle'})}
function play(){const r=D.room,q=pack.questions[r.cur];upd({phase:'live',t0:sn()+1000,durs:hdur.d,q:{type:q.type,round:q.round||1,parts:q.parts.map(p=>({text:p.text,handout:p.handout,img:p.img}))}});try{ac=ac||new AudioContext();ac.resume()}catch(e){}}
const pcard=(g,k)=>`<div class="pc"><div class="mu">Sual ${g.q+1} · ${esc(g.name)}</div>${g.l.map(a=>{const q=pack.questions[a.q],p=q&&q.parts[a.part];return`<div class="pl"><span>${q&&q.parts.length>1?(a.part+1)+'. ':''}${esc(a.text)}${p?`<br><span class="mu">Doğru: ${esc(p.answer)}</span>`:''}</span><span class="pm"><button class="g" onclick="${k?'judge':'apJ'}('${a.id}',1)">＋</button><button class="r" onclick="${k?'judge':'apJ'}('${a.id}',0)">−</button></span></div>`}).join('')}</div>`;
function hostPend(){const pd=groupBy(D.answers.filter(a=>a.status==='pending')),ap=openAp();
 $('#hp').innerHTML=`<div class="card">${pd.map(g=>pcard(g,1)).join('')||'<div class="mu">Gözləyən cavab yoxdur.</div>'}</div>`+(ap.length?`<div class="row"><button class="apb" onclick="apOpen=!apOpen;hostPend()">Apellyasiya (${ap.length})</button></div>`:'')+(apOpen&&ap.length?`<div class="card">${groupBy(ap).map(g=>pcard(g,0)).join('')}</div>`:'')}
function judge(id,ok){col('answers').doc(id).update({status:ok?'ok':'no'});col('rooms').doc(rid).update({last:sn()})}
function apJ(id,ok){if(ok)col('answers').doc(id).update({status:'ok'});col('appeals').doc(id).update({status:ok?'done':'rejected'});col('rooms').doc(rid).update({last:sn()})}
function hostCheck(){const r=D.room;if(!r||mode!=='h'||!pack)return;let ch=0;
 D.answers.filter(a=>a.status==='new'&&!chk.has(a.id)).forEach(a=>{const p=pack.questions[a.q]&&pack.questions[a.q].parts[a.part];if(p){chk.add(a.id);ch=1;col('answers').doc(a.id).update({status:match(a.text,p)?'ok':'pending'})}});
 if(ch)col('rooms').doc(rid).update({last:sn()});
 if(r.phase==='review'&&!adv&&!D.answers.some(a=>a.q===r.cur&&(a.status==='new'||a.status==='pending'))){adv=1;setTimeout(()=>{const c=D.room;adv=0;if(c.phase!=='review')return;nextQ()},900)}}
function idle(r,now){if(closing||!r.last||r.phase==='done'||r.phase==='closed'||now-r.last<6e5)return;closing=1;col('rooms').doc(rid).update({phase:'closed'}).catch(()=>{})}
/* ---------- shared: table (xal + reytinq) ---------- */
function rows(){const N=D.players.length,s={},c={},rt={};
 D.answers.forEach(a=>{if(a.status==='ok'){const k=a.q+'.'+a.part;s[k]=(s[k]||0)+1}});
 D.answers.forEach(a=>{if(a.status!=='ok')return;const v=100+900*(N-s[a.q+'.'+a.part])/Math.max(1,N-1);c[a.pid]=(c[a.pid]||0)+1;rt[a.pid]=(rt[a.pid]||0)+v});
 const l=D.players.map(p=>({name:p.name,s:c[p.pid]||0,rt:rt[p.pid]||0})).sort((a,b)=>b.s-a.s||b.rt-a.rt||a.name.localeCompare(b.name));
 l.forEach((x,i)=>x.rk=i&&l[i-1].s===x.s&&l[i-1].rt===x.rt?l[i-1].rk:i+1);return l}
function tableHtml(){return`<div class="card"><table><tr><th>Yer</th><th>Ad</th><th>Xal</th><th>Reytinq</th></tr>${rows().map(x=>`<tr><td>${x.rk}</td><td>${esc(x.name)}</td><td><b>${x.s}</b></td><td><b>${x.rt.toFixed(1)}</b></td></tr>`).join('')}</table></div>`}
/* ---------- poster (turnir cədvəli dizaynı, TOP20) ---------- */
const LOGO="https://i.ibb.co/3mjVHt5R/Yeni-Proje-2.png";
function loadLogo(){const t=u=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u});return t(LOGO).then(im=>im||t(LOGO+'?cors=1'))}
function fit(x,txt,w,s,mw,mn){while(s>mn){x.font=`${w} ${s}px Poppins,sans-serif`;if(x.measureText(txt).width<=mw)break;s--}x.font=`${w} ${s}px Poppins,sans-serif`}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function savePng(){
 try{await Promise.all([document.fonts.load('700 40px Poppins'),document.fonts.load('500 40px Poppins')])}catch(e){}
 const l=rows(),n=Math.min(20,l.length),cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#002E92');g.addColorStop(.35,'#00123F');g.addColorStop(.7,'#00072C');g.addColorStop(1,'#00226F');x.fillStyle=g;x.fillRect(0,0,1080,1920);
 const im=await loadLogo();
 if(im){const k=Math.min(190/im.width,170/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,540-w/2,36+(170-h)/2,w,h)}
 else{x.fillStyle='#9DC3FF';x.textAlign='center';x.font='700 130px Poppins,sans-serif';x.fillText('π',540,120)}
 x.textBaseline='middle';x.textAlign='center';x.fillStyle='#9DC3FF';
 const title=`"${D.room.title}" TOP${n}-u`;fit(x,title,700,76,960,20);x.fillText(title,540,300);
 const two=n>10,W=two?488:720,X=two?[46,546]:[180];
 X.forEach(X0=>{x.fillStyle='#6FA5FC';x.font='500 24px Poppins,sans-serif';x.textAlign='center';x.fillText('Yer',X0+34,444);x.textAlign='left';x.fillText('Komanda',X0+68,444);x.textAlign='center';x.fillText('Xal',X0+W-150,444);x.fillText('Reytinq',X0+W-60,444)});
 for(let i=0;i<n;i++){const X0=X[two&&i>=10?1:0],y=470+(i%10)*108,top=i<3,w=top?700:500,rs=l[i].rt.toFixed(1);
  x.fillStyle=top?'#9DC3FF':'rgba(111,165,252,.3)';rr(x,X0,y,W,90,45);x.fill();x.fillStyle=top?'#00072C':'#DCE9FF';
  x.textAlign='center';x.font=`${w} 30px Poppins,sans-serif`;x.fillText(String(l[i].rk),X0+34,y+46);
  x.textAlign='left';fit(x,l[i].name,w,30,W-249,12);x.fillText(l[i].name,X0+68,y+46);
  x.textAlign='center';x.font=`${w} 30px Poppins,sans-serif`;x.fillText(String(l[i].s),X0+W-150,y+46);
  fit(x,rs,w,30,100,12);x.fillText(rs,X0+W-60,y+46)}
 x.fillStyle='#9DC3FF';x.textAlign='center';
 const b1='Qalibləri təbrik edir',b2='İştirakçılara təşəkkür edirik';fit(x,b1,700,52,960,20);x.fillText(b1,540,1735);fit(x,b2,700,52,960,20);x.fillText(b2,540,1805);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(D.room.title||'reytinq').replace(/[^\w\u0080-\uFFFF-]+/g,'_')+'_top'+n+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/png')}
/* ---------- PLAYER ---------- */
async function playerStart(r){rid=r;mode='p';const rs=await col('rooms').doc(r).get();if(!rs.exists){app.innerHTML='<div class="card">Otaq tapılmadı.</div>';return}
 setTitle(rs.data().title);const ps=await col('players').doc(r+'_'+pid).get();if(ps.exists){myName=ps.data().name;return enterP()}
 app.innerHTML=`<div class="card"><h3>Yarışda iştirak etmək üçün qeydiyyatdan keçin</h3><input id="nm" placeholder="Adınız"><button class="pri" style="margin-top:14px" onclick="reg()">Daxil ol</button></div>`}
async function reg(){const n=$('#nm').value.trim();if(!n)return;myName=n;await col('players').doc(rid+'_'+pid).set({room:rid,pid,name:n,at:Date.now()});enterP()}
function enterP(){mode='p';pkey='';app.innerHTML='<div class="tabs" id="pt"></div><div id="pp"></div>';sub()}
function pRender(){if(!D.room)return;const r=D.room;idle(r,sn());tabsH($('#pt'),['Suallar','Oyunçu sıralaması','Cavabların'],ptab,'setP',0);
 if(ptab===0){const t=r.phase==='live'?tl(r,sn()):null,k=r.phase+r.cur+r.t0+(t?t.i+'_'+t.end:'');if(k!==pkey){pkey=k;pGame(r,t)}}else if(ptab===1)$('#pp').innerHTML=tableHtml();else pMine()}
function pData(){if(ptab!==0)pRender()}
function setV(k,v){const r=D.room;vals[r.t0+'|'+k]={c:r.cur,j:k,v,t0:r.t0,qt:r.q.parts[k].text,np:r.q.parts.length}}
function pGame(r,t){const el=$('#pp');
 if(r.phase==='closed'){el.innerHTML='<div class="card"><h3>Otaq hərəkətsizlik səbəbindən bağlandı</h3></div>';return}
 if(r.phase==='done'){el.innerHTML='<div class="card"><h2>Oyun bitdi 🎉</h2><div class="mu">Nəticələr sıralama bölməsindədir.</div></div>';return}
 if(r.phase==='idle'){el.innerHTML='<div class="card"><h3>Sual '+(r.cur+1)+' gözlənilir…</h3></div>';return}
 if(r.phase==='review'||t.end){el.innerHTML='<div class="card"><h3>Vaxt bitdi. Cavablar yoxlanılır…</h3></div>';return}
 const sg=t.S[t.i],R=['I','II','III'],n=r.q.parts.length;
 if(sg.g){el.innerHTML=`<div class="card"><div class="ho">${R[sg.j]} sual üçün</div><div class="tm" id="tm"></div></div>`;return}
 const j=sg.j;
 el.innerHTML=`<div class="card"><div class="mu">Tur ${r.q.round} · Sual ${r.cur+1}/${r.n}</div><div class="tm" id="tm"></div>${qHtml(r.q.parts[j])}</div>
 <div class="card">${r.q.parts.map((x,k)=>{const en=vals[r.t0+'|'+k];return`<div class="ac${k>j?' off':''}">${n>1?`<b>${k+1}.</b>`:''}<input ${k>j?'disabled':'data-act="1"'} placeholder="Cavabınız" value="${esc(en?en.v:'')}" oninput="setV(${k},this.value)"></div>`}).join('')}</div>`;
 try{const a=el.querySelectorAll('[data-act]');if(n>1&&a.length)a[a.length-1].focus()}catch(e){}}
function submitEn(en){const k=en.t0+'|'+en.j;if(sent.has(k))return;sent.add(k);const v=en.v.trim();if(!v)return;const id=`${rid}_${en.c}_${en.j}_${pid}`;if(D.answers.some(a=>a.id===id))return;
 col('answers').doc(id).set({room:rid,q:en.c,part:en.j,np:en.np,pid,name:myName||'?',text:v,qtext:en.qt,status:'new',at:sn()})}
function flush(r,now){Object.values(vals).forEach(en=>{if(sent.has(en.t0+'|'+en.j))return;if(r.t0!==en.t0||r.phase!=='live'||tl(r,now).end)submitEn(en)})}
function pMine(){const g=groupBy(D.answers.filter(a=>a.pid===pid)).sort((a,b)=>b.q-a.q);
 $('#pp').innerHTML=g.map(x=>`<div class="card al"><div class="mu">Sual ${x.q+1}</div>${x.l.map(a=>{const ap=D.appeals.find(y=>y.id===a.id),cl=a.status==='ok'?'g':a.status==='no'?'r':'';
 return`<div class="pl"><span class="${cl}"><b>${a.np>1?(a.part+1)+'. ':''}${esc(a.text)}</b>${a.status==='new'||a.status==='pending'?' <span class="mu">gözləyir</span>':''}${ap?`<br><span class="mu">${ap.status==='open'?'Apellyasiya göndərildi':ap.status==='done'?'Apellyasiya qəbul edildi':'Apellyasiya rədd edildi'}</span>`:''}</span>${a.status==='no'&&!ap?`<button class="ap" onclick="appeal('${a.id}')" aria-label="Apellyasiya">${HAND}</button>`:''}</div>`}).join('')}</div>`).join('')||'<div class="mu">Hələ cavab göndərməmisiniz.</div>'}
function appeal(id){const a=D.answers.find(x=>x.id===id);col('appeals').doc(id).set({room:rid,aid:id,q:a.q,part:a.part,pid,name:a.name,text:a.text,status:'open'}).then(()=>toast('Apellyasiya göndərildi'))}
/* ---------- ticker (server vaxtı ilə) ---------- */
setInterval(()=>{const r=D.room;if(!r)return;const now=sn();
 if(mode==='p')flush(r,now);
 if(r.phase!=='live')return;
 const t=tl(r,now),el=$('#tm');if(el&&!t.end)el.textContent=Math.ceil(t.rem)+(t.S[t.i].g?'':' san');
 const k=r.t0+'_'+t.i;if(!t.end&&!t.S[t.i].g&&t.rem<=10&&t.S[t.i].d>10&&beeped!==k){beeped=k;beep()}
 if(mode==='p'&&ptab===0)pRender();
 else if(mode==='h'&&t.end&&(now-r.t0)/1000>=t.total+1&&endF!==r.t0){endF=r.t0;upd({phase:'review'})}},250);
init();
</script></body></html>
