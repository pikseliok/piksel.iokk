<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8d5ff">
<title>πksel - Kart çəkmə</title>
<link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
body{--page:#b8d5ff;--c1:#00269C;--c2:#00269C;--fg:#b8d5ff;--accent:#00269C;--nav:rgba(255,255,255,.35);--navb:rgba(17,92,251,.2);--gl:linear-gradient(135deg,rgba(184,213,255,.3),rgba(184,213,255,.08));--glb:rgba(184,213,255,.55);--glh:rgba(255,255,255,.4);--og:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.12));--ogb:rgba(255,255,255,.7)}
body.dark{--page:#000521;--c1:#6ca2f9;--c2:#6ca2f9;--fg:#000521;--accent:#6ca2f9;--nav:rgba(108,162,249,.2);--navb:rgba(108,162,249,.2);--gl:linear-gradient(135deg,rgba(0,5,33,.28),rgba(0,5,33,.08));--glb:rgba(0,5,33,.45);--glh:rgba(255,255,255,.28);--og:linear-gradient(135deg,rgba(108,162,249,.22),rgba(108,162,249,.06));--ogb:rgba(108,162,249,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*,*:focus,*:focus-visible{outline:none!important}
a,button{-webkit-touch-callout:none}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--page);color:var(--accent);font-family:Montserrat,system-ui,sans-serif;overflow-x:hidden;transition:background .6s ease,color .6s ease;-webkit-font-smoothing:antialiased}
a,button,input{font:inherit}
a{color:inherit;text-decoration:none}
.page{width:calc(100% - 24px);max-width:820px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 0 14px;flex:1 0 auto}
.frame{animation:frameIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--i,0) * .1s)}
@keyframes frameIn{from{opacity:0;transform:translateY(28px)}}
@keyframes navIn{from{opacity:0;transform:translate(-50%,60px)}}

/* şüşə çərçivə */
.glass{position:relative;isolation:isolate;padding:12px;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 48%,rgba(255,255,255,.1));-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.18)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse 75% 55% at 8% 0%,rgba(255,255,255,.62),transparent 72%),linear-gradient(118deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 18%,transparent 42%,rgba(255,255,255,.07) 76%,rgba(255,255,255,.2) 100%)}
body.dark .glass{background:linear-gradient(135deg,rgba(108,162,249,.14),rgba(0,5,33,.28) 48%,rgba(108,162,249,.08));border-color:rgba(108,162,249,.46);box-shadow:inset 0 1px 0 rgba(108,162,249,.24),inset 0 -1px 0 rgba(108,162,249,.16)}
body.dark .glass::before{background:radial-gradient(ellipse 72% 48% at 8% 0%,rgba(108,162,249,.24),transparent 72%),linear-gradient(118deg,rgba(108,162,249,.13) 0%,rgba(108,162,249,.055) 18%,transparent 42%,rgba(108,162,249,.035) 76%,rgba(108,162,249,.12) 100%)}
.glass>*{position:relative;z-index:1}

/* içdəki çərçivələr */
.box{background:var(--c1);color:var(--fg);border-radius:28px;padding:22px 24px;margin-top:12px}
.title-card{display:flex;align-items:center;justify-content:center;gap:14px;min-height:84px;padding:18px 24px;margin-top:0}
.card-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center}
.card-icon svg{width:100%;height:100%;display:block}
.card-title{font-size:25px;line-height:1.15;font-weight:700;letter-spacing:-.6px}
.screen{display:none}
.screen.active{display:block}
h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.5px;text-align:center;margin-bottom:16px}
.center{text-align:center}
.in{font-weight:500;font-size:17px;color:var(--fg);background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border-radius:40px;padding:0 18px;height:46px;width:100%;max-width:260px;text-align:center;transition:box-shadow .25s ease;-webkit-user-select:text;user-select:text}
.in::placeholder{color:var(--fg);opacity:.55}
.in.bad,.slot .in.bad{box-shadow:0 0 0 3px #ff5d6c}
.actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{height:46px;min-width:130px;padding:0 26px;border-radius:40px;cursor:pointer;font-size:15px;font-weight:600;background:var(--gl);color:var(--fg);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);transition:transform .25s ease,opacity .25s ease}
.btn:hover{transform:scale(1.03)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.pbtn{height:46px;min-width:46px;padding:0 24px;border:1px solid var(--ogb);border-radius:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--og);color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,20,110,.1);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);transition:transform .25s ease,opacity .25s ease}
.pbtn:hover{transform:scale(1.04)}.pbtn:active{transform:scale(.96)}
.pbtn:disabled{opacity:.45;cursor:default;transform:none}
.pbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.slot{display:flex;align-items:center;gap:10px;background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border-radius:40px;padding:6px 8px}
.slot b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--c1);font-size:14px}
.slot .in{max-width:none;text-align:left;height:36px;font-size:15px;padding:0 14px;background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;min-width:0}

/* kart çəkmə */
#deck{position:relative}
.pcard{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.13);background:var(--fg);box-shadow:0 5px 12px rgba(0,0,0,.35);transform:translate(var(--x),calc(var(--y) + var(--dy))) rotate(calc(var(--j)*1deg));cursor:pointer}
.ready .pcard{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pcard.up{transform:translate(var(--x),calc(var(--y) - 30px)) scale(1.08);z-index:500!important;box-shadow:0 18px 30px rgba(0,0,0,.55)}
.ov{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:transparent;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:.6s;cursor:pointer}
.ov.on{background:color-mix(in srgb,var(--page) 55%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ov p{margin:0 0 28px;opacity:0;transition:.4s;color:var(--accent);font-weight:500}
.fly{position:absolute;perspective:1000px}
.fin{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.fb,.ff{position:absolute;inset:0;border-radius:7%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fb{background:var(--fg);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.pcard::after,.fb::after{content:"";position:absolute;inset:9%;border:2px solid var(--c1);border-radius:30%/21%;opacity:.6;pointer-events:none}
.fb::after{border-width:3px;border-radius:12%/8.5%}
.ff{transform:rotateY(180deg);background:var(--c1);color:var(--fg);display:flex;align-items:center;justify-content:center;border:3px solid var(--fg);box-shadow:0 24px 60px rgba(0,0,0,.6);font-weight:700}
.ff span{display:inline-block;white-space:nowrap}
#resList{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#resList li{display:flex;gap:10px;align-items:center;background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 var(--glh);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border-radius:20px;padding:10px 16px;font-weight:700}
.empty{text-align:center;margin:0;opacity:.75;font-weight:500;font-size:15px}
.back{display:none;justify-content:center;gap:12px;margin-top:12px}
.back .pbtn{flex:1 1 0;min-width:0;max-width:240px;padding:0 10px}

/* footer */
footer{background:var(--c1);color:var(--fg);min-height:110px;padding:20px 20px calc(96px + max(0px,env(safe-area-inset-bottom)));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:background .6s ease,color .6s ease}
.footer-line{font-size:15px;line-height:1.4;font-weight:500}
.footer-link{transition:opacity .25s ease,transform .25s ease}.footer-link:hover{opacity:.72;transform:translateY(-1px)}

/* navbar */
.navbar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:900;display:flex;gap:10px;padding:8px;border-radius:44px;background:var(--nav);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 10px 30px rgba(0,20,110,.18),inset 0 0 0 1px rgba(255,255,255,.25);animation:navIn .8s cubic-bezier(.18,.8,.24,1) .6s backwards}
.nb{position:relative;width:56px;height:56px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);background:var(--navb);transition:transform .25s ease,background .4s ease,color .4s ease}
.nb:hover{transform:translateY(-3px)}.nb:active{transform:scale(.92)}
.nb svg{width:28px;height:28px;overflow:visible;fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nb svg.search-i{fill:none;stroke-width:1.9}
.nb svg.theme-icon{fill:none;stroke:none}
body.dark .navbar{background:rgba(0,9,34,.72)}
body.dark .nb{background:rgba(108,162,249,.2);color:#6ca2f9}
body.dark .nb:hover{background:#6ca2f9;color:#000521}
.ray{stroke:currentColor;stroke-width:2;stroke-linecap:round}
body.dark .ray{opacity:0}
.core{transform:scale(.68);transform-origin:16px 16px}
.bite{transform:translate(14px,-14px)}
body.dark .core{transform:scale(1)}body.dark .bite{transform:translate(0,0)}
body.ready .bite,body.ready .core{transition:transform .6s cubic-bezier(.4,0,.2,1)}

@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
@media (max-width:700px){
.glass{padding:10px;border-radius:26px}
.box{padding:18px 16px;border-radius:22px;margin-top:10px}
.title-card{min-height:70px;gap:10px;padding:12px 16px}
.card-icon{width:32px;height:32px;flex-basis:32px}
.card-title{font-size:19px}
h2{font-size:17px}
.team{font-size:16px;height:52px;padding:0 8px;border-radius:20px}
.vs{width:22px;font-size:18px}
.row{gap:8px}
.nb{width:52px;height:52px}.navbar{gap:8px}
}
@media (max-width:420px){.card-title{font-size:17px}.footer-line{font-size:13px}}
@media (max-width:360px){.nb{width:46px;height:46px}.nb svg{width:25px;height:25px}}
</style>
</head>
<body>

<div class="page">
 <main class="frame glass" style="--i:1">
  <section class="box title-card">
   <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="6" width="15" height="21" rx="3.5" transform="rotate(-12 10 16)" fill="currentColor" opacity=".55"/><rect x="12" y="4.5" width="15" height="21" rx="3.5" transform="rotate(8 19 15)" fill="currentColor"/></svg></span>
   <h1 class="card-title">Kart çəkmə</h1>
  </section>

  <section id="s-count" class="screen active">
   <div class="box center"><h2>Komanda sayı:</h2>
    <input class="in" id="cnt" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="məs. 8">
    <div class="actions"><button class="btn" id="cNext" type="button">Davam</button></div>
   </div>
  </section>

  <section id="s-names" class="screen">
   <div class="box"><h2>Komanda adları</h2>
    <div class="grid" id="nameGrid"></div>
    <div class="actions"><button class="btn ghost" id="nBack" type="button">Geri</button><button class="btn" id="nNext" type="button">Davam</button></div>
   </div>
  </section>

  <section id="s-blind" class="screen">
   <div class="box"><div id="deck"></div></div>
   <div class="box"><h2>Çıxanlar</h2><p class="empty" id="resEmpty">Hələ kart seçilməyib</p><ol id="resList"></ol></div>
   <div class="back" id="backB"><button class="pbtn" id="redo" type="button">Yenidən kart çək</button><button class="pbtn" id="newgame" type="button">Yeni kart çək</button></div>
  </section>
 </main>
</div>

<footer><div class="footer-line">Unikal İntellektual Oyunlar Platforması</div><a class="footer-line footer-link" href="https://www.instagram.com/piksel.iok" rel="noopener noreferrer" target="_blank">©πksel intellektual oyunlar klubu</a><a class="footer-line footer-link" href="https://www.instagram.com/onurelzh" rel="noopener noreferrer" target="_blank">©Onur Əlizadə</a></footer>

<nav class="navbar" aria-label="Əsas naviqasiya">
<a href="/" class="nb" aria-label="Əsas Səhifə" title="Əsas Səhifə"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.4l8 6.8V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19z" stroke-width="2.2"/></svg></a>
<a href="sual_axtarisi" class="nb" aria-label="Sual axtarışı" title="Sual axtarışı"><svg viewBox="0 0 24 24" class="search-i" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5 16 16"/></svg></a>
<a href="elaqe" class="nb" aria-label="Bizimlə Əlaqə" title="Bizimlə Əlaqə"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.8 3.6h2.5c.5 0 .9.3 1 .8l.5 2.7c.1.4-.1.8-.4 1l-1.5 1.2a11.5 11.5 0 0 0 5.2 5.2l1.2-1.5c.3-.3.7-.5 1-.4l2.7.5c.5.1.8.5.8 1v2.5c0 1-.8 1.8-1.8 1.8C10.6 18.4 5 12.8 5 5.4c0-1 .8-1.8 1.8-1.8z" stroke-width="1.4"/></svg></a>
<button class="nb" type="button" id="themeToggle" aria-label="Gecə rejiminə keç" title="Rejimi dəyiş"><svg viewBox="0 0 32 32" aria-hidden="true" class="theme-icon" id="themeIcon"><defs><mask id="biteMask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle class="bite" cx="21" cy="11" r="7.5" fill="#000"/></mask></defs><g class="rays"><g transform="rotate(0 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(45 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(90 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(135 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(180 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(225 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(270 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g><g transform="rotate(315 16 16)"><line class="ray" x1="16" y1="3.5" x2="16" y2="6.5"/></g></g><g mask="url(#biteMask)"><circle class="core" cx="16" cy="16" r="9" fill="currentColor"/></g></svg></button>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const shake=el=>el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],300);
function fit(el,pad,start){el.style.fontSize=start?start+'px':'';let s=parseFloat(getComputedStyle(el).fontSize),b=el.parentNode;while(el.offsetWidth>b.clientWidth-pad&&s>7){s-=.5;el.style.fontSize=s+'px'}}
const fitRow=r=>r.querySelectorAll('.team span').forEach(s=>fit(s,28));

/* ===== SAĞ KLİK VƏ CTRL+U BLOKU ===== */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='u'){e.preventDefault();e.stopPropagation()}
},true);

/* ===== TEMA ===== */
const themeToggle=$('#themeToggle'),rays=[...document.querySelectorAll('.ray')];
function animateRays(n){rays.forEach(e=>{e.getAnimations().forEach(a=>a.cancel());const t=e.animate(n?[{transform:'translateY(0)',opacity:1},{transform:'translateY(-14px)',opacity:0}]:[{transform:'translateY(11px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:n?520:620,delay:n?0:180,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});t.onfinish=()=>t.cancel()})}
function setTheme(d,anim){document.body.classList.toggle('dark',d);try{localStorage.setItem('piksel-theme',d?'dark':'light')}catch(e){}themeToggle.setAttribute('aria-label',d?'Gündüz rejiminə keç':'Gecə rejiminə keç');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#010033':'#b8d5ff';if(anim)animateRays(d)}
(function(){let v=null;try{v=localStorage.getItem('piksel-theme')}catch(e){}
 if(v==='dark')setTheme(true,false);else if(v==='light')setTheme(false,false);else setTheme(!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),false)})();
themeToggle.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark'),true));
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));

/* ===== EKRANLAR ===== */
let names=[],st={};
async function go(id){
 const cur=document.querySelector('.screen.active');
 if(cur){
  const out=cur.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-20px)'}],{duration:350,easing:'ease',fill:'forwards'});
  await out.finished;
  cur.classList.remove('active');
  out.cancel();
 }
 const nx=$('#'+id);
 nx.getAnimations().forEach(a=>a.cancel());
 nx.classList.add('active');
 nx.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:450,easing:'ease-out'});
 scrollTo({top:0,behavior:'smooth'});
}
$('#nBack').onclick=()=>go('s-count');
$('#redo').onclick=()=>{scrollTo({top:0,behavior:'smooth'});initBlind()};
$('#newgame').onclick=async()=>{names=[];$('#cnt').value='';$('#cnt').classList.remove('bad');await go('s-count');$('#deck').innerHTML='';$('#resList').innerHTML='';$('#nameGrid').innerHTML=''};
$('#cnt').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,2);e.target.classList.remove('bad')});
$('#cnt').addEventListener('keydown',e=>{if(e.key==='Enter')$('#cNext').click()});
$('#cNext').onclick=async()=>{
 const n=parseInt($('#cnt').value,10);
 if(!(n>=2&&n<=40)){shake($('#cnt'));$('#cnt').classList.add('bad');return}
 $('#cnt').classList.remove('bad');
 $('#nameGrid').innerHTML=Array.from({length:n},(_,i)=>`<div class="slot"><b>${i+1}</b><input class="in" maxlength="40" placeholder="Komanda adı"></div>`).join('');
 const ins=[...document.querySelectorAll('#nameGrid input')];
 ins.forEach((x,i)=>x.onkeydown=e=>{if(e.key==='Enter')(ins[i+1]||$('#nNext')).focus()});
 await go('s-names');ins[0].focus();
};
$('#nNext').onclick=async()=>{
 const ins=[...document.querySelectorAll('#nameGrid input')];let bad=null;
 ins.forEach(x=>{const e=!x.value.trim();x.classList.toggle('bad',e);if(e){shake(x);bad=bad||x}});
 if(bad)return bad.focus();
 names=ins.map(x=>x.value.trim());
 await go('s-blind');initBlind();
};

/* ===== KART ÇƏKMƏ ===== */
let cards=[],busy=false;
const deckEl=$('#deck');
function initBlind(){
 deckEl.innerHTML='';deckEl.classList.remove('ready');$('#resList').innerHTML='';$('#resEmpty').style.display='';$('#backB').style.display='none';
 cards=shuffle(names).map(n=>{const c=document.createElement('div'),j=Math.random()*5-2.5,dy=Math.random()*6-3;
  c.className='pcard';c.dataset.n=n;c._d=[j,dy];c.style.setProperty('--j',j.toFixed(2));c.style.setProperty('--dy',dy.toFixed(1)+'px');deckEl.appendChild(c);return c});
 shuffleAnim();
}
function layout(){
 const W=deckEl.clientWidth,N=cards.length,cw=W<520?60:84,ch=cw*1.4;
 deckEl.style.setProperty('--cw',cw+'px');deckEl.style.setProperty('--ch',ch+'px');
 let per=N>1?Math.min(N,Math.floor((W-cw)/(cw*.3))+1):1;const rows=Math.ceil(N/per);per=Math.ceil(N/rows);
 const step=per>1?Math.min(cw*.5,(W-cw)/(per-1)):0;
 cards.forEach((c,i)=>{const r=i/per|0,k=i%per,cnt=Math.min(per,N-r*per),x=(W-(cw+(cnt-1)*step))/2+k*step,y=36+r*ch*.7;
  c.style.setProperty('--x',x+'px');c.style.setProperty('--y',y+'px');c.style.zIndex=i;c._p=[x,y]});
 const H=36+(rows-1)*ch*.7+ch+20;deckEl.style.height=H+'px';return{W,H,cw,ch};
}
async function shuffleAnim(){
 busy=true;const{W,H,cw,ch}=layout(),N=cards.length,cx=(W-cw)/2,cy=(H-ch)/2,t=(x,y,r)=>`translate(${x}px,${y}px) rotate(${r}deg)`;
 const as=cards.map((c,i)=>{const s=i%2?1:-1,z=(i*7)%N,j=Math.random()*3-1.5,st0=t(cx+j,cy+i*.2,0);
  return c.animate([
   {transform:st0,zIndex:i,offset:0},{transform:st0,zIndex:i,offset:.1},
   {transform:t(cx+s*cw*.9,cy+s*8,s*9),zIndex:i,offset:.3},
   {transform:t(cx,cy+z*.2,0),zIndex:z,offset:.5},
   {transform:t(cx-s*cw*.9,cy-s*8,-s*9),zIndex:z,offset:.7},
   {transform:t(cx,cy+i*.2,0),zIndex:i,offset:.85},
   {transform:t(c._p[0],c._p[1]+c._d[1],c._d[0]),zIndex:i,offset:1}
  ],{duration:2400,delay:i*Math.min(20,300/N),easing:'ease-in-out',fill:'both'})});
 await Promise.all(as.map(a=>a.finished));as.forEach(a=>a.cancel());
 deckEl.classList.add('ready');busy=false;
}
deckEl.onclick=e=>{
 const c=e.target.closest('.pcard');if(!c||busy)return;
 if(c.classList.contains('up'))return reveal(c);
 cards.forEach(x=>x.classList.remove('up'));c.classList.add('up');
};
async function reveal(c){
 busy=true;const n=c.dataset.n,r=c.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;
 let tw=Math.min(vw*.72,300),th=tw*1.4;if(th>vh*.78){th=vh*.78;tw=th/1.4}
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML='<div class="fly"><div class="fin"><div class="fb"></div><div class="ff"><span></span></div></div></div><p>Davam etmək üçün toxunun</p>';
 const fly=ov.firstChild,fin=fly.firstChild,sp=ov.querySelector('span');sp.textContent=n;
 fly.style.cssText=`width:${tw}px;height:${th}px;left:${(vw-tw)/2}px;top:${(vh-th)/2}px`;
 document.body.appendChild(ov);fit(sp,tw*.2,tw*.2);
 requestAnimationFrame(()=>ov.classList.add('on'));c.style.visibility='hidden';
 fly.animate([{transform:`translate(${r.left+r.width/2-vw/2}px,${r.top+r.height/2-vh/2}px) scale(${r.width/tw})`},{transform:'none'}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
 await fin.animate([{transform:'rotateY(0)'},{transform:'rotateY(180deg)'}],{duration:900,easing:'ease-in-out',fill:'both'}).finished;
 ov.querySelector('p').style.opacity=1;
 await new Promise(res=>ov.onclick=res);
 ov.classList.remove('on');
 await fly.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.9)'}],{duration:350,fill:'both'}).finished;
 ov.remove();c.remove();cards=cards.filter(x=>x!==c);layout();
 $('#resEmpty').style.display='none';
 const li=document.createElement('li'),b=document.createElement('b');b.textContent=($('#resList').children.length+1)+'.';
 li.append(b,document.createTextNode(n));$('#resList').appendChild(li);
 li.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:400});
 busy=false;
 if(!cards.length){const bk=$('#backB');bk.style.display='flex';bk.animate([{opacity:0},{opacity:1}],500)}
}
addEventListener('resize',()=>{if(!busy&&cards.length&&$('#s-blind').classList.contains('active'))layout()});
</script>
