<style>

<script>
firebase.initializeApp({apiKey:"AIzaSyBmo0VWzQ-K4s_yvt89ZMLqKWJx4cJBLUk",authDomain:"piksel-sesli-breyn-rinq.firebaseapp.com",databaseURL:"https://piksel-sesli-breyn-rinq-default-rtdb.firebaseio.com",projectId:"piksel-sesli-breyn-rinq"});
const db=firebase.database(),$=e=>document.getElementById(e),esc=e=>String(e??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]),

document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{setMode(b.dataset.m);if(b.dataset.m==="host")start()});$("go").onclick=start;
async function start(){if(busy)return;busy=1;try{
if(mode==="host"){let c=null;for(let i=0;i<10;i++){const t=rnd(5);if(!(await db.ref("xr/"+t).once("value")).exists()){c=t;break}}

if(!d||!d.teams||!d.teams[tid])return toast("Komanda kodu yanlışdır");if(d.status!=="lobby")return toast("Oyun artıq başlayıb");
let full=0;const res=await db.ref("xr/"+r+"/players").transaction(cur=>{cur=cur||{};if(cur[pid])return cur;

function listen(){rf().on("value",s=>{const v=s.val();if(!v){alert("Otaq bağlandı");location.reload();return}

/* ---- oyun məntiqi ---- */
const plays=(t,p,ex)=>{const s=(T()[t]||{}).slots||{};return Object.entries(s).filter(([n,x])=>x===p&&Number(n)!==ex).length};

if(plays(t,p,n)>=cap)return "Bu oyunçu artıq maksimum dəfə oynayıb";

if(un>left)return "Hələ oynamayan oyunçular qalıb, onları göndər";return ""}

const A={
begin(){const ts=tids();if(ts.length<2||ts.some(t=>mem(t).length<2))return toast("Hər komandada ən azı 2 oyunçu olmalıdır (min 2 komanda)");rf().update({status:"topics",topic:0})},

topic(){const n=cur()+1;const u={status:"pick",topic:n,queue:null,wrong:null,ev:n+"-ci mövzu üçün oyunçuları seçin"};tids().forEach(t=>u["teams/"+t+"/slots/"+n]=null);rf().update(u)},
go(){if(tids().some(t=>!(T()[t].slots||{})[cur()]))return toast("Bütün komandalar oyunçu göndərməlidir");rf().update({status:"play",ev:"Oyun gedir"})},
rst(){rf().update({queue:null,wrong:null})},
rem(){const a=ans();if(a)rf("wrong/"+a).set(true)},

const qlist=()=>(R.queue||[]).filter(x=>P()[x]),ans=()=>qlist().find(x=>!(R.wrong||{})[x])||null;
function pts(sg){const a=ans();if(!a)return;const t=P()[a].team,d=sg*val(),u={};
u["teams/"+t+"/score"]=(T()[t].score||0)+d;u["players/"+a+"/pts"]=(P()[a].pts||0)+d;
const l=Object.values(P()[a].log||{});const run=(P()[a].pts||0)+d;
rf("players/"+a+"/log").push(run).then(()=>{});
if(sg>0){rf().update(u).then(()=>nextT(P()[a].name+" +"+d));}
else{u["wrong/"+a]=true;rf().update(u)}}

const f=R.status==="play"?tids().map(t=>(T()[t].slots||{})[cur()]):[];const onF=x=>f.includes(x);
if(isH())return R.status!=="play"||onF(id)||true&&onF(id);

/* ---- ekran ---- */

function render(){const me=P()[pid]||{},o=me.team,ts=tids(),l=R.status;if(!isH()&&me.cap)role="captain";
$("lobby").hidden=true;$("game").hidden=false;

const st={lobby:"Komandaların qoşulması gözlənilir...",topics:"Aparıcı mövzuları elan edəcək",announced:cur()?"Növbəti mövzunu aparıcı elan edir":"Mövzular elan olunur",pick:"Kapitanlar oyunçu seçir",play:"Oyun gedir",done:"Bəlli raund bitdi"}[l];

if(l==="announced")hp+=b("topic",(cur()+1)+"-Cİ MÖVZU OYNANSIN");
if(l==="pick")hp+=b("go","OYUN BAŞLASIN",ts.some(t=>!(T()[t].slots||{})[cur()]));
if(l==="play")hp+=b("plus","+ "+val())+b("minus","− "+val())+b("rem","QALAN VAXT RƏQİBİN")+b("none","DOĞRU CAVAB YOXDUR")+b("rst","DÜYMƏLƏRİ SIFIRLA");
hp+="</div>"}

document.addEventListener("click",async e=>{const c=e.target.closest("[data-copy]");if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast("Kopyalandı")}catch(x){}return}

/* düymə: klik və Space */

/* ---- səs (WebRTC) ---- */

const iceReady=fetch("https://piksel-nhn.pikseliok.workers.dev/turn").then(r=>r.json()).then(j=>{if(j.iceServers)ICE=ICE.concat(j.iceServers)}).catch(()=>{});
const pcs={},auds={},pend=[];
function applyMute(){for(const id in auds)auds[id].muted=!hear(id)}
const sg=(to,d)=>db.ref("sig/"+room+"/"+to).push({from:pid,d:JSON.stringify(d)});
function mkpc(peer){const pc=new RTCPeerConnection({iceServers:ICE});pc._q=[];stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.onicecandidate=e=>{if(e.candidate)sg(peer,{ice:e.candidate})};
pc.ontrack=e=>{if(auds[peer])auds[peer].remove();const au=document.createElement("audio");au.srcObject=e.streams[0];au.autoplay=true;au.playsInline=true;au.muted=true;document.body.appendChild(au);auds[peer]=au;au.play().catch(()=>{});applyMute()};
pcs[peer]=pc;return pc}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(auds[id]){auds[id].remove();delete auds[id]}}
async function reconcile(){if(!stream||!R)return;const ids=Object.keys(P()).concat(R.host).filter(x=>x&&x!==pid);
Object.keys(pcs).forEach(id=>{if(!ids.includes(id))drop(id)});
for(const id of ids)if(!pcs[id]&&pid<id){const pc=mkpc(id);try{await pc.setLocalDescription(await pc.createOffer());sg(id,{sdp:pc.localDescription})}catch(x){}}}
function sigIn(f,d){if(stream)onSig(f,d);else pend.push([f,d])}
async function onSig(from,d){if(!R)return;if(d.sdp&&d.sdp.type==="offer"&&pcs[from]&&pcs[from].remoteDescription)drop(from);
const pc=pcs[from]||mkpc(from);try{if(d.sdp){await pc.setRemoteDescription(d.sdp);for(const c of pc._q.splice(0))await pc.addIceCandidate(c);
if(d.sdp.type==="offer"){await pc.setLocalDescription(await pc.createAnswer());sg(from,{sdp:pc.localDescription})}}
else if(d.ice){if(pc.remoteDescription)await pc.addIceCandidate(d.ice);else pc._q.push(d.ice)}}catch(x){}}
async function getMic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
catch(e){toast("Mikrofon icazəsi lazımdır");window._mic=0;return}
await Promise.race([iceReady,new Promise(r=>setTimeout(r,3e3))]);await reconcile();pend.splice(0).forEach(([f,d])=>onSig(f,d))}
setInterval(()=>{if(!R)return;Object.keys(pcs).forEach(id=>{const s=pcs[id].connectionState;if(s==="failed"||s==="closed")drop(id)});applyMute();reconcile();
$("net").textContent="Mikrofon: "+(stream?"var":"yoxdur")+" | Səs əlaqələri: "+Object.values(pcs).filter(p=>p.connectionState==="connected").length});
document.addEventListener("pointerdown",()=>{for(const id in auds)auds[id].play().catch(()=>{})},{passive:true});
</script></body></html>
