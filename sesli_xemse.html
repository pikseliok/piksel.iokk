else if(ph==="xread")c=b("xtime","VAXT — 60 SANİYƏ");
else if(ph==="xtime")c=`<div class="tmr" id="tm"></div>`;
else if(ph==="xmark"){const ps=ts.filter(t=>T()[t].pa);c=ps.map(t=>{const tm=T()[t];return `<div class="tbox"><b>${esc(tm.name)}</b> • risk ${tm.risk}<div class="sm">${esc(tm.ans||"—")}</div><div class="two"><button class="hb${tm.ok===true?"":" o"}" data-a="mk" data-t="${t}" data-v="1">✓ +</button><button class="hb${tm.ok===false?"":" o"}" data-a="mk" data-t="${t}" data-v="0">✗ −</button></div></div>`}).join("")+b("xopen","NƏTİCƏLƏRİ AÇIQLA",!ps.every(t=>typeof T()[t].ok==="boolean"))}

if(ph==="pick"&&cap){c=`<div class="tbox">${nI().map(i=>{const s=ok(t0,i);return `<div class="slot" data-s="${i}"><span>${i+1}-ci yer: <b>${s?esc(P()[s].name):"boş"}</b></span>${s?`<button data-clr="${i}">✕</button>`:""}</div>`}).join("")}<div class="chips">${mem(t0).map(m=>`<div class="chip${sel===m.id?" on":""}" draggable="true" data-m="${m.id}">${esc(m.name)} (${(R.cnt||{})[m.id]||0})</div>`).join("")}</div></div><div class="sm">Oyunçunu seç və yerə toxun, ya da sürüşdür</div>`}

c=x}

/* səs (WebRTC): komanda daxili + aparıcı; qaydalar hear() ilə */
let ICE=[{urls:"stun:stun.l.google.com:19302"}],stream=null,ctx=null;const pcs={},au={},pend=[];
fetch("https://piksel-nhn.pikseliok.workers.dev/turn").then(r=>r.json()).then(j=>{if(j.iceServers)ICE=ICE.concat(j.iceServers)}).catch(()=>{});
const mx=()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});if(ctx.state==="suspended")ctx.resume();return ctx};
const want=id=>id!==pid&&!!R&&(role==="host"?!!P()[id]:(id===R.host||(!!P()[id]&&P()[id].team===(P()[pid]||{}).team)));
function hear(id){if(id===pid)return false;const x=R.r===4||!["pick","play"].includes(R.ph);
if(role==="host")return x||sent(id);if(id===R.host)return true;if(sent(pid))return false;return !sent(id)&&!!P()[id]&&P()[id].team===P()[pid].team}
function applyG(){if(ctx&&R)for(const id in au)au[id].g.gain.setTargetAtTime(hear(id)?2*vol:0,ctx.currentTime,.02)}
const sg=(to,d)=>db.ref("xsig/"+room+"/"+to).push({from:pid,d:JSON.stringify(d)});
function mkpc(p){const pc=new RTCPeerConnection({iceServers:ICE});pc._q=[];stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.onicecandidate=e=>{if(e.candidate)sg(p,{ice:e.candidate})};
pc.ontrack=e=>{const st=e.streams[0];try{e.receiver.jitterBufferTarget=20}catch(x){}if(au[p])au[p].a.remove();const a=document.createElement("audio");a.srcObject=st;a.muted=true;a.autoplay=true;document.body.appendChild(a);a.play().catch(()=>{});
const c=mx(),s=c.createMediaStreamSource(st),g=c.createGain();g.gain.value=0;s.connect(g);g.connect(c.destination);au[p]={a,g};applyG()};
pcs[p]=pc;return pc}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(au[id]){au[id].a.remove();delete au[id]}}
async function reconcile(){if(!stream||!R)return;const ids=Object.keys(P()).concat(R.host).filter(x=>x&&x!==pid);
Object.keys(pcs).forEach(id=>{if(!(ids.includes(id)&&want(id)))drop(id)});

async function onSig(from,d){if(!R||!want(from))return;if(d.sdp&&d.sdp.type==="offer"&&pcs[from]&&pcs[from].remoteDescription)drop(from);

async function getMic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}})}catch(e){micA=0;alert("Mikrofon icazəsi lazımdır.");return}
stream.getAudioTracks().forEach(t=>t.enabled=!muted);await reconcile();pend.splice(0).forEach(([f,d])=>onSig(f,d))}
setInterval(()=>{if(!R)return;Object.keys(pcs).forEach(id=>{const s=pcs[id].connectionState;if(s==="failed"||s==="closed")drop(id)});reconcile();applyG()},3000);
