function fx(){const q=qs().length,ph=R.ph,nz=R.nz||0;
if(L.i){if(ph==="play"&&L.q===0&&q>0&&!sk("buzz"))SND.buzz();if(nz>L.nz)SND.nn();if(ph==="end"&&L.ph!=="end")SND.win();if(ph==="xtime"&&L.ph!=="xtime")SND.beep()}
L={i:1,q,ph,nz}}

setInterval(()=>{if(!R)return;const e=$("tm");if(e&&R.ph==="xtime")e.textContent=Math.max(0,(R.te-now())/1e3).toFixed(1);
if(role==="host"){if(R.ph==="xtime"&&now()>=R.te+800)H(rm=>{if(rm.ph==="xtime")rm.ph="xmark"});if(Date.now()-rcT>1000){rcT=Date.now();recon()}}},100);

fetch("https://piksel-nhn.pikseliok.workers.dev/turn").then(r=>r.json()).then(j=>{if(j.iceServers&&j.iceServers.length){ICE=ICE.concat(j.iceServers);relayOk=true}}).catch(()=>{});
const mx=()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});if(ctx.state==="suspended")ctx.resume();return ctx};
const want=id=>id!==pid&&!!R&&(role==="host"?!!P()[id]:(id===R.host||!!P()[id]));
function hear(id){if(id===pid)return false;
if(role==="host")return playing()?sent(id):(TK()&&id===R.talk);
if(id===R.host||(TK()&&id===R.talk))return true;
const a=P()[pid],b2=P()[id];if(!a||!b2)return false;
if(playing()){if(sent(id))return id===ans();if(sent(pid))return false}
return a.team===b2.team}
const isMain=id=>role==="host"||id===R.host||(TK()&&id===R.talk)||(playing()&&sent(id));
function applyG(){if(ctx&&R)for(const id in au)au[id].g.gain.setTargetAtTime(hear(id)?2*(isMain(id)?mvol:tvol):0,ctx.currentTime,.02)}
const sg=(to,d)=>db.ref("xsig/"+room+"/"+to).push({from:pid,d:JSON.stringify(d)});
function mkpc(p){const pc=new RTCPeerConnection({iceServers:ICE});pc._q=[];stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.onicecandidate=e=>{if(e.candidate)sg(p,{ice:e.candidate})};pc.onconnectionstatechange=showNet;
pc.ontrack=e=>{const st=e.streams[0];try{e.receiver.jitterBufferTarget=20}catch(x){}if(au[p]){try{au[p].s.disconnect();au[p].g.disconnect()}catch(x){}au[p].a.remove()}
const a=document.createElement("audio");a.srcObject=st;a.muted=true;a.autoplay=true;a.playsInline=true;document.body.appendChild(a);a.play().catch(()=>{});
const c=mx(),s=c.createMediaStreamSource(st),g=c.createGain();g.gain.value=0;s.connect(g);g.connect(c.destination);au[p]={a,g,s};applyG()};
pcs[p]=pc;return pc}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(au[id]){try{au[id].s.disconnect();au[id].g.disconnect()}catch(x){}au[id].a.srcObject=null;au[id].a.remove();delete au[id]}}
async function reconcile(){if(!stream||!R)return;const ids=Object.keys(P()).concat(R.host).filter(x=>x&&x!==pid);
Object.keys(pcs).forEach(id=>{if(!(ids.includes(id)&&want(id)))drop(id)});
for(const id of ids)if(!pcs[id]&&want(id)&&pid<id){const pc=mkpc(id);try{await pc.setLocalDescription(await pc.createOffer());sg(id,{sdp:pc.localDescription})}catch(x){}}}
function sigIn(f,d){if(stream)onSig(f,d);else pend.push([f,d])}
async function onSig(from,d){if(!R||!(want(from)||from===R.host))return;if(d.sdp&&d.sdp.type==="offer"&&pcs[from]&&pcs[from].remoteDescription)drop(from);
const pc=pcs[from]||mkpc(from);try{if(d.sdp){await pc.setRemoteDescription(d.sdp);for(const c of pc._q.splice(0))await pc.addIceCandidate(c);if(d.sdp.type==="offer"){await pc.setLocalDescription(await pc.createAnswer());sg(from,{sdp:pc.localDescription})}}else if(d.ice){if(pc.remoteDescription)await pc.addIceCandidate(d.ice);else pc._q.push(d.ice)}}catch(x){}}

setInterval(()=>{if(!R)return;Object.keys(pcs).forEach(id=>{const s=pcs[id].connectionState;if(s==="failed"||s==="closed")drop(id);else if(s==="disconnected"){if(pcs[id]._dt){if(Date.now()-pcs[id]._dt>5e3)drop(id)}else pcs[id]._dt=Date.now()}else pcs[id]._dt=0});reconcile();applyG()},3000);

async function wake(){if(!room)return;try{db.goOnline()}catch(e){}try{mx()}catch(e){}for(const k in au)au[k].a.play().catch(()=>{});keepAwake();
if(stream){const tr=stream.getAudioTracks()[0];if(!tr||tr.readyState==="ended"){try{const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}}),nt=ns.getAudioTracks()[0];nt.enabled=!muted;Object.values(pcs).forEach(pc=>pc.getSenders().forEach(s=>{s.replaceTrack(nt).catch(()=>{})}));stream=ns}catch(e){}}}
