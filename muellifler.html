<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9DC3FF">
  <title>πksel - Müəlliflər</title>

  <link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
  <link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700;800&display=swap" rel="stylesheet">

  <style>
/* Ölçülər: Komp+Planşet (701px+) / Telefon (≤700px) / Dar telefon (≤420px) */
body{
  --page:#9DC3FF; --c1:#001E6F; --c2:#002E92; --fg:#9DC3FF; --accent:#001E6F;
  --glow:rgba(0,8,45,.30); --soft:rgba(255,255,255,.35); --mk:rgba(255,255,255,.3);
  --grad:linear-gradient(135deg,var(--c1) 0%,var(--c2) 50%,var(--c1) 100%);
  --tx:env(safe-area-inset-top,0px); --bx:env(safe-area-inset-bottom,0px);
}
body.dark{
  --page:#00072C; --c1:#9DC3FF; --c2:#6FA5FC; --fg:#00072C; --accent:#9DC3FF;
  --glow:rgba(255,255,255,.40); --soft:rgba(0,0,0,.2); --mk:rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
a,button,.author-card{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{min-height:100vh;background:var(--page);color:var(--fg);font-family:"Poppins",sans-serif;overflow-x:hidden;max-width:100%;transition:background .65s ease;-webkit-font-smoothing:antialiased;padding-top:var(--tx);padding-bottom:var(--bx)}
button,input,a{font:inherit}
a{color:inherit;text-decoration:none}
.page{width:min(95vw,820px);margin:0 auto;padding:12px 0 32px}

/* ---------- Giriş animasiyası: əvvəl çərçivə, sonra içindəkilər ---------- */
.frame{--d:calc(var(--i) * .1s);animation:frameIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:var(--d)}
.rise{animation:riseIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--d) + .55s)}
/* ---------- Siyahı dəyişəndə (axtarış / filtr) kartların animasiyası ---------- */
.enter{animation:frameIn .5s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--e,0) * .05s)}
.enter-in{animation:riseIn .5s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--e,0) * .05s + .22s)}
@keyframes frameIn{from{opacity:0;transform:translateY(28px)}}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}}

/* ---------- Naviqasiya ---------- */
.top-nav{height:50px;border-radius:40px;padding:0 52px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--grad);box-shadow:0 10px 28px rgba(0,20,100,.08)}
.nav-links{display:flex;align-items:center;gap:40px;height:100%}
.nav-link{position:relative;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .25s ease}
.nav-link:hover{transform:translateY(-1px)}
.theme-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--accent);background:var(--page);transition:transform .3s ease,background .65s ease,color .65s ease}
.theme-toggle:hover{transform:translateY(-50%) scale(1.08)}
.theme-toggle:active{transform:translateY(-50%) scale(.95)}
.theme-icon{width:24px;height:24px;display:block}
.ray{stroke:currentColor;stroke-width:2;stroke-linecap:round}
body.dark .ray{opacity:0}
.core{transform:scale(.68);transform-origin:16px 16px}
.bite{transform:translate(14px,-14px)}
body.dark .core{transform:scale(1)}
body.dark .bite{transform:translate(0,0)}
body.ready .core,body.ready .bite{transition:transform .6s cubic-bezier(.4,0,.2,1)}

/* ---------- Axtarış ---------- */
.search-wrap{margin-top:14px;height:52px;border-radius:40px;border:2px solid var(--accent);background:var(--soft);display:flex;align-items:center;padding:0 18px;gap:10px;transition:border-color .65s ease,background .65s ease}
.search-wrap>svg{width:22px;height:22px;flex:0 0 22px;color:var(--accent)}
#searchInput{flex:1 1 auto;min-width:0;width:0;border:0;background:transparent;outline:0;font-family:"Poppins",sans-serif;font-size:17px;font-weight:500;color:var(--accent)}
#searchInput::placeholder{color:var(--accent);opacity:.6}

.section-title{text-align:center;color:var(--accent);font-size:24px;line-height:1;font-weight:700;letter-spacing:-.7px;margin:24px 0 14px}

/* ---------- Müəlliflər: 2 müstəqil sütun ---------- */
.cards-list{display:flex;align-items:flex-start;gap:14px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}

.author-card{position:relative;border-radius:28px;background:var(--grad);color:var(--fg);padding:14px 20px;display:flex;align-items:center;gap:14px;height:104px;overflow:hidden;box-shadow:0 10px 25px rgba(0,20,110,.07);cursor:pointer;transition:transform .35s cubic-bezier(.18,.8,.22,1),box-shadow .35s ease}
.author-card>*{position:relative;z-index:1}
.author-card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:
    radial-gradient(ellipse 170px 120px at var(--mx,50%) var(--my,50%),var(--glow),transparent 72%),
    radial-gradient(ellipse 100px 150px at calc(var(--mx,50%) + 16px) calc(var(--my,50%) - 12px),var(--glow),transparent 72%)}
@media (hover:hover){
  .author-card:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 14px 30px rgba(0,20,110,.14);z-index:5}
  .author-card:hover::before{opacity:1}
}
.author-icon{width:64px;height:64px;flex:0 0 64px;border-radius:16px;overflow:hidden}
.author-icon svg{width:100%;height:100%;display:block}
.author-right{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.author-name{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.12;overflow:hidden;white-space:nowrap;display:block}
.author-count{font-size:15px;font-weight:500;line-height:1.3;opacity:.92}

/* ---------- Paylaş düyməsi ---------- */
.share-btn{flex:0 0 auto;margin-left:auto;width:36px;height:36px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:var(--page);color:var(--accent);transition:transform .25s ease,background .3s ease,color .65s ease}

/* ---------- Paketlər ---------- */
.packages-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.author-wrapper.open .packages-panel{grid-template-rows:1fr}
.packages-inner{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:0 2px}
.packages-inner>.package-item:first-child{margin-top:8px}
.package-item{min-height:46px;padding:9px 16px;border-radius:17px;display:flex;align-items:center;min-width:0;background:var(--grad);color:var(--fg);border:1px solid rgba(255,255,255,.12);box-shadow:0 5px 15px rgba(0,20,110,.08);font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;
  opacity:0;transform:translateY(-16px);transition:opacity .35s ease,transform .45s cubic-bezier(.18,.8,.22,1)}
.author-wrapper.open .package-item{opacity:1;transform:none;transition-delay:calc(var(--k) * .06s + .08s)}
.author-wrapper.open .package-item:active{transform:scale(.96);transition-delay:0s;transition-duration:.3s}

mark.hl{background:var(--mk);color:inherit;font-weight:800;border:2px solid currentColor;border-radius:6px;padding:0 4px;display:inline-block;line-height:1.1}
.no-results{width:100%;text-align:center;color:var(--accent);font-size:15px;font-weight:500;padding:25px 10px 50px}

/* ---------- Səhifələmə ---------- */
.pager{margin:22px 0 6px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.pg-btn{width:42px;height:42px;border:0;border-radius:14px;background:var(--grad);color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:transform .25s ease,box-shadow .3s ease}
.pg-btn.cur{box-shadow:0 0 0 2px var(--page),0 0 0 4px var(--accent);cursor:default}
.pg-btn:active{transform:scale(.94)}
.pg-arrow{background:transparent;color:var(--accent);width:36px;border-radius:50%;transition:transform .25s ease,color .65s ease}
.pg-arrow svg{width:24px;height:24px}
@media (hover:hover){.pg-btn:not(.cur):hover{transform:translateY(-2px)}}

/* ---------- Paylaşma pəncərəsi ---------- */
.sheet-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,7,44,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{width:min(100%,520px);background:var(--grad);color:var(--fg);border-radius:28px 28px 0 0;padding:20px 18px calc(18px + var(--bx));transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.8,.25,1)}
.sheet-overlay.open .sheet{transform:translateY(0)}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.4px;text-align:center;margin-bottom:8px;color:var(--page)}
.sheet-opt{width:100%;height:52px;margin-top:8px;padding:0 16px;border:0;border-radius:16px;background:var(--page);color:var(--accent);display:flex;align-items:center;gap:14px;font-size:16px;font-weight:500;cursor:pointer;text-align:left;transition:transform .2s ease}
.sheet-opt:active{transform:scale(.97)}
.sheet-opt svg{width:22px;height:22px;flex:0 0 22px}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--bx));z-index:120;max-width:min(92vw,420px);padding:12px 18px;border-radius:20px;background:var(--grad);color:var(--fg);font-size:14px;font-weight:500;text-align:center;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Footer ---------- */
footer{background:var(--grad);color:var(--fg);min-height:110px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.footer-line{font-size:15px;line-height:1.4;font-weight:500}
.footer-link{transition:opacity .25s ease,transform .25s ease}
.footer-link:hover{opacity:.72;transform:translateY(-1px)}

.author-card:focus-visible,.package-item:focus-visible,.nav-link:focus-visible,.theme-toggle:focus-visible,.footer-link:focus-visible,.share-btn:focus-visible,.sheet-opt:focus-visible,.pg-btn:focus-visible{outline:3px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- KOMP / PLANŞET ≥701px ---------- */
@media (min-width:701px){
  .share-btn svg{width:18px;height:18px}
}

/* ---------- TELEFON ≤700px (tək sütun) ---------- */
@media (max-width:700px){
  .page{width:calc(100vw - 44px);padding:11px 0 26px}
  .top-nav{height:46px;padding:0 46px}
  .nav-links{gap:28px}
  .nav-link{font-size:13px}
  .theme-toggle{width:34px;height:34px;right:6px}
  .theme-icon{width:21px;height:21px}
  .search-wrap{margin-top:12px;height:46px;padding:0 14px}
  #searchInput{font-size:16px}
  .section-title{font-size:17px;margin:20px 0 12px}
  .cards-list,.col{gap:10px}
  .author-card{height:88px;padding:12px 16px;gap:12px;border-radius:22px}
  .author-icon{width:48px;height:48px;flex-basis:48px;border-radius:13px}
  .author-name{font-size:17px;letter-spacing:-.5px}
  .author-count{font-size:9px}
  .share-btn{width:32px;height:32px}
  .share-btn svg{width:14px;height:14px;display:block}
  .package-item{min-height:42px;padding:8px 14px;border-radius:14px;font-size:10px}
  .packages-inner{gap:7px}
  .pager{gap:8px;margin-top:18px}
  .pg-btn{width:36px;height:36px;border-radius:12px;font-size:14px}
  .pg-arrow{width:32px}
  footer{min-height:96px;padding:16px 12px;gap:5px}
  .footer-line{font-size:13px}
}

/* ---------- DAR TELEFON ≤420px ---------- */
@media (max-width:420px){
  .page{width:calc(100vw - 36px)}
  .top-nav{height:42px;padding:0 42px}
  .nav-links{gap:22px}
  .nav-link{font-size:11px}
  .theme-toggle{width:32px;height:32px;right:5px}
  .theme-icon{width:20px;height:20px}
  #searchInput{font-size:15px}
  .section-title{font-size:15px}
  .author-card{height:82px;padding:10px 14px;gap:10px}
  .author-icon{width:44px;height:44px;flex-basis:44px}
  .author-name{font-size:15px}
  .author-count{font-size:8px}
  .share-btn{width:30px;height:30px}
  .package-item{min-height:40px;padding:7px 12px;font-size:9px}
  footer{min-height:88px}
  .footer-line{font-size:11px}
}
  </style>
</head>

<script>
/* =========================
   THEME
========================= */
/* Sağ klik və klaviatura qısayollarını bloklama */
document.addEventListener("contextmenu", function(e) {
  e.preventDefault();
  e.stopPropagation();
}, true);

document.addEventListener("keydown", function(e) {
  const key = e.key.toLowerCase();

  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && (key === "i" || key === "j")) ||
    (e.ctrlKey && key === "u") ||
    (e.ctrlKey && key === "s")
  ) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);
const themeToggle=document.getElementById("themeToggle");
const rays=[...document.querySelectorAll(".ray")];

function animateRays(dark){
  rays.forEach(r=>{
    r.getAnimations().forEach(a=>a.cancel());
    const kf=dark
      ?[{transform:"translateY(0)",opacity:1},{transform:"translateY(-14px)",opacity:0}]
      :[{transform:"translateY(11px)",opacity:0},{transform:"translateY(0)",opacity:1}];
    const a=r.animate(kf,{duration:dark?520:620,delay:dark?0:180,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"});
    a.onfinish=()=>a.cancel();
  });
}
function setTheme(dark,animate){
  document.body.classList.toggle("dark",dark);
  try{localStorage.setItem("piksel-theme",dark?"dark":"light")}catch(e){}
  themeToggle.setAttribute("aria-label",dark?"Gündüz rejiminə keç":"Gecə rejiminə keç");
  if(animate) animateRays(dark);
}
function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem("piksel-theme")}catch(e){}
  if(saved==="dark") return setTheme(true,false);
  if(saved==="light") return setTheme(false,false);
  setTheme(!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),false);
}
themeToggle.addEventListener("click",()=>setTheme(!document.body.classList.contains("dark"),true));
initTheme();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));

========================= */
let query="";
let page=1;
let firstRender=true;
let lastKey="";
const openSet=new Set();

const searchInput=document.getElementById("searchInput");
const cardsList=document.getElementById("cardsList");
const pager=document.getElementById("pager");
const wide=matchMedia("(min-width:701px)");   /* komp/planşet: 2 sütun, 20 müəllif/səhifə; telefon: 1 sütun, 10 müəllif/səhifə */
const pageSize=()=>wide.matches?20:10;

searchInput.addEventListener("input",()=>{query=normalize(searchInput.value.trim());page=1;render()});
wide.addEventListener("change",()=>render());

function normalize(t){return t.toLocaleLowerCase("az-AZ")}
function highlight(text,q){
  if(!q) return text;
  const i=normalize(text).indexOf(q);
  if(i===-1) return text;
  return text.slice(0,i)+"<mark class='hl'>"+text.slice(i,i+q.length)+"</mark>"+text.slice(i+q.length);
}
/* Həmişə ən çox paketi olan yuxarıda. Sort stabildir: bərabər olanda massivdə əvvəl yazılan yuxarıda qalır. */
function authorCompare(a,b){return b.packages.length-a.packages.length}

/* Maus işığı */
cardsList.addEventListener("pointermove",e=>{
  const card=e.target.closest(".author-card");
  if(!card) return;
  const r=card.getBoundingClientRect();
  card.style.setProperty("--mx",(e.clientX-r.left)+"px");
  card.style.setProperty("--my",(e.clientY-r.top)+"px");
});

/* =========================
   RENDER
========================= */
function render(noAnim){
  const all=authors.filter(a=>!query||normalize(a.name).includes(query)).sort(authorCompare);
  const size=pageSize();
  const pages=Math.max(1,Math.ceil(all.length/size));
  if(page>pages) page=pages;
  const list=all.slice((page-1)*size,page*size);

  /* axtarış / sütun sayı dəyişibsə kartlar animasiya ilə gəlir; səhifə dəyişəndə yox */
  const key=list.map(a=>a.name).join("|")+"#"+(wide.matches?2:1);
  const changed=!noAnim&&key!==lastKey;
  lastKey=key;
  cardsList.innerHTML="";

  if(!list.length){
    cardsList.innerHTML='<div class="no-results">Bu ada uyğun müəllif tapılmadı.</div>';
    pager.innerHTML="";
    return;
  }

  const colCount=wide.matches?2:1;
  const cols=Array.from({length:colCount},()=>{
    const c=document.createElement("div");
    c.className="col";
    cardsList.appendChild(c);
    return c;
  });

  const first=firstRender;   /* ilk yüklənmə: tam giriş animasiyası */
  firstRender=false;

  list.forEach((author,idx)=>{
    const col=idx%colCount, row=Math.floor(idx/colCount);

    const wrapper=document.createElement("div");
    wrapper.className="author-wrapper"+(openSet.has(author.name)?" open":"");

    const card=document.createElement("div");
    card.className="author-card"+(first?" frame":(changed?" enter":""));
    if(first) card.style.setProperty("--i",3+Math.min(row,10)+col*0.5);
    else if(changed) card.style.setProperty("--e",Math.min(row,10)+col*0.5);
    card.setAttribute("role","button");
    card.tabIndex=0;
    card.setAttribute("aria-expanded",openSet.has(author.name));
    const r=first?" rise":(changed?" enter-in":"");
    card.innerHTML=`
      <span class="author-icon${r}">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="8.5" r="5.5" fill="currentColor"/><path d="M5 26a11 11 0 0 1 22 0 2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z" fill="currentColor"/></svg>
      </span>
      <div class="author-right${r}">
        <div class="author-name">${highlight(author.name,query)}</div>
        <div class="author-count">${author.packages.length} paket</div>
      </div>
      <button class="share-btn${r}" type="button" data-i="${authors.indexOf(author)}" aria-label="Paylaş">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
      </button>`;

    const panel=document.createElement("div");
    panel.className="packages-panel";
    const inner=document.createElement("div");
    inner.className="packages-inner";
    author.packages.forEach((pkg,k)=>{
      const link=document.createElement("a");
      link.className="package-item";
      link.style.setProperty("--k",k);
      link.href=pkg.link;
      link.target="_blank";
      link.rel="noopener noreferrer";
      link.textContent=pkg.title;
      inner.appendChild(link);
    });
    panel.appendChild(inner);

    const toggle=()=>{
      const open=wrapper.classList.toggle("open");
      card.setAttribute("aria-expanded",open);
      if(open) openSet.add(author.name); else openSet.delete(author.name);
    };
    card.addEventListener("click",e=>{
      /* Paylaş düyməsi: paket siyahısı açılmasın, paylaşma pəncərəsi açılsın */
      const sb=e.target.closest(".share-btn");
      if(sb){ e.stopPropagation(); openShare(+sb.dataset.i); return; }
      toggle();
    });
    card.addEventListener("keydown",e=>{
      if(e.target!==card) return;
      if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
    });

    wrapper.appendChild(card);
    wrapper.appendChild(panel);
    cols[col].appendChild(wrapper);
    const nameEl=card.querySelector(".author-name");
    requestAnimationFrame(()=>{
      let size=parseFloat(getComputedStyle(nameEl).fontSize);
      while(nameEl.scrollWidth>nameEl.clientWidth&&size>8){
        size=Math.max(8,size-1);
        nameEl.style.fontSize=size+"px";
      }
    });
  });

  renderPager(pages,first,changed);
}

========================= */
const ARW=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

function renderPager(pages,first,changed){
  pager.className="pager"+(first?" frame":(changed?" enter":""));
  pager.style.setProperty("--i",6);
  pager.style.setProperty("--e",3);
  if(pages<2){ pager.innerHTML=""; return; }
  let h="";
  if(page>1) h+=`<button class="pg-btn pg-arrow" type="button" data-p="${page-1}" aria-label="Əvvəlki səhifə">${ARW("M15 5l-7 7 7 7")}</button>`;
  for(let p=1;p<=pages;p++){
    h+=`<button class="pg-btn${p===page?" cur":""}" type="button" data-p="${p}"${p===page?' aria-current="page"':""}>${p}</button>`;
  }
  if(page<pages) h+=`<button class="pg-btn pg-arrow" type="button" data-p="${page+1}" aria-label="Növbəti səhifə">${ARW("M9 5l7 7-7 7")}</button>`;
  pager.innerHTML=h;
}

pager.addEventListener("click",e=>{
  const b=e.target.closest(".pg-btn");
  if(!b||+b.dataset.p===page) return;
  page=+b.dataset.p;
  cardsList.style.minHeight=cardsList.offsetHeight+"px";   /* hündürlük azalsa səhifə sıçramasın */
  render(true);                                            /* kartlar animasiyasız */
  scrollTopSmooth(500,()=>{cardsList.style.minHeight=""}); /* istifadəçi 0,5 san ərzində ən başa sürüşür */
});

function scrollTopSmooth(ms,done){
  const root=document.documentElement,from=window.scrollY;
  if(!from||matchMedia("(prefers-reduced-motion:reduce)").matches){
    window.scrollTo(0,0); if(done) done(); return;
  }
  root.style.scrollBehavior="auto";
  const t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/ms);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    window.scrollTo(0,from*(1-e));
    if(k<1) requestAnimationFrame(step);
    else{ root.style.scrollBehavior=""; if(done) done(); }
  })(t0);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawAuthorIcon(ctx,x,y,size,color){
  const s=size/32;
  ctx.save();ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x+16*s,y+8.5*s,5.5*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+5*s,y+26*s);
  ctx.bezierCurveTo(x+5*s,y+20*s,x+10*s,y+15*s,x+16*s,y+15*s);
  ctx.bezierCurveTo(x+22*s,y+15*s,x+27*s,y+20*s,x+27*s,y+26*s);
  ctx.quadraticCurveTo(x+27*s,y+28*s,x+25*s,y+28*s);
  ctx.lineTo(x+7*s,y+28*s);ctx.quadraticCurveTo(x+5*s,y+28*s,x+5*s,y+26*s);
  ctx.closePath();ctx.fill();ctx.restore();
}

/* ---------- Afişa (story) çəkilişi ---------- */
async function makeStory(a){
  /* Soyad Ad formatı: ilk söz soyad, qalanı ad */
  const parts=a.name.trim().split(/\s+/);
  let soyad="",ad=a.name.trim();
  if(parts.length>1){ soyad=parts[0]; ad=parts.slice(1).join(" "); }
  /* yuxarıda soyad, aşağıda ad (böyük hərflə) */
  const topTxt=soyad||ad, botTxt=soyad?ad.toLocaleUpperCase("az"):"";

  try{
    await Promise.all([
      document.fonts.load('500 30px Poppins'),
      document.fonts.load('700 30px Poppins'),
      document.fonts.load('800 30px Poppins')
    ]);
  }catch(e){}

  const W=1080,H=1920;
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const x=c.getContext("2d");
  const F=(w,s)=>w+" "+s+"px Poppins, sans-serif";

  /* ---------- Fon: lacivert rəng keçidli ləkələr ---------- */
  x.fillStyle="#00072C";x.fillRect(0,0,W,H);
  function bgBlob(cx,cy,rx,ry,col,al){
    x.save();
    x.translate(cx,cy);x.scale(rx,ry);
    const g=x.createRadialGradient(0,0,0,0,0,1);
    g.addColorStop(0,"rgba("+col+","+al+")");
    g.addColorStop(1,"rgba("+col+",0)");
    x.fillStyle=g;
    x.beginPath();x.arc(0,0,1,0,Math.PI*2);x.fill();
    x.restore();
  }
  bgBlob(260,120,620,520,"10,80,220",.65);
  bgBlob(640,-40,700,420,"20,110,255",.55);
  bgBlob(1080,880,420,620,"10,60,190",.55);
  bgBlob(-40,720,380,520,"6,40,140",.6);
  bgBlob(120,1500,600,520,"10,55,170",.55);
  bgBlob(980,1760,560,520,"8,50,160",.55);
  bgBlob(540,1000,700,300,"0,4,24",.55);
  bgBlob(900,300,300,260,"0,140,255",.18);

  function fitText(text,start,weight,maxW){
    let size=start;
    x.font=F(weight,size);
    while(x.measureText(text).width>maxW&&size>8){
      size=Math.max(8,size-2);
      x.font=F(weight,size);
    }
    const measured=x.measureText(text).width;
    if(measured>maxW){ size*=maxW/measured; }
    return {size,lines:[text]};
  }

  /* ---------- Yuxarı mətn ---------- */
  const TW=900;
  const A=fitText(topTxt,176,"800",TW);
  const B=botTxt?fitText(botTxt,160,"800",TW):null;
  const hA=A.lines.length*A.size*1.08;
  const hB=B?B.lines.length*B.size*1.08+4:0;
  const pillH=88,logoH=110;
  const total=hA+hB+34+pillH+30+logoH;
  let y=110+(880-total)/2;

  x.textAlign="center";x.textBaseline="middle";

  /* soyad */
  x.font=F("800",A.size);
  x.fillStyle="#9DC3FF";
  A.lines.forEach((ln,i)=>{
    x.fillText(ln,W/2,y+A.size*1.08*(i+.5));
  });
  y+=hA;

  /* ad */
  if(B){
    x.font=F("800",B.size);
    x.fillStyle="#ADCDFF";
    B.lines.forEach((ln,i)=>{
      x.fillText(ln,W/2,y+2+B.size*1.08*(i+.5));
    });
    y+=hB;
  }
  y+=34;

  /* SUAL MÜƏLLİFİ çərçivəsi */
  const label="SUAL MÜƏLLİFİ";
  x.font=F("800",58);
  try{x.letterSpacing="5px";}catch(e){}
  const pw=Math.min(920,x.measureText(label).width+110);
  roundRect(x,W/2-pw/2,y,pw,pillH,44);
  x.fillStyle="rgba(0,16,80,.65)";x.fill();
  x.lineWidth=4;x.strokeStyle="#2D7BFF";x.stroke();
  x.fillStyle="#fff";
  x.fillText(label,W/2+2,y+pillH/2+3);
  try{x.letterSpacing="0px";}catch(e){}
  y+=pillH+30;

  /* πksel-də */
  const ls=100;
  x.textAlign="left";
  x.font="italic 800 "+(ls*1.1)+"px Poppins, sans-serif";
  const w1=x.measureText("π").width;
  x.font=F("800",ls);
  const w2=x.measureText("ksel-də").width;
  const sx0=W/2-(w1+w2)/2,cy2=y+logoH/2;
  x.fillStyle="#9DC3FF";
  x.font="italic 800 "+(ls*1.1)+"px Poppins, sans-serif";
  x.fillText("π",sx0,cy2);
  x.font=F("800",ls);
  x.fillText("ksel-də",sx0+w1,cy2+4);

  /* ---------- Telefon ---------- */
  const PW=800,PH=1250,SX=50,SY=46,SW=700;
  x.save();
  x.translate(140,1040);
  x.rotate(0.04);

  x.save();
  x.shadowColor="rgba(0,110,255,.45)";x.shadowBlur=90;
  roundRect(x,0,0,PW,PH,124);
  x.fillStyle="#10162A";x.fill();
  x.restore();
  roundRect(x,0,0,PW,PH,124);
  const bg=x.createLinearGradient(0,0,PW,0);
  bg.addColorStop(0,"#1B2238");bg.addColorStop(.5,"#0E1426");bg.addColorStop(1,"#232B45");
  x.fillStyle=bg;x.fill();
  x.lineWidth=3;x.strokeStyle="#39425F";x.stroke();
  x.fillStyle="#1A2036";
  roundRect(x,-8,180,10,70,4);x.fill();
  roundRect(x,-8,300,10,120,4);x.fill();
  roundRect(x,-8,450,10,120,4);x.fill();
  roundRect(x,12,12,PW-24,PH-24,112);
  x.fillStyle="#000";x.fill();

  /* ekran */
  x.save();
  x.translate(SX,SY);
  roundRect(x,0,0,SW,PH-SY-10,78);
  x.clip();
  x.fillStyle="#9DC3FF";
  x.fillRect(0,0,SW,PH);

  const navG=(x0,y0,w0)=>{
    const g=x.createLinearGradient(x0,y0,x0+w0,y0+100);
    g.addColorStop(0,"#001E6F");g.addColorStop(.5,"#002E92");g.addColorStop(1,"#001E6F");
    return g;
  };
  const PAD=36;

  /* ön kamera */
  let ny=60;
  x.beginPath();x.arc(SW/2,30,14,0,Math.PI*2);x.fillStyle="#000";x.fill();

  /* naviqasiya */
  roundRect(x,PAD,ny,SW-2*PAD,92,46);
  x.fillStyle=navG(PAD,ny,SW-2*PAD);x.fill();
  x.fillStyle="#9DC3FF";
  x.font=F("500",25);x.textAlign="left";x.textBaseline="middle";
  const l1="Əsas Səhifə",l2="Bizimlə Əlaqə";
  const lw1=x.measureText(l1).width,lw2=x.measureText(l2).width;
  const gap=44,lt=lw1+gap+lw2;
  const lx=PAD+(SW-2*PAD-80)/2-lt/2;
  x.fillText(l1,lx,ny+46);
  x.fillText(l2,lx+lw1+gap,ny+46);
  const bx=SW-PAD-46-4,by=ny+46;
  x.beginPath();x.arc(bx,by,36,0,Math.PI*2);x.fillStyle="#9DC3FF";x.fill();
  x.strokeStyle="#001E6F";x.fillStyle="#001E6F";x.lineWidth=3;x.lineCap="round";
  x.beginPath();x.arc(bx,by,10,0,Math.PI*2);x.fill();
  for(let k=0;k<8;k++){
    const an=k*Math.PI/4;
    x.beginPath();
    x.moveTo(bx+Math.cos(an)*17,by+Math.sin(an)*17);
    x.lineTo(bx+Math.cos(an)*23,by+Math.sin(an)*23);
    x.stroke();
  }

  /* axtarış (müəllifin adı yazılıb) */
  const sy2=ny+92+28,sh=92;
  roundRect(x,PAD,sy2,SW-2*PAD,sh,46);
  x.fillStyle="rgba(255,255,255,.35)";x.fill();
  x.lineWidth=4;x.strokeStyle="#001E6F";x.stroke();
  x.lineWidth=3.5;x.lineCap="round";
  x.beginPath();x.arc(PAD+48,sy2+sh/2-3,13,0,Math.PI*2);x.stroke();
  x.beginPath();x.moveTo(PAD+58,sy2+sh/2+7);x.lineTo(PAD+68,sy2+sh/2+17);x.stroke();
  x.fillStyle="#001E6F";
  x.font=F("500",32);x.textAlign="left";x.textBaseline="middle";
  const sMaxW=(SW-PAD-30)-(PAD+88);
  let sTxt=a.name;
  while(x.measureText(sTxt).width>sMaxW&&sTxt.length>1) sTxt=sTxt.slice(0,-1);
  if(sTxt!==a.name) sTxt=sTxt.trimEnd()+"…";
  x.fillText(sTxt,PAD+88,sy2+sh/2+2);

  /* Müəlliflər başlığı */
  x.fillStyle="#001E6F";x.textAlign="center";
  x.font=F("700",32);
  x.fillText("Müəlliflər",SW/2,sy2+sh+70);

  /* müəllif kartı */
  const cy0=sy2+sh+70+44,cw=SW-2*PAD,ch=190;
  roundRect(x,PAD,cy0,cw,ch,50);
  x.fillStyle=navG(PAD,cy0,cw);x.fill();
  const isz=116,ix=PAD+30,iy=cy0+(ch-isz)/2;
  drawAuthorIcon(x,ix,iy,isz,"#9DC3FF");
  const shCx=PAD+cw-30-34,shCy=cy0+ch/2;
  const tx=ix+isz+26,tMaxW=(shCx-34-16)-tx;
  x.textAlign="left";
  let ts=44;
  x.font=F("700",ts);
  while(x.measureText(a.name).width>tMaxW&&ts>8){
    ts=Math.max(8,ts-2);
    x.font=F("700",ts);
  }
  if(x.measureText(a.name).width>tMaxW){
    ts*=tMaxW/x.measureText(a.name).width;
    x.font=F("700",ts);
  }
  const tlh=ts*1.15,sub=26;
  const blockH=tlh+10+sub*1.3;
  let ty=cy0+(ch-blockH)/2;
  x.fillStyle="#9DC3FF";
  x.font=F("700",ts);
  x.fillText(a.name,tx,ty+tlh*.5);
  ty+=tlh+10;
  x.font=F("500",sub);
  x.globalAlpha=.92;
  x.fillText(a.packages.length+" paket",tx,ty+sub*.65);
  x.globalAlpha=1;
  /* paylaş düyməsi */
  x.beginPath();x.arc(shCx,shCy,34,0,Math.PI*2);
  x.fillStyle="rgba(255,255,255,.3)";x.fill();
  x.strokeStyle="#9DC3FF";x.lineWidth=3;x.lineCap="round";
  const pts=[[shCx+10,shCy-12],[shCx-10,shCy],[shCx+10,shCy+12]];
  x.beginPath();x.moveTo(pts[1][0],pts[1][1]);x.lineTo(pts[0][0],pts[0][1]);
  x.moveTo(pts[1][0],pts[1][1]);x.lineTo(pts[2][0],pts[2][1]);x.stroke();
  pts.forEach(q=>{x.beginPath();x.arc(q[0],q[1],6,0,Math.PI*2);x.fillStyle="#7FA9E8";x.fill();x.stroke();});

  x.restore(); /* ekran */
  x.restore(); /* telefon */

  const pngBlob=await new Promise(res=>c.toBlob(res,"image/png"));
  if(!pngBlob) return null;
  const fname="muellif_"+a.name.trim().replace(/\s+/g,"_");
  return new File([pngBlob],fname+".png",{type:"image/png"});
}

function openShare(i){
  shareIdx=i;
  shareFile=null;
  const my=i;
  sharePromise=makeStory(authors[i]).catch(()=>null);
  sharePromise.then(f=>{ if(shareIdx===my) shareFile=f; });
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden","false");
}
function closeShare(){
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden","true");
}
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeShare(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeShare(); });

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text){
  const h=document.createElement("textarea");
  h.value=text;h.style.position="fixed";h.style.opacity="0";
  document.body.appendChild(h);h.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(h);
}
function downloadFile(file){
  const u=URL.createObjectURL(file);
  const a=document.createElement("a");
  a.href=u;a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

async function doShare(mode){
  if(shareIdx===null) return;
  const a=authors[shareIdx];

  if(mode==="copy"){
    await copyText(authorLink(a));
    toast("Link kopyalandı");
    closeShare();
    return;
  }

  const file=shareFile||await sharePromise;
  if(!file){ toast("Afişa hazırlana bilmədi"); closeShare(); return; }
  downloadFile(file);
  toast("Afişa yükləndi");
  closeShare();
}

overlay.querySelectorAll(".sheet-opt").forEach(b=>{
  b.addEventListener("click",()=>doShare(b.dataset.mode));
});
