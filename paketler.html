<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9DC3FF">
<title>πksel - Sual Paketləri</title>
<link rel="icon" type="image/png" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-10-03-7c990532-b6d4-4529-87ea-f322379e1f97.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
/* Ölçülər: Komp+Planşet (701px+) / Telefon (≤700px) / Dar telefon (≤420px) */
body{
  --page:#9DC3FF; --c1:#001E6F; --c2:#002E92; --fg:#9DC3FF; --accent:#001E6F;
  --glow:rgba(0,8,45,.30); --soft:rgba(255,255,255,.35); --mk:rgba(255,255,255,.3);
  --grad:linear-gradient(135deg,var(--c1) 0%,var(--c2) 50%,var(--c1) 100%);
  --tx:env(safe-area-inset-top,0px); --bx:env(safe-area-inset-bottom,0px);
}
body.dark{
  --page:#00072C; --c1:#9DC3FF; --c2:#6FA5FC; --fg:#00072C; --accent:#9DC3FF;
  --glow:rgba(255,255,255,.40); --soft:rgba(0,0,0,.2); --mk:rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
a,button,.pkg-card{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{min-height:100vh;background:var(--page);color:var(--fg);font-family:"Poppins",sans-serif;overflow-x:hidden;max-width:100%;transition:background .65s ease;-webkit-font-smoothing:antialiased;padding-top:var(--tx);padding-bottom:var(--bx)}
button,input,a{font:inherit}
a{color:inherit;text-decoration:none}
.page{width:min(95vw,820px);margin:0 auto;padding:12px 0 32px}

/* ---------- Giriş animasiyası: əvvəl çərçivə, sonra içindəkilər ---------- */
.frame{--d:calc(var(--i) * .1s);animation:frameIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:var(--d)}
.rise{animation:riseIn .6s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--d) + .55s)}
/* ---------- Siyahı dəyişəndə (axtarış / sıralama / filtr) kartların animasiyası ---------- */
.enter{animation:frameIn .5s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--e,0) * .05s)}
.enter-in{animation:riseIn .5s cubic-bezier(.18,.8,.24,1) backwards;animation-delay:calc(var(--e,0) * .05s + .22s)}
@keyframes frameIn{from{opacity:0;transform:translateY(28px)}}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}}

/* ---------- Naviqasiya ---------- */
.top-nav{height:50px;border-radius:40px;padding:0 52px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--grad);box-shadow:0 10px 28px rgba(0,20,100,.08)}
.nav-links{display:flex;align-items:center;gap:40px;height:100%}
.nav-link{position:relative;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .25s ease}
.nav-link:hover{transform:translateY(-1px)}
.theme-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--accent);background:var(--page);transition:transform .3s ease,background .65s ease,color .65s ease}
.theme-toggle:hover{transform:translateY(-50%) scale(1.08)}
.theme-toggle:active{transform:translateY(-50%) scale(.95)}
.theme-icon{width:24px;height:24px;display:block}
.ray{stroke:currentColor;stroke-width:2;stroke-linecap:round}
body.dark .ray{opacity:0}
.core{transform:scale(.68);transform-origin:16px 16px}
.bite{transform:translate(14px,-14px)}
body.dark .core{transform:scale(1)}
body.dark .bite{transform:translate(0,0)}
body.ready .core,body.ready .bite{transition:transform .6s cubic-bezier(.4,0,.2,1)}

/* ---------- Axtarış ---------- */
.search-wrap{margin-top:14px;height:52px;border-radius:40px;border:2px solid var(--accent);background:var(--soft);display:flex;align-items:center;padding:0 18px;gap:10px;transition:border-color .65s ease,background .65s ease}
.search-wrap>svg{width:22px;height:22px;flex:0 0 22px;color:var(--accent)}
#searchInput{flex:1 1 auto;min-width:0;width:0;border:0;background:transparent;outline:0;font-family:"Poppins",sans-serif;font-size:17px;font-weight:500;color:var(--accent)}
#searchInput::placeholder{color:var(--accent);opacity:.6}
.sort-btn{border:0;background:transparent;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;color:var(--accent);transition:transform .25s ease}
.sort-btn:hover{transform:scale(1.1)}
.sort-btn svg{width:22px;height:22px;transition:transform .3s ease}
.sort-btn.flip svg{transform:scaleY(-1)}

.filters{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
.filter-pill{height:38px;padding:0 20px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid transparent;color:var(--fg);background:var(--grad);transition:color .3s ease,border-color .3s ease,transform .2s ease}
.filter-pill:hover{transform:translateY(-2px)}
.filter-pill.off{background:transparent;border-color:var(--accent);color:var(--accent)}

.section-title{text-align:center;color:var(--accent);font-size:24px;line-height:1;font-weight:700;letter-spacing:-.7px;margin:24px 0 14px}

/* ---------- Paket kartları ---------- */
.cards-list{display:flex;flex-direction:column;gap:14px}
.pkg-card{position:relative;border-radius:28px;background:var(--grad);color:var(--fg);padding:16px 24px;display:flex;align-items:center;gap:18px;height:128px;overflow:hidden;box-shadow:0 10px 25px rgba(0,20,110,.07);transition:transform .35s cubic-bezier(.18,.8,.22,1),box-shadow .35s ease}
.pkg-card>*{position:relative;z-index:1}
/* Mausın ətrafında yumşaq, qeyri-dəqiq formalı rəng dəyişimi */
.pkg-card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
background:
radial-gradient(ellipse 170px 120px at var(--mx,50%) var(--my,50%),var(--glow),transparent 72%),
radial-gradient(ellipse 100px 150px at calc(var(--mx,50%) + 16px) calc(var(--my,50%) - 12px),var(--glow),transparent 72%)}
@media (hover:hover){
.pkg-card:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 14px 30px rgba(0,20,110,.14);z-index:5}
.pkg-card:hover::before{opacity:1}
}
.pkg-card:active{
transform:translateY(0) scale(.97);
box-shadow:0 6px 14px rgba(0,20,110,.12);
transition-duration:.3s;
}
.filter-pill:active,.sort-btn:active{transform:scale(.94)}
.pkg-icon{width:80px;height:80px;flex:0 0 80px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.15)}
.pkg-icon img{width:100%;height:100%;object-fit:cover;display:block}
.pkg-right{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.pkg-title{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pkg-type,.pkg-date{font-size:15px;font-weight:500;line-height:1.3;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark.hl{background:var(--mk);color:inherit;font-weight:800;border:2px solid currentColor;border-radius:6px;padding:0 4px;display:inline-block;line-height:1.1}

/* ---------- Paylaş düyməsi (kartın ən sağı) ---------- */
.share-btn{flex:0 0 auto;margin-left:auto;width:36px;height:36px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:var(--mk);color:var(--fg);transition:transform .25s ease,background .3s ease}
.share-btn svg{width:18px;height:18px;display:block}
@media (hover:hover){.share-btn:hover{transform:scale(1.12)}}
.share-btn:active{transform:scale(.88)}

/* ---------- Paylaşma pəncərəsi ---------- */
.sheet-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,7,44,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{width:min(100%,520px);background:var(--grad);color:var(--fg);border-radius:28px 28px 0 0;padding:20px 18px calc(18px + var(--bx));transform:translateY(100%);transition:transform .4s cubic-bezier(.22,.8,.25,1)}
.sheet-overlay.open .sheet{transform:translateY(0)}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.4px;text-align:center;margin-bottom:8px}
.sheet-opt{width:100%;height:52px;margin-top:8px;padding:0 16px;border:0;border-radius:16px;background:var(--mk);color:inherit;display:flex;align-items:center;gap:14px;font-size:16px;font-weight:500;cursor:pointer;text-align:left;transition:transform .2s ease}
.sheet-opt:active{transform:scale(.97)}
.sheet-opt svg{width:22px;height:22px;flex:0 0 22px}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--bx));z-index:120;max-width:min(92vw,420px);padding:12px 18px;border-radius:20px;background:var(--grad);color:var(--fg);font-size:14px;font-weight:500;text-align:center;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Footer ---------- */
footer{background:var(--grad);color:var(--fg);min-height:110px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.footer-line{font-size:15px;line-height:1.4;font-weight:500}
.footer-link{transition:opacity .25s ease,transform .25s ease}
.footer-link:hover{opacity:.72;transform:translateY(-1px)}

.pkg-card:focus-visible,.nav-link:focus-visible,.theme-toggle:focus-visible,.footer-link:focus-visible,.share-btn:focus-visible,.sheet-opt:focus-visible{outline:3px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- TELEFON ≤700px ---------- */
@media (max-width:700px){
.page{width:calc(100vw - 44px);padding:11px 0 26px}
.top-nav{height:46px;padding:0 46px}
.nav-links{gap:28px}
.nav-link{font-size:13px}
.theme-toggle{width:34px;height:34px;right:6px}
.theme-icon{width:21px;height:21px}
.search-wrap{margin-top:12px;height:46px;padding:0 14px}
#searchInput{font-size:16px}
.filters{gap:8px;margin-top:12px}
.filter-pill{height:34px;padding:0 14px;font-size:13px}
.section-title{font-size:17px;margin:20px 0 12px}
.cards-list{gap:10px}
.pkg-card{height:100px;padding:12px 16px;gap:12px;border-radius:22px}
.pkg-icon{width:56px;height:56px;flex-basis:56px;border-radius:14px}
.pkg-title{font-size:17px;letter-spacing:-.5px}
.pkg-type,.pkg-date{font-size:9px}
.share-btn{width:32px;height:32px}
.share-btn svg{width:16px;height:16px}
footer{min-height:96px;padding:16px 12px;gap:5px}
.footer-line{font-size:13px}
}

/* ---------- DAR TELEFON ≤420px ---------- */
@media (max-width:420px){
.page{width:calc(100vw - 36px)}
.top-nav{height:42px;padding:0 42px}
.nav-links{gap:22px}
.nav-link{font-size:11px}
.theme-toggle{width:32px;height:32px;right:5px}
.theme-icon{width:20px;height:20px}
#searchInput{font-size:15px}
.filter-pill{height:32px;padding:0 12px;font-size:12px}
.section-title{font-size:15px}
.pkg-card{height:94px;padding:12px 14px;gap:10px}
.pkg-icon{width:50px;height:50px;flex-basis:50px}
.pkg-title{font-size:15px}
.pkg-type,.pkg-date{font-size:8px}
.share-btn{width:30px;height:30px}
footer{min-height:88px}
.footer-line{font-size:11px}
}
</style>
</head>

<script>
/* ---------- Sağ düymə və Ctrl+U / F12 Bloklama ---------- */
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

document.addEventListener('keydown', function(e) {
  if (
    e.keyCode === 123 || // F12
    (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
    (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
    (e.ctrlKey && e.keyCode === 85) || // Ctrl+U
    (e.ctrlKey && e.keyCode === 83)    // Ctrl+S
  ) {
    e.preventDefault();
    return false;
  }
});

const themeToggle=document.getElementById("themeToggle");
const rays=[...document.querySelectorAll(".ray")];

/* ---------- Gün / Ay animasiyası ---------- */
function animateRays(dark){
  rays.forEach(r=>{
    r.getAnimations().forEach(a=>a.cancel());
    const kf=dark
      ?[{transform:"translateY(0)",opacity:1},{transform:"translateY(-14px)",opacity:0}]
      :[{transform:"translateY(11px)",opacity:0},{transform:"translateY(0)",opacity:1}];
    const a=r.animate(kf,{duration:dark?520:620,delay:dark?0:180,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"});
    a.onfinish=()=>a.cancel();
  });
}
function setTheme(dark,animate){
  document.body.classList.toggle("dark",dark);
  try{localStorage.setItem("piksel-theme",dark?"dark":"light")}catch(e){}
  themeToggle.setAttribute("aria-label",dark?"Gündüz rejiminə keç":"Gecə rejiminə keç");
  if(animate) animateRays(dark);
}
function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem("piksel-theme")}catch(e){}
  if(saved==="dark") return setTheme(true,false);
  if(saved==="light") return setTheme(false,false);
  setTheme(!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches),false);
}
themeToggle.addEventListener("click",()=>setTheme(!document.body.classList.contains("dark"),true));
initTheme();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));

function highlight(title,q){
  if(!q) return title;
  const idx=title.toLowerCase().indexOf(q);
  if(idx===-1) return title;
  return title.slice(0,idx)+"<mark class='hl'>"+title.slice(idx,idx+q.length)+"</mark>"+title.slice(idx+q.length);
}

const cardsList=document.getElementById("cardsList");

/* Maus işığı (dinamik kartlar üçün) */
cardsList.addEventListener("pointermove",e=>{
  const card=e.target.closest(".pkg-card");
  if(!card) return;
  const r=card.getBoundingClientRect();
  card.style.setProperty("--mx",(e.clientX-r.left)+"px");
  card.style.setProperty("--my",(e.clientY-r.top)+"px");
});

function render(){
  let list=packages.filter(p=>activeTypes.has(p.type));
  if(query) list=list.filter(p=>p.title.toLowerCase().includes(query));
  list.sort((a,b)=>newestFirst
    ?(b.date.localeCompare(a.date)||b.order-a.order)
    :(a.date.localeCompare(b.date)||a.order-b.order));

  /* siyahı (tərkib və ya sıra) dəyişibsə kartlar animasiya ilə gəlir */
  const key=list.map(p=>p.order).join(",");
  const changed=key!==lastKey;
  lastKey=key;
  cardsList.innerHTML="";
  const first=firstRender;   /* ilk yüklənmə: tam giriş animasiyası */
  firstRender=false;

  list.forEach((p,i)=>{
    const t=TYPES.find(x=>x.key===p.type);
    const [y,m,d]=p.date.split("-");
    const card=document.createElement("a");
    card.href=p.link;
    card.className="pkg-card"+(first?" frame":(changed?" enter":""));
    if(first) card.style.setProperty("--i",4+i);
    else if(changed) card.style.setProperty("--e",Math.min(i,12));
    const r=first?" rise":(changed?" enter-in":"");
    card.innerHTML=`
      <span class="pkg-icon${r}"><img src="${p.icon}" alt=""></span>
      <div class="pkg-right${r}">
        <div class="pkg-title">${highlight(p.title,query)}</div>
        <div class="pkg-type">${t.full}</div>
        <div class="pkg-date">${d}.${m}.${y}</div>
      </div>
      <button class="share-btn${r}" type="button" data-i="${p.order}" aria-label="Paylaş">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
      </button>`;
    cardsList.appendChild(card);
  });
}

   PAYLAŞ
   - Story/status üçün 1080x1920 afişa canvas ilə hazırlanır.
   - Telefonda sistem paylaşma menyusu açılır (WhatsApp, Instagram, Telegram və s.),
     şəkil fayl kimi, başlıq + link isə mesaj mətni kimi göndərilir.
   - Masaüstündə şəkil yüklənir, link kopyalanır.
========================================================= */
const overlay=document.getElementById("shareOverlay");
const toastEl=document.getElementById("toast");
let shareIdx=null,sharePromise=null,shareFile=null,toastTimer=null;

function absLink(p){ return new URL(p.link,location.href).href; }

function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2600);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loadImg(src){
  const tryLoad=(u)=>new Promise(res=>{
    const im=new Image();
    im.crossOrigin="anonymous";
    im.onload=()=>res(im);
    im.onerror=()=>res(null);
    im.src=u;
  });
  /* əvvəl birbaşa, alınmasa CORS dəstəkləyən proxy ilə */
  return tryLoad(src).then(im=>im||tryLoad("https://wsrv.nl/?url="+encodeURIComponent(src)));
}

function drawCover(ctx,im,x,y,w,h){
  const s=Math.max(w/im.naturalWidth,h/im.naturalHeight);
  const dw=im.naturalWidth*s,dh=im.naturalHeight*s;
  ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}

function wrapLines(ctx,text,maxW){
  const words=text.split(" ");
  const lines=[];
  let cur="";
  words.forEach(w=>{
    const t=cur?cur+" "+w:w;
    if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; }
    else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}

function placeholderBox(ctx,x,y,w,h,r,fontPx){
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,"#001E6F");g.addColorStop(1,"#00072C");
  ctx.fillStyle=g;
  roundRect(ctx,x,y,w,h,r);ctx.fill();
  ctx.fillStyle="#6FA5FC";
  ctx.font="700 "+fontPx+"px Poppins, sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("π",x+w/2,y+h/2);
}

/* ---------- Afişa (story) çəkilişi ---------- */
async function makeStory(p){
  const t=TYPES.find(x=>x.key===p.type);
  const dd=p.date.split("-")[2],mm=p.date.split("-")[1],yy=p.date.split("-")[0];
  try{
    await Promise.all([
      document.fonts.load('500 30px Poppins'),
      document.fonts.load('700 30px Poppins'),
      document.fonts.load('800 30px Poppins')
    ]);
  }catch(e){}
  const icon=await loadImg(p.icon);

  const W=1080,H=1920;
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const x=c.getContext("2d");
  const F=(w,s)=>w+" "+s+"px Poppins, sans-serif";

  /* ---------- Fon: lacivert rəng keçidli ləkələr ---------- */
  x.fillStyle="#00072C";x.fillRect(0,0,W,H);
  function blob(cx,cy,rx,ry,col,a){
    x.save();
    x.translate(cx,cy);x.scale(rx,ry);
    const g=x.createRadialGradient(0,0,0,0,0,1);
    g.addColorStop(0,"rgba("+col+","+a+")");
    g.addColorStop(1,"rgba("+col+",0)");
    x.fillStyle=g;
    x.beginPath();x.arc(0,0,1,0,Math.PI*2);x.fill();
    x.restore();
  }
  blob(260,120,620,520,"10,80,220",.65);
  blob(640,-40,700,420,"20,110,255",.55);
  blob(1080,880,420,620,"10,60,190",.55);
  blob(-40,720,380,520,"6,40,140",.6);
  blob(120,1500,600,520,"10,55,170",.55);
  blob(980,1760,560,520,"8,50,160",.55);
  blob(540,1000,700,300,"0,4,24",.55);
  blob(900,300,300,260,"0,140,255",.18);

  /* ---------- Başlıq mətni ---------- */
  const m=p.title.match(/^(.*?)"([^"]+)"\s*(.*)$/);
  let big,rest="";
  if(m){
    big=(m[1]+m[2]).trim();
    rest=m[3].trim().toLocaleUpperCase("az");
  }else{
    big=p.title;
  }

  function fitText(text,start,weight,maxW){
    let s,lines;
    for(s=start;s>=start*0.6;s-=2){
      x.font=F(weight,s);
      lines=wrapLines(x,text,maxW);
      if(lines.length<=1) return {size:s,lines};
    }
    for(s=Math.round(start*0.8);s>=48;s-=2){
      x.font=F(weight,s);
      lines=wrapLines(x,text,maxW);
      if(lines.length<=2) return {size:s,lines};
    }
    x.font=F(weight,48);
    return {size:48,lines:wrapLines(x,text,maxW)};
  }

  const TW=900;
  const A=fitText(big,176,"800",TW);
  const B=rest?fitText(rest,160,"800",TW):null;
  const hA=A.lines.length*A.size*1.08;
  const hB=B?B.lines.length*B.size*1.08+4:0;
  const pillH=88,logoH=110;
  const total=hA+hB+34+pillH+30+logoH;
  let y=110+(880-total)/2;

  x.textAlign="center";x.textBaseline="middle";

  /* ad (ağ, parlayan) */
  x.font=F("800",A.size);
  A.lines.forEach((ln,i)=>{
    const cy=y+A.size*1.08*(i+.5);
    x.fillStyle="#9DC3FF";
    x.fillText(ln,W/2,cy);
  });
  y+=hA;

  /* növ (KUBOKU / TURNİRİ ...) */
  if(B){
    x.font=F("800",B.size);
    B.lines.forEach((ln,i)=>{
      const lh=B.size*1.08;
      const cy=y+2+lh*(i+.5);
      x.fillStyle="#ADCDFF";
      x.fillText(ln,W/2,cy);
    });
    y+=hB;
  }
  y+=34;

  /* PAKETİ çərçivəsi */
  const pw=500;
  x.save();
  roundRect(x,W/2-pw/2,y,pw,pillH,44);
  x.fillStyle="rgba(0,16,80,.65)";x.fill();
  x.lineWidth=4;x.strokeStyle="#2D7BFF";x.stroke();
  x.restore();
  x.fillStyle="#fff";
  x.font=F("800",64);
  try{x.letterSpacing="6px";}catch(e){}
  x.fillText("PAKETİ",W/2+3,y+pillH/2+3);
  try{x.letterSpacing="0px";}catch(e){}
  y+=pillH+30;

  /* πksel-də */
  const ls=100;
  x.textAlign="left";
  x.font="italic 800 "+(ls*1.1)+"px Poppins, sans-serif";
  const w1=x.measureText("π").width;
  x.font=F("800",ls);
  const w2=x.measureText("ksel-də").width;
  const sx0=W/2-(w1+w2)/2,cy2=y+logoH/2;
  x.save();
  x.fillStyle="#9DC3FF";
  x.font="italic 800 "+(ls*1.1)+"px Poppins, sans-serif";
  x.fillText("π",sx0,cy2);
  x.fillStyle="#9DC3FF";
  x.font=F("800",ls);
  x.fillText("ksel-də",sx0+w1,cy2+4);
  x.restore();

  /* ---------- Telefon ---------- */
  const PW=800,PH=1250,SX=50,SY=46,SW=700;
  x.save();
  x.translate(140,1040);
  x.rotate(0.04);

  /* kölgə / parıltı */
  x.save();
  x.shadowColor="rgba(0,110,255,.45)";x.shadowBlur=90;
  roundRect(x,0,0,PW,PH,124);
  x.fillStyle="#10162A";x.fill();
  x.restore();
  roundRect(x,0,0,PW,PH,124);
  const bg=x.createLinearGradient(0,0,PW,0);
  bg.addColorStop(0,"#1B2238");bg.addColorStop(.5,"#0E1426");bg.addColorStop(1,"#232B45");
  x.fillStyle=bg;x.fill();
  x.lineWidth=3;x.strokeStyle="#39425F";x.stroke();
  /* yan düymələr */
  x.fillStyle="#1A2036";
  roundRect(x,-8,180,10,70,4);x.fill();
  roundRect(x,-8,300,10,120,4);x.fill();
  roundRect(x,-8,450,10,120,4);x.fill();
  /* qara çərçivə */
  roundRect(x,12,12,PW-24,PH-24,112);
  x.fillStyle="#000";x.fill();

  /* ekran */
  x.save();
  x.translate(SX,SY);
  roundRect(x,0,0,SW,PH-SY-10,78);
  x.clip();
  x.fillStyle="#9DC3FF";
  x.fillRect(0,0,SW,PH);

  const navG=(x0,y0,w0)=>{
    const g=x.createLinearGradient(x0,y0,x0+w0,y0+100);
    g.addColorStop(0,"#001E6F");g.addColorStop(.5,"#002E92");g.addColorStop(1,"#001E6F");
    return g;
  };
  const PAD=36;

  /* naviqasiya */
  let ny=60;
  /* ön kamera */
  x.beginPath();x.arc(SW/2,30,14,0,Math.PI*2);x.fillStyle="#000";x.fill();
  roundRect(x,PAD,ny,SW-2*PAD,92,46);
  x.fillStyle=navG(PAD,ny,SW-2*PAD);x.fill();
  x.fillStyle="#9DC3FF";
  x.font=F("500",25);x.textAlign="left";x.textBaseline="middle";
  const l1="Əsas Səhifə",l2="Bizimlə Əlaqə";
  const lw1=x.measureText(l1).width,lw2=x.measureText(l2).width;
  const gap=44,lt=lw1+gap+lw2;
  const lx=PAD+(SW-2*PAD-80)/2-lt/2;
  x.fillText(l1,lx,ny+46);
  x.fillText(l2,lx+lw1+gap,ny+46);
  /* gün düyməsi */
  const bx=SW-PAD-46-4,by=ny+46;
  x.beginPath();x.arc(bx,by,36,0,Math.PI*2);x.fillStyle="#9DC3FF";x.fill();
  x.strokeStyle="#001E6F";x.fillStyle="#001E6F";x.lineWidth=3;x.lineCap="round";
  x.beginPath();x.arc(bx,by,10,0,Math.PI*2);x.fill();
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4;
    x.beginPath();
    x.moveTo(bx+Math.cos(a)*17,by+Math.sin(a)*17);
    x.lineTo(bx+Math.cos(a)*23,by+Math.sin(a)*23);
    x.stroke();
  }

  /* axtarış (paketin adı yazılıb) */
  const sy2=ny+92+28,sh=92;
  roundRect(x,PAD,sy2,SW-2*PAD,sh,46);
  x.fillStyle="rgba(255,255,255,.35)";x.fill();
  x.lineWidth=4;x.strokeStyle="#001E6F";x.stroke();
  /* böyüdücü */
  x.lineWidth=3.5;x.strokeStyle="#001E6F";x.lineCap="round";
  x.beginPath();x.arc(PAD+48,sy2+sh/2-3,13,0,Math.PI*2);x.stroke();
  x.beginPath();x.moveTo(PAD+58,sy2+sh/2+7);x.lineTo(PAD+68,sy2+sh/2+17);x.stroke();
  /* sıralama ikonu */
  const sx3=SW-PAD-56,sc=sy2+sh/2;
  x.lineWidth=3;
  x.beginPath();x.moveTo(sx3-16,sc-12);x.lineTo(sx3+16,sc-12);x.stroke();
  x.beginPath();x.moveTo(sx3-16,sc);x.lineTo(sx3+6,sc);x.stroke();
  x.beginPath();x.moveTo(sx3-16,sc+12);x.lineTo(sx3-4,sc+12);x.stroke();
  x.lineJoin="round";
  x.beginPath();x.moveTo(sx3+14,sc+4);x.lineTo(sx3+14,sc+16);
  x.moveTo(sx3+14,sc+16);x.lineTo(sx3+8,sc+10);
  x.moveTo(sx3+14,sc+16);x.lineTo(sx3+20,sc+10);x.stroke();
  /* ad mətni */
  x.fillStyle="#001E6F";
  x.font=F("500",32);x.textAlign="left";x.textBaseline="middle";
  const sMaxW=(sx3-30)-(PAD+88);
  let sTxt=p.title;
  while(x.measureText(sTxt).width>sMaxW&&sTxt.length>1) sTxt=sTxt.slice(0,-1);
  if(sTxt!==p.title) sTxt=sTxt.trimEnd()+"…";
  x.fillText(sTxt,PAD+88,sy2+sh/2+2);

  /* filtrlər */
  let fx=PAD,fy=sy2+sh+26;
  const fh=66;
  x.font=F("700",24);
  TYPES.forEach(tp=>{
    const w=x.measureText(tp.short).width+56;
    if(fx+w>SW-PAD){fx=PAD;fy+=fh+14;}
    roundRect(x,fx,fy,w,fh,33);
    x.fillStyle=navG(fx,fy,w);x.fill();
    x.fillStyle="#9DC3FF";x.textAlign="center";
    x.fillText(tp.short,fx+w/2,fy+fh/2+1);
    fx+=w+14;
  });
  fy+=fh;

  /* Paketlər başlığı */
  x.fillStyle="#001E6F";x.textAlign="center";
  x.font=F("700",32);
  x.fillText("Paketlər",SW/2,fy+62);

  /* paket kartı */
  const cy0=fy+62+44,cw=SW-2*PAD,ch=200;
  roundRect(x,PAD,cy0,cw,ch,50);
  x.fillStyle=navG(PAD,cy0,cw);x.fill();
  const isz=120,ix=PAD+30,iy=cy0+(ch-isz)/2;
  if(icon){
    x.save();roundRect(x,ix,iy,isz,isz,30);x.clip();
    drawCover(x,icon,ix,iy,isz,isz);
    x.restore();
  }else{
    placeholderBox(x,ix,iy,isz,isz,30,70);
  }
  const shCx=PAD+cw-30-34,shCy=cy0+ch/2;
  const tx=ix+isz+26,tMaxW=(shCx-34-16)-tx;
  /* kartdakı başlıq */
  x.textAlign="left";
  let ts,tl;
  for(ts=40;ts>=22;ts-=2){
    x.font=F("700",ts);
    tl=wrapLines(x,p.title,tMaxW);
    if(tl.length<=2) break;
  }
  const tlh=ts*1.15,sub=24;
  const blockH=tl.length*tlh+10+sub*1.3*2;
  let ty=cy0+(ch-blockH)/2;
  x.fillStyle="#9DC3FF";
  x.font=F("700",ts);
  tl.forEach((ln,i)=>x.fillText(ln,tx,ty+tlh*(i+.5)));
  ty+=tl.length*tlh+10;
  x.font=F("500",sub);
  x.globalAlpha=.92;
  x.fillText(t.full,tx,ty+sub*.65);
  x.fillText(dd+"."+mm+"."+yy,tx,ty+sub*1.3+sub*.65);
  x.globalAlpha=1;
  /* paylaş düyməsi */
  x.beginPath();x.arc(shCx,shCy,34,0,Math.PI*2);
  x.fillStyle="rgba(255,255,255,.3)";x.fill();
  x.strokeStyle="#9DC3FF";x.lineWidth=3;x.lineCap="round";
  const pts=[[shCx+10,shCy-12],[shCx-10,shCy],[shCx+10,shCy+12]];
  x.beginPath();x.moveTo(pts[1][0],pts[1][1]);x.lineTo(pts[0][0],pts[0][1]);
  x.moveTo(pts[1][0],pts[1][1]);x.lineTo(pts[2][0],pts[2][1]);x.stroke();
  pts.forEach(q=>{x.beginPath();x.arc(q[0],q[1],6,0,Math.PI*2);x.fillStyle="#7FA9E8";x.fill();x.stroke();});

  x.restore(); /* ekran */
  x.restore(); /* telefon */

  const pngBlob=await new Promise(res=>c.toBlob(res,"image/png"));
  if(!pngBlob) return null;
  const name=(p.link.split("/").pop()||"paket").replace(".html","")||"paket";
  return new File([pngBlob],name+".png",{type:"image/png"});
}

function openShare(i){
  shareIdx=i;
  shareFile=null;
  const my=i;
  sharePromise=makeStory(packages[i]).catch(()=>null);
  sharePromise.then(f=>{ if(shareIdx===my) shareFile=f; });
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden","false");
}
function closeShare(){
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden","true");
}
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeShare(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeShare(); });

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }
  fallbackCopy(text);
  return Promise.resolve();
}
function fallbackCopy(text){
  const h=document.createElement("textarea");
  h.value=text;h.style.position="fixed";h.style.opacity="0";
  document.body.appendChild(h);h.select();
  try{document.execCommand("copy")}catch(e){}
  document.body.removeChild(h);
}
function downloadFile(file){
  const u=URL.createObjectURL(file);
  const a=document.createElement("a");
  a.href=u;a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

async function doShare(mode){
  if(shareIdx===null) return;
  const p=packages[shareIdx];

  if(mode==="copy"){
    await copyText(absLink(p));
    toast("Link kopyalandı");
    closeShare();
    return;
  }

  /* afişanı yüklə */
  const file=shareFile||await sharePromise;
  if(!file){ toast("Afişa hazırlana bilmədi"); closeShare(); return; }
  downloadFile(file);
  toast("Afişa yükləndi");
  closeShare();
}

overlay.querySelectorAll(".sheet-opt").forEach(b=>{
  b.addEventListener("click",()=>doShare(b.dataset.mode));
});
</script>
</body>
</html>
