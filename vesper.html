<html lang="az">
<head>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

html,
body{
  width:100%;
  min-height:100%;
  background:transparent;
}

body{
  color:#0d38a8;
  overflow-x:hidden;
}

#scrollWrap{
  width:100%;
  padding:8px 6px 45px;
}

.main-container{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
}

.blur-content{
  display:flex;
  flex-direction:column;
  gap:14px;
  transition:
    filter .5s cubic-bezier(.25,1,.5,1),
    opacity .3s ease;
}

body.img-zoomed .blur-content{
  filter:blur(8px);
  pointer-events:none;
}


/* =========================================
   ÜMUMİ KART
========================================= */

.info-card,
.tours-card,
.q-card{
  width:100%;
  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(195,212,240,.96) 0%,
      rgba(225,235,250,.94) 42%,
      rgba(240,244,255,.91) 100%
    );

  border:1px solid rgba(255,255,255,.82);

  box-shadow:
    0 5px 18px rgba(15,45,120,.10),
    inset 0 1px 0 rgba(255,255,255,.65);

  position:relative;
  overflow:hidden;

  word-wrap:break-word;
  overflow-wrap:break-word;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.info-card::after,
.tours-card::after,
.q-card::after{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:55%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform:skewX(-18deg);
  pointer-events:none;

  animation:microShine 11s ease-in-out infinite;
}

@keyframes microShine{
  0%,72%{
    left:-120%;
    opacity:0;
  }

  78%{
    opacity:1;
  }

  88%,100%{
    left:150%;
    opacity:0;
  }
}


/* =========================================
   İNFO KARTI
========================================= */

.info-card{
  padding:18px 17px;
}

.game-title{
  font-size:22px;
  font-weight:800;
  color:#0b3297;
  line-height:1.28;
  margin-bottom:13px;
  letter-spacing:-.2px;
}

.info-row{
  font-size:14px;
  color:#1746ad;
  line-height:1.55;
  margin-bottom:6px;
}

.info-row:last-child{
  margin-bottom:0;
}

.info-label{
  font-weight:800;
  color:#0b3297;
}

.info-val{
  font-weight:500;
  color:#1746ad;
}


/* =========================================
   TUR KARTI
========================================= */

.tours-card{
  padding:12px;
}

.tour-buttons{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.tour-btn{
  width:100%;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(240,244,255,.68)
    );

  color:#0d38a8;

  border:1px solid rgba(13,56,168,.16);

  padding:10px 13px;
  border-radius:14px;

  font-size:14px;
  font-weight:600;

  cursor:pointer;
  text-align:left;

  transition:
    background .22s ease,
    color .22s ease,
    transform .16s ease,
    box-shadow .22s ease;

  -webkit-tap-highlight-color:transparent;
}

.tour-btn:active{
  transform:scale(.985);
}

.tour-btn.active{
  background:
    linear-gradient(
      135deg,
      #0d38a8,
      #174bc4
    );

  color:#fff;
  font-weight:800;

  border-color:#0d38a8;

  box-shadow:
    0 5px 13px rgba(13,56,168,.22);
}


/* =========================================
   BÜTÜN CAVABLAR
========================================= */

.global-toggle-btn{
  width:100%;

  background:
    linear-gradient(
      135deg,
      #0d38a8,
      #174bc4
    );

  color:#fff;

  border:0;

  padding:12px 15px;

  border-radius:15px;

  font-size:14px;
  font-weight:800;

  cursor:pointer;

  text-align:center;

  box-shadow:
    0 5px 15px rgba(13,56,168,.18);

  transition:
    transform .16s ease,
    box-shadow .22s ease;

  -webkit-tap-highlight-color:transparent;
}

.global-toggle-btn:active{
  transform:scale(.985);
  box-shadow:0 3px 9px rgba(13,56,168,.15);
}


/* =========================================
   SUAL KARTLARI
========================================= */

.questions-container{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.q-card{
  padding:16px 15px;
}

.q-text{
  font-size:15px;
  font-weight:500;

  color:#123f9f;

  line-height:1.62;

  margin-bottom:13px;
}

.q-text b{
  font-weight:850;
  color:#0a318f;
}


/* =========================================
   REKVİZİT ŞƏKLİ
========================================= */

.req-img-wrapper{
  position:relative;
  display:inline-block;
  max-width:100%;
  margin-top:9px;
}

.req-img{
  max-width:100%;
  height:auto;

  border-radius:13px;

  cursor:pointer;

  display:block;

  transform-origin:center center;

  transition:
    transform .5s cubic-bezier(.25,1,.5,1),
    box-shadow .5s ease;

  will-change:transform;

  position:relative;
  z-index:1;

  border:1px solid rgba(255,255,255,.65);

  box-shadow:
    0 4px 12px rgba(13,56,168,.12);
}


/* =========================================
   CAVAB DÜYMƏSİ
========================================= */

.toggle-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  background:
    linear-gradient(
      135deg,
      #0d38a8,
      #174bc4
    );

  color:#fff;

  border:none;

  padding:8px 14px;

  border-radius:14px;

  font-size:13px;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 3px 9px rgba(13,56,168,.16);

  transition:
    transform .16s ease,
    box-shadow .2s ease;

  -webkit-tap-highlight-color:transparent;
}

.toggle-btn:active{
  transform:scale(.96);
}

.arrow-icon{
  width:10px;
  height:10px;

  fill:#fff;

  transition:
    transform .3s ease;

  image-rendering:pixelated;
}

.q-card.active .arrow-icon{
  transform:rotate(180deg);
}


/* =========================================
   CAVAB PANELİ
========================================= */

.ans-panel{
  display:none;

  margin-top:13px;
  padding-top:13px;

  border-top:
    1px solid rgba(13,56,168,.16);

  animation:
    answerOpen .28s ease;
}

@keyframes answerOpen{
  from{
    opacity:0;
    transform:translateY(-4px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.q-card.active .ans-panel{
  display:block;
}

.ans-row{
  font-size:14px;
  font-weight:500;

  color:#1746ad;

  line-height:1.6;

  margin-bottom:8px;
}

.ans-row:last-child{
  margin-bottom:0;
}

.ans-label{
  font-weight:800;
  color:#0b3297;
}

.ans-row a{
  color:#1649ba;
  text-decoration:underline;
  word-break:break-word;
}


/* =========================================
   MOBİL
========================================= */

@media(max-width:480px){

  #scrollWrap{
    padding:
      7px
      5px
      38px;
  }

  .main-container,
  .blur-content,
  .questions-container{
    gap:11px;
  }

  .info-card{
    padding:16px 14px;
    border-radius:18px;
  }

  .game-title{
    font-size:20px;
    line-height:1.3;
    margin-bottom:11px;
  }

  .info-row{
    font-size:13px;
    line-height:1.5;
    margin-bottom:5px;
  }

  .tours-card{
    padding:10px;
    border-radius:18px;
  }

  .tour-btn{
    font-size:13px;
    padding:9px 11px;
    border-radius:13px;
  }

  .global-toggle-btn{
    font-size:13px;
    padding:11px 13px;
    border-radius:14px;
  }

  .q-card{
    padding:14px 13px;
    border-radius:18px;
  }

  .q-text{
    font-size:14px;
    line-height:1.58;
    margin-bottom:12px;
  }

  .toggle-btn{
    font-size:12px;
    padding:7px 13px;
  }

  .ans-row{
    font-size:13px;
    line-height:1.58;
    margin-bottom:7px;
  }
}


/* =========================================
   BÖYÜK EKRAN
========================================= */

@media(min-width:700px){

  #scrollWrap{
    padding-left:10px;
    padding-right:10px;
  }

  .info-card{
    padding:20px;
  }

  .game-title{
    font-size:23px;
  }

  .info-row{
    font-size:14px;
  }

  .q-card{
    padding:18px;
  }

  .q-text{
    font-size:15px;
  }

  .ans-row{
    font-size:14px;
  }
}


/* =========================================
   TEMA DÜYMƏSİ (sağ üstdə, kiçik)
========================================= */

.theme-toggle{
  position:fixed;

  top:12px;
  right:12px;

  z-index:300;

  width:42px;
  height:42px;

  border:0;
  border-radius:14px;

  background:
    linear-gradient(135deg,#0d38a8,#2360d2);

  color:#fff;

  font-size:18px;

  cursor:pointer;

  box-shadow:
    0 6px 16px rgba(13,56,168,.25);

  transition:transform .25s ease;

  -webkit-tap-highlight-color:transparent;
}

.theme-toggle:active{
  transform:scale(.9);
}


/* =========================================
   DARK MODE — ortaq 'piksel-theme' açarı ilə
========================================= */

html.dark .info-card,
html.dark .tours-card,
html.dark .q-card{

  background:
    linear-gradient(
      135deg,
      rgba(18,38,86,.96),
      rgba(11,28,67,.94) 55%,
      rgba(8,20,51,.94)
    );

  border-color:
    rgba(121,184,255,.16);

  box-shadow:
    0 5px 20px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.04);
}

html.dark .game-title,
html.dark .info-label,
html.dark .q-text b,
html.dark .ans-label{
  color:#9bc8ff;
}

html.dark .info-row,
html.dark .info-val,
html.dark .q-text,
html.dark .ans-row{
  color:#b9d7ff;
}

html.dark .tour-btn{
  background:
    rgba(24,47,99,.72);

  color:#b9d7ff;

  border-color:
    rgba(121,184,255,.18);
}

html.dark .tour-btn.active{
  background:
    linear-gradient(
      135deg,
      #174bc4,
      #0d38a8
    );

  color:#fff;
}

html.dark .ans-row a{
  color:#8fc4ff;
}

html.dark .ans-panel{
  border-top-color:
    rgba(121,184,255,.16);
}


/* =========================================
   SCROLL REVEAL
========================================= */

.reveal{
  opacity:0;
  transform:translateY(10px);
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.25,1,.5,1);
}

.reveal.visible{
  opacity:1;
  transform:translateY(0);
}


/* =========================================
   ZOOM
========================================= */

.zoom-overlay{
  position:fixed;
  inset:0;

  background:
    rgba(0,10,35,.08);

  z-index:9998;

  pointer-events:none;
}

body.img-zoomed .zoom-overlay{
  pointer-events:auto;
}

<script>

/* =====================================================
   TEMA — ortaq 'piksel-theme' açarı (bütün səhifələr üçün)
===================================================== */

const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");

function applyTheme(dark){
  document.documentElement.classList.toggle("dark", dark);
  themeIcon.textContent = dark ? "☀️" : "🌙";
  try{ localStorage.setItem("piksel-theme", dark ? "dark" : "light"); }catch(e){}
}

applyTheme(document.documentElement.classList.contains("dark"));

themeBtn.addEventListener("click", ()=>{
  themeIcon.style.transform = "scale(0)";
  setTimeout(()=>{
    applyTheme(!document.documentElement.classList.contains("dark"));
    themeIcon.style.transform = "scale(1)";
  },150);
});


/* =====================================================

/* =====================================================
   DƏYİŞƏNLƏR
===================================================== */

let currentTour=1;
let allExpanded=false;

let activeZoomedImg=null;
let activeClone=null;


/* =====================================================
   TUR YÜKLƏ
===================================================== */

function loadTour(tourNum){

  removeZoom();

  currentTour=tourNum;
  allExpanded=false;

  document.getElementById(
    "globalToggleBtn"
  ).textContent="Bütün cavabları göstər";


  const buttons=
    document.querySelectorAll(".tour-btn");

  buttons.forEach((btn,index)=>{

    if(index+1===tourNum){

      btn.classList.add("active");

    }else{

      btn.classList.remove("active");

    }

  });


  renderQuestions();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =====================================================
   SUALLARI YARAT
===================================================== */

function renderQuestions(){

  const container=
    document.getElementById(
      "questionsContainer"
    );

  container.innerHTML="";


  const questions=
    toursData[currentTour] || [];


  questions.forEach((item,index)=>{

    const card=
      document.createElement("div");

    card.className="q-card reveal";
    card.id=`q-card-${index}`;


    const criteriaHTML=
      item.criteria
      ?
      `<div class="ans-row">
        <span class="ans-label">
          Sayılma meyarı:
        </span>
        ${item.criteria}
      </div>`
      :
      "";


    const sourceHTML=
      item.source
      ?
      `<div class="ans-row">
        <span class="ans-label">
          Mənbə:
        </span>
        ${item.source}
      </div>`
      :
      "";


    card.innerHTML=`

      <div class="q-text">
        <b>${item.id}.</b>
        ${item.question}
      </div>

      <button
        class="toggle-btn"
        onclick="toggleSingleCard(${index})"
      >

        <span>
          Cavabı göstər
        </span>

        <svg
          class="arrow-icon"
          viewBox="0 0 8 8"
        >
          <path d="
            M0 2h8v1H0z
            M1 3h6v1H1z
            M2 4h4v1H2z
            M3 5h2v1H3z
          "/>
        </svg>

      </button>


      <div class="ans-panel">

        <div class="ans-row">
          <span class="ans-label">
            Cavab:
          </span>
          ${item.answer}
        </div>

        ${criteriaHTML}

        <div class="ans-row">
          <span class="ans-label">
            Şərh:
          </span>
          ${item.comment}
        </div>

        ${sourceHTML}

        <div class="ans-row">
          <span class="ans-label">
            Müəllif:
          </span>
          ${item.author}
        </div>

      </div>

    `;


    container.appendChild(card);

  });


  requestAnimationFrame(()=>{
    activateReveal();
  });

}


/* =====================================================
   TƏK CAVAB
===================================================== */

function toggleSingleCard(index){

  const card=
    document.getElementById(
      `q-card-${index}`
    );


  const btnText=
    card.querySelector(
      ".toggle-btn span"
    );


  card.classList.toggle("active");


  if(card.classList.contains("active")){

    btnText.textContent=
      "Cavabı gizlə";

  }else{

    btnText.textContent=
      "Cavabı göstər";

  }

}


/* =====================================================
   BÜTÜN CAVABLAR
===================================================== */

function toggleAllAnswers(){

  allExpanded=!allExpanded;


  const cards=
    document.querySelectorAll(
      ".q-card"
    );


  const globalBtn=
    document.getElementById(
      "globalToggleBtn"
    );


  cards.forEach(card=>{

    const btnText=
      card.querySelector(
        ".toggle-btn span"
      );


    if(allExpanded){

      card.classList.add("active");

      btnText.textContent=
        "Cavabı gizlə";

    }else{

      card.classList.remove("active");

      btnText.textContent=
        "Cavabı göstər";

    }

  });


  globalBtn.textContent=
    allExpanded
    ?
    "Bütün cavabları gizlə"
    :
    "Bütün cavabları göstər";

}


/* =====================================================
   ŞƏKİL ZOOM
===================================================== */

function toggleZoom(imgEl,event){

  event.stopPropagation();


  if(activeZoomedImg===imgEl){

    removeZoom();

    return;
  }


  removeZoom();


  const rect=
    imgEl.getBoundingClientRect();


  const overlay=
    document.createElement("div");

  overlay.className="zoom-overlay";

  overlay.onclick=function(){

    removeZoom();

  };

  document.body.appendChild(overlay);


  const clone=
    imgEl.cloneNode(true);


  clone.removeAttribute("onclick");


  clone.style.position="fixed";

  clone.style.top=
    rect.top+"px";

  clone.style.left=
    rect.left+"px";

  clone.style.width=
    rect.width+"px";

  clone.style.height=
    rect.height+"px";

  clone.style.margin="0";

  clone.style.maxWidth="none";

  clone.style.maxHeight="90vh";

  clone.style.zIndex="9999";

  clone.style.transformOrigin=
    "center center";

  clone.style.transition=
    "transform .5s cubic-bezier(.25,1,.5,1), box-shadow .5s ease";

  clone.style.borderRadius="13px";

  clone.style.cursor="pointer";

  clone.style.filter="none";


  clone.onclick=function(e){

    e.stopPropagation();

    removeZoom();

  };


  document.body.appendChild(clone);


  imgEl.style.visibility="hidden";


  document.body.classList.add(
    "img-zoomed"
  );


  requestAnimationFrame(()=>{

    clone.style.transform=
      "scale(1.2)";

    clone.style.boxShadow=
      "0 12px 35px rgba(0,0,0,.30)";

  });


  activeZoomedImg=imgEl;
  activeClone=clone;
}


/* =====================================================
   ZOOMU BAĞLA
===================================================== */

function removeZoom(){

  const overlay=
    document.querySelector(
      ".zoom-overlay"
    );


  if(overlay){

    overlay.remove();

  }


  if(activeClone){

    const cloneToRemove=
      activeClone;

    const imgToRestore=
      activeZoomedImg;


    cloneToRemove.style.transform=
      "scale(1)";

    cloneToRemove.style.boxShadow=
      "none";


    setTimeout(()=>{

      cloneToRemove.remove();

      if(imgToRestore){

        imgToRestore.style.visibility=
          "visible";

      }

    },300);


    activeClone=null;

  }


  activeZoomedImg=null;


  document.body.classList.remove(
    "img-zoomed"
  );

}


/* =====================================================
   REVEAL
===================================================== */

function activateReveal(){

  const elements=
    document.querySelectorAll(
      ".reveal"
    );


  if(!("IntersectionObserver" in window)){

    elements.forEach(el=>{
      el.classList.add("visible");
    });

    return;

  }


  const observer=
    new IntersectionObserver(
      entries=>{

        entries.forEach((entry,index)=>{

          if(entry.isIntersecting){

            setTimeout(()=>{

              entry.target.classList.add(
                "visible"
              );

            },index*35);

            observer.unobserve(
              entry.target
            );

          }

        });

      },
      {
        threshold:.05
      }
    );


  elements.forEach(el=>{
    observer.observe(el);
  });

}


/* =====================================================
   SƏHİFƏ AÇILIŞI
===================================================== */

document.addEventListener(
  "click",
  function(e){

    if(
      activeZoomedImg &&
      e.target!==activeClone &&
      !e.target.closest(".req-img")
    ){

      removeZoom();

    }

  }
);


loadTour(1);
