<style>
:root{--bg:#9DC3FF;--ink:#9DC3FF;--deep:#001E6F;--bright:#002E92;--dbg:#00072C;--dink:#00072C;--dl:#9DC3FF;--db:#6FA5FC;--t:24px;--b:15px;--c:15px}
body{--g:linear-gradient(135deg,var(--deep),var(--bright) 50%,var(--deep));--fg:var(--ink);--bt:var(--ink);--btc:var(--deep)}
body.dark{--g:linear-gradient(135deg,var(--dl),var(--db) 50%,var(--dl));--fg:var(--dink);--bt:var(--dink);--btc:var(--dl)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:Poppins,sans-serif;display:flex;flex-direction:column;transition:background .65s,color .65s}
body.dark{background:var(--dbg)}
button,input,textarea{font:inherit}[hidden]{display:none!important}
.page{width:min(95vw,1000px);margin:0 auto;padding:12px 0 30px;flex:1}
.nav{height:50px;border-radius:40px;background:var(--g);display:flex;align-items:center;justify-content:center;gap:40px;position:relative;font-size:15px;font-weight:500}
.nav a{color:var(--fg);text-decoration:none}
#th{position:absolute;right:6px;width:38px;height:38px;border:0;border-radius:50%;background:var(--bt);color:var(--btc);cursor:pointer;font-size:18px}
h1{text-align:center;color:var(--deep);font-size:var(--t);font-weight:700;margin:24px 0 14px;letter-spacing:-.7px}
body.dark h1,body.dark .note{color:var(--dl)}
.note{color:var(--deep);text-align:center;font-size:var(--b);font-weight:500;margin-top:8px}
.card,.tcard{background:var(--g);color:var(--fg);border-radius:28px;padding:18px 22px;margin-top:14px;box-shadow:0 10px 25px rgba(0,20,110,.07)}
.tcard{border-radius:22px;padding:12px 18px;margin-top:10px}
.center{text-align:center}.big{font-weight:700;font-size:var(--t);letter-spacing:-.7px}.sm{font-size:var(--b);font-weight:500;opacity:.9;margin-top:6px}
.pill,.pbtn,input{border:0;border-radius:999px;background:var(--bt);color:var(--btc);font-weight:700;font-size:var(--c);cursor:pointer}
.pill{display:block;width:100%;height:46px;margin-top:12px}.pill.on{outline:3px solid currentColor;outline-offset:3px}
input{width:100%;padding:10px 16px;margin-top:10px;font-weight:500;cursor:text;outline:0}
.pbtn{padding:10px 24px;margin:8px 4px 0}.pbtn:disabled,.mini:disabled{opacity:.35}
.mini{border:0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:var(--c);background:var(--bt);color:var(--btc);cursor:pointer;margin-left:6px}
.cc,.cc2{border:0;background:none;color:inherit;font-weight:800;cursor:pointer}.cc{display:block;margin:4px auto 0;font-size:34px;letter-spacing:5px}
#num{font-size:72px;font-weight:600;line-height:1.1}
.evt{text-align:center;font-weight:600;font-size:var(--b);margin-top:12px;color:var(--deep);min-height:22px}body.dark .evt{color:var(--dl)}
.info{text-align:center;font-size:var(--b);margin-top:20px;line-height:1.5}
.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;cursor:pointer}.sc{font-size:13px;font-weight:500}
.lbl{font-size:var(--b);font-weight:500;margin-top:4px}
.mem{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:var(--b);font-weight:500}
.mem.out{opacity:.4}
.tb{display:none;border-top:2px solid rgba(157,195,255,.3);margin-top:8px;padding-top:6px}.tcard.open .tb{display:block}
#buzz{display:block;width:100%;height:120px;border:0;border-radius:30px;margin-top:14px;font-size:44px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4F76D7,#2454D1 55%,#003DBF);cursor:pointer}
#buzz:disabled{opacity:.35}#buzz:active{transform:scale(.97)}
.ctl{text-align:center}
#dock{margin-top:16px;text-align:center}
#bMute{width:56px;height:56px;border:0;border-radius:50%;background:var(--g);color:var(--fg);font-size:24px;cursor:pointer}
footer{background:var(--g);color:var(--fg);padding:20px;text-align:center;font-size:15px;font-weight:500;line-height:1.6}
@media(min-width:701px){#cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}#cols #roster{margin-top:14px}}
@media(max-width:700px){:root{--t:17px;--b:9px;--c:11px}.page{width:calc(100vw - 44px)}.nav{height:46px;gap:28px;font-size:13px}.cc{font-size:28px}#num{font-size:56px}}
@media(max-width:420px){:root{--t:15px;--b:8px;--c:10px}}
</style></head><body>

<section class="card" id="lobby" style="margin-top:20px">
 <div class="big center" style="margin-bottom:16px">"Breyn Rinq"<br>Səsli otaq</div>
 <button class="pill" data-m="host">APARICI</button><button class="pill" data-m="cap">KAPİTAN</button><button class="pill" data-m="pl">OYUNÇU</button>
 <div id="form" hidden>
  <input id="fRoom" placeholder="Otaq kodu" hidden><input id="fTeam" placeholder="Komanda adı" hidden>

 </div>

<div id="game" hidden>
 <h1>"Breyn Rinq"<br>Səsli otaq</h1>
 <section class="card center" id="head"></section>
 <div id="cols">
  <div id="L">
   <section class="card center"><div class="sm">Sual <b id="q"></b> • Dəyər +<b id="v"></b></div><div id="num">20</div></section>
   <div class="evt" id="ev"></div>
   <div class="ctl" id="ctl"></div>
   <div id="teams"></div>
  </div>

 </div>

<footer>Unikal İntellektual Oyunlar Platforması<br>©πksel intellektual oyunlar klubu<br>©Onur Əlizadə</footer>

<script>
/* ===== YENİ FIREBASE LAYİHƏSİNİN MƏLUMATLARI ===== */
const CFG={apiKey:"YENI_API_KEY",authDomain:"YENI-LAYIHE.firebaseapp.com",databaseURL:"https://YENI-LAYIHE-default-rtdb.firebaseio.com",projectId:"YENI-LAYIHE"};
firebase.initializeApp(CFG);
const db=firebase.database(),$=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rnd=n=>Array.from({length:n},()=>AL[Math.random()*AL.length|0]).join(''),norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let R,S,role,stream,muted=false,mode='host',opn={},micAsk=0,pend=[],expiring=false,lastLeft=-1,off=0,ac;
const me=db.ref().push().key,pcs={},auds={};
let ICE=[{urls:'stun:stun.l.google.com:19302'}];
db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const now=()=>Date.now()+off,U=o=>db.ref('rooms/'+R).update(o);
const T=()=>Object.keys(S.teams||{}),tn=k=>S.teams[k].name,pn=i=>(S.players[i]||{}).name||'';

/* TEMA */
function setTheme(d){document.body.classList.toggle('dark',d);try{localStorage.setItem('bs-theme',d?'dark':'light')}catch(e){}}
let sv=null;try{sv=localStorage.getItem('bs-theme')}catch(e){}
setTheme(sv?sv==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
$('th').onclick=()=>setTheme(!document.body.classList.contains('dark'));

/* GİRİŞ */
function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m&&m!=='host'));
 $('form').hidden=m==='host';$('fRoom').hidden=$('fTeam').hidden=m!=='cap';$('fCode').hidden=m!=='pl';$('go').textContent=m==='cap'?'Komandanı yarat':'Komandaya qoş'}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);if(b.dataset.m==='host')enter()});
$('go').onclick=enter;
function beep(ms,f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.frequency.value=f;g.gain.value=.2;o.connect(g).connect(ac.destination);o.start(n);o.stop(n+ms/1000)}catch(e){}}

async function enter(){
 const nm=$('fName').value.trim();beep(1,1);
 try{
  if(mode==='host'){R=rnd(5);await db.ref('rooms/'+R).set({phase:'lobby',q:1,val:1,host:me,cnt:0});db.ref('rooms/'+R).onDisconnect().remove()}
  else if(mode==='cap'){
   R=norm($('fRoom').value);const tm=$('fTeam').value.trim();if(R.length<5||!nm||!tm)return alert('Otaq kodunu, komanda adını və adını yaz');
   const r=await db.ref('rooms/'+R).transaction(x=>{if(!x)return x;if(x.phase!=='lobby'||(x.cnt||0)>=100)return;const t=x.teams||{};
    if(Object.keys(t).length>=2||Object.values(t).some(a=>a.name.toLowerCase()===tm.toLowerCase()))return;
    const k=t.t1?'t2':'t1';t[k]={name:tm,score:0,code:rnd(3),cap:me};x.teams=t;(x.players=x.players||{})[me]={name:nm,team:k};x.cnt=(x.cnt||0)+1;return x});
   if(!r.committed)return alert('Otaq tapılmadı, dolub, oyun başlayıb və ya komanda adı təkrarlanır');
  }else{
   const raw=norm($('fCode').value);if(raw.length<8||!nm)return alert('Komanda kodunu və adını yaz');R=raw.slice(0,5);const tc=raw.slice(5);
   const r=await db.ref('rooms/'+R).transaction(x=>{if(!x||(x.cnt||0)>=100)return x&&undefined;const t=x.teams||{},k=Object.keys(t).find(a=>t[a].code===tc);if(!k)return;
    const ps=x.players||{};if(Object.values(ps).filter(p=>p.team===k).length>=6)return;ps[me]={name:nm,team:k};x.players=ps;x.cnt=(x.cnt||0)+1;return x});
   if(!r.committed)return alert('Kod səhvdir, komanda doludur (max 6) və ya otaq yoxdur');
   db.ref('rooms/'+R+'/players/'+me).onDisconnect().remove();
  }
 }catch(e){return alert('Xəta: '+e.message)}
 try{const j=await (await fetch('/turn')).json();if(j.iceServers)ICE=j.iceServers}catch(e){}
 db.ref('rooms/'+R+'/sig/'+me).on('child_added',s=>{const v=s.val();s.ref.remove();if(!stream)pend.push([v.f,JSON.parse(v.d)]);else onSig(v.f,JSON.parse(v.d))});
 db.ref('rooms/'+R).on('value',s=>{S=s.val();if(!S){alert('Otaq bağlandı');location.reload();return}
  render();if(stream)reconcile();else if(!micAsk){micAsk=1;getMic()}});
}

/* ===== WEBRTC (oxu qaydaları) ===== */
const tm=id=>((S.players||{})[id]||{}).team;
const peers=()=>[S.host,...Object.keys(S.players||{})].filter(i=>i!==me);
/* bağlantı lazımdırmı: aparıcı, eyni komanda və ya danışan */
const need=id=>id===S.host||me===S.host||(tm(me)&&tm(id)===tm(me))||id===S.spk||me===S.spk;
/* eşitmə: aparıcı hamıya, danışan hamıya, komanda öz içində */
function hear(id){if(me===S.host)return id===S.spk;return id===S.host||id===S.spk||(tm(me)&&tm(id)===tm(me))}
function applyMute(){for(const id in auds)auds[id].muted=!hear(id)}
function applyMic(){if(!stream)return;const out=((S.players||{})[me]||{}).out;stream.getAudioTracks().forEach(t=>t.enabled=!muted&&!out);$('bMute').textContent=muted||out?'🔇':'🎙'}
const sd=(to,d)=>db.ref('rooms/'+R+'/sig/'+to).push({f:me,d:JSON.stringify(d)});
function mkpc(id){const pc=new RTCPeerConnection({iceServers:ICE});pc._q=[];stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>e.candidate&&sd(id,{ice:e.candidate});
 pc.ontrack=e=>{let a=auds[id];if(!a){a=auds[id]=document.createElement('audio');a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{});applyMute()};
 pc.onconnectionstatechange=()=>$('net').textContent='Səs əlaqəsi: '+Object.values(pcs).filter(p=>p.connectionState==='connected').length+'/'+Object.keys(pcs).length;
 return pcs[id]=pc}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(auds[id]){auds[id].srcObject=null;auds[id].remove();delete auds[id]}}
async function reconcile(){const l=peers();Object.keys(pcs).forEach(i=>{if(!l.includes(i)||!need(i))drop(i)});
 for(const id of l){if(need(id)&&!pcs[id]&&me<id){const pc=mkpc(id);await pc.setLocalDescription(await pc.createOffer());sd(id,{sdp:pc.localDescription})}}applyMute()}
async function onSig(f,d){if(!S||!peers().includes(f))return;const pc=pcs[f]||mkpc(f);
 try{if(d.sdp){await pc.setRemoteDescription(d.sdp);for(const c of pc._q.splice(0))await pc.addIceCandidate(c);
  if(d.sdp.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());sd(f,{sdp:pc.localDescription})}}
  else if(d.ice){pc.remoteDescription?await pc.addIceCandidate(d.ice):pc._q.push(d.ice)}}catch(e){}}
async function getMic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return alert('Mikrofon icazəsi lazımdır.')}
 applyMic();await reconcile();pend.splice(0).forEach(([f,d])=>onSig(f,d))}
$('bMute').onclick=()=>{muted=!muted;applyMic()};

/* ===== OYUN MƏNTİQİ ===== */
function nextQ(x){const o={phase:'idle',q:S.q+1,val:1,buzz:null,spk:null,usedSpk:null,capTalk:null,timerEnd:null,rem:null,ev:null};
 T().forEach(k=>{o['teams/'+k+'/lock']=null;o['teams/'+k+'/wrong']=null});return Object.assign(o,x)}
function clearOuts(o){Object.keys(S.players||{}).forEach(i=>{if(S.players[i].out)o['players/'+i+'/out']=null});
 T().forEach(k=>{if(S.teams[k].origBtn)o['teams/'+k+'/btn']=S.teams[k].origBtn});return o}
const H={
 begin:()=>U({phase:'idle'}),
 start:()=>U({phase:'run',t0:now(),timerEnd:now()+20000,ev:'VAXT!',buzz:null,spk:null,usedSpk:null,capTalk:null}),
 pts(n){const k=S.buzz.team,sc=S.teams[k].score+n;
  if(sc>=5)U(clearOuts({['teams/'+k+'/score']:sc,phase:'finished',ev:'🏆 '+tn(k)+' KOMANDASI QALİB OLDU!',timerEnd:null,spk:null,usedSpk:null,buzz:null}));
  else U(nextQ({['teams/'+k+'/score']:sc}))},
 wrong(){const b=S.buzz,k=b.team,o=T().find(x=>x!==k),sp=S.spk,u={};let pen='';
  if(b.first&&sp&&sp!==S.teams[k].cap){u['players/'+sp+'/out']=true;if(S.teams[k].btn===sp)u['teams/'+k+'/btn']=null;pen=pn(sp)+' CƏRİMƏLƏNDİ! '}
  const ot=S.teams[o];if(!ot||ot.lock||ot.wrong)return H.unres(u);
  U(Object.assign(u,{['teams/'+k+'/wrong']:true,phase:'run',timerEnd:now()+S.rem*1000,buzz:null,spk:null,usedSpk:null,ev:pen+'QALAN VAXT '+ot.name+' KOMANDASININ'}))},
 unres(u){const big=S.val>=3,o=nextQ({val:big?1:S.val+1,ev:big?'Tapılmadı. Tur bitdi, xallar sıfırlandı, cərimələr silindi.':null});
  if(big){T().forEach(k=>o['teams/'+k+'/score']=0);clearOuts(o)}else Object.assign(o,u||{});U(o)},
 newgame(){const o=nextQ({q:1});T().forEach(k=>o['teams/'+k+'/score']=0);clearOuts(o);U(o)},
 grant(k){U({spk:S.teams[k].cap,capTalk:true,['teams/'+k+'/want']:null})},
 endtalk:()=>U({spk:null,capTalk:null}),
 lift(i){const k=S.players[i].team,u={['players/'+i+'/out']:null};if(!S.teams[k].btn&&S.teams[k].origBtn===i)u['teams/'+k+'/btn']=i;U(u)}
};
async function buzz(){const k=tm(me);
 await db.ref('rooms/'+R).transaction(r=>{if(!r)return r;const t=r.teams[k],p=r.players[me];if(!t||t.btn!==me||p.out||t.lock||t.wrong)return;const n=now();
  if(r.phase==='idle'){t.lock=true;p.out=true;t.btn=null;r.ev=t.name+' KOMANDASI FALSTART ETDİ! '+p.name+' CƏRİMƏLƏNDİ! '+t.name+' bu suala cavab hüququnu itirir.'}
  else if(r.phase==='run'&&r.timerEnd>n){r.rem=Math.max(1,Math.ceil((r.timerEnd-n)/1000));r.buzz={team:k,at:n,first:n-r.t0<=1000};r.phase='ans';r.spk=t.cap;r.usedSpk=null;r.timerEnd=null;r.ev=null}
  else return;return r})}

/* ===== EKRAN ===== */
function evText(){const P=S.players||{},Tm=S.teams||{};
 if(S.phase==='lobby')return 'Komandalar qoşulur. Aparıcı oyunu başladacaq.';
 if(S.phase==='ans'&&S.buzz){const b=S.buzz,t=Tm[b.team];return (b.first?'İLK SANİYƏ! ':'')+t.name+' KOMANDASI DÜYMƏNİ SIXDI. '+(S.spk===t.cap?t.name+' komandasının kapitanı '+pn(t.cap)+' danışır':pn(S.spk)+' CAVAB VERİR')}
 if(S.phase==='idle'){const vm={1:'1 xallıq sual',2:'2 XALLIQ SUAL SƏSLƏNİR!',3:'3 XALLIQ SUAL, TAPILMASA DİSKVALİFİKASİYA'}[S.val]||'';
  return (S.capTalk&&S.spk?'Kapitan '+pn(S.spk)+' aparıcı ilə danışır. ':'')+(S.ev?S.ev+' — ':'')+vm}
 return S.ev||''}
function rows(k,h,mk){const P=S.players||{},t=S.teams[k],ph=S.phase;
 return Object.keys(P).filter(i=>P[i].team===k).sort((a,b)=>(!!P[a].out)-(!!P[b].out)).map(i=>{const p=P[i],c=t.cap===i,o=p.out;let a='';
  if(role==='cap'&&k===mk&&!o){if((ph==='lobby'||ph==='idle')&&t.btn!==i&&!c)a+=`<button class="mini" data-a="d" data-id="${i}">D</button>`;
   if(i!==me)a+=`<button class="mini" data-a="mic" data-id="${i}" ${ph==='ans'&&S.spk===me&&!S.usedSpk?'':'disabled'}>🎙</button>`}
  if(h&&o)a=`<button class="mini" data-a="lift" data-id="${i}">↩</button>`;
  return `<div class="mem${o?' out':''}"><span>${c?'<b>'+esc(p.name)+'</b> (K)':esc(p.name)}${t.btn===i?' (D)':''}${o?' (X)':''}${S.spk===i?' 🎙':''}</span>${a}</div>`}).join('')}
function render(){
 const h=me===S.host,P=S.players||{},Tm=S.teams||{},mk=tm(me),mt=Tm[mk],ph=S.phase;
 role=h?'host':!mt?'':mt.cap===me?'cap':mt.btn===me?'btn':'pl';
 $('lobby').hidden=true;$('game').hidden=false;
 $('head').innerHTML=h?`<div class="big">Otaq kodu:</div><button class="cc" data-copy="${R}">${R}</button><div class="sm">Kodu kapitanlara ver</div>`
  :`<div class="big">${esc(mt?mt.name:'')} komandası</div><div class="sm">Otaq kodu: <button class="cc2" data-copy="${R}">${R}</button></div>`+(role==='cap'?`<div class="sm">Komanda kodu (oyunçulara ver):</div><button class="cc" data-copy="${R+mt.code}">${R+mt.code}</button>`:'');
 $('q').textContent=S.q;$('v').textContent=S.val;
 let e=evText();if(role==='cap'&&ph!=='lobby'&&!mt.btn&&!mt.lock)e='YENİ DÜYMƏSİXAN seç. '+e;$('ev').textContent=e;
 /* idarəetmə */
 const b=(a,t,d)=>`<button class="pbtn" data-a="${a}" ${d?'disabled':''}>${t}</button>`;let c='';
 if(h){const ks=T();
  if(ph==='lobby')c=b('begin','Oyuna başla',ks.length<2);
  else if(ph==='idle'){const all=ks.length>1&&ks.every(k=>Tm[k].lock);
   c=all?b('unres','DOĞRU CAVAB YOXDUR'):b('start','VAXT! - 20 SANİYƏ',ks.some(k=>!Tm[k].btn&&!Tm[k].lock)||ks.length<2);
   if(S.capTalk)c+=b('endtalk',pn(S.spk)+' ilə danışığı bitir')}
  else if(ph==='ans')c=b('p1','+1')+b('p2','+2')+b('p3','+3')+'<br>'+b('wrong','QALAN VAXT RƏQİBİN')+b('unres','DOĞRU CAVAB YOXDUR');
  else if(ph==='exp')c=b('unres','DOĞRU CAVAB YOXDUR');
  else if(ph==='finished')c=b('newgame','YENİ OYUN')}
 if(role==='cap'&&(ph==='lobby'||ph==='idle'))c=b('want',mt.want?'İstək göndərildi':'Aparıcı ilə danışmaq istəyirəm',!!mt.want||!!S.capTalk);
 if(role==='btn'){const ok=(ph==='idle'||ph==='run')&&!mt.lock&&!mt.wrong&&!(P[me]||{}).out;c=`<button id="buzz" data-a="buzz" ${ok?'':'disabled'}>BAS!</button>`}
 $('ctl').innerHTML=c;
 /* komandalar */
 $('teams').innerHTML=T().map(k=>{const t=Tm[k];
  let lb=t.name+'';if(ph==='ans'&&S.buzz&&S.buzz.team===k)lb=S.spk===t.cap?'KAPİTAN':pn(S.spk).toUpperCase();else lb='';
  return `<div class="tcard${opn[k]?' open':''}"><div class="tt" data-tg="${k}"><span>${h&&t.want?`<button class="mini" data-a="grant" data-id="${k}" style="margin:0 6px 0 0">✋</button>`:''}"${esc(t.name)}" <span class="sc">${t.score} xal</span></span><span>▾</span></div>${lb?`<div class="lbl">${esc(t.name)}: ${esc(lb)}</div>`:''}${(h||k!==mk)?`<div class="tb">${rows(k,h,mk)}</div>`:''}</div>`}).join('')||'<div class="note">Hələ komanda yoxdur.</div>';
 $('roster').hidden=h||!mt;if(mt)$('roster').innerHTML=`<b>Komandam</b>${rows(mk,h,mk)}`;
 applyMic();applyMute();
}

/* KLİK */
document.addEventListener('click',async e=>{
 const cp=e.target.closest('[data-copy]');if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);const o=cp.textContent;cp.textContent='KOPYALANDI ✓';setTimeout(()=>cp.textContent=o,900)}catch(x){}return}
 const tg=e.target.closest('[data-tg]');if(tg&&!e.target.closest('[data-a]')){const c=tg.parentElement;c.classList.toggle('open');opn[tg.dataset.tg]=c.classList.contains('open');return}
 const a=e.target.closest('[data-a]');if(!a||!S)return;const id=a.dataset.id;
 switch(a.dataset.a){
  case'begin':return H.begin();case'start':beep(1,1);return H.start();case'p1':return H.pts(1);case'p2':return H.pts(2);case'p3':return H.pts(3);
  case'wrong':return H.wrong();case'unres':return H.unres();case'newgame':return H.newgame();case'endtalk':return H.endtalk();
  case'grant':return H.grant(id);case'lift':return H.lift(id);case'buzz':return buzz();
  case'want':return U({['teams/'+tm(me)+'/want']:true});
  case'd':{const k=tm(me),u={['teams/'+k+'/btn']:id};if(S.phase==='lobby'||!S.teams[k].origBtn)u['teams/'+k+'/origBtn']=id;return U(u)}
  case'mic':if(S.phase==='ans'&&S.spk===me&&!S.usedSpk)return U({spk:id,usedSpk:id});
 }});
$('fName').addEventListener('keydown',e=>e.key==='Enter'&&enter());

/* TAYMER */
setInterval(()=>{if(!S)return;let l=20;
 if(S.phase==='run')l=Math.max(0,Math.ceil((S.timerEnd-now())/1000));else if(S.phase==='ans')l=S.rem||0;else if(S.phase==='exp'||S.phase==='finished')l=0;
 $('num').textContent=l;
 if(S.phase==='run'&&l!==lastLeft){lastLeft=l;if(l===10)beep(700,880);if(l>=1&&l<=3)beep(180,1300);if(l===0)beep(1500,700)}
 if(me===S.host&&S.phase==='run'&&S.timerEnd<=now()&&!expiring){expiring=true;U({phase:'exp',timerEnd:null,spk:null,ev:'VAXT BİTDİ - DOĞRU CAVAB YOXDUR'}).finally(()=>setTimeout(()=>expiring=false,600))}
},250);
</script></body></html>
