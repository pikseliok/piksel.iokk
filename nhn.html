<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9DC3FF">
<title>NHN otağı - πksel.iok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#9DC3FF;--ink:#9DC3FF;--deep:#001E6F;--bright:#002E92;--dark-bg:#00072C;--dark-ink:#00072C;--dark-light:#9DC3FF;--dark-bright:#6FA5FC}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Poppins",sans-serif;overflow-x:hidden;transition:background .65s,color .65s;-webkit-font-smoothing:antialiased}
body.dark{background:var(--dark-bg);color:var(--dark-ink)}
button,input,textarea{font:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.page{width:min(95vw,820px);margin:0 auto;padding:12px 0 40px}
.top-nav{height:60px;border-radius:40px;padding:0 14px 0 26px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--deep),var(--bright) 50%,var(--deep))}
.dark .top-nav,.dark .card,.dark footer{background:linear-gradient(135deg,var(--dark-light),var(--dark-bright) 50%,var(--dark-light))}
.nav-links{display:flex;gap:58px}
.nav-link{font-size:20px;font-weight:500;white-space:nowrap}
.dark .nav-link{color:var(--dark-ink)}
.theme-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--deep);background:rgba(157,195,255,.98)}
.dark .theme-toggle{background:var(--dark-bg);color:var(--dark-light)}
.theme-icon{width:25px;height:25px}
h1{text-align:center;color:var(--deep);font-size:28px;font-weight:700;letter-spacing:-.8px;margin:26px 0 14px}
.dark h1{color:var(--dark-light)}
.card{border-radius:31px;background:linear-gradient(135deg,var(--deep),var(--bright) 49%,var(--deep));color:var(--ink);padding:24px 26px;margin-top:14px;box-shadow:0 10px 25px rgba(0,20,110,.07)}
.dark .card{color:var(--dark-ink)}
.sm{font-size:13px;font-weight:500;opacity:.85;margin-top:6px;line-height:1.4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--ink);color:var(--deep);transition:transform .2s,opacity .2s}
.dark .btn{background:var(--dark-ink);color:var(--dark-light)}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.on{outline:3px solid currentColor;outline-offset:2px}
.btn.big{padding:12px 24px;font-size:16px}
input,textarea{width:100%;border:0;border-radius:18px;padding:11px 16px;margin-top:10px;background:var(--ink);color:var(--deep);font-weight:500;outline:none}
.dark input,.dark textarea{background:var(--dark-ink);color:var(--dark-light)}
textarea{resize:vertical;min-height:70px}
.code{font-weight:700;font-size:22px;letter-spacing:3px}
.timer{font-size:56px;font-weight:700;text-align:center;letter-spacing:-2px;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.team{border-top:2px solid rgba(157,195,255,.25);padding-top:12px;margin-top:12px}
.dark .team{border-color:rgba(0,7,44,.2)}
.team:first-child{border:0;margin-top:0;padding-top:0}
.th{display:flex;justify-content:space-between;font-size:18px}
.mem{margin-top:6px;font-size:15px;font-weight:500}
.ans{margin-top:8px;font-weight:600;word-break:break-word}
footer{margin-top:20px;background:linear-gradient(100deg,var(--deep),var(--bright) 50%,var(--deep));color:var(--ink);padding:26px 20px;text-align:center;font-size:15px;font-weight:500;line-height:1.7}
.dark footer{color:var(--dark-ink)}
@media(max-width:700px){.page{width:calc(100vw - 44px)}.top-nav{height:52px;padding-right:60px}.nav-links{gap:34px}.nav-link{font-size:15px}.theme-toggle{width:39px;height:39px;right:8px}.theme-icon{width:22px;height:22px}h1{font-size:22px}.card{padding:20px}.timer{font-size:46px}}
</style>
</head>
<body>
<div class="page">
<nav class="top-nav">
  <div class="nav-links"><a class="nav-link" href="index.html">Əsas Səhifə</a><a class="nav-link" href="contact.html">Bizimlə Əlaqə</a></div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Rejimi dəyiş"><svg id="themeIcon" class="theme-icon" viewBox="0 0 32 32"></svg></button>
</nav>
<h1>NHN səsli otağı</h1>

<section class="card" id="lobby">
  <div class="tabs">
    <button class="btn on" data-m="host">Aparıcıyam</button>
    <button class="btn" data-m="cap">Kapitanam</button>
    <button class="btn" data-m="pl">Oyunçuyam</button>
  </div>
  <div class="sm" id="hint">Otaq yaradırsan. Düyməyə basanda mikrofona icazə ver.</div>
  <input id="fRoom" placeholder="Otaq kodu (aparıcıdan al)" hidden>
  <input id="fTeam" placeholder="Komanda adı" hidden>
  <input id="fCode" placeholder="Komanda kodu (kapitandan al)" hidden>
  <input id="fName" placeholder="Adın" hidden>
  <div class="row"><button class="btn big" id="go">Otaq yarat</button></div>
</section>

<div id="game" hidden>
  <section class="card"><div id="head"></div><div class="sm" id="spk"></div></section>
  <section class="card"><div class="timer" id="timer">--:--</div><div class="sm" id="phase" style="text-align:center"></div></section>

  <section class="card" id="hostbox" hidden>
    <b>Aparıcı paneli</b>
    <input id="secs" type="number" min="5" max="600" value="60" placeholder="Müzakirə vaxtı (saniyə)">
    <div class="row">
      <button class="btn" id="bBegin">Oyuna başla</button>
      <button class="btn" id="bAsk">Sualı oxudum, taymeri başlat</button>
      <button class="btn" id="bNext">Növbəti sual</button>
      <button class="btn" id="bEnd">Danışığı bitir</button>
    </div>
  </section>

  <section class="card" id="ansbox" hidden>
    <b>Komandanın yekun cavabı</b>
    <textarea id="aText" maxlength="300" placeholder="Müzakirədən sonra cavabı bura yaz"></textarea>
    <div class="row"><button class="btn" id="aSend">Aparıcıya göndər</button><span class="sm" id="aInfo"></span></div>
  </section>

  <section class="card"><div id="teams"></div></section>

  <div class="row" style="justify-content:center">
    <button class="btn" id="bTalk" hidden>Aparıcı ilə danışmaq istəyirəm</button>
    <button class="btn" id="bMute">Mikrofonu söndür</button>
    <button class="btn" id="bSound" hidden>Səsi aç</button>
  </div>
  <div class="sm" id="net" style="text-align:center;margin-top:10px"></div>
</div>
</div>

<footer>
  <div>İntellektuallar üçün hər şey...</div>
  <a href="https://www.instagram.com/piksel.iok" target="_blank" rel="noopener noreferrer">©πksel intellektual oyunlar klubu</a><br>
  <a href="https://www.instagram.com/onurelzh" target="_blank" rel="noopener noreferrer">©Onur Əlizadə</a>
</footer>

<script>
const WS='wss://piksel-nhn.pikseliok.workers.dev/room/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));

/* ---------- Tema ---------- */
const sun='<circle cx="16" cy="16" r="6" fill="currentColor"/><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M16 2.7v3"/><path d="M16 26.3v3"/><path d="m2.7 16 3 0"/><path d="m26.3 16-3 0"/><path d="m6.6 6.6 2.1 2.1"/><path d="m23.3 23.3 2.1 2.1"/><path d="m25.4 6.6-2.1 2.1"/><path d="m8.7 23.3-2.1 2.1"/></g>';
const moon='<path d="M25.4 20.8A11.7 11.7 0 0 1 11.2 6.6a11.8 11.8 0 1 0 14.2 14.2Z" fill="currentColor"/>';
function setTheme(d){document.body.classList.toggle('dark',d);localStorage.setItem('piksel-theme',d?'dark':'light');$('themeIcon').innerHTML=d?moon:sun}
setTheme(localStorage.getItem('piksel-theme')==='dark');
$('themeToggle').onclick=()=>setTheme(!document.body.classList.contains('dark'));

/* ---------- Giriş ---------- */
let mode='host';
const hints={host:'Otaq yaradırsan. Düyməyə basanda mikrofona icazə ver.',cap:'Aparıcının verdiyi otaq kodunu, komanda adını və öz adını yaz.',pl:'Kapitanın verdiyi komanda kodunu və öz adını yaz.'};
const goText={host:'Otaq yarat',cap:'Komandanı yarat',pl:'Komandaya qoşul'};
function setMode(m){
  mode=m;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('fRoom').hidden=$('fTeam').hidden=m!=='cap';
  $('fCode').hidden=m!=='pl';
  $('fName').hidden=m==='host';
  $('hint').textContent=hints[m];$('go').textContent=goText[m];
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode('host');

/* ---------- Əlaqə ---------- */
let ws,me,S,room,stream,off=0,muted=false,lastEnds=0;
const pcs={},auds={};
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

$('go').onclick=async()=>{
  let first;
  if(mode==='host'){room=Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');first={t:'host'}}
  else if(mode==='cap'){
    room=norm($('fRoom').value);
    if(room.length<4||!$('fTeam').value.trim()||!$('fName').value.trim())return alert('Otaq kodunu, komanda adını və adını yaz');
    first={t:'captain',team:$('fTeam').value,name:$('fName').value};
  }else{
    const raw=norm($('fCode').value);
    if(raw.length<8||!$('fName').value.trim())return alert('Komanda kodunu və adını yaz');
    room=raw.slice(0,-4);first={t:'player',code:raw.slice(-4),name:$('fName').value};
  }
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){return alert('Mikrofon icazəsi lazımdır. Brauzer ayarlarından icazə ver.')}
  ws=new WebSocket(WS+room);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='hello'){me=m.id;send(first)}
    else if(m.t==='error'){alert(m.msg);if(!S)location.reload()}
    else if(m.t==='state'){S=m;off=m.now-Date.now();render();reconcile()}
    else if(m.t==='signal')onSignal(m.from,m.data);
    else if(m.t==='closed'){alert('Aparıcı otaqdan çıxdı');location.reload()}
  };
  ws.onclose=()=>{if(S){alert('Əlaqə kəsildi');location.reload()}};
};

/* ---------- Səs (WebRTC) ---------- */
function peers(){
  const list=S.teams.flatMap((t,i)=>t.members.map(m=>({id:m.id,tk:i})));
  if(S.hostId)list.push({id:S.hostId,host:true});
  return list;
}
const myTk=()=>{const p=peers().find(x=>x.id===me);return p?p.tk:-1};
function want(p){
  if(p.host||S.role==='host')return true;
  if(p.tk===myTk())return true;
  return p.id===S.speaker||me===S.speaker;
}
function hear(id){
  if(S.role==='host')return id===S.speaker;
  const p=peers().find(x=>x.id===id);
  return id===S.hostId||id===S.speaker||(p&&p.tk===myTk());
}
function applyMute(){for(const id in auds)auds[id].muted=!hear(id)}
function mk(id){
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc._q=[];
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.onicecandidate=e=>e.candidate&&send({t:'signal',to:id,data:{ice:e.candidate}});
  pc.ontrack=e=>{
    let a=auds[id];
    if(!a){a=auds[id]=new Audio();a.autoplay=true}
    a.srcObject=e.streams[0];a.play().catch(()=>{$('bSound').hidden=false});applyMute();
  };
  pc.onconnectionstatechange=showNet;
  pcs[id]=pc;return pc;
}
function showNet(){
  if(!S)return;
  const names={};S.teams.forEach(t=>t.members.forEach(m=>names[m.id]=m.name));
  names[S.hostId]='Aparıcı';
  const tr={connected:'qoşuldu',connecting:'qoşulur',new:'başlayır',failed:'alınmadı',disconnected:'kəsildi',closed:'bağlandı'};
  const l=Object.keys(pcs).map(id=>(names[id]||id)+': '+(tr[pcs[id].connectionState]||pcs[id].connectionState));
  $('net').textContent=l.length?'Səs əlaqəsi: '+l.join(' | '):'Səs əlaqəsi hələ yoxdur';
}
$('bSound').onclick=()=>{for(const id in auds)auds[id].play().catch(()=>{});$('bSound').hidden=true};
function drop(id){
  if(pcs[id]){pcs[id].close();delete pcs[id]}
  if(auds[id]){auds[id].srcObject=null;delete auds[id]}
}
async function reconcile(){
  const list=peers().filter(p=>p.id!==me),ids=list.map(p=>p.id);
  Object.keys(pcs).forEach(id=>{if(!ids.includes(id))drop(id)});
  for(const p of list){
    const has=!!pcs[p.id],w=want(p);
    if(!w&&has)drop(p.id);
    else if(w&&!has&&me<p.id){
      const pc=mk(p.id);
      await pc.setLocalDescription(await pc.createOffer());
      send({t:'signal',to:p.id,data:{sdp:pc.localDescription}});
    }
  }
  applyMute();showNet();
}
async function onSignal(from,d){
  const pc=pcs[from]||mk(from);
  try{
    if(d.sdp){
      await pc.setRemoteDescription(d.sdp);
      for(const c of pc._q.splice(0))await pc.addIceCandidate(c);
      if(d.sdp.type==='offer'){
        await pc.setLocalDescription(await pc.createAnswer());
        send({t:'signal',to:from,data:{sdp:pc.localDescription}});
      }
    }else if(d.ice){
      if(pc.remoteDescription)await pc.addIceCandidate(d.ice);else pc._q.push(d.ice);
    }
  }catch(e){}
}

/* ---------- Ekran ---------- */
function render(){
  const h=S.role==='host',cap=S.role==='captain';
  $('lobby').hidden=true;$('game').hidden=false;
  const myT=S.teams.find(t=>t.members.some(m=>m.id===me));
  $('head').innerHTML=h
    ?`<b>Otaq kodu:</b> <span class="code">${room}</span><div class="sm">Bu kodu kapitanlara ver. Komanda kodlarını aşağıda görürsən.</div>`
    :`<b>${esc(myT&&myT.name)}</b> komandası (${cap?'kapitan':'oyunçu'})<div class="sm">Komanda kodu: <span class="code">${room}${myT?myT.code:''}</span><br>Bu kodu komanda yoldaşlarına ver.</div>`;
  $('hostbox').hidden=!h;$('ansbox').hidden=!cap;$('bTalk').hidden=!cap;
  const ph=S.phase;
  if(h){
    $('bBegin').hidden=ph!=='lobby';$('bBegin').disabled=S.teams.length<2;
    $('bAsk').hidden=ph!=='idle';
    $('bNext').hidden=!(ph==='running'||ph==='ended');
    $('bEnd').hidden=!S.speaker;$('secs').hidden=ph==='lobby';
  }
  if(cap){
    const on=ph==='running';
    $('aText').disabled=$('aSend').disabled=!on;
    if(on&&S.endsAt!==lastEnds){lastEnds=S.endsAt;$('aText').value='';$('aInfo').textContent=''}
    const mm=myT&&myT.members.find(m=>m.id===me);
    $('bTalk').disabled=!!(mm&&mm.wants)||S.speaker===me;
    $('bTalk').textContent=mm&&mm.wants?'İstək göndərildi, aparıcının cavabını gözlə':'Aparıcı ilə danışmaq istəyirəm';
  }
  const spName=S.teams.flatMap(t=>t.members).find(m=>m.id===S.speaker);
  $('spk').textContent=S.speaker===me?'Aparıcı səni dinləyir. Səsini hamı eşidir.':spName?`${spName.name} aparıcı ilə danışır, hamı eşidir.`:'';
  $('phase').textContent={lobby:'Komandalar qoşulur. Aparıcı oyunu başladacaq.',idle:'Aparıcı sualı oxuyur.',running:'Müzakirə gedir. Yalnız komandanın içində danışın.',ended:'Vaxt bitdi. Aparıcı cavabları yoxlayır.'}[ph]||'';
  $('teams').innerHTML=S.teams.length?S.teams.map(t=>
    `<div class="team"><div class="th"><b>${esc(t.name)}</b><span>${t.score} xal</span></div>`+
    (h?`<div class="sm">Komanda kodu: <span class="code" style="font-size:16px">${room}${t.code}</span></div>`:'')+
    t.members.map(m=>`<div class="mem">${esc(m.name)}${m.captain?' (kapitan)':''}${m.id===S.speaker?' 🎙':''}${m.wants?' ✋':''}${h&&m.wants?` <button class="btn" data-a="grant" data-id="${m.id}">Qəbul et</button>`:''}</div>`).join('')+
    (h&&t.answered?`<div class="ans">Cavab: ${esc(t.answer)}</div>`:(!h&&t.answered&&(ph==='running'||ph==='ended')?'<div class="sm">Cavab göndərildi</div>':''))+
    (h&&ph!=='lobby'?`<div class="row"><button class="btn" data-a="pt" data-c="${t.code}" data-d="1">+1 xal</button><button class="btn" data-a="pt" data-c="${t.code}" data-d="-1">−1</button></div>`:'')+
    '</div>').join(''):'<div class="sm">Hələ komanda yoxdur.</div>';
  applyMute();
}
$('teams').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='grant')send({t:'talkgrant',id:b.dataset.id});
  if(b.dataset.a==='pt')send({t:'score',code:b.dataset.c,delta:Number(b.dataset.d)});
};
$('bBegin').onclick=()=>send({t:'begin'});
$('bAsk').onclick=()=>send({t:'ask',seconds:Number($('secs').value)||60});
$('bNext').onclick=()=>send({t:'next'});
$('bEnd').onclick=()=>send({t:'talkend'});
$('bTalk').onclick=()=>send({t:'talkreq'});
$('aSend').onclick=()=>{send({t:'answer',text:$('aText').value});$('aInfo').textContent='Göndərildi. Vaxt bitənə qədər dəyişə bilərsən.'};
$('bMute').onclick=()=>{
  muted=!muted;
  stream.getAudioTracks().forEach(t=>t.enabled=!muted);
  $('bMute').textContent=muted?'Mikrofonu aç':'Mikrofonu söndür';
};
setInterval(()=>{
  if(!S)return;
  if(S.phase==='running'){
    const left=Math.max(0,Math.ceil((S.endsAt-(Date.now()+off))/1000));
    $('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  }else $('timer').textContent=S.phase==='ended'?'Vaxt bitdi':'--:--';
},250);
</script>
</body>
</html>
