function lev(a, b) { let p = [...Array(b.length + 1).keys()]; for (let i = 1; i <= a.length; i++) { let c = [i]; for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1)); p = c; } return p[b.length]; }
const tol = n => n < 4 ? 0 : n <= 5 ? 1 : n <= 7 ? 2 : n <= 10 ? 3 : 4;
let UID = 0; const ALL = [];

  if (V == "home") app.innerHTML = `<h2 class="section-title${F(1)}">πksel Ruleti</h2><div class="card${F(2)}"><div class="ct">Dostunla onlayn oyna</div><div class="card-divider"></div><p class="cd">Hər kəsin 1 canı var. Sualı səhv cavablayan güllə yeyir. Mövzunu seç, düzgün cavabla və sağ qal.</p><input class="in" maxlength="14" placeholder="Adın" value="${E(myName)}" oninput="nin(this.value)"><p class="cd" id="hm">${E(msg)}</p><div class="col">${btn("pk", "mkRoom()", "Otaq yarat")}${btn("", "V='join';msg='';R()", "Otağa qoş")}</div></div>`;
  else app.innerHTML = `<h2 class="section-title${F(1)}">Otağa qoş</h2><div class="card${F(2)}"><div class="ct">Otaq kodunu yaz</div><div class="card-divider"></div><input class="in" id="jc" maxlength="5" placeholder="KOD" style="text-transform:uppercase;letter-spacing:4px;text-align:center" onkeydown="if(event.key=='Enter')joinRoom()"><input class="in" maxlength="14" placeholder="Adın" value="${E(myName)}" oninput="nin(this.value)"><p class="cd" id="hm" style="text-align:center">${E(msg)}</p><div class="col">${btn("pk", "joinRoom()", "Qoşul")}${btn("", "V='home';msg='';R()", "Geri")}</div></div>`;
}
R();
</script>
<script src="/footer.js"></script>
