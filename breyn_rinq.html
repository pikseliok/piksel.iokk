/* ===== YENİ FIREBASE LAYİHƏSİNİN AYARLARINI BURAYA YAZ ===== */
const CFG={apiKey:"YENI_API_KEY",authDomain:"YENI-LAYIHE.firebaseapp.com",databaseURL:"https://YENI-LAYIHE-default-rtdb.firebaseio.com",projectId:"YENI-LAYIHE",appId:"YENI_APP_ID"};
const TURN_URL='https://piksel-nhn.pikseliok.workers.dev/turn';
firebase.initializeApp(CFG);const db=firebase.database();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd=n=>Array.from({length:n},()=>ALPHA[Math.random()*ALPHA.length|0]).join('');
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const opp=k=>k==='blue'?'pink':'blue';
const VT=v=>v===2?'2 XALLIQ SUAL SƏSLƏNİR!':v>=3?'3 XALLIQ SUAL, TAPILMASA DİSKVALİFİKASİYA':'';

/* TEMA */
const rays=[...document.querySelectorAll('.ray')];
function setTheme(d,anim){document.body.classList.toggle('dark',d);try{localStorage.setItem('piksel-theme',d?'dark':'light')}catch(e){}
 if(anim)rays.forEach(r=>{r.getAnimations().forEach(a=>a.cancel());const a=r.animate(d?[{transform:'translateY(0)',opacity:1},{transform:'translateY(-14px)',opacity:0}]:[{transform:'translateY(11px)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:d?520:620,delay:d?0:180,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});a.onfinish=()=>a.cancel()})}
let sv=null;try{sv=localStorage.getItem('piksel-theme')}catch(e){}
setTheme(sv?sv==='dark':!!(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),false);
$('themeToggle').onclick=()=>setTheme(!document.body.classList.contains('dark'),true);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
document.addEventListener('pointermove',e=>{const c=e.target.closest('.card,.tcard');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});

/* DƏYİŞƏNLƏR */
let R,me,tk,mode='host',off=0,stream,muted=false,micAsk=false,curVol=.5,audioCtx=null,entered=false;
let S={g:{},t:{},p:{},req:{},host:null},loaded={};
let ICE=[{urls:'stun:stun.l.google.com:19302'}];
const pcs={},auds={},open={};
const now=()=>Date.now()+off;
const ref=p=>db.ref('rooms/'+R+(p?'/'+p:''));
db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const isHost=()=>mode==='host';
const role=()=>{if(isHost())return'host';const t=S.t[tk];return t&&t.cap===me?'cap':t&&t.bz===me?'bz':'pl'};
const mem=k=>Object.entries(S.p).filter(([i,p])=>p.tk===k).map(([id,p])=>({id,...p}));
const pen=id=>!!(S.g.pen&&S.g.pen[id]);
const pname=id=>(S.p[id]&&S.p[id].name)||'';
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',ensureAudio,{passive:true});

/* GİRİŞ */
function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m&&m!=='host'));$('form').hidden=m==='host';$('fRoom').hidden=$('fTeam').hidden=m!=='cap';$('fCode').hidden=m!=='pl';$('go').textContent=m==='cap'?'Komandanı yarat':'Komandaya qoş'}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);if(b.dataset.m==='host')start()});
$('go').onclick=()=>start();
setMode('host');

async function start(){
 ensureAudio();me=db.ref().push().key;const pn=$('fName').value.trim();
 try{
  if(mode==='host'){
   R=rnd(5);await ref().set({host:me,g:{st:'wait',q:1,v:1,ev:''}});ref().onDisconnect().remove();
  }else if(mode==='cap'){
   R=norm($('fRoom').value);const nm=$('fTeam').value.trim();
   if(R.length<4||!nm||!pn)return alert('Otaq kodunu, komanda adını və adını yaz');
   if(!(await ref('host').once('value')).val())return alert('Belə otaq yoxdur');
   const ts=(await ref('t').once('value')).val()||{};
   if(Object.values(ts).some(t=>t.name.toLowerCase()===nm.toLowerCase()))return alert('Bu komanda adı artıq istifadə olunub');
   const k=['blue','pink'].find(c=>!ts[c]);if(!k)return alert('Bu otaqda artıq 2 komanda var');
   const r=await ref('t/'+k).transaction(c=>c===null?{name:nm,score:0,cap:me,code:rnd(4)}:undefined);
   if(!r.committed)return alert('Yer tutuldu, yenidən cəhd et');
   tk=k;await ref('p/'+me).set({name:pn,tk});ref('p/'+me).onDisconnect().remove();
  }else{
   const raw=norm($('fCode').value);if(raw.length<8||!pn)return alert('Komanda kodunu və adını yaz');
   R=raw.slice(0,-4);const c=raw.slice(-4);
   const ts=(await ref('t').once('value')).val()||{};const k=['blue','pink'].find(x=>ts[x]&&ts[x].code===c);
   if(!k)return alert('Komanda tapılmadı');
   const ps=(await ref('p').once('value')).val()||{};
   if(Object.values(ps).filter(p=>p.tk===k).length>=6)return alert('Komandada 6 nəfər var (maksimum)');
   tk=k;await ref('p/'+me).set({name:pn,tk});ref('p/'+me).onDisconnect().remove();
  }
 }catch(e){return alert('Xəta: '+e.message)}
 try{const j=await (await fetch(TURN_URL)).json();if(j.iceServers&&j.iceServers.length)ICE=j.iceServers}catch(e){}
 ['g','t','p','req','host'].forEach(k=>ref(k).on('value',s=>{
   const v=s.val();
   if(k==='host'){if(loaded.host&&!v&&!isHost()){alert('Aparıcı otaqdan çıxdı');location.reload()}S.host=v}else S[k]=v||{};
   loaded[k]=1;if(['g','t','p','host'].every(x=>loaded[x]))render();
 }));
 const sg=ref('sig/'+me);sg.onDisconnect().remove();
 sg.on('child_added',s=>{const v=s.val();s.ref.remove();if(v)sig(v.f,JSON.parse(v.d))});
 rxStart();
}

/* WEBRTC (siqnal Firebase üzərindən) */
const sendSig=(to,d)=>ref('sig/'+to).push({f:me,d:JSON.stringify(d)});
const same=id=>S.p[id]&&S.p[id].tk===tk;
const want=id=>isHost()||id===S.host||same(id)||id===S.g.ac||me===S.g.ac;
const hear=id=>isHost()?id===S.g.ac:(id===S.host||id===S.g.ac||same(id));
const applyMute=()=>{for(const id in auds)auds[id].muted=!hear(id)};
function applyMic(){if(!stream)return;const on=!muted&&!pen(me);stream.getAudioTracks().forEach(t=>t.enabled=on);$('bMute').innerHTML=micIco(!on);$('bMute').disabled=pen(me)}
function mk(id){
 const pc=new RTCPeerConnection({iceServers:ICE});pc._q=[];
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 pc.onicecandidate=e=>e.candidate&&sendSig(id,{ice:e.candidate.toJSON()});
 pc.ontrack=e=>{let a=auds[id];if(!a){a=auds[id]=document.createElement('audio');a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.volume=curVol;a.play().catch(()=>{$('bSound').hidden=false});applyMute()};
 pcs[id]=pc;return pc}
function drop(id){if(pcs[id]){pcs[id].close();delete pcs[id]}if(auds[id]){auds[id].srcObject=null;auds[id].remove();delete auds[id]}}
$('bSound').onclick=()=>{for(const id in auds)auds[id].play().catch(()=>{});$('bSound').hidden=true};
async function reconcile(){
 if(!stream)return;
 const ids=[...Object.keys(S.p),S.host].filter(i=>i&&i!==me);
 Object.keys(pcs).forEach(id=>{if(!ids.includes(id))drop(id)});
 for(const id of ids){const has=!!pcs[id],w=want(id);
  if(!w&&has)drop(id);
  else if(w&&!has&&me<id){const pc=mk(id);await pc.setLocalDescription(await pc.createOffer());sendSig(id,{sdp:pc.localDescription.toJSON()})}}
 applyMute();applyMic()}
let pending=[];
function sig(from,d){if(!stream)pending.push([from,d]);else onSignal(from,d)}
async function onSignal(from,d){
 const pc=pcs[from]||mk(from);
 try{
  if(d.sdp){await pc.setRemoteDescription(d.sdp);for(const c of pc._q.splice(0))await pc.addIceCandidate(c);
   if(d.sdp.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());sendSig(from,{sdp:pc.localDescription.toJSON()})}}
  else if(d.ice){if(pc.remoteDescription)await pc.addIceCandidate(d.ice);else pc._q.push(d.ice)}
 }catch(e){}}
async function getMic(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return alert('Mikrofon icazəsi lazımdır. Brauzer ayarlarından icazə ver.')}
 await reconcile();pending.splice(0).forEach(([f,d])=>onSignal(f,d))}

/* REAKSİYALAR */
let rxLast=0;
function rxStart(){ref('rx').orderByKey().startAt(db.ref().push().key).on('child_added',s=>{const v=s.val();if(v&&v.f!==me)spawn(v.e)})}
document.querySelectorAll('.rx').forEach(b=>{b.addEventListener('contextmenu',e=>e.preventDefault());
 b.addEventListener('pointerdown',e=>{e.preventDefault();fire(b.dataset.e)})});
function spawn(e){
 const b=[...document.querySelectorAll('.rx')].find(x=>x.dataset.e===e);if(!b||$('game').hidden)return;
 const r=b.getBoundingClientRect(),n=document.createElement('span');n.className='rxe';n.textContent=e;
 n.style.left=(r.left+r.width/2+(Math.random()-.5)*18)+'px';n.style.top=(r.top+r.height/2)+'px';$('rxlayer').appendChild(n);
 const dx=(Math.random()-.5)*50;
 const a=n.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,-120px) scale(.45)`,opacity:0}],{duration:600,easing:'cubic-bezier(.12,.75,.3,1)',fill:'forwards'});a.onfinish=()=>n.remove()}
function fire(e){if(!R)return;spawn(e);const t=Date.now();if(t-rxLast<120)return;rxLast=t;const r=ref('rx').push({e,f:me});setTimeout(()=>r.remove(),4000)}

/* SƏS */
$('vol').addEventListener('input',e=>{curVol=e.target.value/100;$('vol').style.setProperty('--p',e.target.value+'%');for(const id in auds)auds[id].volume=curVol});
$('vol').style.setProperty('--p','50%');
function beep(ms,f){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime,d=ms/1000,pk=.22*Math.min(1,curVol*2);
 o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(pk,n+.015);g.gain.setValueAtTime(pk,n+Math.max(d-.04,.02));g.gain.linearRampToValueAtTime(0,n+d);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+d+.03)}
const micIco=m=>`<svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>${m?'<path d="M3.5 3.5l17 17" stroke-width="2.6"/>':''}</svg>`;
$('bMute').innerHTML=micIco(false);
$('bMute').onclick=()=>{if(!stream||pen(me))return;muted=!muted;applyMic()};

/* TAYMER */
let lastLeft=-1,prevSt='',expiring=false;
setInterval(()=>{
 if(!loaded.g)return;const g=S.g;let left=20;
 if(g.st==='run'&&g.end)left=Math.max(0,Math.ceil((g.end-now())/1000));
 else if(g.st==='ans')left=g.rem||0;else if(g.st==='exp'||g.st==='fin')left=0;
 $('num').textContent=left;$('num').classList.toggle('w',g.st==='run'&&left<=10);
 if(g.st==='run'&&left!==lastLeft){lastLeft=left;if(left===10)beep(700,1000);if(left>=1&&left<=3)beep(180,1300)}
 if(prevSt==='run'&&g.st==='exp')beep(2000,700);prevSt=g.st;
 if(isHost()&&g.st==='run'&&g.end&&now()>=g.end&&!expiring){expiring=true;ref('g').update({st:'exp',end:null,ac:null,ev:'VAXT ÇIXDI'}).finally(()=>setTimeout(()=>expiring=false,500))}
 if(g.st==='run')renderBuzz();
},250);

/* OYUN MƏNTİQİ (aparıcı) */
function penReset(u){u['g/pen']=null;['blue','pink'].forEach(k=>{const t=S.t[k];if(t&&t.bz0)u['t/'+k+'/bz']=t.bz0})}
function nextQ(u,v,ev){Object.assign(u,{'g/st':'wait','g/q':(S.g.q||1)+1,'g/v':v,'g/lock':null,'g/bt':null,'g/ac':null,'g/tlk':null,'g/spk':null,'g/first':null,'g/end':null,'g/rem':null,'g/t0':null,'g/ev':ev})}
function hStart(){const g=S.g;if(g.st!=='wait'||!S.t.blue||!S.t.pink||(g.lock&&g.lock.blue&&g.lock.pink))return;ensureAudio();beep(700,1000);
 const t=now();ref().update({'g/st':'run','g/t0':t,'g/end':t+20000,'g/ac':null,'g/tlk':null,'g/ev':'VAXT!!'})}
function hReset(){if(S.g.st==='wait')ref().update({'g/lock':null,'g/ev':VT(S.g.v||1)})}
function hPts(p){const g=S.g;if(g.st!=='ans')return;const k=g.bt,t=S.t[k],sc=(t.score||0)+p,u={['t/'+k+'/score']:sc};
 if(sc>=5){Object.assign(u,{'g/st':'fin','g/ac':null,'g/bt':null,'g/spk':null,'g/lock':null,'g/ev':'🏆 '+t.name+' QALİB OLDU!'});penReset(u)}
 else nextQ(u,1,t.name+' KOMANDASI +'+p+' XAL QAZANDI');ref().update(u)}
function hUnres(msg){const g=S.g,v=g.v||1,d=v>=3,u={};
 nextQ(u,d?1:v+1,(msg?msg+' · ':'')+(d?'DİSKVALİFİKASİYA! XALLAR SIFIRLANDI':VT(v+1)));
 if(d){['blue','pink'].forEach(k=>{if(S.t[k])u['t/'+k+'/score']=0});penReset(u)}ref().update(u)}
function hWrong(){const g=S.g;if(g.st!=='ans')return;const k=g.bt,o=opp(k),a=g.ac,nm=pname(a)||('KAPİTAN '+pname(S.t[k].cap));
 if(g.lock&&g.lock[o])return hUnres(nm+' SƏHV CAVAB VERİR, DOĞRU CAVAB YOXDUR');
 const t=now(),u={'g/st':'run','g/end':t+(g.rem||20)*1000,'g/t0':null,'g/ac':null,'g/bt':null,'g/first':null,'g/lock/'+k:true};
 const cap=S.t[k].cap===a;
 if(g.first&&!cap){u['g/pen/'+a]=true;u['g/ev']=nm.toUpperCase()+' CƏRİMƏLƏNDİ! QALAN VAXT '+S.t[o].name+' KOMANDASININ'}
 else u['g/ev']=nm.toUpperCase()+' SƏHV CAVAB VERDİ. QALAN VAXT '+S.t[o].name+' KOMANDASININ';
 beep(700,1000);ref().update(u)}
function hNew(){const u={'t/blue/score':0,'t/pink/score':0,'g/q':0};nextQ(u,1,'');penReset(u);ref().update(u)}
function hForgive(id){const u={['g/pen/'+id]:null};['blue','pink'].forEach(k=>{if(S.t[k]&&S.t[k].bz0===id)u['t/'+k+'/bz']=id});ref().update(u)}
function hGrant(k){const g=S.g,t=S.t[k];if(g.st!=='wait'||g.ac||!t)return;ref().update({'g/ac':t.cap,'g/tlk':k,'g/ev':t.name+' KOMANDASININ KAPİTANI '+pname(t.cap).toUpperCase()+' APARICİ İLƏ DANIŞIR','req/'+k:null})}
const hEndTalk=()=>ref().update({'g/ac':null,'g/tlk':null,'g/ev':VT(S.g.v||1)});

/* BASMA (oyunçu) */
let bbusy=false;
async function buzz(){
 if(bbusy||role()!=='bz'||!tk)return;bbusy=true;const T=S.t[tk],my=pname(me);
 try{await ref('g').transaction(g=>{
   if(!g)return;const t=now();g.lock=g.lock||{};g.pen=g.pen||{};if(g.pen[me])return;
   if(g.st==='wait'){if(g.lock[tk])return;g.lock[tk]=true;g.pen[me]=true;g.ev=T.name+' KOMANDASI FALSTART ETDİ! DÜYMƏSİXAN '+my.toUpperCase()+' CƏRİMƏLƏNDİ!'}
   else if(g.st==='run'){if(g.lock[tk]||!g.end||t>=g.end)return;g.first=!!g.t0&&(t-g.t0)<=1000;g.rem=Math.ceil((g.end-t)/1000);g.st='ans';g.bt=tk;g.ac=T.cap;g.end=null;
     g.ev=(g.first?'İLK SANİYƏ! ':'')+T.name+' KOMANDASI DÜYMƏNİ SIXDI. '+T.name+' KOMANDASININ KAPİTANI '+pname(T.cap).toUpperCase()+' DANIŞIR'}
   else return;return g})}catch(e){}
 setTimeout(()=>bbusy=false,200)}

/* KAPİTAN */
function cMic(id){const g=S.g,t=S.t[tk];if(g.st!=='ans'||g.bt!==tk||g.ac!==me||(g.spk&&g.spk[tk])||pen(id))return;ref().update({'g/ac':id,['g/spk/'+tk]:id,'g/ev':pname(id).toUpperCase()+' CAVAB VERİR'})}
function cBz(id){const g=S.g,t=S.t[tk];if(g.st!=='wait'||g.ac||pen(id)||id===t.cap)return;const u={['t/'+tk+'/bz']:id};
 if(!(t.bz&&pen(t.bz)))u['t/'+tk+'/bz0']=id;
 else u['g/ev']=t.name+' KOMANDASINDA YENİ DÜYMƏSİXAN: '+pname(id).toUpperCase()+'. FALSTART ETDİYİ ÜÇÜN '+t.name+' KOMANDASI BU SUALA CAVAB VERMƏK HÜQUQUNU İTİRİR';
 ref().update(u)}
const cReq=()=>ref('req/'+tk).set(true);

function hideNb(){clearTimeout(nbA);clearTimeout(nbB);$('nb').classList.remove('show')}

/* EKRAN */
function render(){
 const g=S.g,h=isHost(),r=role(),t=S.t,mt=t[tk],st=g.st;
 $('lobby').hidden=true;$('game').hidden=false;
 $('head').innerHTML=h?`<div class="big">Otaq kodu:</div><button class="copy-code host-room-code" data-copy="${esc(R)}" type="button">${esc(R)}</button><div class="sm">Kodu kapitanlara ver - Kopyalamaq üçün kodun üzərinə toxun</div>`
  :r==='cap'&&mt?`<div class="big">${esc(mt.name)} komandası</div><div class="sm">Komanda kodu</div><button class="copy-code captain-team-code" data-copy="${esc(R+mt.code)}" type="button">${esc(R+mt.code)}</button><div class="sm">Kodu komanda yoldaşlarına ver - Kopyalamaq üçün toxun</div>`
  :`<div class="big">${esc(mt?mt.name:'')} komandası</div><div class="sm">Otaq kodu: <span class="code">${esc(R)}</span></div>`;
 $('qn').textContent=g.q||1;$('qv').textContent=g.v||1;$('bRqv').hidden=!h;$('bRqv').disabled=st!=='wait';

 const chev=`<svg class="chev" width="22" height="11" viewBox="0 0 8 4" fill="currentColor" shape-rendering="crispEdges"><path d="M0 0h2v1H0zM6 0h2v1H6z"/><path d="M1 1h2v1H1zM5 1h2v1H5z"/><path d="M2 2h4v1H2z"/><path d="M3 3h2v1H3z"/></svg>`;
 $('teams').innerHTML=['blue','pink'].map(k=>{const x=t[k];if(!x)return`<div class="tcard wait"><div class="thead"><div class="tt"><span>Gözləyir...</span></div></div></div>`;
  const exp=h||k!==tk;
  const ms=mem(k).sort((a,b)=>(x.cap===b.id)-(x.cap===a.id)||pen(a.id)-pen(b.id));
  return`<div class="tcard ${k}${exp&&open[k]?' open':''}"><div class="thead${exp?' tg':''}" ${exp?`data-tg="${k}"`:''}><div class="tt">${h&&S.req[k]&&st==='wait'?`<button class="hand" data-a="grant" data-k="${k}">✋</button>`:''}<span>"${esc(x.name)}" komandası</span><span class="sc">${x.score||0}</span></div>${exp?chev:''}</div>
  ${exp?`<div class="tbody"><div class="tin"><div class="tpad">${ms.map(m=>`<div class="mem">${nameH(m,k)}${m.id===g.ac?' 🎙':''}</div>`).join('')}</div></div></div>`:''}</div>`}).join('');

 let ev=g.ev;if(!ev)ev=st==='wait'?VT(g.v||1)||'Aparıcı sualı oxuyur.':'';
 if(st==='wait'&&(!t.blue||!t.pink))ev='İki komandanın qoşulması gözlənilir...';
 $('ev').textContent=ev;

 /* oz komanda heyyeti */
 $('roster').hidden=h||!mt;
 if(!h&&mt){const ms=mem(tk).sort((a,b)=>(mt.cap===b.id)-(mt.cap===a.id)||pen(a.id)-pen(b.id));
  $('roster').innerHTML=`<div class="hd">${esc(mt.name)} komandası</div>`+ms.map(m=>{const c=r==='cap'&&m.id!==mt.cap;
   const canMic=c&&st==='ans'&&g.bt===tk&&g.ac===me&&!(g.spk&&g.spk[tk])&&!pen(m.id);
   const canBz=c&&st==='wait'&&!g.ac&&!pen(m.id);
   return`<div class="row"><span class="nm">${nameH(m,tk)}${m.id===g.ac?' 🎙':''}</span>${c?`<span class="bt"><button class="mini ico" data-a="mic" data-id="${m.id}" ${canMic?'':'disabled'}>🎙</button><button class="mini ico" data-a="bz" data-id="${m.id}" ${canBz?'':'disabled'}>🔔</button></span>`:''}</div>`}).join('')
   +(r==='cap'?`<button class="pbtn s" data-a="req" ${st==='wait'&&!g.ac&&!S.req[tk]?'':'disabled'}>${S.req[tk]?'İstək göndərildi, gözləyin':'Aparıcı ilə danışmaq istəyirəm'}</button>`:'')}
 renderBuzz();
 if(h)renderHost();else $('hc').innerHTML='';
 if(!micAsk){micAsk=true;getMic()}else{reconcile()}
 applyMute();applyMic();checkNb();
 if(!entered){entered=true;[...$('game').children].forEach((e,i)=>{e.classList.add('frame');e.style.setProperty('--i',Math.min(i+1,9))})}
}
function nameH(m,k){const x=S.t[k];let n=esc(m.name);if(x.cap===m.id)return`<b>${n} (K)</b>`;if(x.bz===m.id)n+=' (D)';return pen(m.id)?`<span class="x">${n} (X)</span>`:n}
function renderBuzz(){
 const b=$('bzbox');if(role()!=='bz'){b.innerHTML='';return}
 const g=S.g;let lab='BAS!',cls=tk,dis=false;const left=g.st==='run'&&g.end?Math.ceil((g.end-now())/1000):1;
 if(pen(me)){lab='CƏRİMƏLƏNDİNİZ';dis=true}
 else if(g.st==='wait'){if(g.lock&&g.lock[tk]){lab='CAVAB HÜQUQU YOXDUR';dis=true}}
 else if(g.st==='run'){if(g.lock&&g.lock[tk]){lab='CAVAB HÜQUQU YOXDUR';dis=true}else if(left<=0){lab='VAXT BİTDİ';dis=true}}
