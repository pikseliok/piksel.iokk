<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9DC3FF">
<title>πksel- İntellektual XOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
    :root {
      --bg:#9DC3FF;
      --ink:#9DC3FF;
      --deep:#001E6F;
      --bright:#002E92;
      --dark-bg:#00072C;
      --dark-ink:#00072C;
      --dark-light:#9DC3FF;
      --dark-bright:#6FA5FC;
      --mode-bg-light:linear-gradient(
          135deg,#9DC3FF 0%,#8DB8F5 50%,#9DC3FF 100%);
      --mode-bg-dark:linear-gradient(
          135deg,#00072C 0%,#001044 50%,#00072C 100%);
      --transition:650ms cubic-bezier(.22,.8,.25,1);
      --glow:rgba(0,8,45,.30);
      --pt:25px;
      --pi:18px;
      --pr:17px;
      --pq:18px;
      --g:linear-gradient(
          135deg,#001E6F 0%,#002E92 49%,#001E6F 100%);
      --pg:linear-gradient(
          135deg,#8E0B45 0%,#D4276F 50%,#8E0B45 100%);
      --pc:#FFE3EF;
      --sec:#001E6F;
    }
    body.dark {
      --glow:rgba(255,255,255,.40);
      --g:linear-gradient(
          135deg,#9DC3FF 0%,#6FA5FC 49%,#9DC3FF 100%);
      --pg:linear-gradient(
          135deg,#FFC6DE 0%,#FF8FBE 50%,#FFC6DE 100%);
      --pc:#2C0016;
      --sec:#9DC3FF;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Poppins, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    a,
    button {
      -webkit-touch-callout: none;
    }
    html {
      scroll-behavior: smooth;
    }
    body,
    html {
      width: 100%;
      height: auto;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      transition: background .65s ease, color .65s ease;
      -webkit-font-smoothing: antialiased;
    }
    body {
      overflow-x: hidden;
    }
    body.dark {
      background: var(--dark-bg);
      color: var(--dark-ink);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button,
    input {
      font: inherit;
    }
    .page {
      width: min(95vw, 820px);
      margin: 0 auto;
      padding: 12px 0 0;
    }
    .frame {
      --d:calc(var(--i) * .1s);
      animation: frameIn .6s cubic-bezier(.18, .8, .24, 1) backwards;
      animation-delay: var(--d);
    }
    .rise {
      animation: riseIn .6s cubic-bezier(.18, .8, .24, 1) backwards;
      animation-delay: calc(var(--d) + .55s);
    }
    @keyframes frameIn {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
    }
    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
    }
    @keyframes markIn {
      from {
        opacity: 0;
        transform: scale(.2) rotate(-40deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.22) rotate(6deg);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    .glow {
      position: relative;
      overflow: hidden;
    }
    .glow > * {
      position: relative;
      z-index: 1;
    }
    .glow::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
      background:
        radial-gradient(
          ellipse 170px 120px at var(--mx,50%) var(--my,50%),
          var(--glow),
          transparent 72%),
        radial-gradient(
          ellipse 100px 150px at calc(var(--mx,50%) + 16px) calc(var(--my,50%) - 12px),
          var(--glow),
          transparent 72%);
    }
    @media (hover: hover) {
      .glow:hover::before {
        opacity: 1;
      }
    }
    .top-nav {
      height: 50px;
      width: 100%;
      border-radius: 40px;
      padding: 0 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          var(--deep) 0,
          var(--bright) 50%,
          var(--deep) 100%);
      box-shadow: 0 10px 28px rgba(0, 20, 100, .08);
    }
    .dark .top-nav {
      background:
        linear-gradient(
          135deg,
          var(--dark-light) 0,
          var(--dark-bright) 50%,
          var(--dark-light) 100%);
    }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      height: 100%;
    }
    .nav-link {
      position: relative;
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      transition: transform .25s ease;
    }
    .dark .nav-link {
      color: var(--dark-ink);
    }
    .nav-link:hover {
      transform: translateY(-1px);
    }
    .theme-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--deep);
      background: rgba(157, 195, 255, .98);
      transition:
        transform .3s ease,
        background var(--transition),
        color var(--transition);
    }
    .dark .theme-toggle {
      background: var(--dark-bg);
      color: var(--dark-light);
    }
    .theme-toggle:hover {
      transform: translateY(-50%) scale(1.08);
    }
    .theme-toggle:active {
      transform: translateY(-50%) scale(.95);
    }
    .theme-icon {
      width: 24px;
      height: 24px;
      display: block;
    }
    .ray {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    body.dark .ray {
      opacity: 0;
    }
    .core {
      transform: scale(.68);
      transform-origin: 16px 16px;
    }
    .bite {
      transform: translate(14px, -14px);
    }
    body.dark .core {
      transform: scale(1);
    }
    body.dark .bite {
      transform: translate(0, 0);
    }
    body.ready .bite,
    body.ready .core {
      transition: transform .6s cubic-bezier(.4, 0, .2, 1);
    }
    .main-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      margin-top: 14px;
      padding-bottom: 44px;
    }
    .section-title {
      text-align: center;
      color: var(--sec);
      font-size: var(--pt);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.7px;
      transition: color var(--transition);
    }
    .card {
      width: 100%;
      border-radius: 28px;
      padding: 20px 22px;
      background: var(--g);
      color: var(--ink);
      box-shadow: 0 10px 25px rgba(0, 20, 110, .09);
      word-wrap: break-word;
      overflow-wrap: break-word;
      transition: background var(--transition), color var(--transition);
    }
    .dark .card {
      color: var(--dark-ink);
    }
    .ct {
      font-size: var(--pt);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.7px;
    }
    .cd {
      margin-top: 12px;
      font-size: var(--pi);
      line-height: 1.5;
      font-weight: 400;
    }
    .cd:empty {
      display: none;
    }
    .card-divider {
      width: 100%;
      height: 2px;
      margin-top: 14px;
      background: currentColor;
      opacity: .14;
      border-radius: 2px;
    }
    .lb {
      display: block;
      margin: 14px 0 8px;
      font-size: var(--pr);
      font-weight: 600;
    }
    .in {
      width: 100%;
      height: 50px;
      border-radius: 50px;
      border: 2px solid currentColor;
      background: rgba(255, 255, 255, .1);
      color: inherit;
      padding: 0 20px;
      font-size: var(--pq);
      font-weight: 600;
      outline: 0;
      margin-top: 14px;
    }
    .in::placeholder {
      color: currentColor;
      opacity: .55;
    }
    .in:focus {
      background: rgba(255, 255, 255, .2);
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn,
    .chip,
    .pill {
      border: 0;
      cursor: pointer;
      border-radius: 50px;
      height: 44px;
      padding: 0 22px;
      font-weight: 700;
      font-size: var(--pr);
      white-space: nowrap;
      background: var(--g);
      color: var(--ink);
      transition:
        transform .25s ease,
        opacity .25s ease,
        background var(--transition),
        color var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dark .btn,
    .dark .chip,
    .dark .pill {
      color: var(--dark-ink);
    }
    .card .btn,
    .card .chip {
      background: rgba(255, 255, 255, .14);
      color: inherit;
      border: 2px solid currentColor;
    }
    .card .btn.pk,
    .card .chip.on {
      background: var(--pg);
      color: var(--pc);
      border-color: transparent;
    }
    .btn:hover:not(:disabled),
    .chip:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .btn:active:not(:disabled),
    .chip:active:not(:disabled) {
      transform: scale(.96);
      transition-duration: .3s;
    }
    .btn:disabled,
    .chip:disabled {
      cursor: default;
    }
    .btn.dis {
      opacity: .4;
      pointer-events: none;
    }
    .chip {
      height: 38px;
      padding: 0 16px;
      font-size: calc(var(--pr) - 1px);
      font-weight: 600;
    }
    .pill {
      height: 38px;
      margin: 0 auto;
      display: flex;
      width: max-content;
      max-width: 100%;
      font-size: var(--pi);
      letter-spacing: 1px;
    }
    .hd {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pl {
      border-radius: 28px;
      padding: 12px 18px;
      transition:
        transform .3s ease,
        box-shadow .3s ease,
        background var(--transition),
        color var(--transition);
      background: var(--g);
      color: var(--ink);
    }
    .dark .pl {
      color: var(--dark-ink);
    }
    .pl.p0 {
      background: var(--pg);
      color: var(--pc);
    }
    .pl.act {
      transform: scale(1.04);
      box-shadow: 0 0 0 3px var(--sec), 0 12px 26px rgba(0, 20, 110, .2);
    }
    .pl span {
      display: block;
      font-weight: 600;
      font-size: var(--pr);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pl strong {
      font-size: calc(var(--pt) * 1.2);
      line-height: 1.1;
      font-weight: 700;
    }
    .st {
      text-align: center;
      color: var(--sec);
      font-size: var(--pi);
      font-weight: 600;
      transition: color var(--transition);
    }
    .bd {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .c {
      aspect-ratio: 1;
      border: 2px solid var(--sec);
      border-radius: 24px;
      background: rgba(0, 30, 111, .1);
      color: var(--ink);
      font-size: clamp(44px, 17vw, 78px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform .25s ease,
        background var(--transition),
        border-color var(--transition);
    }
    .dark .c {
      background: rgba(157, 195, 255, .12);
      color: var(--dark-ink);
    }
    .c:hover:not(:disabled) {
      transform: scale(1.04);
    }
    .c:disabled {
      cursor: default;
    }
    .c.s0 {
      background: var(--pg);
      color: var(--pc);
      border-color: transparent;
    }
    .c.s1 {
      background: var(--g);
      border-color: transparent;
      color: var(--ink);
    }
    .dark .c.s1 {
      color: var(--dark-ink);
    }
    .c.stl {
      outline: 2px dashed currentColor;
      outline-offset: -8px;
    }
    .mk {
      display: inline-block;
      line-height: 1;
    }
    .mk.pop {
      animation: markIn .55s cubic-bezier(.34, 1.56, .64, 1);
    }
    .ov {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 7, 44, .58);
      backdrop-filter: blur(3px);
    }
    .ov.fade {
      animation: fadeIn .4s ease;
    }
    .ov .card {
      width: min(92vw, 460px);
      max-height: 90vh;
      overflow: auto;
      text-align: center;
    }
    .q {
      margin: 12px 0 6px;
      font-size: var(--pt);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.6px;
      overflow-wrap: anywhere;
    }
    .qs {
      display: block;
      width: 100%;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      font-size: var(--pr);
      font-weight: 600;
    }
    .tb {
      height: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .2);
      overflow: hidden;
      margin: 6px 0 4px;
    }
    .tb i {
      display: block;
      height: 100%;
      width: 100%;
      background:
        linear-gradient(
          90deg,
          #FF8FBE,
          #FF4F93);
      transition: width .25s linear;
    }
    .tm {
      font-weight: 700;
      font-size: var(--pr);
    }
    footer {
      width: 100%;
      background:
        linear-gradient(
          100deg,
          var(--deep) 0,
          var(--bright) 50%,
          var(--deep) 100%);
      color: var(--ink);
      min-height: 110px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      transition: background var(--transition), color var(--transition);
    }
    .dark footer {
      background:
        linear-gradient(
          164deg,
          var(--dark-light) 0,
          var(--dark-bright) 50%,
          var(--dark-light) 100%);
      color: var(--dark-ink);
    }
    .footer-line {
      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
    }
    .footer-link {
      transition: opacity .25s ease, transform .25s ease;
    }
    .footer-link:hover {
      opacity: .72;
      transform: translateY(-1px);
    }
    .btn:focus-visible,
    .chip:focus-visible,
    .c:focus-visible,
    .pill:focus-visible,
    .footer-link:focus-visible,
    .nav-link:focus-visible,
    .theme-toggle:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 4px;
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      ::after,
      ::before {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
    @media (max-width: 700px) {
      :root {
        --pt:19px;
        --pi:16px;
        --pr:15px;
        --pq:16px;
      }
      .page {
        width: calc(100vw - 44px);
        padding-top: 11px;
      }
      .top-nav {
        height: 46px;
        padding: 0 46px;
      }
      .nav-links {
        gap: 28px;
      }
      .nav-link {
        font-size: 13px;
      }
      .theme-toggle {
        width: 34px;
        height: 34px;
        right: 6px;
      }
      .theme-icon {
        width: 21px;
        height: 21px;
      }
      .main-container {
        gap: 10px;
        margin-top: 12px;
      }
      .card {
        border-radius: 22px;
        padding: 16px;
      }
      .pl {
        border-radius: 22px;
        padding: 10px 14px;
      }
      .hd {
        gap: 10px;
      }
      .btn,
      .pill {
        height: 42px;
      }
      .in {
        height: 46px;
      }
      footer {
        min-height: 96px;
        padding: 16px 12px;
        gap: 5px;
      }
      .footer-line {
        font-size: 13px;
      }
    }
    @media (max-width: 420px) {
      :root {
        --pt:16px;
        --pi:14px;
        --pr:13px;
        --pq:13px;
      }
      .page {
        width: calc(100vw - 36px);
      }
      .nav-links {
        gap: 22px;
      }
      .nav-link {
        font-size: 11px;
      }
      .top-nav {
        height: 42px;
        padding: 0 42px;
      }
      .theme-toggle {
        width: 32px;
        height: 32px;
        right: 5px;
      }
      .theme-icon {
        width: 20px;
        height: 20px;
      }
      .card {
        padding: 14px;
      }
      .btn,
      .pill {
        height: 40px;
      }
      .in {
        height: 42px;
      }
      footer {
        min-height: 88px;
      }
      .footer-line {
        font-size: 11px;
      }
    }
</style>
</head>
<body>
  <div class="page">
    <nav class="frame top-nav" style="--i:0" aria-label="Əsas naviqasiya">
      <div class="rise nav-links">
        <a class="nav-link" href="index.html">Əsas Səhifə</a>
        <a class="nav-link" href="/elaqe">Bizimlə Əlaqə</a>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Gecə rejiminə keç">
        <svg aria-hidden="true" class="rise theme-icon" id="themeIcon" viewBox="0 0 32 32">
          <defs>
            <mask height="32" id="biteMask" maskUnits="userSpaceOnUse" width="32" x="0" y="0">
              <rect fill="#fff" height="32" width="32" />
              <circle class="bite" cx="21" cy="11" fill="#000" r="7.5" />

          </g>
        </svg>
      </button>
    </nav>
    <main class="main-container" id="app"></main>
  </div>

  <footer>
    <div class="footer-line">İntellektuallar üçün hər şey...</div>
    <a class="footer-line footer-link" href="https://www.instagram.com/piksel.iok" rel="noopener noreferrer" target="_blank">©πksel intellektual oyunlar klubu</a>
    <a class="footer-line footer-link" href="https://www.instagram.com/onurelzh" rel="noopener noreferrer" target="_blank">©Onur Əlizadə</a>
  </footer>

  <script>

  END = Date.now() + S.time * 1e3;
  G.ph = "ask";
  clearInterval(iv);
  iv = setInterval(tick, 200);
  sync();
}
function tick() {
  const l = Math.max(0, END - Date.now()), b = $("bar");
  if (b) {
    b.style.width = l / (S.time * 10) + "%";
    $("tm").textContent = Math.ceil(l / 1e3) + " san";
  }
  if (!ME && l <= 0 && G.ph == "ask") doAns("");
}
function doAns(v) {
  clearInterval(iv);
  const r = ok(v, H.it);
  G.fb = { ok: r, a: H.it.a.split("/")[0] };
  G.ph = "fb";
  sync();
  setTimeout(after, r ? 1100 : 2e3);
}
function after() {
  if (V != "game" || G.ph != "fb") return;
  if (G.fb.ok) G.b[G.c] = G.act;
  G.turn = 1 - G.act;
  fin();
}
function fin() {
  const b = G.b;
  for (const l of L) if (b[l[0]] != null && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) {
    G.w = b[l[0]];
    G.sc[G.w]++;
    G.ph = "end";
    G.stl = false;
    return sync();
  }
  if (b.every((v) => v != null)) {
    G.w = null;
    G.ph = "end";
    G.stl = false;
    return sync();
  }
  G.ph = "idle";
  G.stl = false;
  sync();
}
function cpy() {
  const b = $("cd"), d = () => {
    b.textContent = "Kopyalandı ✓";
    setTimeout(() => b.textContent = "Kod: " + code, 1400);
  };
  (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(d, () => {
    const a = document.createElement("textarea");
    a.value = code;
    document.body.appendChild(a);
    a.select();
    try {
      document.execCommand("copy");
    } catch (e) {
    }
    a.remove();
    d();
  });
}
function setup() {
  const ro = ME ? "disabled" : "";
  return `<div class="card glow${F(3, ani)}"><div class="ct${ri(ani)}">Otaq ayarları</div><div class="card-divider"></div>
<span class="lb">Oğurlama</span><div class="row"><button class="chip ${S.steal ? "on" : ""}" ${ro} onclick="cfg('steal',true)">Açıq</button><button class="chip ${S.steal ? "" : "on"}" ${ro} onclick="cfg('steal',false)">Bağlı</button></div>
<span class="lb">Hər sual üçün vaxt</span><div class="row">${[15, 20, 25, 30].map((t) => `<button class="chip ${S.time == t ? "on" : ""}" ${ro} onclick="cfg('time',${t})">${t} san</button>`).join("")}</div>
<span class="lb">Mövzular (ən azı 3)</span><div class="row">${TP.map((t, i) => `<button class="chip ${S.sel.includes(i) ? "on" : ""}" ${ro} onclick="tg(${i})">${t.n}</button>`).join("")}</div></div>`;
}
function game() {
  const b = G.b;
  let h;
  if (G.wait) h = `<div class="pill glow${F(0, ani)}">Otaq hazırlanır...</div>`;
  else {
    h = `<button class="pill${F(0, ani)}" id="cd" onclick="cpy()" title="Kodu kopyala">Kod: ${code}</button>`;
    if (!ME && !G.gid && !G.err) h += `<p class="st${F(0, ani)}" id="wt">Dostun gözlənilir: ${clk(Math.max(0, mkAt + WAIT - Date.now()))}</p>`;
  }
  const hdr = `<div class="hd">${[0, 1].map((i) => `<div class="pl glow p${i}${G.turn == i && G.ph != "lobby" && G.ph != "end" ? " act" : ""}${F(1, ani)}"><span>${NM(i)} (${i ? "O" : "X"})</span><strong>${G.sc[i]}</strong></div>`).join("")}</div><p class="st" id="wn" style="display:none">⚠ Rəqib bağlantısı kəsildi. Gözlənilir...</p>`;
  if (G.ph == "lobby" && !G.closed && !G.err) {
    const ready = !ME && G.gid && S.sel.length >= 3;
    return h + hdr + `<div class="card glow${F(2, ani)}"><div class="ct${ri(ani)}">${ME ? "Otaq sahibi başlatmağı gözləyir" : G.names[1] ? NM(1) + " qoşuldu" : "Dostunu gözləyirik"}</div><div class="card-divider"></div><p class="cd${ri(ani)}">${ME ? "Ayarlara bax və gözlə." : G.names[1] ? "Ayarları seç və oyunu başlat." : "Yuxarıdakı kodu kopyala və dostuna göndər. O, “Otağa qoş” seçib kodu yazacaq."}</p>${ME ? "" : `<div class="col">${btn("pk" + (ready ? "" : " dis"), "startGame()", "Başla")}</div>`}</div>` + setup();
  }
  const mine = G.act == ME, OF = (i) => F(i, ano), OR = ri(ano);
  let o = "";
  if (G.ph == "pick") o = `<div class="card glow${OF(0)}"><div class="ct${OR}">${mine ? G.stl ? "Xananı oğurlamaq üçün mövzu seç" : "Mövzunu seç" : NM(G.act) + (G.stl ? " xananı oğurlamağa çalışır" : " mövzu seçir")}</div><div class="card-divider"></div>${mine ? `<div class="col">${G.opts.map((t, k) => btn("", `go('pick',${k})`, TP[t].n)).join("")}</div>` : ""}</div>`;
  if (G.ph == "ask") o = `<div class="card glow${OF(0)}"><div class="tm${OR}" id="tm"></div><div class="tb"><i id="bar"></i></div><div class="cd" style="margin-top:6px">${TP[G.tp].n} · ${NM(G.act)}</div><div class="q">${E(G.q)}</div><div class="qs">${E(TP[G.tp].l)}</div>${mine ? `<input class="in" id="in" autocomplete="off" placeholder="Cavabı yaz" onkeydown="if(event.key=='Enter')go('ans',this.value)"><div class="col">${btn("pk", "go('ans',$('in').value)", "Cavab ver")}</div>` : `<p class="cd">${NM(G.act)} cavab yazır...</p>`}</div>`;
  if (G.ph == "fb") o = `<div class="card glow${OF(0)}"><div class="ct${OR}">${G.fb.ok ? "Düzdür!" : "Səhvdir"}</div><div class="card-divider"></div><p class="cd">${G.fb.ok ? G.stl ? NM(G.act) + " xananı oğurladı!" : "Xana " + NM(G.act) + " üçündür." : (G.stl ? "Oğurlamaq alınmadı. " : "") + "Düzgün cavab: <b>" + E(G.fb.a) + "</b>"}</p></div>`;
  if (G.ph == "end") o = `<div class="card glow${OF(0)}"><div class="ct${OR}">${G.w == null ? "Bərabərlik" : NM(G.w) + " qalib gəldi!"}</div><div class="card-divider"></div><p class="cd">Hesab ${G.sc[0]} : ${G.sc[1]}</p>${ME ? `<p class="cd">Ev sahibi yeni oyunu başladacaq.</p>` : `<div class="col">${btn("pk", "round()", "Yenidən oyna")}</div>`}</div>`;
  if (G.err) o = `<div class="card glow${OF(0)}"><div class="ct${OR}">Xəta</div><div class="card-divider"></div><p class="cd">${E(G.err)}</p><div class="col">${btn("pk", "location.reload()", "Yenidən cəhd et")}</div></div>`;
  if (G.closed) o = `<div class="card glow${OF(0)}"><div class="ct${OR}">Otaq bağlandı</div><div class="card-divider"></div><p class="cd">${E(G.cm || "Otaq bağlandı.")}</p><div class="col">${btn("pk", "location.reload()", "Əsas menyu")}</div></div>`;
  const cells = b.map((v, i) => {
    const dis = G.ph != "idle" || G.turn != ME || v === ME || v != null && !S.steal;
    const pop = shown && shown[i] !== v && v != null;
    const cl = (v == null ? "" : "s" + v) + (!dis && v != null ? " stl" : "");
    return `<button class="c ${cl}" ${dis ? "disabled" : ""} onclick="go('cell',${i})" aria-label="xana ${i + 1}">${v == null ? "" : `<span class="mk${pop ? " pop" : ""}">${v ? "O" : "X"}</span>`}</button>`;
  }).join("");
  shown = [...b];
  return h + hdr + `<p class="st${F(2, ani)}">${G.ph == "end" ? "Oyun bitdi" : "Növbə: " + NM(G.turn)}</p><div class="bd${F(3, ani)}">${cells}</div>` + (o ? `<div class="ov${ano ? " fade" : ""}">${o}</div>` : "");
}
function fit() {
  document.querySelectorAll(".qs").forEach((e) => {
    e.style.fontSize = "";
    let s = parseFloat(getComputedStyle(e).fontSize);
    while (e.scrollWidth > e.clientWidth && s > 8) {
      s -= 0.5;
      e.style.fontSize = s + "px";
    }
  });
}
function R() {
  const a1 = V + (V == "game" ? (G.ph == "lobby" ? "L" : "P") + (G.err || G.closed ? "x" : "") : "");
  const a2 = V == "game" ? G.ph + (G.closed ? "c" : "") + (G.err ? "e" : "") : "";
  if (a1 != k1) {
    ani = 1;
    k1 = a1;
  }
  if (a2 != k2) {
    ano = 1;
    k2 = a2;
  }
  const A = ri(ani);
  let h = "";
  if (V == "home") h = `<h2 class="section-title${F(1, ani)}">İntellektual XOX</h2><div class="card glow${F(2, ani)}"><div class="ct${A}">Dostunla onlayn oyna</div><div class="card-divider"></div><p class="cd${A}">Xananı seç, mövzunu seç, sualı düzgün cavabla və xananı qazan.</p><input class="in" maxlength="14" placeholder="Adın" value="${E(myName)}" oninput="nin(this.value)"><p class="cd" id="hm">${E(msg)}</p><div class="col">${btn("pk", "mkRoom()", "Otaq yarat")}${btn("", "V='join';msg='';R()", "Otağa qoş")}</div></div>`;
  else if (V == "join") h = `<h2 class="section-title${F(1, ani)}">Otağa qoş</h2><div class="card glow${F(2, ani)}"><div class="ct${A}">Otaq kodunu yaz</div><div class="card-divider"></div><input class="in" id="jc" maxlength="5" placeholder="KOD" style="text-transform:uppercase;letter-spacing:4px;text-align:center" onkeydown="if(event.key=='Enter')joinRoom()"><input class="in" maxlength="14" placeholder="Adın" value="${E(myName)}" oninput="nin(this.value)"><p class="cd" id="hm" style="text-align:center">${E(msg)}</p><div class="col">${btn("pk", "joinRoom()", "Qoşul")}${btn("", "V='home';msg='';R()", "Geri")}</div></div>`;
  else h = game();
  const keep = V == "join" && $("jc") ? $("jc").value : "";
  app.innerHTML = h;
  if (keep && $("jc")) $("jc").value = keep;
  ani = 0;
  ano = 0;
  fit();
  if (V == "game" && G.ph == "ask") {
    tick();
    const i = $("in");
    if (i) i.focus();
  }
}
addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
R();
  </script>
</body>
</html>
