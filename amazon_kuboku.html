<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>πksel.iok - Amazon kuboku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#9DC3FF;
      --ink:#9DC3FF;
      --deep:#001E6F;
      --bright:#002E92;
      --dark-bg:#00072C;
      --dark-ink:#00072C;
      --dark-light:#9DC3FF;
      --dark-bright:#6FA5FC;
      --transition:650ms cubic-bezier(.22,.8,.25,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      transition:background .65s ease,color .65s ease;
      -webkit-font-smoothing:antialiased;
    }

    body.dark{
      background:var(--dark-bg);
      color:var(--dark-ink);
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    .page{
      width:min(95vw,820px);
      margin:0 auto;
      padding:12px 0 0;
    }

    /* ---------- NAVIGATION (identical to ana səhifə) ---------- */
    .top-nav{
      height:60px;
      width:100%;
      border-radius:40px;
      padding:0 14px 0 26px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      background:
        linear-gradient(135deg,var(--deep) 0%,var(--bright) 50%,var(--deep) 100%);
      box-shadow:0 10px 28px rgba(0,20,100,.08);
      transition:background var(--transition),box-shadow var(--transition);
    }

    .dark .top-nav{
      background:
        linear-gradient(135deg,var(--dark-light) 0%,var(--dark-bright) 50%,var(--dark-light) 100%);
    }

    .nav-links{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:58px;
      height:100%;
    }

    .nav-link{
      position:relative;
      color:var(--ink);
      font-size:20px;
      font-weight:500;
      white-space:nowrap;
      transition:transform .25s ease,opacity .25s ease;
    }

    .dark .nav-link{
      color:var(--dark-ink);
    }

    .nav-link:hover{
      transform:translateY(-1px);
    }

    .nav-link.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-7px;
      height:2px;
      border-radius:2px;
      background:currentColor;
      opacity:.9;
    }

    .theme-toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      cursor:pointer;
      display:grid;
      place-items:center;
      color:var(--deep);
      background:rgba(157,195,255,.98);
      transition:transform .3s ease,background var(--transition),color var(--transition);
    }

    .dark .theme-toggle{
      background:var(--dark-bg);
      color:var(--dark-light);
    }

    .theme-toggle:hover{
      transform:translateY(-50%) scale(1.08);
    }

    .theme-toggle:active{
      transform:translateY(-50%) scale(.95);
    }

    .theme-icon{
      width:25px;
      height:25px;
      display:block;
    }

    /* ---------- MAIN CONTENT WRAP ---------- */
    .main-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      margin-top:18px;
      padding-bottom:56px;
    }

    .blur-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: filter 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: filter;
    }

    body.img-zoomed .blur-content {
      filter: blur(8px);
      pointer-events: none;
    }

    /* ---------- CARD BASE (identical gradient/shadow language to ana səhifə cards) ---------- */
    .info-card, .tours-card, .q-card {
      width: 100%;
      border-radius: 28px;
      padding: 24px 26px;
      background:
        linear-gradient(135deg,var(--deep) 0%,var(--bright) 49%,var(--deep) 100%);
      color: var(--ink);
      box-shadow: 0 10px 25px rgba(0,20,110,.09);
      word-wrap: break-word;
      overflow-wrap: break-word;
      transition:background var(--transition),color var(--transition),box-shadow .3s ease,transform .3s ease;
    }

    .dark .info-card, .dark .tours-card, .dark .q-card{
      background:
        linear-gradient(135deg,var(--dark-light) 0%,var(--dark-bright) 49%,var(--dark-light) 100%);
      color: var(--dark-ink);
    }

    .game-title {
      font-size: 30px;
      font-weight: 700;
      font-family:"Poppins",sans-serif;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing:-.7px;
      margin-bottom: 16px;
    }

    .dark .game-title{
      color:var(--dark-ink);
    }

    .info-row {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.6;
      margin-bottom: 5px;
    }

    .dark .info-row{
      color:var(--dark-ink);
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-weight: 700;
      font-family:"Poppins",sans-serif;
    }

    .info-val {
      font-weight: 400;
    }

    .tour-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tour-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.14);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.22);
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dark .tour-btn{
      color:var(--dark-ink);
      border:1px solid rgba(0,7,44,.16);
      background:rgba(0,7,44,.10);
    }

    .tour-btn.active {
      background: linear-gradient(135deg, var(--bg) 0%, #7baaff 100%);
      color: var(--deep);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .dark .tour-btn.active{
      background: linear-gradient(135deg, var(--dark-bg) 0%, #001254 100%);
      color: var(--dark-light);
      border-color: rgba(0, 7, 44, 0.3);
    }

    .round-arrow {
      width: 10px;
      height: 10px;
      fill: currentColor;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .tour-btn.active .round-arrow {
      transform: rotate(180deg);
    }

    .battle-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.35s cubic-bezier(0, 1, 0, 1),
        opacity 0.25s ease,
        margin-top 0.25s ease;
      margin-top: 0;
    }

    .round-wrapper.active .battle-panel {
      max-height: 1000px;
      opacity: 1;
      margin-top: 8px;
    }

    .battle-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 12px;
    }

    .battle-btn {
      background: rgba(255, 255, 255, 0.14);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.22);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .dark .battle-btn{
      color:var(--dark-ink);
      border:1px solid rgba(0,7,44,.16);
      background:rgba(0,7,44,.10);
    }

    .battle-btn.active {
      background: linear-gradient(135deg, var(--bg) 0%, #7baaff 100%);
      color: var(--deep);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .dark .battle-btn.active{
      background: linear-gradient(135deg, var(--dark-bg) 0%, #001254 100%);
      color: var(--dark-light);
      border-color: rgba(0, 7, 44, 0.3);
    }

    .sub-round-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sub-round-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.14);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.22);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dark .sub-round-btn{
      color:var(--dark-ink);
      border:1px solid rgba(0,7,44,.16);
      background:rgba(0,7,44,.10);
    }

    .sub-round-btn.active {
      background: linear-gradient(135deg, var(--bg) 0%, #7baaff 100%);
      color: var(--deep);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .dark .sub-round-btn.active{
      background: linear-gradient(135deg, var(--dark-bg) 0%, #001254 100%);
      color: var(--dark-light);
      border-color: rgba(0, 7, 44, 0.3);
    }

    .sub-battle-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.35s cubic-bezier(0, 1, 0, 1),
        opacity 0.25s ease,
        margin-top 0.25s ease;
      margin-top: 0;
    }

    .sub-round-wrapper.active .sub-battle-panel {
      max-height: 500px;
      opacity: 1;
      margin-top: 8px;
    }

    .sub-battle-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 12px;
    }

    .global-toggle-btn {
      width: 100%;
      background:
        linear-gradient(135deg,var(--deep) 0%,var(--bright) 50%,var(--deep) 100%);
      color: var(--ink);
      border: none;
      padding: 14px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      box-shadow:0 10px 22px rgba(0,20,110,.10);
      transition:background var(--transition),color var(--transition),transform .25s ease,box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .dark .global-toggle-btn{
      background:
        linear-gradient(135deg,var(--dark-light) 0%,var(--dark-bright) 50%,var(--dark-light) 100%);
      color: var(--dark-ink);
    }

    .global-toggle-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 28px rgba(0,20,110,.16);
    }

    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .q-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .dark .q-text{
      color:var(--dark-ink);
    }

    .q-text b {
      font-weight: 700;
    }

    .req-img-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin-top: 10px;
    }

    .req-img {
      max-width: 100%;
      border-radius: 12px;
      cursor: pointer;
      display: block;
      transform-origin: center center;
      transition:
        transform 0.5s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.5s ease;
      will-change: transform;
      position: relative;
      z-index: 1;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, var(--bg) 0%, #7baaff 100%);
      color: var(--deep);
      border: 1px solid rgba(255,255,255,.3);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition:background .25s ease,color .25s ease,transform .2s ease;
    }

    .dark .toggle-btn{
      background: linear-gradient(135deg, var(--dark-bg) 0%, #001254 100%);
      color: var(--dark-light);
      border: 1px solid rgba(0,7,44,.3);
    }

    .toggle-btn:hover{
      transform:translateY(-1px);
    }

    .arrow-icon {
      width: 10px;
      height: 10px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .ans-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.35s cubic-bezier(0, 1, 0, 1),
        opacity 0.25s ease,
        margin-top 0.25s ease;
      margin-top: 0;
      border-top: 1px solid rgba(255,255,255,.22);
    }

    .dark .ans-panel{
      border-top: 1px solid rgba(0,7,44,.18);
    }

    .q-card.active .ans-panel {
      max-height: 3000px;
      opacity: 1;
      margin-top: 12px;
      padding-top: 12px;
    }

    .q-card.active .arrow-icon {
      transform: rotate(180deg);
    }

    .ans-row {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.55;
      margin-bottom: 7px;
    }

    .dark .ans-row{
      color:var(--dark-ink);
    }

    .ans-row:last-child {
      margin-bottom: 0;
    }

    .ans-label {
      font-weight: 700;
      font-family:"Poppins",sans-serif;
      color: var(--ink);
    }

    .dark .ans-label{
      color:var(--dark-ink);
    }

    .ans-row a {
      color: var(--ink);
      text-decoration: underline;
      word-break: break-all;
    }

    .dark .ans-row a{
      color:var(--dark-ink);
    }

    .author-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .copy-btn{
      flex:0 0 auto;
      width:32px;
      height:32px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.16);
      color: var(--ink);
      transition:background .25s ease,color .25s ease,transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .dark .copy-btn{
      background: rgba(0,7,44,.12);
      color: var(--dark-ink);
    }

    .copy-btn:hover{
      transform:translateY(-1px);
      background: rgba(255,255,255,.28);
    }

    .dark .copy-btn:hover{
      background: rgba(0,7,44,.2);
    }

    .copy-btn.copied{
      background: linear-gradient(135deg, var(--bg) 0%, #7baaff 100%);
      color: var(--deep);
    }

    .dark .copy-btn.copied{
      background: linear-gradient(135deg, var(--dark-bg) 0%, #001254 100%);
      color: var(--dark-light);
    }

    .copy-icon{
      width:16px;
      height:16px;
      display:block;
    }

    .copy-icon .check-path{
      display:none;
    }

    .copy-btn.copied .copy-icon .clip-path{
      display:none;
    }

    .copy-btn.copied .copy-icon .check-path{
      display:block;
    }

    /* ---------- FOOTER (identical to ana səhifə) ---------- */
    footer{
      width:100%;
      background:
        linear-gradient(100deg,var(--deep) 0%,var(--bright) 50%,var(--deep) 100%);
      color:var(--ink);
      min-height:170px;
      padding:27px 20px 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:9px;
      text-align:center;
      transition:background var(--transition),color var(--transition);
    }

    .dark footer{
      background:
        linear-gradient(164deg,var(--dark-light) 0%,var(--dark-bright) 50%,var(--dark-light) 100%);
      color:var(--dark-ink);
    }

    .footer-line{
      font-size:15px;
      line-height:1.45;
      font-weight:500;
    }

    .footer-link{
      transition:opacity .25s ease,transform .25s ease;
    }

    .footer-link:hover{
      opacity:.72;
      transform:translateY(-1px);
    }

    /* ---------- ACCESSIBILITY ---------- */
    .q-card:focus-visible,
    .nav-link:focus-visible,
    .theme-toggle:focus-visible,
    .footer-link:focus-visible{
      outline:3px solid currentColor;
      outline-offset:4px;
    }

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }

    @media (max-width:700px){
      .page{
        width:calc(100vw - 44px);
        padding-top:11px;
      }

      .top-nav{
        height:52px;
        padding-left:18px;
        padding-right:60px;
      }

      .nav-links{
        gap:34px;
      }

      .nav-link{
        font-size:15px;
      }

      .theme-toggle{
        width:39px;
        height:39px;
        right:8px;
      }

      .theme-icon{
        width:22px;
        height:22px;
      }

      .info-card, .tours-card, .q-card{
        border-radius:22px;
        padding:18px 18px;
      }

      .game-title{
        font-size:22px;
      }

      footer{
        min-height:185px;
        padding-left:12px;
        padding-right:12px;
      }

      .footer-line{
        font-size:14px;
      }
    }

    @media (max-width:420px){
      .page{
        width:calc(100vw - 36px);
      }

      .nav-links{
        gap:25px;
      }

      .nav-link{
        font-size:13px;
      }

      .top-nav{
        height:48px;
      }

      .theme-toggle{
        width:36px;
        height:36px;
        right:6px;
      }

      .theme-icon{
        width:20px;
        height:20px;
      }

      .game-title{
        font-size:20px;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <nav class="top-nav" aria-label="Əsas naviqasiya">
    <div class="nav-links">
      <a class="nav-link" href="index.html">Əsas Səhifə</a>
      <a class="nav-link active" href="packages.html">Sual Paketləri</a>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button"
            aria-label="Gecə rejiminə keç">
      <svg id="themeIcon" class="theme-icon" viewBox="0 0 32 32" aria-hidden="true"></svg>
    </button>
  </nav>

<div class="main-container" id="mainContainer">

  <div class="blur-content">

    <!-- PAKET MƏLUMATLARI -->
    <div class="info-card">

      <div class="game-title">"Amazon" kuboku - Breyn Rinq</div>

      <div class="info-row">
        <span class="info-label">Təşkilatçı:</span>
        <span class="info-val">Yusifov Zeynal</span>
      </div>

      <div class="info-row">
        <span class="info-label">Redaktor:</span>
        <span class="info-val">Yusifov Zeynal</span>
      </div>

      <div class="info-row">
        <span class="info-label">Müəllif(lər):</span>
        <span class="info-val">Zeynal Yusifov, Seyidova Aydan</span>
      </div>

      <div class="info-row">
        <span class="info-label">Oynanıldığı tarix:</span>
        <span class="info-val">22.08.2026</span>
      </div>

      <div class="info-row">
        <span class="info-label">Əlavə edildiyi tarix:</span>
        <span class="info-val">05.08.2026</span>
      </div>

    </div>


    <!-- TUR / FİNAL SEÇİMLƏRİ -->
    <div class="tours-card">

      <div class="tour-buttons">

        <!-- 1/4 FINAL -->
        <div class="round-wrapper active" id="round-quarter">

          <button class="tour-btn active" onclick="toggleRound('round-quarter')">
            <span>1/4 Final</span>
            <svg class="round-arrow" viewBox="0 0 8 8">
              <path d="M0 2h8v1H0zM1 3h6v1H1zM2 4h4v1H2zM3 5h2v1H3z"/>
            </svg>
          </button>

          <div class="battle-panel">
            <div class="battle-buttons">

              <button class="battle-btn active" onclick="loadSet('q1')">
                I Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('q2')">
                II Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('q3')">
                III Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('q4')">
                IV Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('q5')">
                V Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('q6')">
                VI Döyüş
              </button>

            </div>
          </div>

        </div>


        <!-- 1/2 FINAL -->
        <div class="round-wrapper" id="round-half">

          <button class="tour-btn" onclick="toggleRound('round-half')">
            <span>1/2 Final</span>
            <svg class="round-arrow" viewBox="0 0 8 8">
              <path d="M0 2h8v1H0zM1 3h6v1H1zM2 4h4v1H2zM3 5h2v1H3z"/>
            </svg>
          </button>

          <div class="battle-panel">
            <div class="battle-buttons">

              <button class="battle-btn" onclick="loadSet('h1')">
                I Döyüş
              </button>

              <button class="battle-btn" onclick="loadSet('h2')">
                II Döyüş
              </button>

            </div>
          </div>

        </div>


        <!-- III YER UĞRUNDA OYUN -->
        <div class="round-wrapper" id="round-third">

          <button class="tour-btn" onclick="toggleRound('round-third')">

/* =========================================================
   THEME (identical to ana səhifə)
   ========================================================= */

const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");

function sunIcon(){
  return `
    <circle cx="16" cy="16" r="6" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M16 2.7v3"/>
      <path d="M16 26.3v3"/>
      <path d="m2.7 16 3 0"/>
      <path d="m26.3 16-3 0"/>
      <path d="m6.6 6.6 2.1 2.1"/>
      <path d="m23.3 23.3 2.1 2.1"/>
      <path d="m25.4 6.6-2.1 2.1"/>
      <path d="m8.7 23.3-2.1 2.1"/>
    </g>`;
}

function moonIcon(){
  return `
    <path d="M25.4 20.8A11.7 11.7 0 0 1 11.2 6.6a11.8 11.8 0 1 0 14.2 14.2Z"
          fill="currentColor"/>`;
}

function updateThemeIcon(){
  const dark = document.body.classList.contains("dark");
  themeIcon.innerHTML = dark ? moonIcon() : sunIcon();
  themeToggle.setAttribute(
    "aria-label",
    dark ? "Gündüz rejiminə keç" : "Gecə rejiminə keç"
  );
}

function setTheme(dark){
  document.body.classList.toggle("dark", dark);
  localStorage.setItem("piksel-theme", dark ? "dark" : "light");
  updateThemeIcon();
}

function initTheme(){
  const saved = localStorage.getItem("piksel-theme");

  if(saved === "dark"){
    setTheme(true);
    return;
  }

  if(saved === "light"){
    setTheme(false);
    return;
  }

  const prefersDark = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;

  setTheme(prefersDark);
}

themeToggle.addEventListener("click", () => {
  setTheme(!document.body.classList.contains("dark"));
  notifyParentHeight();
});

initTheme();

function loadSet(setName) {

    'Bütün cavabları göstər';

  document.querySelectorAll('.battle-btn').forEach(btn => {

  event.currentTarget.classList.add('active');

/* =========================================================
   ROUND AÇ / BAĞLA
   ========================================================= */

function toggleRound(roundId) {

  const wrapper = document.getElementById(roundId);
  const wasActive = wrapper.classList.contains('active');

  document.querySelectorAll('.round-wrapper').forEach(round => {
    round.classList.remove('active');

    const button = round.querySelector('.tour-btn');
    if (button) button.classList.remove('active');
  });

  if (!wasActive) {
    wrapper.classList.add('active');

    const button = wrapper.querySelector('.tour-btn');
    if (button) button.classList.add('active');
  }

  notifyParentHeight();
}


/* =========================================================
   SUALLARI GÖSTƏR
   ========================================================= */

function renderQuestions() {

  const container =
    document.getElementById('questionsContainer');

  container.innerHTML = '';

  const questions = setsData[currentSet] || [];

  questions.forEach((item, index) => {

    const card = document.createElement('div');

    card.className = 'q-card';
    card.id = `q-card-${index}`;

    let criteriaHTML = item.criteria
      ? `<div class="ans-row">
           <span class="ans-label">Sayılma meyarı:</span>
           ${item.criteria}
         </div>`
      : '';

    let sourceHTML = item.source
      ? `<div class="ans-row">
           <span class="ans-label">Mənbə:</span>
           ${item.source}
         </div>`
      : '';

    let commentHTML = item.comment
      ? `<div class="ans-row">
           <span class="ans-label">Şərh:</span>
           ${item.comment}
         </div>`
      : '';

    card.innerHTML = `
      <div class="q-text">
        <b>${item.id}.</b> ${item.question}
      </div>

      <button class="toggle-btn"
              onclick="toggleSingleCard(${index})">

        <span>Cavabı göstər</span>

        <svg class="arrow-icon" viewBox="0 0 8 8">
          <path d="M0 2h8v1H0zM1 3h6v1H1zM2 4h4v1H2zM3 5h2v1H3z"/>
        </svg>

      </button>

      <div class="ans-panel">

        <div class="ans-row">
          <span class="ans-label">Cavab:</span>
          ${item.answer}
        </div>

        ${criteriaHTML}

        ${commentHTML}

        ${sourceHTML}

        <div class="ans-row author-row">
          <span><span class="ans-label">Müəllif:</span> ${item.author}</span>

          <button class="copy-btn" type="button"
                  onclick="copyQuestion(${index}, this)"
                  aria-label="Sualı kopyala">
            <svg class="copy-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g class="clip-path">
                <rect x="6.5" y="6.5" width="10" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 13V4.5A1.5 1.5 0 0 1 5.5 3H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </g>
              <path class="check-path" d="M4.5 10.3l3.4 3.4 7.6-7.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
        </div>

      </div>
    `;

    container.appendChild(card);

  });

  notifyParentHeight();
}


/* =========================================================
   SUALI KOPYALA
   ========================================================= */

function questionHtmlToText(html){
  return html
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .trim();
}

function buildQuestionText(item){
  let text = `${item.id}. ${questionHtmlToText(item.question)}`;
  text += `\n\nCavab: ${item.answer}`;

  if(item.criteria){
    text += `\nSayılma meyarı: ${item.criteria}`;
  }

  if(item.comment){
    text += `\nŞərh: ${item.comment}`;
  }

  if(item.source){
    text += `\nMənbə: ${item.source}`;
  }

  text += `\nMüəllif: ${item.author}`;

  return text;
}

function copyQuestion(index, btn){

  const item = (setsData[currentSet] || [])[index];
  if(!item) return;

  const text = buildQuestionText(item);

  function showCopied(){
    btn.classList.add('copied');
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.classList.remove('copied');
    }, 1600);
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => {
      fallbackCopy(text, showCopied);
    });
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onDone){
  const helper = document.createElement('textarea');
  helper.value = text;
  helper.style.position = 'fixed';
  helper.style.opacity = '0';
  document.body.appendChild(helper);
  helper.select();

  try{
    document.execCommand('copy');
    onDone();
  }catch(err){
    /* copy failed silently */
  }

  document.body.removeChild(helper);
}


/* =========================================================
   TƏK CAVABI AÇ / BAĞLA

function toggleSingleCard(index) {

  const card =
    document.getElementById(`q-card-${index}`);

  const btnText =
    card.querySelector('.toggle-btn span');

  card.classList.toggle('active');

  if (card.classList.contains('active')) {

    btnText.textContent = 'Cavabı gizlə';

  } else {

    btnText.textContent = 'Cavabı göstər';

  }

  notifyParentHeight();
}

function toggleAllAnswers() {

  allExpanded = !allExpanded;

  const cards =
    document.querySelectorAll('.q-card');

  const globalBtn =
    document.getElementById('globalToggleBtn');

  cards.forEach(card => {

    const btnText =
      card.querySelector('.toggle-btn span');

    if (allExpanded) {

      card.classList.add('active');
      btnText.textContent = 'Cavabı gizlə';

    } else {

      card.classList.remove('active');
      btnText.textContent = 'Cavabı göstər';

    }

  });

  globalBtn.textContent =
    allExpanded
      ? 'Bütün cavabları gizlə'
      : 'Bütün cavabları göstər';

  notifyParentHeight();
}


/* =========================================================
   ŞƏKİL ZOOM
   ========================================================= */

function toggleZoom(imgEl, event) {

  event.stopPropagation();

  if (activeZoomedImg === imgEl) {
    removeZoom();
    return;
  }

  removeZoom();

  const rect =
    imgEl.getBoundingClientRect();

  const clone =
    imgEl.cloneNode(true);

  clone.removeAttribute('onclick');

  clone.style.position = 'fixed';
  clone.style.top = rect.top + 'px';
  clone.style.left = rect.left + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.height = rect.height + 'px';
  clone.style.margin = '0';
  clone.style.maxWidth = 'none';
  clone.style.zIndex = '9999';
  clone.style.transformOrigin = 'center center';

  clone.style.transition =
    'transform 0.5s cubic-bezier(0.25,1,0.5,1), box-shadow 0.5s ease';

  clone.style.borderRadius = '10px';
  clone.style.cursor = 'pointer';
  clone.style.filter = 'none';

  clone.onclick = function(e) {

    e.stopPropagation();
    removeZoom();

  };

  document.body.appendChild(clone);

  imgEl.style.visibility = 'hidden';

  document.body.classList.add('img-zoomed');

  requestAnimationFrame(() => {

    clone.style.transform = 'scale(1.2)';

    clone.style.boxShadow =
      '0 10px 30px rgba(0, 0, 0, 0.25)';

  });

  activeZoomedImg = imgEl;
  activeClone = clone;
}


/* =========================================================
   ZOOM LƏĞV
   ========================================================= */

function removeZoom() {

  if (activeClone) {

    const cloneToRemove =
      activeClone;

    const imgToRestore =
      activeZoomedImg;

    cloneToRemove.style.transform =
      'scale(1)';

    cloneToRemove.style.boxShadow =
      'none';

    setTimeout(() => {

      cloneToRemove.remove();

      if (imgToRestore) {
        imgToRestore.style.visibility = 'visible';
      }

    }, 500);

    activeClone = null;
  }

  activeZoomedImg = null;

  document.body.classList.remove('img-zoomed');
}


/* =========================================================
   EKRANA KƏNARDAN KLİK
   ========================================================= */

document.addEventListener('click', function(e) {

  if (
    activeZoomedImg &&
    e.target !== activeClone
  ) {
    removeZoom();
  }

});


/* =========================================================
   GOOGLE SITES / IFRAME HÜNDÜRLÜYÜ
   ========================================================= */

function notifyParentHeight() {

  setTimeout(() => {

    const fullHeight =
      document.documentElement.scrollHeight ||
      document.body.scrollHeight;

    window.parent.postMessage(
      {
        frameHeight: fullHeight + 20
      },
      '*'
    );

  }, 350);
}


/* =========================================================
   BAŞLANĞIC
   ========================================================= */

loadSet('q1');

</script>
